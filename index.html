003c/h2>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>ACT-LAM 将条件提取和条件使用分开设计，控制任务收益与影像重建指标并不一致；其长程误差结果也提醒我们不要把条件敏感性当成预测正确性。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Dingjie Fu、Dianxing Shi、Yangyang Xu、Jun Yu。v1：2026-09-14 08:10:46 UTC；无修订；技术报告/预印本，未核实正式接受。\u003ca href=\"https://arxiv.org/abs/2609.15189\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.15189v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>；\u003ca href=\"https://github.com/DingjieFu/ACT-LAM\" target=\"_blank\" rel=\"noopener noreferrer\">官方仓库\u003c/a>。仓库与论文互链已核实，但当前根目录只有 \u003cstrong>README.md 和 LICENSE，没有模型源码\u003c/strong>，不能称为已可复现实现。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>基于冻结 DINOv2，AQ-IDM 用可学习 query 读取相邻状态差，并通过门控汇总为 latent action；AT-FDM 把 action 变成随 state token 一起更新的 token，在每层继续调制状态。它针对当前状态造成的预测捷径，以及重建训练并未充分约束 latent action 含义的问题。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>相对 DiLA，方法取消较重的特征处理模块，强化逆向与正向动态模块。未来状态采用残差形式 \u003ccode>s_next = s + F(s,z_action)\u003c/code>；总目标组合特征重建、状态差 SmoothL1、动作一致性、前后方向对称与动作方差项。参数量从 \u003cstrong>123M 降至 55M\u003c/strong>，因此主榜并非只改变一个损失的等容量对照。论文的条件使用实验固定 IDM，替换 FDM 的条件通路，再把正确 action 换为常量，比较 rollout 状态误差的相对增量。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 5 的 VP² 归一化 aggregate 为 \u003cstrong>49.04 对 41.44\u003c/strong>，提高 \u003cstrong>7.60 个百分点\u003c/strong>；该 aggregate 按 simulator 成功率归一化，并非普通平均临床成功率。结果来自四个种子。\u003c/p>\n\u003cp>Table 3 的 RT-1 重建 MSE：短程 @1，ACT-LAM \u003cstrong>0.119\u003c/strong>、DiLA \u003cstrong>0.215\u003c/strong>；@15 则 ACT-LAM \u003cstrong>0.705\u003c/strong>、DiLA \u003cstrong>0.323\u003c/strong>。正文说明 ACT-LAM 仅 teacher forcing，而 DiLA 用 rollout 微调的官方 checkpoint，训练阶段差异限制了归因。论文支持“更好的动作表示可以与更差的长程重建共存”，不支持“所有生成和长程指标全面领先”。移除动作使误差上升，仅证明模型依赖该输入，不能单独证明使用方式正确。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 优先借鉴 state-aware 条件 token 和条件干预诊断；用已知治疗类型、剂量及真实时间差初始化 token。逆向模型从真实未来影像提取的 action 只能用于训练期辅助监督，预测时不可作为输入，否则发生未来信息泄漏。肿瘤缩小并不能唯一反推治疗，前后方向对称也不等于临床过程可逆；\u003ccode>L_sym\u003c/code> 不应直接照搬为撤药或逆疗效约束。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>**改动位置：**只替换小型 latent 残差预测头的治疗条件注入模块，比较固定拼接/FiLM 与逐层交互 token；保持治疗编码器与影像编码器一致。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**对照：**同输入、近似同参数量与预算，包含不使用治疗、正确治疗、置换治疗、复制和直接残差预测；置换仅作条件使用诊断，不估计治疗效应。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**指标：**分开报告单步/多步 latent 误差、病灶变化 MAE、患者间变化排序，以及 landmark 固定的 pCR 增益。记录移除条件后的误差差值，但不把该差值作为主要成绩。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**否证：**治疗敏感性增加却不改善真实预测、校准或下游任务，或收益仅出现在训练可获得未来 action 的设置，则否定本次迁移假设。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**算力：**原文 Appendix A.2 使用 \u003cstrong>4 × RTX A6000 48 GB、50k 步、16 帧 256²、fp32\u003c/strong>。仅改缓存 latent 上的小头估计可单卡验证；不据此估计完整视频预训练时长。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据：\u003ca href=\"https://arxiv.org/html/2609.15189v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §3–4、Tables 1/3/5、Appendix A.2/B.8；官方仓库目录为本次读取结果。独立笔记附原始摘要。\u003c/p>\n\u003ch2>3. AsyncCouple-Flow: Asynchronous Cross-Modal Coupling and Flow Matching for Spatio-Temporal Forecasting\u003c/h2>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>用原生时间戳的稀疏跨模态图构造条件，再由 Flow Matching 联合预测整段未来；它可以启发 MRI、临床变量和治疗记录不同步时的历史融合。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Zhixiang Wu、Yining Liu、Bo Zhao、Szu-Yu Chen、Huiran Duan、Chu Lin、Chuanguang Yang。v1：\u003cstrong>2026-09-15 03:15:14 UTC\u003c/strong>，以原页历史为准，搜索结果显示的 09-14 不采用；无修订。\u003ca href=\"https://arxiv.org/abs/2609.16573\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.16573v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。预印本；作者注明 ICONIP 2026 接受，未独立核实正式论文集。\u003cstrong>未找到官方代码\u003c/strong>，摘要仍称接受后发布。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>MATS 在各模态各时点保留少量 token；ACCG 的边结合真实时间差、语义相似度与模态对先验，缺失模态直接不建立节点；FM head 把整个未来张量作为一个联合随机变量生成。相对插值后拼接或逐步自回归，它同时改变历史融合与未来输出组织方式。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>边权大致为时间衰减 × query-key 相似度 × 模态对先验。生成时间 \u003ccode>s ∈ [0,1]\u003c/code> 与真实观测时间分开：\u003ccode>x_s = (1-s) noise + s Y_future\u003c/code>，回归速度 \u003ccode>Y_future - noise\u003c/code>，再加一步预测 L1 与 token 预算正则。训练随机整模态 dropout 为 \u003cstrong>0.3\u003c/strong>。“一次 ODE 求解”仍包含 \u003cstrong>25 次 Euler 更新\u003c/strong>，不是一次网络前向，也不保证未来误差不增长。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 1：WeatherBench-MM 24 h 的 RMSE \u003cstrong>1.67 对 CrossViViT 1.89\u003c/strong>，CRPS \u003cstrong>0.93 对 1.06\u003c/strong>；PEMS-BAY-MM 60 min MAE \u003cstrong>1.61 对 1.79\u003c/strong>。论文称五个种子均值，但该表没有给种子离散度或差异置信区间。缺失模态实验通过随机删除 0/1/2 个模态完成，不能推及临床按病情选择检查的缺失机制。\u003c/p>\n\u003cp>作者将优点描述为避免自回归漂移；我的判断是它消除了显式逐步回灌，但 Figure 4 中误差仍随预测距离增长。它没有证明医学长程外推、治疗效应识别或跨中心校准，插值式基线和融合模块同时改变也需要拆开消融。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可以迁移真实时间差边和“整段未来 latent”的输出方式；需要影像、化验、临床记录各自可信的采集时间，以及预测时点之前的治疗信息。少量 MRI 的场景可先保留全部时点，避免未经验证的 top-k 丢掉小病灶。天气模态之间的物理先验不能直接换成未经验证的影像—病理因果关系。预测跨度超过已知治疗方案时，需要明确后续治疗的条件假设。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>**改动位置：**冻结编码器，用时间差图或简单时间戳 attention 融合历史，再比较联合未来 latent 与自回归输出。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**对照：**2×2 消融：插值/原生时间融合 × 直接回归/FM，另加复制和同预算自回归模型；匹配可用历史、参数量、训练步数与采样预算。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**指标：**按真实间隔报告病灶体积变化 MAE、每一步误差、CRPS、联合 energy score、区间覆盖率与宽度。分别测试随机缺失和真实就诊缺失，后者需记录缺失指示及时间信息。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**否证：**只在随机缺失上有效、对真实缺失失效；联合采样增加多样性却恶化 proper scores；或相同输入预算的直接回归更好，均削弱迁移理由。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>算力：\u003c/strong>§4.1 报告 \u003cstrong>8 × A100、100 epochs、batch 32\u003c/strong>；§4.6 单 A100 推理约 \u003cstrong>150 ms\u003c/strong>，只适用于其数据/分辨率。医学小实验估计先用缓存 latent 单卡训练小头，不能沿用该延迟数字。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据：\u003ca href=\"https://arxiv.org/html/2609.16573v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §3–4、Table 1、Figures 2–5。独立笔记附原始摘要。\u003c/p>\n\u003ch2>4. Generative models for simulation based filtering: Formulations and Empirical Comparisons\u003c/h2>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>把新观测下的后验校正统一成条件 transport，比较 FM、随机插值和 Schrodinger bridge；算法选择依赖粒子数和在线计算预算，没有普遍赢家。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Mohammad Al-Jarrah、Wei Deng、Bamdad Hosseini、Amirhossein Taghvaei。v1：2026-09-14 20:31:29 UTC；无修订；预印本。\u003ca href=\"https://arxiv.org/abs/2609.16317\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.16317v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>；\u003ca href=\"https://github.com/Mohd9485/Generative_Filters\" target=\"_blank\" rel=\"noopener noreferrer\">官方代码\u003c/a>。论文链接与仓库目录已核验，有 SIF.py、SBF.py、OTF.py、KRF.py、SIR.py、EnKF.py 及调参脚本；未运行代码。README 提及的 FMF.py 未出现在本次根目录列表中，不能据此宣称所有比较方法均已完整发布。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>已知状态转移和观测模拟器时，先生成 forecast ensemble，再学习依赖新观测的 transport 得到过滤后验。通过保持观测坐标的三角映射统一不同模型，并把初始训练调参与每次新观测的在线 refinement 分开。\u003c/p>\n\u003ch3>创新点与实验边界\u003c/h3>\n\u003cp>两类合成动力学测试用 aa-SW2、粒子数、在线成本和二十次模拟评价。正文 §IV-C 明确：二次观测任务中 \u003cstrong>SBF 是未恢复双峰的例外\u003c/strong>，不能照摘要转述“所有生成过滤器都恢复多峰”。小粒子数 Lorenz-63 下 OTF/KRF 更稳定；某些 SIF 最低误差设置的在线成本比 EnKF/SIR 高约四个数量级。aa-SW2 逐坐标投影不能充分检查联合相关结构。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 适合“疗中 MRI 到达后校正患者状态分布”，与从基线一次性预测未来是不同任务。前提是有可用状态转移与观测模型；MRI 测量噪声、潜状态可辨识性、信息性随访不能当作已知。原文没有临床疗效/生存证据。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在固定低维病灶状态预测器后增加观测校正层，比较无校正、线性/Kalman 更新、小粒子滤波、FM transport；相同观测与在线预算。用观测到来之后的下一次随访检验变化 MAE、energy score 和覆盖率，不能用刚吸收的观测当“未来预测”成绩。若仅观测拟合变好而下一次预测无增益，或增加成本后不优于简单滤波，否定复杂生成校正的必要性。先做低维模拟和缓存 latent，CPU/单卡估计可起步；具体训练预算需实测，原文比较的是随方法变化的在线成本。\u003c/p>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>\u003ca href=\"https://arxiv.org/html/2609.16317v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §II–V、Figures 1–2；独立笔记附原始摘要。\u003c/p>\n\u003ch2>5. Stable by Construction: Variational Latent Markov Operators for Long-Horizon PDE Prediction\u003c/h2>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>VAMO 用空间相关的潜变量扰动和相邻状态分布 KL 对齐改善长程 rollout；其部署使用确定性均值，不能直接作为不确定性已校准的依据。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Junyi Liao、Johann Guilleminot、Vahid Tarokh。v1：2026-09-15 04:28:59 UTC；无修订；预印本。\u003ca href=\"https://arxiv.org/abs/2609.16621\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.16621v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。\u003cstrong>未找到官方代码\u003c/strong>。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>编码器保留空间 latent field，残差 FNO 预测下一状态。训练在编码和转移处加入有谱结构的 Gaussian 扰动，目标为 \u003ccode>L_pred + beta KL(q(z_next|x_next) || p(z_next|z)) + lambda L_rec\u003c/code>。推理只编码一次，随后潜空间递推并解码，关闭采样。\u003c/p>\n\u003ch3>创新点与实验边界\u003c/h3>\n\u003cp>相对确定性 latent FNO 和普通 Gaussian noise baseline，新增的是结构化噪声及分布转移对齐。2D CFD 从训练区间 \u003ccode>[0,1]\u003c/code> 外推至 \u003ccode>10\u003c/code>：Table 4 的平均相对 L2 \u003cstrong>0.0565\u003c/strong>，FNO-AE \u003cstrong>0.2526\u003c/strong>；H1 \u003cstrong>0.4044 对 2.3394\u003c/strong>。这是真实的长于训练时域的合成 PDE 测试，但物理系统使用规则网格和固定步长，理论界依赖正则性，不能把标题理解为任意疾病动力学均稳定。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可迁移结构化 latent 扰动与下一时点表示对齐，以检验小样本下局部预测误差的累积。治疗与不规则时间差必须另行建模；MRI 空间纹理不具有周期流体边界，频谱噪声不能未经检验直接照搬。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在同一个小型 latent transition 上比较无噪声、等方差独立噪声、空间相关噪声，以及是否加入下一状态 KL 的消融。至少需要三次观测才能检查真实多步误差；少于此时只检验单步，不构造伪随访证明长程稳定。报告 rollout 各步病灶误差、频谱/边界保真与少事件临床结局；若只是平滑病灶而失去变化信息，或 KL 导致表征塌缩，则否证。单卡小头是工程估计；本次未核实全文硬件总耗时，不作原实验算力承诺。\u003c/p>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>\u003ca href=\"https://arxiv.org/html/2609.16621v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §4–6、Tables 2/4；本次未逐条复核附录证明，独立笔记附原始摘要。\u003c/p>\n\u003ch2>6. Multi-source conformal prediction: leveraging heterogeneity via localization\u003c/h2>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>MS-RLCP 根据测试样本附近的数据支持选择校准来源，适合研究多中心区间预测，但依赖跨来源共享 \u003ccode>P(Y|X)\u003c/code>，不提供任意中心漂移下的保证。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Rohan Hore、Anirban Chatterjee、Sayantan Choudhury。v1：2026-09-13 14:08:28 UTC；无修订；预印本。\u003ca href=\"https://arxiv.org/abs/2609.14531\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.14531v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。\u003cstrong>未找到官方代码\u003c/strong>。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>各来源分别训练 score 并留出 calibration set；对随机局部化的测试特征，以训练样本核密度估计选择局部支持最强的来源，再构造该来源的加权 conformal 集合。选择规则使用训练分区，避免直接依照校准标签挑选最有利来源。\u003c/p>\n\u003ch3>创新点与实验边界\u003c/h3>\n\u003cp>理论允许测试特征分布超出简单来源混合，但需要共享条件响应分布、envelope 支持及相应正则性。不是无条件的有限样本逐患者覆盖保证。目标覆盖 90% 时，FMoW 实验实际总体 \u003cstrong>88.59 ± 0.82%\u003c/strong>；MEPS 三个 panel 总体 \u003cstrong>89.4–89.8%\u003c/strong>，其中一个来源仅 \u003cstrong>88.1–88.3%\u003c/strong>。这些数字说明应报告具体亚组不足，不能只写“达到了 90% 校准”。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可为肿瘤变化量或 pCR 预测集合增加跨中心校准层。治疗选择、终点定义或疾病谱导致 \u003ccode>P(Y|X)\u003c/code> 改变时，核心假设可能失效；删失生存不能把未观察到的生存时间直接当连续标签套用。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>固定预测模型，按患者/中心分开 train、calibration、test；比较 pooled split conformal、中心内校准和 MS-RLCP，做留一中心测试。报告总体和逐中心覆盖率、区间宽度、worst-group coverage、校准样本数。带宽只在训练/验证集选择。若低样本中心持续欠覆盖，或仅靠极宽/无界集合达到覆盖，否定实用价值；也须把机制漂移与协变量漂移分别分析。缓存特征上的校准主要是 CPU 工作，复杂度与校准集规模、核计算有关，不需要重新训练生成器。\u003c/p>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>\u003ca href=\"https://arxiv.org/html/2609.14531v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> Algorithm 1、§3–5、Table 1；理论结论按其假设转述，未独立验证全部证明。独立笔记附原始摘要。\u003c/p>\n\u003ch2>7. An immune world model for multiscale forecasting and therapeutic hypothesis generation\u003c/h2>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>把免疫干预与患者背景分开建模，强调变化量和锁定评估；治疗组合仍是计算提出的假设，尚无新实验或临床疗效验证。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Taoyong Cui、Xi Wang、Zonghang Li、Jinchao Ding、Lingsen You、Yuzhi Xu、Wanghan Xu、Fang Wu、Kejun Ying、Wanli Ouyang、Pheng Ann Heng、Ling Yang、Zhenfei Yin、Yingcheng Wu。v1：2026-09-13 18:06:18 UTC；无修订；预印本。\u003ca href=\"https://arxiv.org/abs/2609.14709\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.14709v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。\u003cstrong>未找到官方代码\u003c/strong>；Data and code availability 使用将来时，称之后发布软件与版本化数据清单。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>将细胞状态、组织微环境和患者背景组织为结构化 state，把目标干预作为独立 action，学习 \u003ccode>S_next = F(S, A)\u003c/code>，用 decoder 输出表达变化、程序分数及临床响应相关读数。作者还报告模型搜索、冻结和独立确认流程，但公开配置和划分清单尚待发布，本次未独立审计这些隔离措施。\u003c/p>\n\u003ch3>创新点与实验边界\u003c/h3>\n\u003cp>原始细胞图谱约一千万细胞，但只有 \u003cstrong>12 名供者\u003c/strong>；细胞数不等于患者样本量。Figure 3 的平均 gene-delta cosine 中，模型与 \u003cstrong>condition-mean 均为 0.46\u003c/strong>，不能声称所有基线都被超越。抗 PD-1 的 all-cell state LOO AUC 为 \u003cstrong>0.92，95% CI 0.79–1.00\u003c/strong>，并非生成未来状态优于同输入直接预测的充分证据。23 个未见组合中 19 个改善；所谓跨尺度 rollout 包含示例，全文仍把队列级递归验证列为未来工作。研究使用公开既有数据，没有新增湿实验，IL-36gamma + SIRPalpha inhibition 只是待验证假设。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关于治疗条件下的生物状态建模；对 MRI/CT 模块属于外围启发。\u003c/strong> 值得借鉴干预与既往治疗分离、变化量而非绝对状态评价，以及在模型选择后锁定测试集。组织层表示主要来自组学/免疫上下文，不是 CT-to-WSI 生成，也未证明组织切片形态预测。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在同一患者划分上，比较临床直接预测、真实影像/组学联合直接预测、预测未来状态辅助模型；匹配输入、容量与训练预算，单独加入 condition-mean 与置换背景对照。以供者/患者为统计单位，评估变化量、pCR/response 的 AUROC/AUPRC/Brier 和中心外表现；假如生成辅助不优于直接模型，或收益依赖反复筛选测试集，就不支持临床增益。计算组合预测不自动识别治疗因果效应，仍需一致性、可交换性、positivity、清晰干预定义及缺失/删失假设。先做缓存特征小头是单卡估计；完整 AI Scientist/组学流程总算力未核实。\u003c/p>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>\u003ca href=\"https://arxiv.org/html/2609.14709v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> Figures 2–4、Methods、Discussion、Resource availability；独立笔记附原始摘要。\u003c/p>\n\u003ch2>今天最值得读的一篇\u003c/h2>\n\u003cp>\u003cstrong>Reverse Spatio-Temporal Disease Progression Modelling。\u003c/strong> 先读 Table 1 和 §5.2，再回看摘要。它直接连接 VQGAN、反向生成、患者特异性和复制基线，并提供了一个能否定错误研究结论的评估案例。最优先的实际动作是做“配准后病灶变化信号 / 编码器误差 / 复制基线”三项审计，而不是立即扩大生成模型。\u003c/p>\n\u003ch2>来源与时效\u003c/h2>\n\u003cp>检索窗口从上次成功检索时间减 72 小时开始，即 \u003cstrong>2026-09-12 01:45 UTC\u003c/strong>，检索于 2026-09-16 北京时间上午执行。分别完成通用算法与医学线；arXiv 查询包含无医学限定词的 FM、world model/JEPA、连续时间、概率预测、缺失模态和长程动态查询。7 篇推荐均核实原始页面日期与 HTML 全文，未下载 PDF。官方仓库只核验可访问性、论文关联与文件目录，未运行其代码。\u003c/p>\n\u003cp>PubMed 两条查询返回 14 篇去重记录，已读取摘要与日期；其中昨日 BPE/pCR 已推荐，其余主要为诊断、分型、综述或新近索引的旧文，没有为填满名额将它们写成新的纵向生成研究。两个 arXiv 搜索候选 BrainVLM（2609.16597）与 Scaling-Score Conformal（2609.17091）的原页返回 404，本期不推荐，保留后续核验。\u003c/p>\n\u003cp>ICLR、ICML、CVPR、ICCV、AISTATS、UAI、MIDL 官方目录已重试并筛查主题，但目录可访问不代表所有论文的近期实质修订已遍历。MICCAI 2026 目录仍返回 401；OpenReview API 个别候选返回 403；ECVA 当前目录仍以 ECCV 2024 为最新展示，NeurIPS 目录最新公开年份为 2025。TMI/MedIA 定向 PubMed 查询本次为 0 条，不代表这些期刊全站没有新论文。上述来源保留覆盖缺口和旧回补起点，不冒称完整覆盖。\u003c/p>\n","markdown":"# 2026-09-16 | 从重建得像，到预测得对\n\n今天精选 **7 篇：5 篇通用算法、2 篇医学状态建模研究**，均为增量窗口内首次公开、首次推荐的论文。本期最值得读的是 **Reverse Spatio-Temporal Disease Progression Modelling**：其配准后的主实验推翻了摘要容易造成的乐观印象，直接提醒我们先测清影像对齐与编码器重建误差，再判断模型是否学到了疾病变化。ACT-LAM 和 AsyncCouple-Flow 分别提供条件使用诊断、异步多模态联合轨迹生成的可验证改动。\n\n## 阅读总览\n\n| 顺序 | 论文 | 类型 / v1 日期（UTC） | 阅读理由 | 证据与代码 |\n|---|---|---|---|---|\n| 1 | [Reverse Spatio-Temporal Disease Progression Modelling](https://arxiv.org/abs/2609.14590) | 医学应用；新论文；09-13 | 配准、复制基线与 VQ 重建误差怎样改变疾病轨迹结论 | 全文方法与实验；未找到官方代码 |\n| 2 | [Reconstructing Is Not Acting: Action-Centric Latent Dynamics Modeling](https://arxiv.org/abs/2609.15189) | 通用算法；新论文；09-14 | 检验生成器是否真正使用条件，分开评价表征与重建 | 全文方法与实验；官方仓库目前仅 README / LICENSE |\n| 3 | [AsyncCouple-Flow: Asynchronous Cross-Modal Coupling and Flow Matching for Spatio-Temporal Forecasting](https://arxiv.org/abs/2609.16573) | 通用算法；新论文；09-15 | 不规则时间、缺失模态、整段未来联合生成 | 全文方法与实验；未找到官方代码 |\n| 4 | [Generative models for simulation based filtering: Formulations and Empirical Comparisons](https://arxiv.org/abs/2609.16317) | 通用算法；新论文；09-14 | 新观测到达后如何校正患者潜状态分布 | 全文方法与实验；官方仓库有实现，未运行 |\n| 5 | [Stable by Construction: Variational Latent Markov Operators for Long-Horizon PDE Prediction](https://arxiv.org/abs/2609.16621) | 通用算法；新论文；09-15 | 用结构化潜变量扰动与分布对齐控制 rollout 误差 | 全文主要方法与实验；未找到官方代码 |\n| 6 | [Multi-source conformal prediction: leveraging heterogeneity via localization](https://arxiv.org/abs/2609.14531) | 通用算法；新论文；09-13 | 跨中心预测区间及其适用假设 | 全文算法、假设与实验；未找到官方代码 |\n| 7 | [An immune world model for multiscale forecasting and therapeutic hypothesis generation](https://arxiv.org/abs/2609.14709) | 医学应用；新论文；09-13 | 治疗与患者状态分离、变化量评价、锁定外部检验 | 全文方法与实验；代码仍为待发布声明 |\n\n7 篇当前均为 v1，未发现后续修订。日期采用 arXiv Submission history 的首次提交时间作为首次公开版本日期代理；精确公告上线时间未独立核实。今天没有以旧版本更新冒充新论文，也未重复推荐此前 8 篇。下文“全文”表示阅读了可访问 HTML 中的方法、结果和相应限制，不表示独立复现实验或逐条证明了理论。\n\n## 1. Reverse Spatio-Temporal Disease Progression Modelling\n\n### 一句话总结\n\n冻结 VQ-GAN 后用逆向 Neural ODE 预测过去 MRI，但配准后的 ADNI 结果没有证明疾病特异的逆向轨迹；最有价值的是重建误差、配准和复制基线的诊断设计。\n\n**元数据。** Ulugbek Shernazarov、Moucheng Xu、Inomjon Ramatov。v1：2026-09-13 15:17:59 UTC；无修订。[原始页面](https://arxiv.org/abs/2609.14590)；[全文](https://arxiv.org/html/2609.14590v1)。当前可核实载体为预印本；作者在 arXiv 注明获 SASHIMI 2026（MICCAI workshop）接受，正式论文集记录本次未独立核实。**未找到官方代码**，不能将其引用的其他进展模型仓库当成实现。\n\n### 中文摘要\n\n任务是根据晚期观测重建未观测的早期影像。先训练并冻结 3D VQ-GAN，逆序 ConvGRU 汇总晚期 latent，再用 `dz/dt = f_theta(z,t)` 向较早时刻积分；残差头相对已观测 anchor 累加变化。它改变的是纵向推断方向和残差时间模型，没有加入治疗效应识别或随机轨迹校准。\n\n### 创新点与机制\n\n相较向前进展生成，方法明确设置“缺失患者自身早期基线”的任务。损失为 `L = 0.2 L_direct + L_inter`，分别约束直接 latent 误差与帧间变化；真实连续时间与整数序列下标分开。方法强调 anchor 必须是已观测帧，不能偷偷取被遮蔽的最早帧。\n\n### 实验支持与局限\n\n最关键的是全文 §5.2 / Table 1：配准至 1 mm 的 ADNI 测试为 **25 名受试者**。模型 MSE **0.00238**，VQ copy-nearest **0.00168**，原始像素 copy-nearest **0.00088**；模型 SSIM **0.574** 高于 VQ copy 的 **0.454**，但远低于原始像素 copy 的 **0.957**。仅做目标影像 encode-decode 的 MSE 已达 **0.00131**，说明编码器误差本身已大于复制基线误差。\n\n变化幅度比 `Dyn` 为 **1.29 ± 0.23**，说明不是静态复制，却存在变化过冲；不同诊断分层的 `Rev` 均为负，整体为 **-1.88**。未配准 64³ 数据上的正面结果，作者在正文中明确解释为主要受到位姿和视野错配影响。因此，**摘要中“所有分层为正”的表述不能代表配准后的主实验**。合成数据能恢复非单调变化，不等于真实 MRI 已捕捉疾病机制。\n\n另有两点待复现时核对：文中“382 T1 MRI”、至少五次就诊、80/10/10 划分和 25 名测试受试者的计数口径并不充分清楚；配准使用患者最早 baseline 为参考，实际逆向部署若该 baseline 不可得，预处理必须改为只依赖已观测 anchor。这是部署可用性问题，不能直接断言已发生模型输入泄漏。\n\n### 和我方向的适配\n\n**直接相关。** VQ 潜空间、连续时间、残差预测与双向学习都贴近纵向影像路线。最值得迁移的是“先量化可观测疾病变化是否高于编码器误差”的评估。肿瘤治疗可能导致非单调反应、坏死、复发；“更早就是更健康”不适用，也不能将向后积分解释为撤除治疗的因果反事实。原文无 pCR、OS 或治疗条件实验。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：**先在现有冻结编码器的评估管线加入重建误差诊断，再试一个小型时间残差头。正向与反向各自只使用预测时可获得的 anchor 和预处理信息。\n\n- **对照：**原始像素复制、encode-decode 后复制、目标影像 encode-decode（仅诊断重建误差，不是可部署预测器）、线性趋势、同输入/参数量/训练预算的直接残差模型。固定患者划分，单独报告配准前后结果。\n\n- **指标：**全图与病灶 ROI 分开算误差；报告肿瘤体积变化 MAE、变化方向、变化幅度比，并按真实变化幅度分层。仅在病灶变化有效后，用同一 landmark 比较临床基线、真实历史直接预测、历史加生成状态的 pCR AUROC/AUPRC/Brier；OS 另用删失适配指标。\n\n- **否证：**配准后收益消失、只改善背景、变化不优于复制，或生成状态不优于同预算直接预测，则不支持“学到有临床价值的动态状态”。\n\n- **算力：**原文 §3.1 为冻结 34.1M 参数编码器、22,163 个时间模型参数、20,000 步 fp32；§5.3 报告 1 mm 阶段一约 36.2 GB 显存/48 GB 单卡。医学小实验若直接复用缓存 latent，可单卡起步，这是按小时间头估计，非原论文复现耗时承诺。\n\n\n### 原始摘要或 Evidence Source\n\n证据：[v1 全文](https://arxiv.org/html/2609.14590v1) §3–6、Table 1；独立笔记附原始英文摘要。上述医学实验为建议，尚未执行。\n\n## 2. Reconstructing Is Not Acting: Action-Centric Latent Dynamics Modeling\n\n### 一句话总结\n\nACT-LAM 将条件提取和条件使用分开设计，控制任务收益与影像重建指标并不一致；其长程误差结果也提醒我们不要把条件敏感性当成预测正确性。\n\n**元数据。** Dingjie Fu、Dianxing Shi、Yangyang Xu、Jun Yu。v1：2026-09-14 08:10:46 UTC；无修订；技术报告/预印本，未核实正式接受。[原文](https://arxiv.org/abs/2609.15189)；[全文](https://arxiv.org/html/2609.15189v1)；[官方仓库](https://github.com/DingjieFu/ACT-LAM)。仓库与论文互链已核实，但当前根目录只有 **README.md 和 LICENSE，没有模型源码**，不能称为已可复现实现。\n\n### 中文摘要\n\n基于冻结 DINOv2，AQ-IDM 用可学习 query 读取相邻状态差，并通过门控汇总为 latent action；AT-FDM 把 action 变成随 state token 一起更新的 token，在每层继续调制状态。它针对当前状态造成的预测捷径，以及重建训练并未充分约束 latent action 含义的问题。\n\n### 创新点与机制\n\n相对 DiLA，方法取消较重的特征处理模块，强化逆向与正向动态模块。未来状态采用残差形式 `s_next = s + F(s,z_action)`；总目标组合特征重建、状态差 SmoothL1、动作一致性、前后方向对称与动作方差项。参数量从 **123M 降至 55M**，因此主榜并非只改变一个损失的等容量对照。论文的条件使用实验固定 IDM，替换 FDM 的条件通路，再把正确 action 换为常量，比较 rollout 状态误差的相对增量。\n\n### 实验支持与局限\n\nTable 5 的 VP² 归一化 aggregate 为 **49.04 对 41.44**，提高 **7.60 个百分点**；该 aggregate 按 simulator 成功率归一化，并非普通平均临床成功率。结果来自四个种子。\n\nTable 3 的 RT-1 重建 MSE：短程 @1，ACT-LAM **0.119**、DiLA **0.215**；@15 则 ACT-LAM **0.705**、DiLA **0.323**。正文说明 ACT-LAM 仅 teacher forcing，而 DiLA 用 rollout 微调的官方 checkpoint，训练阶段差异限制了归因。论文支持“更好的动作表示可以与更差的长程重建共存”，不支持“所有生成和长程指标全面领先”。移除动作使误差上升，仅证明模型依赖该输入，不能单独证明使用方式正确。\n\n### 和我方向的适配\n\n**可迁移算法。** 优先借鉴 state-aware 条件 token 和条件干预诊断；用已知治疗类型、剂量及真实时间差初始化 token。逆向模型从真实未来影像提取的 action 只能用于训练期辅助监督，预测时不可作为输入，否则发生未来信息泄漏。肿瘤缩小并不能唯一反推治疗，前后方向对称也不等于临床过程可逆；`L_sym` 不应直接照搬为撤药或逆疗效约束。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：**只替换小型 latent 残差预测头的治疗条件注入模块，比较固定拼接/FiLM 与逐层交互 token；保持治疗编码器与影像编码器一致。\n\n- **对照：**同输入、近似同参数量与预算，包含不使用治疗、正确治疗、置换治疗、复制和直接残差预测；置换仅作条件使用诊断，不估计治疗效应。\n\n- **指标：**分开报告单步/多步 latent 误差、病灶变化 MAE、患者间变化排序，以及 landmark 固定的 pCR 增益。记录移除条件后的误差差值，但不把该差值作为主要成绩。\n\n- **否证：**治疗敏感性增加却不改善真实预测、校准或下游任务，或收益仅出现在训练可获得未来 action 的设置，则否定本次迁移假设。\n\n- **算力：**原文 Appendix A.2 使用 **4 × RTX A6000 48 GB、50k 步、16 帧 256²、fp32**。仅改缓存 latent 上的小头估计可单卡验证；不据此估计完整视频预训练时长。\n\n\n### 原始摘要或 Evidence Source\n\n证据：[v1 全文](https://arxiv.org/html/2609.15189v1) §3–4、Tables 1/3/5、Appendix A.2/B.8；官方仓库目录为本次读取结果。独立笔记附原始摘要。\n\n## 3. AsyncCouple-Flow: Asynchronous Cross-Modal Coupling and Flow Matching for Spatio-Temporal Forecasting\n\n### 一句话总结\n\n用原生时间戳的稀疏跨模态图构造条件，再由 Flow Matching 联合预测整段未来；它可以启发 MRI、临床变量和治疗记录不同步时的历史融合。\n\n**元数据。** Zhixiang Wu、Yining Liu、Bo Zhao、Szu-Yu Chen、Huiran Duan、Chu Lin、Chuanguang Yang。v1：**2026-09-15 03:15:14 UTC**，以原页历史为准，搜索结果显示的 09-14 不采用；无修订。[原文](https://arxiv.org/abs/2609.16573)；[全文](https://arxiv.org/html/2609.16573v1)。预印本；作者注明 ICONIP 2026 接受，未独立核实正式论文集。**未找到官方代码**，摘要仍称接受后发布。\n\n### 中文摘要\n\nMATS 在各模态各时点保留少量 token；ACCG 的边结合真实时间差、语义相似度与模态对先验，缺失模态直接不建立节点；FM head 把整个未来张量作为一个联合随机变量生成。相对插值后拼接或逐步自回归，它同时改变历史融合与未来输出组织方式。\n\n### 创新点与机制\n\n边权大致为时间衰减 × query-key 相似度 × 模态对先验。生成时间 `s ∈ [0,1]` 与真实观测时间分开：`x_s = (1-s) noise + s Y_future`，回归速度 `Y_future - noise`，再加一步预测 L1 与 token 预算正则。训练随机整模态 dropout 为 **0.3**。“一次 ODE 求解”仍包含 **25 次 Euler 更新**，不是一次网络前向，也不保证未来误差不增长。\n\n### 实验支持与局限\n\nTable 1：WeatherBench-MM 24 h 的 RMSE **1.67 对 CrossViViT 1.89**，CRPS **0.93 对 1.06**；PEMS-BAY-MM 60 min MAE **1.61 对 1.79**。论文称五个种子均值，但该表没有给种子离散度或差异置信区间。缺失模态实验通过随机删除 0/1/2 个模态完成，不能推及临床按病情选择检查的缺失机制。\n\n作者将优点描述为避免自回归漂移；我的判断是它消除了显式逐步回灌，但 Figure 4 中误差仍随预测距离增长。它没有证明医学长程外推、治疗效应识别或跨中心校准，插值式基线和融合模块同时改变也需要拆开消融。\n\n### 和我方向的适配\n\n**可迁移算法。** 可以迁移真实时间差边和“整段未来 latent”的输出方式；需要影像、化验、临床记录各自可信的采集时间，以及预测时点之前的治疗信息。少量 MRI 的场景可先保留全部时点，避免未经验证的 top-k 丢掉小病灶。天气模态之间的物理先验不能直接换成未经验证的影像—病理因果关系。预测跨度超过已知治疗方案时，需要明确后续治疗的条件假设。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：**冻结编码器，用时间差图或简单时间戳 attention 融合历史，再比较联合未来 latent 与自回归输出。\n\n- **对照：**2×2 消融：插值/原生时间融合 × 直接回归/FM，另加复制和同预算自回归模型；匹配可用历史、参数量、训练步数与采样预算。\n\n- **指标：**按真实间隔报告病灶体积变化 MAE、每一步误差、CRPS、联合 energy score、区间覆盖率与宽度。分别测试随机缺失和真实就诊缺失，后者需记录缺失指示及时间信息。\n\n- **否证：**只在随机缺失上有效、对真实缺失失效；联合采样增加多样性却恶化 proper scores；或相同输入预算的直接回归更好，均削弱迁移理由。\n\n- **算力：**§4.1 报告 **8 × A100、100 epochs、batch 32**；§4.6 单 A100 推理约 **150 ms**，只适用于其数据/分辨率。医学小实验估计先用缓存 latent 单卡训练小头，不能沿用该延迟数字。\n\n\n### 原始摘要或 Evidence Source\n\n证据：[v1 全文](https://arxiv.org/html/2609.16573v1) §3–4、Table 1、Figures 2–5。独立笔记附原始摘要。\n\n## 4. Generative models for simulation based filtering: Formulations and Empirical Comparisons\n\n### 一句话总结\n\n把新观测下的后验校正统一成条件 transport，比较 FM、随机插值和 Schrodinger bridge；算法选择依赖粒子数和在线计算预算，没有普遍赢家。\n\n**元数据。** Mohammad Al-Jarrah、Wei Deng、Bamdad Hosseini、Amirhossein Taghvaei。v1：2026-09-14 20:31:29 UTC；无修订；预印本。[原文](https://arxiv.org/abs/2609.16317)；[全文](https://arxiv.org/html/2609.16317v1)；[官方代码](https://github.com/Mohd9485/Generative_Filters)。论文链接与仓库目录已核验，有 SIF.py、SBF.py、OTF.py、KRF.py、SIR.py、EnKF.py 及调参脚本；未运行代码。README 提及的 FMF.py 未出现在本次根目录列表中，不能据此宣称所有比较方法均已完整发布。\n\n### 中文摘要\n\n已知状态转移和观测模拟器时，先生成 forecast ensemble，再学习依赖新观测的 transport 得到过滤后验。通过保持观测坐标的三角映射统一不同模型，并把初始训练调参与每次新观测的在线 refinement 分开。\n\n### 创新点与实验边界\n\n两类合成动力学测试用 aa-SW2、粒子数、在线成本和二十次模拟评价。正文 §IV-C 明确：二次观测任务中 **SBF 是未恢复双峰的例外**，不能照摘要转述“所有生成过滤器都恢复多峰”。小粒子数 Lorenz-63 下 OTF/KRF 更稳定；某些 SIF 最低误差设置的在线成本比 EnKF/SIR 高约四个数量级。aa-SW2 逐坐标投影不能充分检查联合相关结构。\n\n### 和我方向的适配\n\n**可迁移算法。** 适合“疗中 MRI 到达后校正患者状态分布”，与从基线一次性预测未来是不同任务。前提是有可用状态转移与观测模型；MRI 测量噪声、潜状态可辨识性、信息性随访不能当作已知。原文没有临床疗效/生存证据。\n\n### 可借鉴动作\n\n在固定低维病灶状态预测器后增加观测校正层，比较无校正、线性/Kalman 更新、小粒子滤波、FM transport；相同观测与在线预算。用观测到来之后的下一次随访检验变化 MAE、energy score 和覆盖率，不能用刚吸收的观测当“未来预测”成绩。若仅观测拟合变好而下一次预测无增益，或增加成本后不优于简单滤波，否定复杂生成校正的必要性。先做低维模拟和缓存 latent，CPU/单卡估计可起步；具体训练预算需实测，原文比较的是随方法变化的在线成本。\n\n### 原始摘要或 Evidence Source\n\n[v1 全文](https://arxiv.org/html/2609.16317v1) §II–V、Figures 1–2；独立笔记附原始摘要。\n\n## 5. Stable by Construction: Variational Latent Markov Operators for Long-Horizon PDE Prediction\n\n### 一句话总结\n\nVAMO 用空间相关的潜变量扰动和相邻状态分布 KL 对齐改善长程 rollout；其部署使用确定性均值，不能直接作为不确定性已校准的依据。\n\n**元数据。** Junyi Liao、Johann Guilleminot、Vahid Tarokh。v1：2026-09-15 04:28:59 UTC；无修订；预印本。[原文](https://arxiv.org/abs/2609.16621)；[全文](https://arxiv.org/html/2609.16621v1)。**未找到官方代码**。\n\n### 中文摘要\n\n编码器保留空间 latent field，残差 FNO 预测下一状态。训练在编码和转移处加入有谱结构的 Gaussian 扰动，目标为 `L_pred + beta KL(q(z_next|x_next) || p(z_next|z)) + lambda L_rec`。推理只编码一次，随后潜空间递推并解码，关闭采样。\n\n### 创新点与实验边界\n\n相对确定性 latent FNO 和普通 Gaussian noise baseline，新增的是结构化噪声及分布转移对齐。2D CFD 从训练区间 `[0,1]` 外推至 `10`：Table 4 的平均相对 L2 **0.0565**，FNO-AE **0.2526**；H1 **0.4044 对 2.3394**。这是真实的长于训练时域的合成 PDE 测试，但物理系统使用规则网格和固定步长，理论界依赖正则性，不能把标题理解为任意疾病动力学均稳定。\n\n### 和我方向的适配\n\n**可迁移算法。** 可迁移结构化 latent 扰动与下一时点表示对齐，以检验小样本下局部预测误差的累积。治疗与不规则时间差必须另行建模；MRI 空间纹理不具有周期流体边界，频谱噪声不能未经检验直接照搬。\n\n### 可借鉴动作\n\n在同一个小型 latent transition 上比较无噪声、等方差独立噪声、空间相关噪声，以及是否加入下一状态 KL 的消融。至少需要三次观测才能检查真实多步误差；少于此时只检验单步，不构造伪随访证明长程稳定。报告 rollout 各步病灶误差、频谱/边界保真与少事件临床结局；若只是平滑病灶而失去变化信息，或 KL 导致表征塌缩，则否证。单卡小头是工程估计；本次未核实全文硬件总耗时，不作原实验算力承诺。\n\n### 原始摘要或 Evidence Source\n\n[v1 全文](https://arxiv.org/html/2609.16621v1) §4–6、Tables 2/4；本次未逐条复核附录证明，独立笔记附原始摘要。\n\n## 6. Multi-source conformal prediction: leveraging heterogeneity via localization\n\n### 一句话总结\n\nMS-RLCP 根据测试样本附近的数据支持选择校准来源，适合研究多中心区间预测，但依赖跨来源共享 `P(Y|X)`，不提供任意中心漂移下的保证。\n\n**元数据。** Rohan Hore、Anirban Chatterjee、Sayantan Choudhury。v1：2026-09-13 14:08:28 UTC；无修订；预印本。[原文](https://arxiv.org/abs/2609.14531)；[全文](https://arxiv.org/html/2609.14531v1)。**未找到官方代码**。\n\n### 中文摘要\n\n各来源分别训练 score 并留出 calibration set；对随机局部化的测试特征，以训练样本核密度估计选择局部支持最强的来源，再构造该来源的加权 conformal 集合。选择规则使用训练分区，避免直接依照校准标签挑选最有利来源。\n\n### 创新点与实验边界\n\n理论允许测试特征分布超出简单来源混合，但需要共享条件响应分布、envelope 支持及相应正则性。不是无条件的有限样本逐患者覆盖保证。目标覆盖 90% 时，FMoW 实验实际总体 **88.59 ± 0.82%**；MEPS 三个 panel 总体 **89.4–89.8%**，其中一个来源仅 **88.1–88.3%**。这些数字说明应报告具体亚组不足，不能只写“达到了 90% 校准”。\n\n### 和我方向的适配\n\n**可迁移算法。** 可为肿瘤变化量或 pCR 预测集合增加跨中心校准层。治疗选择、终点定义或疾病谱导致 `P(Y|X)` 改变时，核心假设可能失效；删失生存不能把未观察到的生存时间直接当连续标签套用。\n\n### 可借鉴动作\n\n固定预测模型，按患者/中心分开 train、calibration、test；比较 pooled split conformal、中心内校准和 MS-RLCP，做留一中心测试。报告总体和逐中心覆盖率、区间宽度、worst-group coverage、校准样本数。带宽只在训练/验证集选择。若低样本中心持续欠覆盖，或仅靠极宽/无界集合达到覆盖，否定实用价值；也须把机制漂移与协变量漂移分别分析。缓存特征上的校准主要是 CPU 工作，复杂度与校准集规模、核计算有关，不需要重新训练生成器。\n\n### 原始摘要或 Evidence Source\n\n[v1 全文](https://arxiv.org/html/2609.14531v1) Algorithm 1、§3–5、Table 1；理论结论按其假设转述，未独立验证全部证明。独立笔记附原始摘要。\n\n## 7. An immune world model for multiscale forecasting and therapeutic hypothesis generation\n\n### 一句话总结\n\n把免疫干预与患者背景分开建模，强调变化量和锁定评估；治疗组合仍是计算提出的假设，尚无新实验或临床疗效验证。\n\n**元数据。** Taoyong Cui、Xi Wang、Zonghang Li、Jinchao Ding、Lingsen You、Yuzhi Xu、Wanghan Xu、Fang Wu、Kejun Ying、Wanli Ouyang、Pheng Ann Heng、Ling Yang、Zhenfei Yin、Yingcheng Wu。v1：2026-09-13 18:06:18 UTC；无修订；预印本。[原文](https://arxiv.org/abs/2609.14709)；[全文](https://arxiv.org/html/2609.14709v1)。**未找到官方代码**；Data and code availability 使用将来时，称之后发布软件与版本化数据清单。\n\n### 中文摘要\n\n将细胞状态、组织微环境和患者背景组织为结构化 state，把目标干预作为独立 action，学习 `S_next = F(S, A)`，用 decoder 输出表达变化、程序分数及临床响应相关读数。作者还报告模型搜索、冻结和独立确认流程，但公开配置和划分清单尚待发布，本次未独立审计这些隔离措施。\n\n### 创新点与实验边界\n\n原始细胞图谱约一千万细胞，但只有 **12 名供者**；细胞数不等于患者样本量。Figure 3 的平均 gene-delta cosine 中，模型与 **condition-mean 均为 0.46**，不能声称所有基线都被超越。抗 PD-1 的 all-cell state LOO AUC 为 **0.92，95% CI 0.79–1.00**，并非生成未来状态优于同输入直接预测的充分证据。23 个未见组合中 19 个改善；所谓跨尺度 rollout 包含示例，全文仍把队列级递归验证列为未来工作。研究使用公开既有数据，没有新增湿实验，IL-36gamma + SIRPalpha inhibition 只是待验证假设。\n\n### 和我方向的适配\n\n**直接相关于治疗条件下的生物状态建模；对 MRI/CT 模块属于外围启发。** 值得借鉴干预与既往治疗分离、变化量而非绝对状态评价，以及在模型选择后锁定测试集。组织层表示主要来自组学/免疫上下文，不是 CT-to-WSI 生成，也未证明组织切片形态预测。\n\n### 可借鉴动作\n\n在同一患者划分上，比较临床直接预测、真实影像/组学联合直接预测、预测未来状态辅助模型；匹配输入、容量与训练预算，单独加入 condition-mean 与置换背景对照。以供者/患者为统计单位，评估变化量、pCR/response 的 AUROC/AUPRC/Brier 和中心外表现；假如生成辅助不优于直接模型，或收益依赖反复筛选测试集，就不支持临床增益。计算组合预测不自动识别治疗因果效应，仍需一致性、可交换性、positivity、清晰干预定义及缺失/删失假设。先做缓存特征小头是单卡估计；完整 AI Scientist/组学流程总算力未核实。\n\n### 原始摘要或 Evidence Source\n\n[v1 全文](https://arxiv.org/html/2609.14709v1) Figures 2–4、Methods、Discussion、Resource availability；独立笔记附原始摘要。\n\n## 今天最值得读的一篇\n\n**Reverse Spatio-Temporal Disease Progression Modelling。** 先读 Table 1 和 §5.2，再回看摘要。它直接连接 VQGAN、反向生成、患者特异性和复制基线，并提供了一个能否定错误研究结论的评估案例。最优先的实际动作是做“配准后病灶变化信号 / 编码器误差 / 复制基线”三项审计，而不是立即扩大生成模型。\n\n## 来源与时效\n\n检索窗口从上次成功检索时间减 72 小时开始，即 **2026-09-12 01:45 UTC**，检索于 2026-09-16 北京时间上午执行。分别完成通用算法与医学线；arXiv 查询包含无医学限定词的 FM、world model/JEPA、连续时间、概率预测、缺失模态和长程动态查询。7 篇推荐均核实原始页面日期与 HTML 全文，未下载 PDF。官方仓库只核验可访问性、论文关联与文件目录，未运行其代码。\n\nPubMed 两条查询返回 14 篇去重记录，已读取摘要与日期；其中昨日 BPE/pCR 已推荐，其余主要为诊断、分型、综述或新近索引的旧文，没有为填满名额将它们写成新的纵向生成研究。两个 arXiv 搜索候选 BrainVLM（2609.16597）与 Scaling-Score Conformal（2609.17091）的原页返回 404，本期不推荐，保留后续核验。\n\nICLR、ICML、CVPR、ICCV、AISTATS、UAI、MIDL 官方目录已重试并筛查主题，但目录可访问不代表所有论文的近期实质修订已遍历。MICCAI 2026 目录仍返回 401；OpenReview API 个别候选返回 403；ECVA 当前目录仍以 ECCV 2024 为最新展示，NeurIPS 目录最新公开年份为 2025。TMI/MedIA 定向 PubMed 查询本次为 0 条，不代表这些期刊全站没有新论文。上述来源保留覆盖缺口和旧回补起点，不冒称完整覆盖。\n\n","paperIds":["arxiv:2609.14590","arxiv:2609.15189","arxiv:2609.16573","arxiv:2609.16317","arxiv:2609.16621","arxiv:2609.14531","arxiv:2609.14709"]},{"date":"2026-09-15","summary":"\u003cp>今天精选 \u003cstrong>3 篇：2 篇可迁移算法、1 篇直接相关医学研究\u003c/strong>，均为本雷达首次推荐，均已阅读开放 HTML 全文的方法与实验。最值得读的是 \u003cstrong>DiTAR+\u003c/strong>：它把“历史复制捷径”和“远期记忆不足”拆成两个可独立验证的问题。近期更值得投入的是条件使用诊断与公平对照，而不是直接增加生成器规模。\u003c/p>\n","html":"\u003cp>今天精选 \u003cstrong>3 篇：2 篇可迁移算法、1 篇直接相关医学研究\u003c/strong>，均为本雷达首次推荐，均已阅读开放 HTML 全文的方法与实验。最值得读的是 \u003cstrong>DiTAR+\u003c/strong>：它把“历史复制捷径”和“远期记忆不足”拆成两个可独立验证的问题。近期更值得投入的是条件使用诊断与公平对照，而不是直接增加生成器规模。\u003c/p>\n\u003cp>本次从上次成功检索时间 2026-09-14 23:25:36（北京时间）向前重叠 72 小时，起点为 \u003cstrong>2026-09-11 23:25:36\u003c/strong>；原站日期查询向外取整至 9 月 11–15 日。三篇属于重叠窗口内新近公开、今天首次检出的论文，\u003cstrong>不称为“今天刚发表”\u003c/strong>。没有核实到值得重复推荐的实质修订。昨天五篇推荐均不重复；奠基论文沿用昨天记录。\u003c/p>\n\u003ch2>阅读总览\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>优先级\u003c/th>\u003cth>论文\u003c/th>\u003cth>首次日期及状态\u003c/th>\u003cth>对研究最有用的部分\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.13909\" target=\"_blank\" rel=\"noopener noreferrer\">DiTAR+: Dual Optimization for Robust Autoregressive Diffusion Speech Synthesis\u003c/a>\u003c/td>\u003ctd>v1 提交 2026-09-12；预印本\u003c/td>\u003ctd>浅层屏蔽历史的直接注意力，后层恢复历史；区分条件忽略与记忆不足\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.13984\" target=\"_blank\" rel=\"noopener noreferrer\">What Makes an Efficient VLA? Navigating Action-Head Design, Scaling, and Latency\u003c/a>\u003c/td>\u003ctd>v1 提交 2026-09-12；预印本\u003c/td>\u003ctd>生成头与直接预测头的初始化、结构、预算要交叉匹配\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ca href=\"https://doi.org/10.4274/dir.2026.264036\" target=\"_blank\" rel=\"noopener noreferrer\">Comparing clinicopathological factors and quantitative background parenchymal enhancement to predict pathological complete response after neoadjuvant chemotherapy in breast cancer\u003c/a>\u003c/td>\u003ctd>在线发表 2026-09-14；Diagn Interv Radiol，ahead of print\u003c/td>\u003ctd>量化影像变化并不自动产生 pCR 增益；临床基线与预测时点必须先锁定\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>arXiv 日期采用 Submission history 的 UTC v1 提交时间作为公开日期代理；精确公告上线时刻未独立核实。检索结果日期曾比 VGFM 原始版本历史早一天，已以原始历史为准。期刊收稿和接受日期不充当公开日期，PubMed 数据库 DateRevised 不充当论文修订日期。\u003c/p>\n\u003ch2>1. DiTAR+\u003c/h2>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>在语音 AR-DiT 中，稀疏保留远期历史改善长程一致性，浅层限制历史直接注意力改善复杂条件遵循，但两者的收益不能假定普遍叠加。\u003c/p>\n\u003cp>\u003cstrong>元数据与来源。\u003c/strong> Ziyu Zhang、Tianlun Zuo、Hanzhao Li、Haoyu Zhang、Lei Xie。首次版本：2026-09-12 12:32:02 UTC；最新 v1，无后续修订记录；预印本，未核实正式接受。\u003ca href=\"https://arxiv.org/abs/2609.13909\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.13909v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。\u003cstrong>未找到官方代码\u003c/strong>；全文给出的 seed-tts-eval 是外部评测工具，不能当作本论文实现。PDF 链接存在，本次未下载，未测试 PDF 可访问性。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>DiTAR 先用自回归模块生成当前语音片段的语义条件，再由 LocDiT 依据该条件、噪声片段和相邻历史生成连续声学潜变量。作者认为长语音失稳包含两种问题：历史窗口太短，以及生成器过度延续历史声学模式、忽略语义条件。DiTAR+ 分别加入 Dilated Context Sampling（DCS）与 Hierarchical Acoustic Masking（HAM），没有提出新的临床时间动力学或新的流匹配目标。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>相对最接近的 DiTAR，DCS 保留最近连续片段，同时按固定步长抽取更远片段，按原时间顺序拼接：\u003ccode>C_i = [P_(i-nj), ..., P_(i-j), P_(i-c), ..., P_(i-1)]\u003c/code>。它改变历史条件的构造，不把时间序列重新排序。\u003c/p>\n\u003cp>HAM 在前 \u003ccode>N1\u003c/code> 个 Transformer 块中，把“当前片段 query → 历史片段 key”的 attention logits 设为负无穷，后续层恢复访问；语义条件与生成时间仍可用。这里的“先后”是\u003cstrong>网络深度\u003c/strong>，不是前几次 ODE 求解步，也不是临床治疗阶段。该 mask 只切断直接注意力边；上游语义条件可能已汇总历史，因此不能把它解释为与历史信息完全独立。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>全文 §3.1–3.5、Table 1/3：Emilia 语音训练；ZH-Hard 与 ZH-Long 各 400 条，后者预期时长 25–35 秒。相对 DiTAR，完整方法在 ZH-Hard 的 WER 为 \u003cstrong>12.478% → 9.893%\u003c/strong>；ZH-Long 的 WER 为 \u003cstrong>2.778% → 2.173%\u003c/strong>，speaker similarity 为 \u003cstrong>0.741 → 0.759\u003c/strong>。\u003c/p>\n\u003cp>消融比总榜更值得读：HAM 单独使用时，ZH-Hard WER 为 \u003cstrong>9.889%\u003c/strong>，但 ZH-Long WER 恶化至 \u003cstrong>3.056%\u003c/strong>；DCS 单独使用的 ZH-Long WER 为 \u003cstrong>2.165%\u003c/strong>，略优于完整方法的 2.173%。完整方法也未提升所有主观指标，Q-MOS 为 3.82，基线为 3.88。作者把两者称为互补机制；我的判断是它支持“任务依赖的折中”，不支持所有条件下的严格协同。没有看到重复训练种子或这些微小差值的置信区间，不能给 0.004 或 0.008 个百分点差异排序。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可迁移 LocDiT 的分层条件通路到未来影像/残差潜变量生成器：浅层主要读取治疗、真实时间差和患者摘要，深层再注入历史空间细节。它针对“生成结果像输入，但病灶变化没学到”的诊断问题。\u003c/p>\n\u003cp>医疗迁移需要至少基线及一个后续观测；验证远期历史价值最好有至少三个可用时点。I-SPY2 类每人仅 2–4 次 MRI 时，应保留所有已观测时点并显式编码真实天数，不能照搬等间隔语音的 stride。患者解剖与病灶历史本身是必要信息，过度屏蔽可能损害患者特异性；治疗条件也不像文本那样指定唯一目标。生成时间 \u003ccode>s∈[0,1]\u003c/code> 与临床时间差 \u003ccode>Δt\u003c/code> 必须分开输入。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>改动位置：\u003c/strong> 冻结既有影像编码器，仅在历史 token 到未来 latent/残差生成器的 attention mask 处加入浅层屏蔽。先不更换 VQGAN 或扩大生成器。没有分层 attention 的模型不硬套 HAM。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>必要对照：\u003c/strong> 同结构、参数量、数据和训练步数下比较原始条件、随机 condition dropout、HAM；有足够时点时再做历史扩展 × HAM 的 2×2 消融。加入最新观测复制、线性趋势和同输入/相近容量的直接残差预测器；额外历史 token 的算量也应计入匹配预算。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>评价：\u003c/strong> 分别报告全图/病灶 ROI 相似度，肿瘤体积变化 MAE 与变化方向，逐预测步误差；将病灶预测均值相对“复制输入”的改善单独列出。随机生成评估体积 CRPS、联合 latent 的 energy score、区间覆盖率及宽度，不用 best-of-K 代替校准。用训练集定义的大变化阈值分组，避免多数稳定患者掩盖失败。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>否证结果：\u003c/strong> 若 HAM 仅降低全图误差、病灶变化不优于复制，或移除治疗/打乱历史后性能基本不变，则削弱“改善条件使用”的假设；若只增加治疗敏感性但真实预测或校准变差，同样不支持它。置换条件属于模型依赖性诊断，不是因果治疗效应实验。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>算力：\u003c/strong> 原文 §3.1 为 \u003cstrong>32 张 H20、每卡 batch 8\u003c/strong>，未给完整 GPU 小时。医学最小实验估计只需单卡训练缓存 latent 上的小生成头；这是基于冻结编码器、控制 token 数的工程估计，须以实际 token 数/显存/每步耗时定预算，不声称单卡可复现原语音模型。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据为 \u003ca href=\"https://arxiv.org/html/2609.13909v1\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv v1 全文\u003c/a> §2.2–2.3、Algorithm 1、§3.1、Table 1–3。独立论文笔记附原始英文摘要。本报告中的医学迁移及否证标准是研究建议，原文没有 MRI、pCR 或生存实验。\u003c/p>\n\u003ch2>2. What Makes an Efficient VLA?\u003c/h2>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>同样的预测头，初始化改变可能比“回归还是 FM”更重要；论文最可靠的启发是如何设计对照，而不是证明回归普遍胜过生成。\u003c/p>\n\u003cp>\u003cstrong>元数据与来源。\u003c/strong> Luoyang Sun、Guoyang Xia、Fengfa Li、Lei Ren、Xinyu Cui、Haifeng Zhang、Fangxiang Feng、Kaike Zhang、Kun Zhan、Yan Xie、Jun Wang、Cheng Deng。首次版本：2026-09-12 14:55:15 UTC；最新 v1，无后续修订记录；预印本，未核实正式接受。\u003ca href=\"https://arxiv.org/abs/2609.13984\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.13984v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>；\u003ca href=\"https://github.com/MindVLA-Team/EFFVLA\" target=\"_blank\" rel=\"noopener noreferrer\">已核实官方代码\u003c/a>。仓库公开且含 EffVLA/Pi0 模型模块；README 要求外部 starVLA 框架，因此它不是已验证可独立复现的完整训练包。本次未运行代码、未下载 PDF。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>固定 SigLIP2、Qwen2.5 家族和 DROID → LIBERO 训练流程，作者考察预测头结构、初始化、L1/FM 损失、推理次数及模块规模。EffVLA 使用从语言骨干最后四层复制权重的 Transformer 预测头，通过 KV-share 读取骨干，单次 L1 回归动作块。它主要是一项系统对照研究和由此选出的配置，不是新的生成分布建模理论。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>对同结构 L1 头，随机初始化与骨干初始化是清晰的权重对照；目标为动作块的 L1 误差。FM 头则学习带噪动作到目标动作的 rectified-flow 路径，实验固定四次推理。可迁移的核心是把\u003cstrong>表征接口、初始化、预测目标、采样预算\u003c/strong>逐项匹配，避免把预训练带来的收益归因于某一生成损失。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 2：同 Transformer/L1/单次推理下，骨干初始化使 LIBERO-Plus 成功率 \u003cstrong>72.7% → 79.8%\u003c/strong>。固定四次推理，已初始化的 L1 头为 79.6%，对应 FM 为 75.2%。但 Appendix A 明确说明随机 FM 用 DiT/adaLN 块，初始化 FM 用普通块，所以 FM 的随机/初始化比较\u003cstrong>同时改变块类型\u003c/strong>，不是纯初始化消融；四步 FM 也没有充分采样步数搜索。\u003c/p>\n\u003cp>作者报告 63 个配置，但多数仅一个训练种子。五种子重复是 EffVLA 与 MLP/OFT 的比较，均值为 \u003cstrong>79.0±1.2% 与 77.9±1.5%\u003c/strong>，不是对 7.1 点随机/初始化差异的五种子重复。大部分模拟任务较短，噪声扰动下 MLP 更强；真实机器人没有完整替代头对照。作者将 representation alignment 作为解释，并承认尚未与“特定预训练权重的作用”分离。我的判断：适合提高你的比较标准，不足以否定患者未来状态的随机生成价值。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法/训练设计。\u003c/strong> 可迁移同架构不同初始化、同输入同预算直接预测的试验矩阵。若医疗骨干与动力学头的维度、注意力结构兼容，可比较复制骨干块与同构随机块；若目前是卷积 VQGAN 编码器，则没有可直接复制的语言 Transformer，不能机械照搬。\u003c/p>\n\u003cp>机器人成功率没有检验未来分布校准，更没有删失生存风险。基础病理特征、真实时间差、治疗信息和训练数据量都要对各比较组一致；不能让生成分支使用额外随访监督而不给直接模型同等预训练机会。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>改动位置：\u003c/strong> 冻结患者编码器，在未来 latent/残差预测头处做同结构的 \u003ccode>初始化（随机/预训练）× 目标（确定性回归/FM）\u003c/code> 对照。仅在模块兼容时开展；同时记录参数、训练 FLOPs、GPU 时间和 NFE。保持 block 类型及时间嵌入一致。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>必要对照：\u003c/strong> 同患者历史直接预测 pCR 的模型；给予相同纵向监督和额外预算的直接模型；最新观测复制。若主张“对齐”机制，再加破坏对齐的预训练权重对照，但旋转/置换也可能影响优化，不能视为完美因果干预。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>评价：\u003c/strong> 未来病灶变化误差与 proper scores 单独报告；pCR 使用嵌套患者级验证的 AUROC、AUPRC、Brier、校准斜率与预设阈值净获益。增加 CKA 或条件遮挡诊断仅帮助解释，不能替代临床端点。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>否证结果：\u003c/strong> 若匹配初始化与额外预算后，生成分支的下游增益消失，则“生成本身创造额外临床信息”的证据不足；如果仍改善分布预测但不改善 pCR，应保留前者、放弃后者的论断。小样本差异 CI 宽时结论是证据不足。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>算力：\u003c/strong> 原文给出约 3.75B 总参数、0.35B 动作头、LIBERO 微调 100k steps；\u003cstrong>39.2 ms\u003c/strong> 是 RTX 5090 上的特定推理测量，不是训练成本，也不含图像预处理。未核实总训练 GPU 小时。医学版先在缓存 latent 上匹配小头预算，按单卡实测估算，不复刻 63 个大模型配置。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据为 \u003ca href=\"https://arxiv.org/html/2609.13984v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a> §3、Table 2、§8、Appendix A/I/J/N，以及\u003ca href=\"https://github.com/MindVLA-Team/EFFVLA\" target=\"_blank\" rel=\"noopener noreferrer\">官方仓库\u003c/a>。独立笔记附原始英文摘要。论文中“loss only”之类总括表述应结合 Appendix A 的结构混杂一起理解。\u003c/p>\n\u003ch2>3. Quantitative BPE and pCR\u003c/h2>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>142 例、57 个 pCR 事件的单中心研究中，自动 BPE 量化较可靠，但并未超越 HER2 + Ki-67 的简洁预测基线，且研究没有早期疗中 MRI。\u003c/p>\n\u003cp>\u003cstrong>元数据与来源。\u003c/strong> Süleyman Öncü、Murat Yüce、Ahmet İrfan Temur。完整标题见总览。\u003ca href=\"https://doi.org/10.4274/dir.2026.264036\" target=\"_blank\" rel=\"noopener noreferrer\">期刊 DOI / HTML 全文\u003c/a>；\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/42734038/\" target=\"_blank\" rel=\"noopener noreferrer\">PubMed PMID 42734038\u003c/a>。已核实在线发表 \u003cstrong>2026-09-14\u003c/strong>，接受日期 2026-07-27，收稿 2026-04-02；状态为 Diagnostic and Interventional Radiology 在线优先。未找到更早预印本，最早已核实公开日期采用期刊在线日期；论文修订日期未披露。PubMed 的 9 月 14 日 DateRevised 是索引元数据。\u003cstrong>未找到官方代码\u003c/strong>，nnU-Net 工具本身不等于本研究完整代码。PDF 链接存在，未下载、未测试 PDF 可访问性。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>研究纳入 142 人、284 次治疗前/后 MRI，通过 3D nnU-Net 分割左右乳腺实质及肿瘤，按增强信号和 SER 阈值计算 BPE，再用 logistic regression 检验 BPE、体积和临床变量对 pCR 的预测价值。57/142 人达到 pCR，定义为 \u003cstrong>ypT0/Tis ypN0\u003c/strong>。它研究真实观测的正常乳腺背景增强变化，不生成未来图像；这里的病理是术后终点与临床标志物，没有 CT-to-WSI 或组织学图像生成。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>相对定性 BPE 或单一阈值研究，改变在于左右乳腺分割、两类增强定义及多个阈值、亚组与简洁临床基线比较。百分比信号增强为 \u003ccode>100 × (SI_postcontrast − SI_precontrast) / SI_precontrast\u003c/code>；这里 post/precontrast 是\u003cstrong>一次扫描内的造影相位\u003c/strong>，另一层 pre/post-NACT 才是治疗前后。不能混为同一时间轴。\u003c/p>\n\u003cp>原文分割训练 121 人，内部测试 21 人；禁止左右镜像增强以保留 laterality。其目标并非设计新的 nnU-Net 损失，而是检验自动表型能否带来临床增益。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>全文 Results：乳腺实质 Dice 为 \u003cstrong>0.85/0.87\u003c/strong>，肿瘤为 \u003cstrong>0.61±0.36\u003c/strong>；只看大于 100 个预测体素的肿瘤可升至 0.70，但那是改变分析子集，不能替代全体表现。\u003c/p>\n\u003cp>完整模型表观 AUC \u003cstrong>0.76\u003c/strong>，五折验证 \u003cstrong>0.694±0.075\u003c/strong>；仅 HER2 + Ki-67 为 \u003cstrong>0.71±0.08\u003c/strong>。表观 +0.05 的差异 DeLong \u003ccode>P=0.12\u003c/code>，加入 BPE 的拟合改善 \u003ccode>P=0.28\u003c/code>，未显示增量价值。这是本队列没有建立增益，\u003cstrong>不是证明 BPE 或影像纵向信息在所有患者中无效\u003c/strong>。\u003c/p>\n\u003cp>HR+、HER2− 等亚组出现信号，但多重比较未校正；Luminal A/B 仅 8 个 pCR 事件。治疗后 MRI 在末次化疗至少三周之后，临近手术；缺少早期疗中扫描，不能直接否定 I-SPY2 的早期 delta-BPE。月经周期未记录、治疗按亚型分配、单中心和排除缺失 MRI 患者均限制推广。全文未充分明确特征选择是否完全嵌套于结局交叉验证、以及分割输出是否对每个结局验证折均来自独立训练，故不把报告的五折 AUC 当作完全独立外部检验。作者明确排除了术后病理变量作为多变量预测输入，不应仅因其出现在单因素表就断言最终模型用了终点泄漏。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关。\u003c/strong> 它提供乳腺纵向 MRI → pCR 的负面/边界证据，也给出正常背景、病灶变化和临床终点应分开评价的实例。值得把 BPE 作为背景通道审查：模型可能学会全乳腺治疗相关变化，却没有增加对残余肿瘤的认识。原文没有测试 latent 世界模型或生存结局。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>改动位置：\u003c/strong> 先在分析层补充预设临床基线与病灶/背景分解，不需要先改生成器。以治疗前或首次疗中扫描建立独立 landmark，预测最终 pCR，只使用该时点已经可知的输入。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>必要对照：\u003c/strong> HER2 + Ki-67 + 预先指定临床/治疗变量；同历史直接预测；真实可用病灶/BPE 特征；以及加生成未来状态的模型。真实未来状态只作单独标明的事后参照，不能混入部署预测。所有组同患者、同输入历史与训练预算，特征选择、阈值和校准均在训练折内完成。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>评价：\u003c/strong> 分割/影像误差、肿瘤体积或强化变化、pCR 增益三层分开。pCR 报告 paired ΔAUROC、ΔBrier、校准和预设阈值净获益及患者级区间；亚型样本与事件数同时列出。跨中心验证优先于反复优化阈值。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>否证结果：\u003c/strong> 若生成状态仅复现背景增强，且加入后不优于同输入的直接模型或临床基线，就不能宣称临床有用；仅某个事后挑选阈值/亚组有效也不能支持总体结论。CI 未排除有意义增益时标为证据不足。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>算力：\u003c/strong> 原文未给 GPU 型号或训练时长。若已有独立生成的分割/latent，最小比较主要是 CPU 上的小模型与重采样；若需重新训练 3D 分割，必须另行估算，不能把前述低成本评估等同于全流程成本。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据为\u003ca href=\"https://doi.org/10.4274/dir.2026.264036\" target=\"_blank\" rel=\"noopener noreferrer\">期刊全文\u003c/a>的 Methods、Results、Discussion 和 PubMed 结构化摘要。正文讨论了早期疗中 BPE 与本研究终末治疗后 BPE 的时间窗差别。独立笔记附原始英文摘要。\u003c/p>\n\u003ch2>今天不推荐的候选\u003c/h2>\n\u003cul>\n\u003cli>\u003cp>\u003ca href=\"https://arxiv.org/abs/2609.14261\" target=\"_blank\" rel=\"noopener noreferrer\">VGFM\u003c/a>：全文已读，v1 实为 \u003cstrong>9 月 13 日 UTC\u003c/strong>。x-prediction 允许对中间预测施加 critic 梯度而免去整条采样路径反传，可作为将来研究线索。但把“高回报动作”目标改成“更高 pCR 的未来状态”会改变预测分布，可能制造乐观轨迹；当前不列入精选。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://arxiv.org/abs/2609.14171\" target=\"_blank\" rel=\"noopener noreferrer\">CyFM\u003c/a>：检索摘要明确实验均为合成复数场。幅相几何需要原始复数数据，与当前普通影像/VQ latent 路线之间的收益尚不具体，暂不推荐。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://arxiv.org/abs/2609.13941\" target=\"_blank\" rel=\"noopener noreferrer\">BLInD\u003c/a>：已核实摘要与作者自报 ITSC 接受状态，但 top-k 轨迹误差与固定候选集决策改善不足以验证概率校准，未精读全文，暂存。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>胃癌新检出条目主要是内镜筛查或 WSI 化生分级；与治疗下 CT 纵向建模距离较远。本轮未新增推荐胶质瘤论文，不据此推断该领域没有新作。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch2>共同实验边界\u003c/h2>\n\u003cp>患者是划分和统计单位，同一患者的多时点、双侧影像、病灶或病理不能跨折。生成器和编码器若在测试患者随访上训练，即使不使用 pCR 标签，也会使归纳性测试不成立。随机生成应检验 proper score、覆盖率、宽度和失败率；没有同一患者多次真实反事实，不能直接估计其完整个体结局分布。\u003c/p>\n\u003cp>治疗条件预测不等于可识别的因果效应。后者还需要干预定义、一致性、序贯可交换性、positivity，以及对信息性缺失/删失的处理；疾病亚型决定治疗方案时，跨治疗置换尤其可能超出支持域。若将本次建议扩展至 OS，需先锁定 landmark、事件定义、风险集、事件数与删失机制，使用适当 IPCW Brier/动态 AUC；本轮三篇均不提供生存增益证据。\u003c/p>\n","markdown":"# 纵向医学世界模型论文雷达 | 2026-09-15\n\n今天精选 **3 篇：2 篇可迁移算法、1 篇直接相关医学研究**，均为本雷达首次推荐，均已阅读开放 HTML 全文的方法与实验。最值得读的是 **DiTAR+**：它把“历史复制捷径”和“远期记忆不足”拆成两个可独立验证的问题。近期更值得投入的是条件使用诊断与公平对照，而不是直接增加生成器规模。\n\n本次从上次成功检索时间 2026-09-14 23:25:36（北京时间）向前重叠 72 小时，起点为 **2026-09-11 23:25:36**；原站日期查询向外取整至 9 月 11–15 日。三篇属于重叠窗口内新近公开、今天首次检出的论文，**不称为“今天刚发表”**。没有核实到值得重复推荐的实质修订。昨天五篇推荐均不重复；奠基论文沿用昨天记录。\n\n\n\n## 阅读总览\n\n| 优先级 | 论文 | 首次日期及状态 | 对研究最有用的部分 |\n|---|---|---|---|\n| 1 | [DiTAR+: Dual Optimization for Robust Autoregressive Diffusion Speech Synthesis](https://arxiv.org/abs/2609.13909) | v1 提交 2026-09-12；预印本 | 浅层屏蔽历史的直接注意力，后层恢复历史；区分条件忽略与记忆不足 |\n| 2 | [What Makes an Efficient VLA? Navigating Action-Head Design, Scaling, and Latency](https://arxiv.org/abs/2609.13984) | v1 提交 2026-09-12；预印本 | 生成头与直接预测头的初始化、结构、预算要交叉匹配 |\n| 3 | [Comparing clinicopathological factors and quantitative background parenchymal enhancement to predict pathological complete response after neoadjuvant chemotherapy in breast cancer](https://doi.org/10.4274/dir.2026.264036) | 在线发表 2026-09-14；Diagn Interv Radiol，ahead of print | 量化影像变化并不自动产生 pCR 增益；临床基线与预测时点必须先锁定 |\n\narXiv 日期采用 Submission history 的 UTC v1 提交时间作为公开日期代理；精确公告上线时刻未独立核实。检索结果日期曾比 VGFM 原始版本历史早一天，已以原始历史为准。期刊收稿和接受日期不充当公开日期，PubMed 数据库 DateRevised 不充当论文修订日期。\n\n## 1. DiTAR+\n\n### 一句话总结\n\n在语音 AR-DiT 中，稀疏保留远期历史改善长程一致性，浅层限制历史直接注意力改善复杂条件遵循，但两者的收益不能假定普遍叠加。\n\n**元数据与来源。** Ziyu Zhang、Tianlun Zuo、Hanzhao Li、Haoyu Zhang、Lei Xie。首次版本：2026-09-12 12:32:02 UTC；最新 v1，无后续修订记录；预印本，未核实正式接受。[原始页面](https://arxiv.org/abs/2609.13909)；[全文](https://arxiv.org/html/2609.13909v1)。**未找到官方代码**；全文给出的 seed-tts-eval 是外部评测工具，不能当作本论文实现。PDF 链接存在，本次未下载，未测试 PDF 可访问性。\n\n### 中文摘要\n\nDiTAR 先用自回归模块生成当前语音片段的语义条件，再由 LocDiT 依据该条件、噪声片段和相邻历史生成连续声学潜变量。作者认为长语音失稳包含两种问题：历史窗口太短，以及生成器过度延续历史声学模式、忽略语义条件。DiTAR+ 分别加入 Dilated Context Sampling（DCS）与 Hierarchical Acoustic Masking（HAM），没有提出新的临床时间动力学或新的流匹配目标。\n\n### 创新点与机制\n\n相对最接近的 DiTAR，DCS 保留最近连续片段，同时按固定步长抽取更远片段，按原时间顺序拼接：`C_i = [P_(i-nj), ..., P_(i-j), P_(i-c), ..., P_(i-1)]`。它改变历史条件的构造，不把时间序列重新排序。\n\nHAM 在前 `N1` 个 Transformer 块中，把“当前片段 query → 历史片段 key”的 attention logits 设为负无穷，后续层恢复访问；语义条件与生成时间仍可用。这里的“先后”是**网络深度**，不是前几次 ODE 求解步，也不是临床治疗阶段。该 mask 只切断直接注意力边；上游语义条件可能已汇总历史，因此不能把它解释为与历史信息完全独立。\n\n### 实验支持与局限\n\n全文 §3.1–3.5、Table 1/3：Emilia 语音训练；ZH-Hard 与 ZH-Long 各 400 条，后者预期时长 25–35 秒。相对 DiTAR，完整方法在 ZH-Hard 的 WER 为 **12.478% → 9.893%**；ZH-Long 的 WER 为 **2.778% → 2.173%**，speaker similarity 为 **0.741 → 0.759**。\n\n消融比总榜更值得读：HAM 单独使用时，ZH-Hard WER 为 **9.889%**，但 ZH-Long WER 恶化至 **3.056%**；DCS 单独使用的 ZH-Long WER 为 **2.165%**，略优于完整方法的 2.173%。完整方法也未提升所有主观指标，Q-MOS 为 3.82，基线为 3.88。作者把两者称为互补机制；我的判断是它支持“任务依赖的折中”，不支持所有条件下的严格协同。没有看到重复训练种子或这些微小差值的置信区间，不能给 0.004 或 0.008 个百分点差异排序。\n\n### 和我方向的适配\n\n**可迁移算法。** 可迁移 LocDiT 的分层条件通路到未来影像/残差潜变量生成器：浅层主要读取治疗、真实时间差和患者摘要，深层再注入历史空间细节。它针对“生成结果像输入，但病灶变化没学到”的诊断问题。\n\n医疗迁移需要至少基线及一个后续观测；验证远期历史价值最好有至少三个可用时点。I-SPY2 类每人仅 2–4 次 MRI 时，应保留所有已观测时点并显式编码真实天数，不能照搬等间隔语音的 stride。患者解剖与病灶历史本身是必要信息，过度屏蔽可能损害患者特异性；治疗条件也不像文本那样指定唯一目标。生成时间 `s∈[0,1]` 与临床时间差 `Δt` 必须分开输入。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：** 冻结既有影像编码器，仅在历史 token 到未来 latent/残差生成器的 attention mask 处加入浅层屏蔽。先不更换 VQGAN 或扩大生成器。没有分层 attention 的模型不硬套 HAM。\n\n- **必要对照：** 同结构、参数量、数据和训练步数下比较原始条件、随机 condition dropout、HAM；有足够时点时再做历史扩展 × HAM 的 2×2 消融。加入最新观测复制、线性趋势和同输入/相近容量的直接残差预测器；额外历史 token 的算量也应计入匹配预算。\n\n- **评价：** 分别报告全图/病灶 ROI 相似度，肿瘤体积变化 MAE 与变化方向，逐预测步误差；将病灶预测均值相对“复制输入”的改善单独列出。随机生成评估体积 CRPS、联合 latent 的 energy score、区间覆盖率及宽度，不用 best-of-K 代替校准。用训练集定义的大变化阈值分组，避免多数稳定患者掩盖失败。\n\n- **否证结果：** 若 HAM 仅降低全图误差、病灶变化不优于复制，或移除治疗/打乱历史后性能基本不变，则削弱“改善条件使用”的假设；若只增加治疗敏感性但真实预测或校准变差，同样不支持它。置换条件属于模型依赖性诊断，不是因果治疗效应实验。\n\n- **算力：** 原文 §3.1 为 **32 张 H20、每卡 batch 8**，未给完整 GPU 小时。医学最小实验估计只需单卡训练缓存 latent 上的小生成头；这是基于冻结编码器、控制 token 数的工程估计，须以实际 token 数/显存/每步耗时定预算，不声称单卡可复现原语音模型。\n\n\n### 原始摘要或 Evidence Source\n\n证据为 [arXiv v1 全文](https://arxiv.org/html/2609.13909v1) §2.2–2.3、Algorithm 1、§3.1、Table 1–3。独立论文笔记附原始英文摘要。本报告中的医学迁移及否证标准是研究建议，原文没有 MRI、pCR 或生存实验。\n\n## 2. What Makes an Efficient VLA?\n\n### 一句话总结\n\n同样的预测头，初始化改变可能比“回归还是 FM”更重要；论文最可靠的启发是如何设计对照，而不是证明回归普遍胜过生成。\n\n**元数据与来源。** Luoyang Sun、Guoyang Xia、Fengfa Li、Lei Ren、Xinyu Cui、Haifeng Zhang、Fangxiang Feng、Kaike Zhang、Kun Zhan、Yan Xie、Jun Wang、Cheng Deng。首次版本：2026-09-12 14:55:15 UTC；最新 v1，无后续修订记录；预印本，未核实正式接受。[原始页面](https://arxiv.org/abs/2609.13984)；[全文](https://arxiv.org/html/2609.13984v1)；[已核实官方代码](https://github.com/MindVLA-Team/EFFVLA)。仓库公开且含 EffVLA/Pi0 模型模块；README 要求外部 starVLA 框架，因此它不是已验证可独立复现的完整训练包。本次未运行代码、未下载 PDF。\n\n### 中文摘要\n\n固定 SigLIP2、Qwen2.5 家族和 DROID → LIBERO 训练流程，作者考察预测头结构、初始化、L1/FM 损失、推理次数及模块规模。EffVLA 使用从语言骨干最后四层复制权重的 Transformer 预测头，通过 KV-share 读取骨干，单次 L1 回归动作块。它主要是一项系统对照研究和由此选出的配置，不是新的生成分布建模理论。\n\n### 创新点与机制\n\n对同结构 L1 头，随机初始化与骨干初始化是清晰的权重对照；目标为动作块的 L1 误差。FM 头则学习带噪动作到目标动作的 rectified-flow 路径，实验固定四次推理。可迁移的核心是把**表征接口、初始化、预测目标、采样预算**逐项匹配，避免把预训练带来的收益归因于某一生成损失。\n\n### 实验支持与局限\n\nTable 2：同 Transformer/L1/单次推理下，骨干初始化使 LIBERO-Plus 成功率 **72.7% → 79.8%**。固定四次推理，已初始化的 L1 头为 79.6%，对应 FM 为 75.2%。但 Appendix A 明确说明随机 FM 用 DiT/adaLN 块，初始化 FM 用普通块，所以 FM 的随机/初始化比较**同时改变块类型**，不是纯初始化消融；四步 FM 也没有充分采样步数搜索。\n\n作者报告 63 个配置，但多数仅一个训练种子。五种子重复是 EffVLA 与 MLP/OFT 的比较，均值为 **79.0±1.2% 与 77.9±1.5%**，不是对 7.1 点随机/初始化差异的五种子重复。大部分模拟任务较短，噪声扰动下 MLP 更强；真实机器人没有完整替代头对照。作者将 representation alignment 作为解释，并承认尚未与“特定预训练权重的作用”分离。我的判断：适合提高你的比较标准，不足以否定患者未来状态的随机生成价值。\n\n### 和我方向的适配\n\n**可迁移算法/训练设计。** 可迁移同架构不同初始化、同输入同预算直接预测的试验矩阵。若医疗骨干与动力学头的维度、注意力结构兼容，可比较复制骨干块与同构随机块；若目前是卷积 VQGAN 编码器，则没有可直接复制的语言 Transformer，不能机械照搬。\n\n机器人成功率没有检验未来分布校准，更没有删失生存风险。基础病理特征、真实时间差、治疗信息和训练数据量都要对各比较组一致；不能让生成分支使用额外随访监督而不给直接模型同等预训练机会。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：** 冻结患者编码器，在未来 latent/残差预测头处做同结构的 `初始化（随机/预训练）× 目标（确定性回归/FM）` 对照。仅在模块兼容时开展；同时记录参数、训练 FLOPs、GPU 时间和 NFE。保持 block 类型及时间嵌入一致。\n\n- **必要对照：** 同患者历史直接预测 pCR 的模型；给予相同纵向监督和额外预算的直接模型；最新观测复制。若主张“对齐”机制，再加破坏对齐的预训练权重对照，但旋转/置换也可能影响优化，不能视为完美因果干预。\n\n- **评价：** 未来病灶变化误差与 proper scores 单独报告；pCR 使用嵌套患者级验证的 AUROC、AUPRC、Brier、校准斜率与预设阈值净获益。增加 CKA 或条件遮挡诊断仅帮助解释，不能替代临床端点。\n\n- **否证结果：** 若匹配初始化与额外预算后，生成分支的下游增益消失，则“生成本身创造额外临床信息”的证据不足；如果仍改善分布预测但不改善 pCR，应保留前者、放弃后者的论断。小样本差异 CI 宽时结论是证据不足。\n\n- **算力：** 原文给出约 3.75B 总参数、0.35B 动作头、LIBERO 微调 100k steps；**39.2 ms** 是 RTX 5090 上的特定推理测量，不是训练成本，也不含图像预处理。未核实总训练 GPU 小时。医学版先在缓存 latent 上匹配小头预算，按单卡实测估算，不复刻 63 个大模型配置。\n\n\n### 原始摘要或 Evidence Source\n\n证据为 [全文](https://arxiv.org/html/2609.13984v1) §3、Table 2、§8、Appendix A/I/J/N，以及[官方仓库](https://github.com/MindVLA-Team/EFFVLA)。独立笔记附原始英文摘要。论文中“loss only”之类总括表述应结合 Appendix A 的结构混杂一起理解。\n\n## 3. Quantitative BPE and pCR\n\n### 一句话总结\n\n142 例、57 个 pCR 事件的单中心研究中，自动 BPE 量化较可靠，但并未超越 HER2 + Ki-67 的简洁预测基线，且研究没有早期疗中 MRI。\n\n**元数据与来源。** Süleyman Öncü、Murat Yüce、Ahmet İrfan Temur。完整标题见总览。[期刊 DOI / HTML 全文](https://doi.org/10.4274/dir.2026.264036)；[PubMed PMID 42734038](https://pubmed.ncbi.nlm.nih.gov/42734038/)。已核实在线发表 **2026-09-14**，接受日期 2026-07-27，收稿 2026-04-02；状态为 Diagnostic and Interventional Radiology 在线优先。未找到更早预印本，最早已核实公开日期采用期刊在线日期；论文修订日期未披露。PubMed 的 9 月 14 日 DateRevised 是索引元数据。**未找到官方代码**，nnU-Net 工具本身不等于本研究完整代码。PDF 链接存在，未下载、未测试 PDF 可访问性。\n\n### 中文摘要\n\n研究纳入 142 人、284 次治疗前/后 MRI，通过 3D nnU-Net 分割左右乳腺实质及肿瘤，按增强信号和 SER 阈值计算 BPE，再用 logistic regression 检验 BPE、体积和临床变量对 pCR 的预测价值。57/142 人达到 pCR，定义为 **ypT0/Tis ypN0**。它研究真实观测的正常乳腺背景增强变化，不生成未来图像；这里的病理是术后终点与临床标志物，没有 CT-to-WSI 或组织学图像生成。\n\n### 创新点与机制\n\n相对定性 BPE 或单一阈值研究，改变在于左右乳腺分割、两类增强定义及多个阈值、亚组与简洁临床基线比较。百分比信号增强为 `100 × (SI_postcontrast − SI_precontrast) / SI_precontrast`；这里 post/precontrast 是**一次扫描内的造影相位**，另一层 pre/post-NACT 才是治疗前后。不能混为同一时间轴。\n\n原文分割训练 121 人，内部测试 21 人；禁止左右镜像增强以保留 laterality。其目标并非设计新的 nnU-Net 损失，而是检验自动表型能否带来临床增益。\n\n### 实验支持与局限\n\n全文 Results：乳腺实质 Dice 为 **0.85/0.87**，肿瘤为 **0.61±0.36**；只看大于 100 个预测体素的肿瘤可升至 0.70，但那是改变分析子集，不能替代全体表现。\n\n完整模型表观 AUC **0.76**，五折验证 **0.694±0.075**；仅 HER2 + Ki-67 为 **0.71±0.08**。表观 +0.05 的差异 DeLong `P=0.12`，加入 BPE 的拟合改善 `P=0.28`，未显示增量价值。这是本队列没有建立增益，**不是证明 BPE 或影像纵向信息在所有患者中无效**。\n\nHR+、HER2− 等亚组出现信号，但多重比较未校正；Luminal A/B 仅 8 个 pCR 事件。治疗后 MRI 在末次化疗至少三周之后，临近手术；缺少早期疗中扫描，不能直接否定 I-SPY2 的早期 delta-BPE。月经周期未记录、治疗按亚型分配、单中心和排除缺失 MRI 患者均限制推广。全文未充分明确特征选择是否完全嵌套于结局交叉验证、以及分割输出是否对每个结局验证折均来自独立训练，故不把报告的五折 AUC 当作完全独立外部检验。作者明确排除了术后病理变量作为多变量预测输入，不应仅因其出现在单因素表就断言最终模型用了终点泄漏。\n\n### 和我方向的适配\n\n**直接相关。** 它提供乳腺纵向 MRI → pCR 的负面/边界证据，也给出正常背景、病灶变化和临床终点应分开评价的实例。值得把 BPE 作为背景通道审查：模型可能学会全乳腺治疗相关变化，却没有增加对残余肿瘤的认识。原文没有测试 latent 世界模型或生存结局。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：** 先在分析层补充预设临床基线与病灶/背景分解，不需要先改生成器。以治疗前或首次疗中扫描建立独立 landmark，预测最终 pCR，只使用该时点已经可知的输入。\n\n- **必要对照：** HER2 + Ki-67 + 预先指定临床/治疗变量；同历史直接预测；真实可用病灶/BPE 特征；以及加生成未来状态的模型。真实未来状态只作单独标明的事后参照，不能混入部署预测。所有组同患者、同输入历史与训练预算，特征选择、阈值和校准均在训练折内完成。\n\n- **评价：** 分割/影像误差、肿瘤体积或强化变化、pCR 增益三层分开。pCR 报告 paired ΔAUROC、ΔBrier、校准和预设阈值净获益及患者级区间；亚型样本与事件数同时列出。跨中心验证优先于反复优化阈值。\n\n- **否证结果：** 若生成状态仅复现背景增强，且加入后不优于同输入的直接模型或临床基线，就不能宣称临床有用；仅某个事后挑选阈值/亚组有效也不能支持总体结论。CI 未排除有意义增益时标为证据不足。\n\n- **算力：** 原文未给 GPU 型号或训练时长。若已有独立生成的分割/latent，最小比较主要是 CPU 上的小模型与重采样；若需重新训练 3D 分割，必须另行估算，不能把前述低成本评估等同于全流程成本。\n\n\n### 原始摘要或 Evidence Source\n\n证据为[期刊全文](https://doi.org/10.4274/dir.2026.264036)的 Methods、Results、Discussion 和 PubMed 结构化摘要。正文讨论了早期疗中 BPE 与本研究终末治疗后 BPE 的时间窗差别。独立笔记附原始英文摘要。\n\n## 今天不推荐的候选\n\n- [VGFM](https://arxiv.org/abs/2609.14261)：全文已读，v1 实为 **9 月 13 日 UTC**。x-prediction 允许对中间预测施加 critic 梯度而免去整条采样路径反传，可作为将来研究线索。但把“高回报动作”目标改成“更高 pCR 的未来状态”会改变预测分布，可能制造乐观轨迹；当前不列入精选。\n\n- [CyFM](https://arxiv.org/abs/2609.14171)：检索摘要明确实验均为合成复数场。幅相几何需要原始复数数据，与当前普通影像/VQ latent 路线之间的收益尚不具体，暂不推荐。\n\n- [BLInD](https://arxiv.org/abs/2609.13941)：已核实摘要与作者自报 ITSC 接受状态，但 top-k 轨迹误差与固定候选集决策改善不足以验证概率校准，未精读全文，暂存。\n\n- 胃癌新检出条目主要是内镜筛查或 WSI 化生分级；与治疗下 CT 纵向建模距离较远。本轮未新增推荐胶质瘤论文，不据此推断该领域没有新作。\n\n\n## 共同实验边界\n\n患者是划分和统计单位，同一患者的多时点、双侧影像、病灶或病理不能跨折。生成器和编码器若在测试患者随访上训练，即使不使用 pCR 标签，也会使归纳性测试不成立。随机生成应检验 proper score、覆盖率、宽度和失败率；没有同一患者多次真实反事实，不能直接估计其完整个体结局分布。\n\n治疗条件预测不等于可识别的因果效应。后者还需要干预定义、一致性、序贯可交换性、positivity，以及对信息性缺失/删失的处理；疾病亚型决定治疗方案时，跨治疗置换尤其可能超出支持域。若将本次建议扩展至 OS，需先锁定 landmark、事件定义、风险集、事件数与删失机制，使用适当 IPCW Brier/动态 AUC；本轮三篇均不提供生存增益证据。\n\n","paperIds":["arxiv:2609.13909","arxiv:2609.13984","doi:10.4274/dir.2026.264036"]},{"date":"2026-09-14","summary":"\u003cp>今天最值得读的是 \u003cstrong>Flow-JEPA\u003c/strong>：它把单步潜状态回归改成整段未来潜轨迹的条件 Flow Matching，最接近你现有路线中可以小规模替换验证的模块。今天最值得立即吸收的评价要求来自 \u003cstrong>OASA\u003c/strong>：新模型必须超过最新观测复制和简单形态学基线；阈值附近的 Dice 改善不能当作疾病演化预测成功。\u003c/p>\n","html":"\u003cp>今天最值得读的是 \u003cstrong>Flow-JEPA\u003c/strong>：它把单步潜状态回归改成整段未来潜轨迹的条件 Flow Matching，最接近你现有路线中可以小规模替换验证的模块。今天最值得立即吸收的评价要求来自 \u003cstrong>OASA\u003c/strong>：新模型必须超过最新观测复制和简单形态学基线；阈值附近的 Dice 改善不能当作疾病演化预测成功。\u003c/p>\n\u003cp>本轮精选 5 篇，通用算法/评价 3 篇，医学应用 2 篇。4 篇阅读了 HTML 全文的方法和实验，1 篇仅有摘要证据。下面所有数字都是作者报告，本轮未复现实验。推荐算法迁移不等于认可其医学效果。\u003c/p>\n\u003ch2>阅读优先级\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>顺序\u003c/th>\u003cth>英文标题\u003c/th>\u003cth>类型与适配\u003c/th>\u003cth>v1 日期 / 最新修订\u003c/th>\u003cth>状态与证据\u003c/th>\u003cth>阅读目的\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2608.29029\" target=\"_blank\" rel=\"noopener noreferrer\">Flow-JEPA: Flow Matching for Robust Latent Dynamics in JEPA World Models\u003c/a>\u003c/td>\u003ctd>新论文；可迁移算法\u003c/td>\u003ctd>2026-08-29 / 无后续修订，v1\u003c/td>\u003ctd>预印本；全文；官方代码已核实\u003c/td>\u003ctd>整段未来潜轨迹预测，降低单步递推误差\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.12435\" target=\"_blank\" rel=\"noopener noreferrer\">Observation-Anchored Selective Assimilation for Longitudinal Tumor-State Proxy Forecasting in Post-Treatment Glioma\u003c/a>\u003c/td>\u003ctd>新论文；直接相关\u003c/td>\u003ctd>2026-09-11 / 无后续修订，v1\u003c/td>\u003ctd>预印本；全文；官方代码已核实\u003c/td>\u003ctd>新观测更新、复制输入基线、变化与阈值评价\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2608.27345\" target=\"_blank\" rel=\"noopener noreferrer\">PAWBench: How Far Are We from Probabilistically Aligned World Modeling?\u003c/a>\u003c/td>\u003ctd>窗口内新论文，已有修订；可迁移评价\u003c/td>\u003ctd>2026-08-27 / 2026-09-03，v3\u003c/td>\u003ctd>预印本；全文；官方代码已核实\u003c/td>\u003ctd>随机未来的概率质量与有效结果覆盖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2608.17293\" target=\"_blank\" rel=\"noopener noreferrer\">Beyond MSE: Rethinking the Evaluation Metric and Benchmarking for Irregular Time Series Forecasting\u003c/a>\u003c/td>\u003ctd>新论文；可迁移评价\u003c/td>\u003ctd>2026-08-18 / 无后续修订，v1\u003c/td>\u003ctd>预印本；全文；官方代码已核实\u003c/td>\u003ctd>不规则随访如何改变误差与模型排名\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2608.22097\" target=\"_blank\" rel=\"noopener noreferrer\">Pretreatment DCE-MRI Resolves Response Quality Within Pathologic Endpoints in Neoadjuvant Breast Cancer\u003c/a>\u003c/td>\u003ctd>新论文；直接相关\u003c/td>\u003ctd>2026-08-22 / 无后续修订，v1\u003c/td>\u003ctd>预印本；仅摘要；未找到官方代码\u003c/td>\u003ctd>pCR 与长期复发风险不是同一个预测目标\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>以上 5 篇均未在导入的旧推荐记录中找到。PAWBench v1/v2/v3 合并为一个实体；本次首次推荐，未做版本全文差异比较，因此不把 v3 标成“已证实的实质修订”。5 篇 PDF 链接均以 HEAD 核验为 HTTP 200、\u003ccode>application/pdf\u003c/code>，未下载或附加 PDF。\u003c/p>\n\u003ch2>1. Flow-JEPA\u003c/h2>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>把未来多个时间点的潜表征作为一个联合随机变量，用条件 Flow Matching 一起生成，替换 LeWorldModel 的确定性单步自回归预测器。\u003c/p>\n\u003ch3>来源与状态\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>作者：Yanchen Huo、Ziying Song、Yadan Luo。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://arxiv.org/abs/2608.29029\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>；\u003ca href=\"https://arxiv.org/html/2608.29029v1\" target=\"_blank\" rel=\"noopener noreferrer\">已读全文 v1\u003c/a>。v1：2026-08-29 03:40:06 UTC；无后续修订。未核实到正式录用记录，按预印本处理。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://github.com/HuoYanchen/Flow-JEPA\" target=\"_blank\" rel=\"noopener noreferrer\">官方代码\u003c/a>：论文直接链接，仓库可访问，包含训练、评价和模型文件；未运行代码。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>中文摘要与创新点\u003c/h3>\n\u003cp>最近的方法是 LeWorldModel：编码当前图像并回归下一步潜状态，多步预测反复使用自己的输出；以 SIGReg 约束表征分布避免塌缩。Flow-JEPA 保留编码器与该正则，把未来 h 个潜状态堆成 Z，以高斯轨迹 Z0 为起点，训练\u003c/p>\n\u003cp>\u003ccode>X_tau = (1-tau) Z0 + tau Z\u003c/code>\u003c/p>\n\u003cp>\u003ccode>L = E[||v_theta(X_tau, tau, z_current, actions) - (Z-Z0)||^2] + lambda_SIG L_SIG\u003c/code>。\u003c/p>\n\u003cp>Transformer 同时处理所有未来 token，交叉注意力读取当前潜状态与对应动作，AdaLN 注入生成过程时间 tau；推理采用 Euler 积分，论文主要设置为 8 步。这里 \u003cstrong>tau 是噪声到潜轨迹的生成时间，不是真实世界时间\u003c/strong>。未来位置由序列位置表示，原文没有解决不规则临床间隔。\u003c/p>\n\u003ch3>实验支持什么\u003c/h3>\n\u003cp>作者在 Two-Room、Reacher、Push-T、OGBench-Cube 四个环境报告平均规划成功率：干净输入 LeWM 86%、Flow-JEPA 92%；局部背景高斯扰动下 67% 与 86%。这是机器人闭环规划成功率，不是未来影像质量或不确定性校准。\u003c/p>\n\u003cp>关键限制是训练历史长度为 1、预测长度为 5；背景噪声不能代表跨中心 MRI 分布偏移。主表部分基线引用前作结果，Push-T 主设置的 CEM 搜索次数不相同，文中有额外预算消融；Push-T 还复用了并冻结 LeWM 编码器。因此主表不足以单独识别“随机生成”“多时点联合输出”和“编码器/优化配置”各自贡献。也没有验证 pCR、OS 或因果治疗效应。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法，优先级最高。\u003c/strong> 迁移对象是潜空间动力学预测头，不必先重训 3D 解码器。医学版本应以历史潜表征、截至预测时点可用的临床变量、治疗记录及未来查询间隔为条件。若使用未来治疗序列，只能是预测时已知的计划或明确设定的情景，不能用后来实际实施的方案泄漏未来信息。\u003c/p>\n\u003cp>需要同一患者至少两个可配准/可比较时点；验证联合多步生成最好有三个以上时点。两时点患者可支持单步或带观测掩码的目标，但“仅对已观测 token 计算损失”是医学扩展方案，原文并未证明它能识别未观测的连续轨迹。不能直接搬用机器人已知动力学、可重复干预或等间隔采样假设。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cp>\u003cstrong>假设\u003c/strong>：在相同输入与预算下，联合潜轨迹 FM 比单步 FM 递推更好地预测病灶变化，并给下游预测提供增量信息。\u003c/p>\n\u003cp>\u003cstrong>改动位置\u003c/strong>：冻结现有影像编码器，先缓存每次访问的全局/ROI 潜表征；将当前状态预测头改为两未来时点的联合 FM 头，增加真实 \u003ccode>delta_days\u003c/code> 与观测掩码。暂不更改图像解码器。\u003c/p>\n\u003cp>\u003cstrong>必要对照\u003c/strong>：最新状态复制；确定性单步递推；确定性多时点联合回归；单步 FM 递推；联合 FM；同输入、相近参数量和训练预算的直接 pCR/生存模型。另设“额外训练预算但不生成”的控制，区别生成目标收益与训练量收益。\u003c/p>\n\u003cp>\u003cstrong>评价\u003c/strong>：按患者划分，全部调参仅在训练/验证集；报告各预测间隔的潜误差、病灶内变化误差、体积变化 MAE、增长/缩小方向、两步误差增量。全图 SSIM 单列。下游比较 AUPRC、AUROC、Brier；有合法生存标签时，在统一 landmark 用 IPCW C-index、时间依赖 AUC、IBS，并对整个训练流程作患者层面的重复验证。不能让生成器见过测试患者后再评价其生成表征的价值。\u003c/p>\n\u003cp>\u003cstrong>推翻标准\u003c/strong>：联合 FM 在患者配对置信区间内未优于确定性联合预测；改善仅见于全局相似度；或同预算直接模型消除了下游收益。尤其要检查大变化患者是否仍回归到平均/复制状态。\u003c/p>\n\u003cp>\u003cstrong>算力\u003c/strong>：原文 Appendix A 报告单张 RTX 6000 Ada、20 epochs、batch 128、h=5；没有给可迁移到你数据的训练时长。冻结编码器、全局/少量 ROI token 的小头试验估计可在单卡完成，依据是只训练低维潜头；体积 token 版本需另做显存估算，不把机器人耗时外推为 3D MRI 耗时。\u003c/p>\n\u003ch3>原始摘要或证据来源\u003c/h3>\n\u003cp>原始英文摘要逐字保存在 \u003ccode>论文记录\u003c/code> 及对应独立论文笔记。上述机制来自全文 §3-4，结果与对照限制来自 §5、Appendix A。\u003c/p>\n\u003ch2>2. Observation-Anchored Selective Assimilation（OASA）\u003c/h2>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>治疗后胶质瘤预测中，以最新 MRI 的标签衍生状态为基准，谨慎接纳模型预测变化；主要价值是展示了强复制基线和阈值收益的边界。\u003c/p>\n\u003ch3>来源与状态\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>作者：Yeonjae Jung、Minwoo Shin。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://arxiv.org/abs/2609.12435\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.12435v1\" target=\"_blank\" rel=\"noopener noreferrer\">已读全文 v1\u003c/a>。v1：2026-09-11 04:55:54 UTC；无后续修订。预印本，未核实正式录用。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://github.com/jsudg436/longitudinal-proxy-forecasting\" target=\"_blank\" rel=\"noopener noreferrer\">官方代码\u003c/a>：论文链接与公开仓库匹配，含配置、源代码和实验产物目录；未核验仓库结果是否逐项复现论文。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>中文摘要与创新点\u003c/h3>\n\u003cp>使用 MU-Glioma Post 的 203 名患者、594 次随访；236 个候选三时点组合经“区间内无记录的新治疗开始”过滤后，保留 \u003cstrong>72 名患者的 120 个 triplets\u003c/strong>，训练/验证/测试为 81/24/15 triplets，按患者隔离。\u003c/p>\n\u003cp>预测的 p 不是未来 MRI，也不是实测肿瘤细胞密度。它由非增强核心、FLAIR 异常、增强病灶标签分别赋权 0.7/0.4/1.0 后平滑得到。模型单次输入包括四种 MRI、当前 proxy、切除腔和按 180 天归一化的时间间隔。SegMamba 输出变化分数 q 与速度 v，先作残差预测；OASA 再根据前一段预测与新观测的差异 I、预测变化范围 B，选择病例级缩放 beta，并按体素门控：\u003c/p>\n\u003cp>\u003ccode>p_hat_t2 = clip(p_observed_t1 + beta(I,B) * q12 * (p_direct_t2 - p_observed_t1), 0, 1)\u003c/code>。\u003c/p>\n\u003cp>训练包括变化加权 L1、Dice、速度、变化 BCE 和稳定区正则。病例分档规则来自验证集，不是校准过的概率置信度。“Calibration”另外把接近 0.2 的值抬到 0.201，是评价阈值附近的 support 调整。\u003c/p>\n\u003ch3>实验支持什么\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方法\u003c/th>\u003cth>RMSE，低为好\u003c/th>\u003cth>Dice@0.2\u003c/th>\u003cth>Dice@0.5\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>最新观测复制\u003c/td>\u003ctd>0.0465\u003c/td>\u003ctd>0.6070\u003c/td>\u003ctd>0.3981\u003c/td>\u003c/tr>\u003ctr>\u003ctd>直接预测\u003c/td>\u003ctd>0.0674 ± 0.0027\u003c/td>\u003ctd>0.6021 ± 0.0189\u003c/td>\u003ctd>0.2777 ± 0.0121\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OASA\u003c/td>\u003ctd>0.0472 ± 0.0005\u003c/td>\u003ctd>0.6071 ± 0.0025\u003c/td>\u003ctd>0.4269 ± 0.0079\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OASA + 阈值调整\u003c/td>\u003ctd>0.0471 ± 0.0006\u003c/td>\u003ctd>0.6178 ± 0.0025\u003c/td>\u003ctd>0.4269 ± 0.0079\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>作者报告 OASA 相对直接预测的 Dice@0.5 配对提升为 0.1493，95% CI 0.0291–0.3055；\u003cstrong>相对复制和形态学膨胀的 Dice 差异 CI 包含 0\u003c/strong>。阈值调整提高 Dice@0.2，但 FP 从 11,836 增到 18,663，同时 FN 从 22,107 降到 17,536。表中 ± 是三个种子的总体标准差，不是患者泛化置信区间。\u003c/p>\n\u003cp>我的判断：证据支持“保守更新比这个直接预测器稳定”，不支持“已学到更准确的肿瘤生物学”。测试只有 15 triplets；统计 bootstrap 按 triplet 抽样，如果同患者贡献多个 triplet，需要进一步采用患者聚类 bootstrap。源标签质量、proxy 权重和固定裁剪也会改变评价结果。“无新治疗开始”仍可能包含既往治疗的持续效应，不能解释为 untreated natural history。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关，主要用于评价和状态更新设计。\u003c/strong> 它匹配胶质瘤 MRI、不规则间隔、有限纵向历史，但不包含可比较的治疗方案效应，不预测 OS/pCR，也不生成完整影像。对 I-SPY2 可迁移“新访视到达后更新状态”的机制，但治疗诱导的明显变化可能被保守门控压掉，必须按响应幅度分层评估。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cp>\u003cstrong>改动位置\u003c/strong>：在既有未来 latent/病灶状态预测之后增加一个验证集拟合的残差缩放器，先不改模型训练。以最近两次已知访视的预测误差作为可用历史信号。\u003c/p>\n\u003cp>\u003cstrong>必要对照\u003c/strong>：最新观测复制、线性时间外推、原模型、固定残差缩放、历史误差自适应缩放；若预测 mask/proxy，加入简单膨胀/腐蚀与单独阈值调整。只允许在验证集定门控与阈值。\u003c/p>\n\u003cp>\u003cstrong>评价\u003c/strong>：同时报告连续变化误差、变化区域 Dice、增长/缩小方向、FP/FN、新病灶召回和体积变化；对小变化、大变化分别统计，以患者聚类 bootstrap 给 CI。最新观测已到达的更新任务，与尚未获得新影像的纯 rollout 必须分开比较。\u003c/p>\n\u003cp>\u003cstrong>推翻标准\u003c/strong>：优势可被复制、固定缩放或阈值调整解释；或门控使大幅进展/治疗响应的召回下降。门控没有临床收益时，不因整体 RMSE 好看而保留。\u003c/p>\n\u003cp>\u003cstrong>算力\u003c/strong>：原文 §3.2 为两张 RTX A6000、60 epochs、128^3 crop、每 GPU batch 2。本建议首步只重算已有预测和小缩放器，通常无需重训大模型；这是基于实验设计的估计。\u003c/p>\n\u003ch3>原始摘要或证据来源\u003c/h3>\n\u003cp>全文 §2.1-2.4 给出 proxy、门控与阈值操作；§3 给队列/硬件；Table 1、§4.1 和 §5 给性能与结论边界。英文摘要保存在独立论文笔记和结构化记录。\u003c/p>\n\u003ch2>3. PAWBench\u003c/h2>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>一个未来样本看起来合理，不代表模型给不同未来分配了正确概率；PAWBench 将有效结果覆盖、概率偏差和无法判读率分开评价。\u003c/p>\n\u003ch3>来源与状态\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>作者：Yuandong Pu、Le Zhuo、Sayak Paul、Gabriel Jorge Menezes、Avram Đorđević、Shiyang Li、Yifan Zhou、Bin Fu、Wenlong Zhang、Junjun He、Yu Qiao、Yihao Liu、Jinbo Xing、Xi Chen。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://arxiv.org/abs/2608.27345\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>；\u003ca href=\"https://arxiv.org/html/2608.27345v3\" target=\"_blank\" rel=\"noopener noreferrer\">已读全文 v3\u003c/a>。v1：2026-08-27 16:46:38 UTC；v2：08-28；v3：2026-09-03 08:39:17 UTC。预印本，未核实正式录用。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://pawbench.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\">项目页\u003c/a> 直接链接 \u003ca href=\"https://github.com/Andrew0613/PAWBench\" target=\"_blank\" rel=\"noopener noreferrer\">官方代码\u003c/a> 和数据。仓库可访问且有评价代码；未运行其自动判读器。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>中文摘要与创新点\u003c/h3>\n\u003cp>最近的评价框架大多逐个视频判断视觉质量、动作一致性或物理合理性。该工作固定初始图像与动作，多次采样，再把每条视频映射为终末结果类别，比较经验结果分布。\u003c/p>\n\u003cp>50 个场景分成两类：25 个有解析/对称性参考概率的 PAW-Calibration，使用 \u003ccode>TVD = 0.5 * sum_y |p_hat(y)-q(y)|\u003c/code>；另 25 个只知道有效结果集合的 PAW-Coverage，报告已生成有效结果占全部有效结果的比例。自动判读失败单列，不把失败虚构成新的未来类型。\u003c/p>\n\u003ch3>实验支持什么\u003c/h3>\n\u003cp>11 个视频模型，每模型每场景采样 50 次。主实验的场景至少要有 20 次可判读结果才进入条件分数，另报 Scene Pass Rate。作者发现没有一个模型同时稳定满足概率校准、有效支持覆盖和跨场景可靠性；例如最优单项仍不能消除其他维度的失败。\u003c/p>\n\u003cp>我的判断：这是对评价对象的有效澄清。要注意条件 TVD/coverage 是在通过可判读门槛的场景上平均，不是完整失败率；比较必须连同 SPR 和失败数。参考概率部分依赖物理对称性与人工场景设计，不能移植成患者的已知结局概率。单个患者无法重复经历同一治疗条件，真实个体未来分布通常不可直接观测；随机样本方差也不能自动区分模型不确定性与生物学随机性。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移评价，优先于扩大采样量或强调多样性。\u003c/strong> 从同一个患者历史、治疗和查询时间采样 K 次，投影到有医学意义的量：病灶体积变化、预先定义的增长/稳定/缩小类别，或固定临床预测头的风险。MRI 的信号强度随机变化不应算作临床有意义的多样性。\u003c/p>\n\u003cp>不把生成影像上的“无可见肿瘤”直接当作病理 pCR；不把条件生成分布写成因果治疗效应。后者至少需要明确干预、时间顺序、一致性、序贯可交换性、positivity，以及对信息性失访/删失的处理。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cp>\u003cstrong>改动位置\u003c/strong>：只扩展随机推理与评价脚本，每患者生成 K=20、50 个样本，固定临床条件和解码规则，记录失败样本，不挑 best-of-K 作为主要成绩。\u003c/p>\n\u003cp>\u003cstrong>必要对照\u003c/strong>：单样本、确定性预测、同预算小 ensemble、FM 多样本；另用简单随机增长/治疗响应模拟器产生已知概率的状态轨迹，仅作为校准机制试验，不把模拟器视为人体真值。\u003c/p>\n\u003cp>\u003cstrong>评价\u003c/strong>：模拟数据测 TVD/有效支持恢复；真实患者用群体及预设亚组的 Brier、CRPS/energy score、预测区间覆盖率与宽度，并报告采样误差。针对生存结局用删失感知评分，不能把早期失访当作未发生事件。评价头需独立锁定，防止生成器与评价器相互迎合。\u003c/p>\n\u003cp>\u003cstrong>推翻标准\u003c/strong>：多样性升高但 proper score、覆盖率或病灶变化误差没有改善；增加 K 仅减少 Monte Carlo 噪声而不改变系统性失校准；或者模型在医学上有效的未来集合仍有明显塌缩。\u003c/p>\n\u003cp>\u003cstrong>算力\u003c/strong>：主评估采样规模由原文 §4.1 给出，为 11×50×50 条视频，不是医学复现要求。本地新增成本约为患者数×K×单次生成成本；优先在潜空间读出病灶量，仅抽查少量图像解码，先实测单样本延迟再估总预算。\u003c/p>\n\u003ch3>原始摘要或证据来源\u003c/h3>\n\u003cp>全文 §2-4、Table 1 与 Appendix B；英文摘要保存在独立论文笔记和结构化记录。\u003c/p>\n\u003ch2>4. Beyond MSE\u003c/h2>\n\u003ch3>一句话总结与中文摘要\u003c/h3>\n\u003cp>普通观测点 MSE 对随访密集区域赋予更多权重；Continuous-time Squared Error（CSE）用随访时间密度的倒数加权，以估计统一时间尺度上的误差。它改变的是评价的目标分布，不是生成器。\u003c/p>\n\u003ch3>来源与创新点\u003c/h3>\n\u003cp>作者：Rongwen Li、Haixin Xie、Xiao Wang、Changjian Chen。v1：\u003cstrong>2026-08-18 02:47:04 UTC\u003c/strong>，无后续修订；\u003ca href=\"https://arxiv.org/abs/2608.17293\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>、\u003ca href=\"https://arxiv.org/html/2608.17293v1\" target=\"_blank\" rel=\"noopener noreferrer\">已读全文\u003c/a>、\u003ca href=\"https://github.com/hnu-vis/ITS-Bench\" target=\"_blank\" rel=\"noopener noreferrer\">官方代码\u003c/a>。预印本。\u003c/p>\n\u003cp>其核心为每条轨迹的自归一化权重 \u003ccode>w_i = 1 / p_hat(t_i | trajectory)\u003c/code>，先算 \u003ccode>sum(w_i * error_i^2)/sum(w_i)\u003c/code>，再对患者平均。论文用 leave-one-out KDE 估计时间密度，在合成、半合成及 8 个真实数据集上展示连续时间风险恢复及排名改变。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移评价。\u003c/strong> 病情加重时更密集的随访，会使评价与就医过程纠缠。但理论依赖给定轨迹后时间采样的条件 IID、密度有正下界、密度估计一致，以及每条轨迹观测数趋大。I-SPY2 式 2-4 次 MRI 不能据此宣称 KDE 已可靠恢复个体观测密度；信息性缺失也不会被简单重新加权自动消除。正文称五个 seeds，而部分附表标题称三个，重复次数存在报告口径不一致，需代码核对。\u003c/p>\n\u003ch3>可借鉴动作与原始证据\u003c/h3>\n\u003cp>最小实验只改评价器：固定同一批预测，比较患者等权 MSE、预设临床时间窗口误差、诊疗计划定义的时间权重与 CSE 敏感性分析。必要对照是在有密集真值的模拟/半合成轨迹中重采样，检查排名是否更接近真实时间积分误差。若权重裁剪或 bandwidth 的轻微变化就翻转结论，或 CSE 更偏离已知真值，则推翻其在当前样本量的可靠性。无须训练新生成器，主要为 CPU 统计成本。证据：全文 Eq.6-8、Assumption 4.1、§5 和 Appendix D；英文摘要单独保存。\u003c/p>\n\u003ch2>5. Pretreatment DCE-MRI Resolves Response Quality Within Pathologic Endpoints in Neoadjuvant Breast Cancer\u003c/h2>\n\u003ch3>一句话总结与中文摘要\u003c/h3>\n\u003cp>即使病理达到 pCR，治疗前 MRI 内部异质性仍可能标记复发风险差异；生成状态的研究价值不应只用 pCR 分类来证明。\u003c/p>\n\u003ch3>来源与创新点\u003c/h3>\n\u003cp>作者：Dattatreya Kantha、Murray H. Loew。v1：\u003cstrong>2026-08-22 20:23:03 UTC\u003c/strong>（北京时间 08-23），无后续修订；\u003ca href=\"https://arxiv.org/abs/2608.22097\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>。预印本，\u003cstrong>仅核验摘要与元数据，未读取方法全文\u003c/strong>；未找到官方代码。PDF 可访问但未下载。没有把标题相似、作者不符的 GitHub 仓库当成其代码。\u003c/p>\n\u003cp>作者以治疗前 DCE-MRI entropy 与 pCR/RCB 交叉分层，报告四个队列共 1,200 例。在 I-SPY2，219 名完全响应者中 55 名被分为结构不利；一个合并的 HER2 阳性响应者分析含 33 人、10 个事件，报告 HR 2.87（95% CI 1.38-5.96）；Duke 908 人、76 个事件的调整 HR 为 0.61（0.41-0.91）。这是影像指标与复发的关联，不是生成影像改善临床决策的证据。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关，但证据等级低于前三篇。\u003c/strong> pCR、RCB 与复发分别反映不同终点，应对未来状态是否保留风险相关异质性单独检验。少事件亚组 HR 波动大；一处分析合并病理确认 pCR 与 best-response proxy，两者不能视为同一定义。摘要的总体人数与跨队列复用关系、entropy 算法和阈值预设过程尚不能逐项核验，所以不照搬阈值、效应量或因果结论。“Pathologic endpoints”在此指病理疗效终点，不意味着方法输入了 WSI。\u003c/p>\n\u003ch3>可借鉴动作与原始证据\u003c/h3>\n\u003cp>最小实验：在统一预测 landmark，比较临床+当前 MRI 的直接模型、加预设 entropy/变化指标的直接模型、再加生成状态统计量的模型。坚持同等输入时点、预算与患者划分；OS/复发采用删失感知指标和校准，报告事件数、患者 bootstrap CI，极小亚组只作描述。pCR 尚未知的治疗前任务不能把术后 pCR 当输入；pCR 已知后的风险分层则另定义术后 landmark。若简单当前影像指标已解释全部收益，或生成状态增量在外部验证中消失，则不支持生成模块必要性。只训练小预测头时成本较低，属估计；原文摘要未给硬件或时长。原始英文摘要保存于结构化记录和独立笔记。\u003c/p>\n\u003ch2>少量奠基论文，均为旧文补充\u003c/h2>\n\u003cp>这里只提供概念定位，本轮核验 arXiv 元数据与摘要；不将它们计入今日 5 篇，也不声称完成全文复读或正式发表状态复核。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>论文\u003c/th>\u003cth>v1 / 最新 arXiv 版本日期\u003c/th>\u003cth>本轮应回看的内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2210.02747\" target=\"_blank\" rel=\"noopener noreferrer\">Flow Matching for Generative Modeling\u003c/a>\u003c/td>\u003ctd>2022-10-06 / 2023-02-08，v2\u003c/td>\u003ctd>向量场回归与条件路径；生成时间不等于临床时间\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2407.01392\" target=\"_blank\" rel=\"noopener noreferrer\">Diffusion Forcing: Next-token Prediction Meets Full-Sequence Diffusion\u003c/a>\u003c/td>\u003ctd>2024-07-01 / 2024-12-10，v4\u003c/td>\u003ctd>各 token 独立噪声水平、历史条件与长程序列生成\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"https://arxiv.org/abs/1907.03907\" target=\"_blank\" rel=\"noopener noreferrer\">Latent ODEs for Irregularly-Sampled Time Series\u003c/a>\u003c/td>\u003ctd>2019-07-08 / 无后续修订，v1\u003c/td>\u003ctd>连续时间状态与观测事件更新；显式建模观测时间过程\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2>本周起点与优先研究假设\u003c/h2>\n\u003cp>这是新任务首次运行，以 30 天资料建立周回顾起点，不伪称已连续观察一周。下次例行周回顾安排在 2026-09-21，回顾此前 7 天记录。\u003c/p>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>优先验证评价能否识别真实变化。\u003c/strong> 先锁定复制/线性趋势/直接预测对照，分开报告全图相似度、病灶变化、下游价值；OASA 显示复杂预测器可能输给复制。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>再验证联合潜轨迹 FM。\u003c/strong> 用同预算确定性联合预测、单步 FM 与直接临床头，拆开多步建模、随机目标和额外容量的贡献。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>概率评价与临床终点并行设计。\u003c/strong> 多样性不等于校准；pCR 不等于无复发；稀疏随访不足以直接识别个体连续轨迹分布。先用模拟真值查评价机制，再在真实队列作删失感知的群体校准。\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>今天最值得读的一篇：Flow-JEPA。\u003c/strong> 先读 §4、§5.1 和 Appendix A，再看成绩表。它提供了足够具体的潜头替换方案，也清楚暴露了需要你补上的真实时间、历史信息、公平对照和临床价值验证。本轮仅提供实验建议，没有修改模型或启动训练。\u003c/p>\n","markdown":"# 纵向医学世界模型文献雷达 | 2026-09-14 首次试运行\n\n今天最值得读的是 **Flow-JEPA**：它把单步潜状态回归改成整段未来潜轨迹的条件 Flow Matching，最接近你现有路线中可以小规模替换验证的模块。今天最值得立即吸收的评价要求来自 **OASA**：新模型必须超过最新观测复制和简单形态学基线；阈值附近的 Dice 改善不能当作疾病演化预测成功。\n\n本轮精选 5 篇，通用算法/评价 3 篇，医学应用 2 篇。4 篇阅读了 HTML 全文的方法和实验，1 篇仅有摘要证据。下面所有数字都是作者报告，本轮未复现实验。推荐算法迁移不等于认可其医学效果。\n\n## 阅读优先级\n\n| 顺序 | 英文标题 | 类型与适配 | v1 日期 / 最新修订 | 状态与证据 | 阅读目的 |\n|---|---|---|---|---|---|\n| 1 | [Flow-JEPA: Flow Matching for Robust Latent Dynamics in JEPA World Models](https://arxiv.org/abs/2608.29029) | 新论文；可迁移算法 | 2026-08-29 / 无后续修订，v1 | 预印本；全文；官方代码已核实 | 整段未来潜轨迹预测，降低单步递推误差 |\n| 2 | [Observation-Anchored Selective Assimilation for Longitudinal Tumor-State Proxy Forecasting in Post-Treatment Glioma](https://arxiv.org/abs/2609.12435) | 新论文；直接相关 | 2026-09-11 / 无后续修订，v1 | 预印本；全文；官方代码已核实 | 新观测更新、复制输入基线、变化与阈值评价 |\n| 3 | [PAWBench: How Far Are We from Probabilistically Aligned World Modeling?](https://arxiv.org/abs/2608.27345) | 窗口内新论文，已有修订；可迁移评价 | 2026-08-27 / 2026-09-03，v3 | 预印本；全文；官方代码已核实 | 随机未来的概率质量与有效结果覆盖 |\n| 4 | [Beyond MSE: Rethinking the Evaluation Metric and Benchmarking for Irregular Time Series Forecasting](https://arxiv.org/abs/2608.17293) | 新论文；可迁移评价 | 2026-08-18 / 无后续修订，v1 | 预印本；全文；官方代码已核实 | 不规则随访如何改变误差与模型排名 |\n| 5 | [Pretreatment DCE-MRI Resolves Response Quality Within Pathologic Endpoints in Neoadjuvant Breast Cancer](https://arxiv.org/abs/2608.22097) | 新论文；直接相关 | 2026-08-22 / 无后续修订，v1 | 预印本；仅摘要；未找到官方代码 | pCR 与长期复发风险不是同一个预测目标 |\n\n以上 5 篇均未在导入的旧推荐记录中找到。PAWBench v1/v2/v3 合并为一个实体；本次首次推荐，未做版本全文差异比较，因此不把 v3 标成“已证实的实质修订”。5 篇 PDF 链接均以 HEAD 核验为 HTTP 200、`application/pdf`，未下载或附加 PDF。\n\n## 1. Flow-JEPA\n\n### 一句话总结\n\n把未来多个时间点的潜表征作为一个联合随机变量，用条件 Flow Matching 一起生成，替换 LeWorldModel 的确定性单步自回归预测器。\n\n### 来源与状态\n\n- 作者：Yanchen Huo、Ziying Song、Yadan Luo。\n\n- [原始页面](https://arxiv.org/abs/2608.29029)；[已读全文 v1](https://arxiv.org/html/2608.29029v1)。v1：2026-08-29 03:40:06 UTC；无后续修订。未核实到正式录用记录，按预印本处理。\n\n- [官方代码](https://github.com/HuoYanchen/Flow-JEPA)：论文直接链接，仓库可访问，包含训练、评价和模型文件；未运行代码。\n\n\n### 中文摘要与创新点\n\n最近的方法是 LeWorldModel：编码当前图像并回归下一步潜状态，多步预测反复使用自己的输出；以 SIGReg 约束表征分布避免塌缩。Flow-JEPA 保留编码器与该正则，把未来 h 个潜状态堆成 Z，以高斯轨迹 Z0 为起点，训练\n\n`X_tau = (1-tau) Z0 + tau Z`\n\n`L = E[||v_theta(X_tau, tau, z_current, actions) - (Z-Z0)||^2] + lambda_SIG L_SIG`。\n\nTransformer 同时处理所有未来 token，交叉注意力读取当前潜状态与对应动作，AdaLN 注入生成过程时间 tau；推理采用 Euler 积分，论文主要设置为 8 步。这里 **tau 是噪声到潜轨迹的生成时间，不是真实世界时间**。未来位置由序列位置表示，原文没有解决不规则临床间隔。\n\n### 实验支持什么\n\n作者在 Two-Room、Reacher、Push-T、OGBench-Cube 四个环境报告平均规划成功率：干净输入 LeWM 86%、Flow-JEPA 92%；局部背景高斯扰动下 67% 与 86%。这是机器人闭环规划成功率，不是未来影像质量或不确定性校准。\n\n关键限制是训练历史长度为 1、预测长度为 5；背景噪声不能代表跨中心 MRI 分布偏移。主表部分基线引用前作结果，Push-T 主设置的 CEM 搜索次数不相同，文中有额外预算消融；Push-T 还复用了并冻结 LeWM 编码器。因此主表不足以单独识别“随机生成”“多时点联合输出”和“编码器/优化配置”各自贡献。也没有验证 pCR、OS 或因果治疗效应。\n\n### 和我方向的适配\n\n**可迁移算法，优先级最高。** 迁移对象是潜空间动力学预测头，不必先重训 3D 解码器。医学版本应以历史潜表征、截至预测时点可用的临床变量、治疗记录及未来查询间隔为条件。若使用未来治疗序列，只能是预测时已知的计划或明确设定的情景，不能用后来实际实施的方案泄漏未来信息。\n\n需要同一患者至少两个可配准/可比较时点；验证联合多步生成最好有三个以上时点。两时点患者可支持单步或带观测掩码的目标，但“仅对已观测 token 计算损失”是医学扩展方案，原文并未证明它能识别未观测的连续轨迹。不能直接搬用机器人已知动力学、可重复干预或等间隔采样假设。\n\n### 可借鉴动作：最小验证实验\n\n**假设**：在相同输入与预算下，联合潜轨迹 FM 比单步 FM 递推更好地预测病灶变化，并给下游预测提供增量信息。\n\n**改动位置**：冻结现有影像编码器，先缓存每次访问的全局/ROI 潜表征；将当前状态预测头改为两未来时点的联合 FM 头，增加真实 `delta_days` 与观测掩码。暂不更改图像解码器。\n\n**必要对照**：最新状态复制；确定性单步递推；确定性多时点联合回归；单步 FM 递推；联合 FM；同输入、相近参数量和训练预算的直接 pCR/生存模型。另设“额外训练预算但不生成”的控制，区别生成目标收益与训练量收益。\n\n**评价**：按患者划分，全部调参仅在训练/验证集；报告各预测间隔的潜误差、病灶内变化误差、体积变化 MAE、增长/缩小方向、两步误差增量。全图 SSIM 单列。下游比较 AUPRC、AUROC、Brier；有合法生存标签时，在统一 landmark 用 IPCW C-index、时间依赖 AUC、IBS，并对整个训练流程作患者层面的重复验证。不能让生成器见过测试患者后再评价其生成表征的价值。\n\n**推翻标准**：联合 FM 在患者配对置信区间内未优于确定性联合预测；改善仅见于全局相似度；或同预算直接模型消除了下游收益。尤其要检查大变化患者是否仍回归到平均/复制状态。\n\n**算力**：原文 Appendix A 报告单张 RTX 6000 Ada、20 epochs、batch 128、h=5；没有给可迁移到你数据的训练时长。冻结编码器、全局/少量 ROI token 的小头试验估计可在单卡完成，依据是只训练低维潜头；体积 token 版本需另做显存估算，不把机器人耗时外推为 3D MRI 耗时。\n\n### 原始摘要或证据来源\n\n原始英文摘要逐字保存在 `论文记录` 及对应独立论文笔记。上述机制来自全文 §3-4，结果与对照限制来自 §5、Appendix A。\n\n## 2. Observation-Anchored Selective Assimilation（OASA）\n\n### 一句话总结\n\n治疗后胶质瘤预测中，以最新 MRI 的标签衍生状态为基准，谨慎接纳模型预测变化；主要价值是展示了强复制基线和阈值收益的边界。\n\n### 来源与状态\n\n- 作者：Yeonjae Jung、Minwoo Shin。\n\n- [原始页面](https://arxiv.org/abs/2609.12435)；[已读全文 v1](https://arxiv.org/html/2609.12435v1)。v1：2026-09-11 04:55:54 UTC；无后续修订。预印本，未核实正式录用。\n\n- [官方代码](https://github.com/jsudg436/longitudinal-proxy-forecasting)：论文链接与公开仓库匹配，含配置、源代码和实验产物目录；未核验仓库结果是否逐项复现论文。\n\n\n### 中文摘要与创新点\n\n使用 MU-Glioma Post 的 203 名患者、594 次随访；236 个候选三时点组合经“区间内无记录的新治疗开始”过滤后，保留 **72 名患者的 120 个 triplets**，训练/验证/测试为 81/24/15 triplets，按患者隔离。\n\n预测的 p 不是未来 MRI，也不是实测肿瘤细胞密度。它由非增强核心、FLAIR 异常、增强病灶标签分别赋权 0.7/0.4/1.0 后平滑得到。模型单次输入包括四种 MRI、当前 proxy、切除腔和按 180 天归一化的时间间隔。SegMamba 输出变化分数 q 与速度 v，先作残差预测；OASA 再根据前一段预测与新观测的差异 I、预测变化范围 B，选择病例级缩放 beta，并按体素门控：\n\n`p_hat_t2 = clip(p_observed_t1 + beta(I,B) * q12 * (p_direct_t2 - p_observed_t1), 0, 1)`。\n\n训练包括变化加权 L1、Dice、速度、变化 BCE 和稳定区正则。病例分档规则来自验证集，不是校准过的概率置信度。“Calibration”另外把接近 0.2 的值抬到 0.201，是评价阈值附近的 support 调整。\n\n### 实验支持什么\n\n| 方法 | RMSE，低为好 | Dice@0.2 | Dice@0.5 |\n|---|---:|---:|---:|\n| 最新观测复制 | 0.0465 | 0.6070 | 0.3981 |\n| 直接预测 | 0.0674 ± 0.0027 | 0.6021 ± 0.0189 | 0.2777 ± 0.0121 |\n| OASA | 0.0472 ± 0.0005 | 0.6071 ± 0.0025 | 0.4269 ± 0.0079 |\n| OASA + 阈值调整 | 0.0471 ± 0.0006 | 0.6178 ± 0.0025 | 0.4269 ± 0.0079 |\n\n作者报告 OASA 相对直接预测的 Dice@0.5 配对提升为 0.1493，95% CI 0.0291–0.3055；**相对复制和形态学膨胀的 Dice 差异 CI 包含 0**。阈值调整提高 Dice@0.2，但 FP 从 11,836 增到 18,663，同时 FN 从 22,107 降到 17,536。表中 ± 是三个种子的总体标准差，不是患者泛化置信区间。\n\n我的判断：证据支持“保守更新比这个直接预测器稳定”，不支持“已学到更准确的肿瘤生物学”。测试只有 15 triplets；统计 bootstrap 按 triplet 抽样，如果同患者贡献多个 triplet，需要进一步采用患者聚类 bootstrap。源标签质量、proxy 权重和固定裁剪也会改变评价结果。“无新治疗开始”仍可能包含既往治疗的持续效应，不能解释为 untreated natural history。\n\n### 和我方向的适配\n\n**直接相关，主要用于评价和状态更新设计。** 它匹配胶质瘤 MRI、不规则间隔、有限纵向历史，但不包含可比较的治疗方案效应，不预测 OS/pCR，也不生成完整影像。对 I-SPY2 可迁移“新访视到达后更新状态”的机制，但治疗诱导的明显变化可能被保守门控压掉，必须按响应幅度分层评估。\n\n### 可借鉴动作：最小验证实验\n\n**改动位置**：在既有未来 latent/病灶状态预测之后增加一个验证集拟合的残差缩放器，先不改模型训练。以最近两次已知访视的预测误差作为可用历史信号。\n\n**必要对照**：最新观测复制、线性时间外推、原模型、固定残差缩放、历史误差自适应缩放；若预测 mask/proxy，加入简单膨胀/腐蚀与单独阈值调整。只允许在验证集定门控与阈值。\n\n**评价**：同时报告连续变化误差、变化区域 Dice、增长/缩小方向、FP/FN、新病灶召回和体积变化；对小变化、大变化分别统计，以患者聚类 bootstrap 给 CI。最新观测已到达的更新任务，与尚未获得新影像的纯 rollout 必须分开比较。\n\n**推翻标准**：优势可被复制、固定缩放或阈值调整解释；或门控使大幅进展/治疗响应的召回下降。门控没有临床收益时，不因整体 RMSE 好看而保留。\n\n**算力**：原文 §3.2 为两张 RTX A6000、60 epochs、128^3 crop、每 GPU batch 2。本建议首步只重算已有预测和小缩放器，通常无需重训大模型；这是基于实验设计的估计。\n\n### 原始摘要或证据来源\n\n全文 §2.1-2.4 给出 proxy、门控与阈值操作；§3 给队列/硬件；Table 1、§4.1 和 §5 给性能与结论边界。英文摘要保存在独立论文笔记和结构化记录。\n\n## 3. PAWBench\n\n### 一句话总结\n\n一个未来样本看起来合理，不代表模型给不同未来分配了正确概率；PAWBench 将有效结果覆盖、概率偏差和无法判读率分开评价。\n\n### 来源与状态\n\n- 作者：Yuandong Pu、Le Zhuo、Sayak Paul、Gabriel Jorge Menezes、Avram Đorđević、Shiyang Li、Yifan Zhou、Bin Fu、Wenlong Zhang、Junjun He、Yu Qiao、Yihao Liu、Jinbo Xing、Xi Chen。\n\n- [原始页面](https://arxiv.org/abs/2608.27345)；[已读全文 v3](https://arxiv.org/html/2608.27345v3)。v1：2026-08-27 16:46:38 UTC；v2：08-28；v3：2026-09-03 08:39:17 UTC。预印本，未核实正式录用。\n\n- [项目页](https://pawbench.github.io) 直接链接 [官方代码](https://github.com/Andrew0613/PAWBench) 和数据。仓库可访问且有评价代码；未运行其自动判读器。\n\n\n### 中文摘要与创新点\n\n最近的评价框架大多逐个视频判断视觉质量、动作一致性或物理合理性。该工作固定初始图像与动作，多次采样，再把每条视频映射为终末结果类别，比较经验结果分布。\n\n50 个场景分成两类：25 个有解析/对称性参考概率的 PAW-Calibration，使用 `TVD = 0.5 * sum_y |p_hat(y)-q(y)|`；另 25 个只知道有效结果集合的 PAW-Coverage，报告已生成有效结果占全部有效结果的比例。自动判读失败单列，不把失败虚构成新的未来类型。\n\n### 实验支持什么\n\n11 个视频模型，每模型每场景采样 50 次。主实验的场景至少要有 20 次可判读结果才进入条件分数，另报 Scene Pass Rate。作者发现没有一个模型同时稳定满足概率校准、有效支持覆盖和跨场景可靠性；例如最优单项仍不能消除其他维度的失败。\n\n我的判断：这是对评价对象的有效澄清。要注意条件 TVD/coverage 是在通过可判读门槛的场景上平均，不是完整失败率；比较必须连同 SPR 和失败数。参考概率部分依赖物理对称性与人工场景设计，不能移植成患者的已知结局概率。单个患者无法重复经历同一治疗条件，真实个体未来分布通常不可直接观测；随机样本方差也不能自动区分模型不确定性与生物学随机性。\n\n### 和我方向的适配\n\n**可迁移评价，优先于扩大采样量或强调多样性。** 从同一个患者历史、治疗和查询时间采样 K 次，投影到有医学意义的量：病灶体积变化、预先定义的增长/稳定/缩小类别，或固定临床预测头的风险。MRI 的信号强度随机变化不应算作临床有意义的多样性。\n\n不把生成影像上的“无可见肿瘤”直接当作病理 pCR；不把条件生成分布写成因果治疗效应。后者至少需要明确干预、时间顺序、一致性、序贯可交换性、positivity，以及对信息性失访/删失的处理。\n\n### 可借鉴动作：最小验证实验\n\n**改动位置**：只扩展随机推理与评价脚本，每患者生成 K=20、50 个样本，固定临床条件和解码规则，记录失败样本，不挑 best-of-K 作为主要成绩。\n\n**必要对照**：单样本、确定性预测、同预算小 ensemble、FM 多样本；另用简单随机增长/治疗响应模拟器产生已知概率的状态轨迹，仅作为校准机制试验，不把模拟器视为人体真值。\n\n**评价**：模拟数据测 TVD/有效支持恢复；真实患者用群体及预设亚组的 Brier、CRPS/energy score、预测区间覆盖率与宽度，并报告采样误差。针对生存结局用删失感知评分，不能把早期失访当作未发生事件。评价头需独立锁定，防止生成器与评价器相互迎合。\n\n**推翻标准**：多样性升高但 proper score、覆盖率或病灶变化误差没有改善；增加 K 仅减少 Monte Carlo 噪声而不改变系统性失校准；或者模型在医学上有效的未来集合仍有明显塌缩。\n\n**算力**：主评估采样规模由原文 §4.1 给出，为 11×50×50 条视频，不是医学复现要求。本地新增成本约为患者数×K×单次生成成本；优先在潜空间读出病灶量，仅抽查少量图像解码，先实测单样本延迟再估总预算。\n\
