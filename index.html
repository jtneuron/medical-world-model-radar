  <script>const DATA = {"reports":[{"date":"2026-09-18","summary":"\u003cp>今天扩充为 \u003cstrong>10 篇：8 篇新论文、2 篇近期补充\u003c/strong>，包含 8 篇通用算法、2 篇医学应用。前 3 篇重点精读，后 7 篇扩展阅读。最值得检验的假设是：\u003cstrong>防止表征塌缩还不够，必须让潜状态显式保留病灶变化，并检验这些信息能否改善独立患者上的临床预测。\u003c/strong> 生成速度、长期数值稳定性和不确定性分别需要独立评价，不能互相替代。\u003c/p>\n","html":"\u003cp>今天扩充为 \u003cstrong>10 篇：8 篇新论文、2 篇近期补充\u003c/strong>，包含 8 篇通用算法、2 篇医学应用。前 3 篇重点精读，后 7 篇扩展阅读。最值得检验的假设是：\u003cstrong>防止表征塌缩还不够，必须让潜状态显式保留病灶变化，并检验这些信息能否改善独立患者上的临床预测。\u003c/strong> 生成速度、长期数值稳定性和不确定性分别需要独立评价，不能互相替代。\u003c/p>\n\u003ch2>阅读优先级\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>顺序\u003c/th>\u003cth>论文\u003c/th>\u003cth>类型 / 首次日期\u003c/th>\u003cth>重点\u003c/th>\u003cth>证据\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.04264\" target=\"_blank\" rel=\"noopener noreferrer\">Spectral-Target Physical Latent Structuring for JEPA-Style World Models\u003c/a>\u003c/td>\u003ctd>可迁移算法；近期补充；9 月 2 日\u003c/td>\u003ctd>防塌缩不等于学到任务关键状态\u003c/td>\u003ctd>HTML 方法与实验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.20008\" target=\"_blank\" rel=\"noopener noreferrer\">Dynamic Generalized Gromov-Wasserstein Optimal Transport\u003c/a>\u003c/td>\u003ctd>可迁移算法；新论文；9 月 17 日\u003c/td>\u003ctd>让传输路径考虑结构变化，而非只匹配端点\u003c/td>\u003ctd>HTML 方法与实验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.09757\" target=\"_blank\" rel=\"noopener noreferrer\">Arti-JEPA: Adapting Video World Model to Real-Time MRI of the Vocal Tract for Speech-Production Analysis\u003c/a>\u003c/td>\u003ctd>医学应用；近期补充；9 月 9 日\u003c/td>\u003ctd>视频 JEPA 适配 MRI；审查外部泛化与正文证据\u003c/td>\u003ctd>HTML 方法与实验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.19674\" target=\"_blank\" rel=\"noopener noreferrer\">Conservation Buys Stability and Factoring Buys Counterfactuals in Physical World Models\u003c/a>\u003c/td>\u003ctd>可迁移算法；新论文；9 月 17 日\u003c/td>\u003ctd>稳定 rollout 与干预外推是两个问题\u003c/td>\u003ctd>HTML 方法与实验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.19796\" target=\"_blank\" rel=\"noopener noreferrer\">LIFD: Anchored Diffusion for 3D-Aware Scene Memory in Robotic Manipulation\u003c/a>\u003c/td>\u003ctd>可迁移算法；新论文；9 月 17 日\u003c/td>\u003ctd>历史记忆与当前观测融合，先补全当前状态\u003c/td>\u003ctd>HTML 方法与实验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.19142\" target=\"_blank\" rel=\"noopener noreferrer\">PointZero: 3D Point Track Completion for Learning Transferable 3D Dynamics\u003c/a>\u003c/td>\u003ctd>可迁移算法；新论文；9 月 16 日\u003c/td>\u003ctd>用结构轨迹作为训练监督，避免未来条件泄漏\u003c/td>\u003ctd>HTML 方法与实验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.19729v1\" target=\"_blank\" rel=\"noopener noreferrer\">Recency Forcing: Bridging the Long-Horizon Gap in Autoregressive Video Generation\u003c/a>\u003c/td>\u003ctd>可迁移算法；新论文；9 月 17 日\u003c/td>\u003ctd>长历史注意力与短训练窗口失配\u003c/td>\u003ctd>仅原站摘要\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.16934\" target=\"_blank\" rel=\"noopener noreferrer\">MedPCFM-TED: One-Step Point Cloud Flow Matching for Implant Generation via Teacher-Guided Endpoint Distillation\u003c/a>\u003c/td>\u003ctd>医学应用；新论文；9 月 15 日\u003c/td>\u003ctd>一步端点蒸馏；质量与多样性分开验证\u003c/td>\u003ctd>HTML 方法与实验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.18734\" target=\"_blank\" rel=\"noopener noreferrer\">Conditionally linear, matrix normal state space models\u003c/a>\u003c/td>\u003ctd>可迁移算法；新论文；9 月 16 日\u003c/td>\u003ctd>小样本矩阵潜状态的结构化概率基线\u003c/td>\u003ctd>HTML 方法与实证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.18093\" target=\"_blank\" rel=\"noopener noreferrer\">Entropy Estimates from Stochastic Interpolants\u003c/a>\u003c/td>\u003ctd>可迁移算法；新论文；9 月 16 日\u003c/td>\u003ctd>低开销熵诊断；不能替代患者级校准\u003c/td>\u003ctd>HTML 方法与实验\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>日期均取 arXiv v1 提交记录的 UTC 日期，精确首次公告上线时间未独立核实；不是搜索结果显示的抓取日期。10 篇均为首次推荐。第 1、3 篇首次公开早于本次增量窗口，作为近期补充；没有把其 9 月 16 日修订当作新论文。修订差异未逐版核实，不宣称实质更新。全部为预印本，未核实正式接受。未下载 PDF，代码未运行。\u003c/p>\n\u003ch2>1. Spectral-Target Physical Latent Structuring for JEPA-Style World Models\u003c/h2>\n\u003cp>作者：Penghao Zhu, Salvatore Penachio, Kaustav Mukherjee, Aneesh Jonelagadda。\u003c/p>\n\u003cp>原文：\u003ca href=\"https://arxiv.org/abs/2609.04264\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.04264\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.04264v3\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v3\u003c/a>。v1：\u003cstrong>2026-09-02 18:05:06 UTC\u003c/strong>；最新修订 v3：\u003cstrong>2026-09-16 16:49:30 UTC\u003c/strong>。预印本，近期补充。\u003cstrong>未找到官方代码\u003c/strong>。已读方法、主要实验和标注来源附录，未独立复现。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>即使潜变量没有塌缩，JEPA 仍可能只编码背景或干扰物；一个受限容量的任务状态辅助头，可以迫使编码器和预测器保留决策所需信息。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>论文从 LeWM 的潜状态预测和 SIGReg 正则出发，在可控物体与环境物体并存的模拟任务中发现：良好的整体表征统计不保证模型理解被控制对象。作者为一组可交换物体的框 \u003ccode>b_i=[x,y,w,h]\u003c/code> 构造固定随机 Fourier 目标 \u003ccode>sum_i [cos(W^T b_i), sin(W^T b_i)]\u003c/code>，用两层 MLP 从当前和预测的未来潜状态恢复该目标。该辅助头通常在推理时移除。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>相对只约束预测一致性和非塌缩的目标，新增的是明确的物理状态监督。目标求和对物体排列不变，但有限 Fourier 频率不保证无歧义地恢复全部物体。浅头限制了“复杂头自行完成任务、主表征仍不保留状态”的可能性。辅助头自身只从真实编码状态学习；预测潜状态上的辅助梯度更新编码器/预测器，避免头追随不稳定预测漂移。默认辅助权重 0.1、SIGReg 权重 0.09。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 1 中，单环境球场景的 H=4 规划成功率 \u003cstrong>1.1%→92.4%\u003c/strong>，H=8 为 \u003cstrong>0→62.1%\u003c/strong>；Table 3 的 Push-T 为 \u003cstrong>91.2%→95.2%\u003c/strong>。五个 planning seeds 不等于五次独立训练复现。主实验框来自模拟器真值，检测器与噪声框分析是额外实验，不能说医学迁移无需标注。\u003c/p>\n\u003cp>表征探针显示受控物体的相关性改善，但环境物体可下降；部分任务的潜距离与真实状态距离相关性仍弱。作者认为结构化目标改善规划，我的判断是证据支持“关键状态监督值得加”，尚不能证明 Fourier 形式优于所有简单病灶目标。极小样本下也不保证收益。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法，今天首选。\u003c/strong> 可以在历史 MRI/CT 编码器和未来潜状态预测器上加病灶状态头，监督体积、位置、增强或纹理变化。需要训练患者的病灶标注或可靠测量。单病灶没有集合置换的明显需求；多病灶要保留器官与解剖身份，不能把不同组织直接无区别相加。医学中的治疗反应、坏死和新病灶也不是模拟球的运动。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>固定现有编码器初始化和 \u003ccode>history, treatment, deltaT\u003c/code> 输入，比较同容量无辅助损失、原始体积/框回归、Fourier 集合目标、同标注的 ROI 监督。直接 pCR/OS 模型也应获得相同未来辅助监督、训练预算与参数容量，才能判断生成模块本身是否必要。\u003c/p>\n\u003cp>同时报告有效秩/特征方差、病灶变化线性探针、相对复制最近观测及趋势外推的误差，以及中心留出的 pCR AUROC/AUPRC/Brier。生存评价固定 landmark、结局与删失处理，报告事件数及时间依赖 Brier；增加标签打乱对照，防止把中心差异当病灶变化。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：只有秩或图像相似度提高，病灶变化和临床预测无增量；或简单体积头达到相同收益，则不支持复杂 spectral 目标的必要性。算力：原文给出小 ViT、64×64 或 224×224 输入及训练轮数，未核实 GPU 小时；缓存潜变量加浅头估计单 GPU 可做，依据是省去 3D 编码器反传，联合微调另计。\u003c/p>\n\u003ch2>2. Dynamic Generalized Gromov-Wasserstein Optimal Transport\u003c/h2>\n\u003cp>作者：Junda Ying, Zhiwei Zeng, Peijie Zhou, Lei Zhang。\u003c/p>\n\u003cp>原文：\u003ca href=\"https://arxiv.org/abs/2609.20008\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.20008\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.20008v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v1\u003c/a>。v1：\u003cstrong>2026-09-17 10:17:33 UTC\u003c/strong>；无修订。预印本。\u003cstrong>未找到官方代码\u003c/strong>。已读方法、主要结果及实现附录，证明未逐条复核。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>把结构约束放进传输路径本身，有机会减少中间状态的几何扭曲，但端点之间的插值成功并不等于能预测未知未来。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>静态 GW/二次 OT 匹配数据内部关系，随后沿直线做 CFM 仍可能在中间路径破坏结构。本文引入 interacting pair dynamics：除运动能量外，惩罚成对距离变化的速率，用 travelling-pair flow matching 学习条件对路径，再得到单粒子边缘速度。实验涉及合成旋转与空间转录组，方法实现称 TP-DATE。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>关键变化是“静态结构匹配 + 直线流”变成结构感知的动态路径。单粒子速度可由对速度条件期望获得，保持边缘连续性，但不意味着恢复了完整的二体联合动力学。速度分解存在不唯一性，需要先验选择；不能由此识别组织变化的唯一机制。实验中的交互约束主要作用于空间位置，表达特征采用运动代价；随机、含噪及 unbalanced 扩展未完成。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Mouse Brain 的空间 W2 从 OT-CFM \u003cstrong>0.09190→0.08678\u003c/strong>，表达 W2 \u003cstrong>6.52705→6.40989\u003c/strong>，SCeMSE \u003cstrong>1.52747→1.47693\u003c/strong>。并非所有指标最佳：ARTISTA 中 stVCR 空间 W2 \u003cstrong>0.08582\u003c/strong> 优于 TP-DATE \u003cstrong>0.09196\u003c/strong>；肿瘤样本 TP-DATE 空间 \u003cstrong>0.06959\u003c/strong> 也逊于 ContextFlow \u003cstrong>0.06768\u003c/strong>。五随机种子不等于五个独立队列。\u003c/p>\n\u003cp>肿瘤实验来自同一组织不同切片深度，\u003cstrong>不是治疗前后纵向肿瘤预测\u003c/strong>；空间转录组也不等于生成 H&amp;E/WSI。实验用两个已知端点重建中间状态。合成 Distractor 的归一化联合使用起点、中点和终点，属于传导式预处理，不能照搬为严格前瞻流程；真实数据 PCA 拟合范围未充分核实。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可尝试让 lesion/organ tokens 的 FM 路径保留合理结构，或用于有空间对应的影像与组织表达对齐。需要可靠坐标、配准和实体对应。治疗导致的缩小、坏死、消失本来就是结构变化，强结构保持可能抑制真正反应。临床时间 \u003ccode>deltaT\u003c/code> 必须单独进入条件，不能拿生成过程时间代替。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>先在可控形变和病灶体积变化的低维潜空间比较 OT-CFM、静态 FGW-CFM、动态 pair path、简单形变/趋势基线。训练可用配对历史与未来标签，测试必须只给预测时点前信息，不给未来端点或中间真值。所有归一化和 PCA 只在训练集拟合。\u003c/p>\n\u003cp>分开评价结构失真、病灶变化误差、患者特异性与 pCR/OS 增量；直接预测模型使用同输入、容量和预算。若引入随机模型，再加 proper score 与覆盖率。\u003cstrong>否证结果\u003c/strong>：只提高空间匹配，却压低真实病灶变化幅度，或从插值改成未知未来预测后收益消失。原文附录使用单张 \u003cstrong>NVIDIA 5070 Ti\u003c/strong>、五层宽 128 的 MLP，未给可核实的 GPU 小时；医学 token 试验可先单 GPU，完整 3D 影像成本需另估。\u003c/p>\n\u003ch2>3. Arti-JEPA: Adapting Video World Model to Real-Time MRI of the Vocal Tract for Speech-Production Analysis\u003c/h2>\n\u003cp>作者：Hong Nguyen, Sean Foley, Christina Hagedorn, Yijing Lu, Sudarsana Reddy Kadiri, Dani Byrd, Shrikanth Narayanan。\u003c/p>\n\u003cp>原文：\u003ca href=\"https://arxiv.org/abs/2609.09757\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.09757\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.09757v2\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v2\u003c/a>。v1：\u003cstrong>2026-09-09 05:58:40 UTC\u003c/strong>；v2：\u003cstrong>2026-09-16 17:11:39 UTC\u003c/strong>。预印本，近期补充。代码线索：\u003ca href=\"https://github.com/Hong7Cong/arti-jepa\" target=\"_blank\" rel=\"noopener noreferrer\">Hong7Cong/arti-jepa\u003c/a>，已核实公开、作者同名资料及对应研究实现文件；论文原页未直接链接，官方归属仍有这一证据缺口，未验证完整复现。已读正文方法与实验。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>视频 JEPA 可以经自监督域适配迁移到动态 MRI，但论文的外部测试规模和摘要正文冲突，要求我们把结论限定在已核对的实验上。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>以预训练 V-JEPA 2 为起点，针对灰度、低分辨率声道实时 MRI 调整输入、增强及时间采样，用 EMA 教师提供 masked latent L1 目标。输入为 50 fps 下 32 帧，即约 640 ms，随后冻结表征，用探针分析发音与言语任务。训练监控特征标准差、有效秩及绝对余弦相似度，避免只看训练损失。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>核心是模态适配与受控探针评估，而非新的长期病程生成器。相对直接使用自然视频 V-JEPA，新增 MRI 持续预训练、符合声道运动的帧率和增强。单次检查的毫秒动态并非跨周/月复查；masked context prediction 也不是天然只用历史预测未来。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 1 的外部音素帧级 Cohen kappa：Arti-JEPA \u003cstrong>0.352±0.015\u003c/strong>，适配 VideoMAE \u003cstrong>0.264\u003c/strong>，原始 V-JEPA 2 \u003cstrong>0.156±0.016\u003c/strong>。但该外部 USCLSS 测试来自\u003cstrong>一位未见说话者\u003c/strong>，不能称多中心临床验证。扩大上下文并加入 biLSTM 后为 0.421，两项同时变化，不能只归因于 LSTM。\u003c/p>\n\u003cp>最新版内部存在冲突：摘要称约 62 小时，正文描述约 15 小时加 38 小时、超过 50 小时；摘要称口吃二分类没有改善，Table 7 却为 macro-F1 \u003cstrong>0.789→0.817\u003c/strong>；摘要的术后无下降说法也与正文个别受试者退化不一致。本报告采用正文可核对数字。口吃分析仅七人留一人测试；三种子波动不等于总体临床置信区间。术后分析仅三人。作者报告受试者分离，但非塌缩统计本身不能证明没有数据泄漏。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关于医学表征适配，病种和预测时间尺度仍需迁移。\u003c/strong> 可借鉴自监督适配、冻结探针、表征诊断的组合。对纵向 MRI，预训练也要按患者与中心划分，测试患者的未标注影像不能自动视为无害。需要分别研究帧内时间、检查间时间和治疗阶段。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>固定骨干和下游头，比较无适配、masked JEPA 适配、真实未来表征预测，并匹配数据量、上下文长度和训练预算；同时比较 MAE/对比学习与直接 pCR/OS 模型。检查 lesion-change probe、中心/扫描器可预测性、少标签曲线和中心留出 pCR/删失生存指标，保留复制/趋势对照。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：域内探针或有效秩改善，但病灶变化与外部临床效用无收益，或收益由更多上下文解释，则不支持目标本身的迁移价值。原文计算为 \u003cstrong>单 V100 32GB、26,875 updates、有效 batch 128\u003c/strong>，FP16 与激活检查点；未核实 GPU 小时。全文网格缓存约 31 GiB/编码器，池化缓存约 123 MB，可先后者做最低成本探针。\u003c/p>\n\u003ch2>4. Conservation Buys Stability and Factoring Buys Counterfactuals in Physical World Models\u003c/h2>\n\u003cp>作者：Yufeng Wang, Parivesh Priye, Lu Wei, Haibin Ling。原文：\u003ca href=\"https://arxiv.org/abs/2609.19674\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.19674v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v1\u003c/a>。v1：\u003cstrong>2026-09-17 04:16:51 UTC\u003c/strong>；无修订；预印本；\u003cstrong>未找到官方代码\u003c/strong>。已读方法、主要实验及计算附录。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>长期不发散与改变干预条件后预测正确，需要不同的归纳偏置，不能用同一个 rollout 分数证明两者。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>作者用 symplectic leapfrog 积分学习的 Hamiltonian，并将势能写成 \u003ccode>V(q,G)=G U_theta(q)\u003c/code>，在辛结构与参数分解的 2×2 对照中，分别测试长期稳定性和改变 G 符号后的迁移。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>守恒结构约束数值演化，显式因子控制力随 G 的变化。负 G 下的规律来自参数化假设，而非仅凭正 G 观测被识别。理论上的近守恒针对满足条件的修正能量，不能直接等于真实物理能量准确。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 1 的 2000 步、约训练时距 100 倍实验中，辛模型 192 次均有限，但真实能量相对漂移仍为 \u003cstrong>7.1，即约 710%\u003c/strong>。有限不等于准确。因子化负 G 测试 nMSE 约 0.03–0.18，未因子化约 2.7；故意将真实 G² 写错成线性 G 时，域内仍拟合良好，反转测试误差却升到 0.343，正确 G² 为 0.022。该结果直接说明域内拟合不能验证干预规律。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 借鉴“稳定约束 × 治疗机制分解”的实验设计。肿瘤治疗是开放、耗散、组织增减过程，不宜硬套能量守恒或剂量线性响应。反事实因果解释还需一致性、序贯可交换性、positivity、干预定义及缺失/删失假设。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>先在已知治疗响应方程的模拟器做 2×2 对照，再考虑给真实患者潜状态添加可辩护的生理约束。匹配参数、输入和训练预算，比较多步误差/失败率、剂量外推、病灶变化和直接临床预测。\u003cstrong>否证结果\u003c/strong>：稳定但偏离真实变化，或参数假设轻微错误便让干预结论反转。原文 oracle 单实验单 GPU 约 1–4 分钟，多实验分布到八 GPU，像素任务更久；不是医学 3D 训练成本。\u003c/p>\n\u003ch2>5. LIFD: Anchored Diffusion for 3D-Aware Scene Memory in Robotic Manipulation\u003c/h2>\n\u003cp>作者：Wenbo Li, Yiteng Chen, Wenhao Li, Qingyao Wu。原文：\u003ca href=\"https://arxiv.org/abs/2609.19796\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.19796v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v1\u003c/a>。v1：\u003cstrong>2026-09-17 07:07:03 UTC\u003c/strong>；无修订；预印本；\u003cstrong>未找到官方代码\u003c/strong>。已读方法、消融与泛化实验。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>把历史记忆与当前观测作为不同条件注入生成器，适合研究缺失观测下的当前患者状态估计，但还不是治疗条件未来预测。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>模型用几何适配的 VGGT 特征、多视角教师、自蒸馏与 GRU 记忆，将高斯噪声经 Rectified Flow 转为当前全局场景 token。记忆每获得一次新观测更新一次，在 ODE 采样中保持不变。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>AGCA 在生成时间 u 中混合当前观测与历史记忆的 FiLM 条件，逐渐增强当前观测权重。它是学习到的 anchoring，并非严格几何约束。生成时间 u 与真实世界观测时间必须区分。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>LIBERO 平均成功率 91.6%，joint 基线 88.5%；移除 anchor、memory 或 RF 均显著降低对应消融成绩。但方法额外使用约 11 万帧几何训练资料，跨方法输入与预算未完全匹配。RoboTwin easy/hard 为 \u003cstrong>63.2/19.4\u003c/strong>，OOD 差距明显。SCI 从 0.20 到 0.14 是相对教师的 token 一致性，不是几何真值准确度或概率校准。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可放在未来预测器之前，融合既往影像与当前缺失模态，估计当前患者状态。需要训练期完整/多模态教师；不能使用测试患者未来检查当教师，也不能假设治疗后的不可见组织仍维持旧状态。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>比较拼接、GRU、确定性补全头、记忆条件 RF，并分别消融 anchor 与 memory。控制教师数据和算力，评价缺失 ROI/模态重建、未来病灶变化及同预算直接 pCR/OS；按观测可见和不可见区域分层。\u003cstrong>否证结果\u003c/strong>：只改善教师相似度，未来变化或临床任务不改善。原文 RTX 4090 上 50 RF 步约 190 ms、20 步约 75 ms，训练成本未核实；这些不是医学体数据延迟。\u003c/p>\n\u003ch2>6. PointZero: 3D Point Track Completion for Learning Transferable 3D Dynamics\u003c/h2>\n\u003cp>作者：Bardienus P. Duisterhof, Kaifeng Zhang, Adam Hung, Bowen Wen, Stan Birchfield, Yunzhu Li, Deva Ramanan, Jeffrey Ichnowski。原文：\u003ca href=\"https://arxiv.org/abs/2609.19142\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.19142v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v1\u003c/a>；\u003ca href=\"https://pointzero-wm.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\">项目页\u003c/a>。v1：\u003cstrong>2026-09-16 17:59:30 UTC\u003c/strong>；无修订；预印本。官方仓库：\u003ca href=\"https://github.com/Duisterhof/pointzero\" target=\"_blank\" rel=\"noopener noreferrer\">Duisterhof/pointzero\u003c/a>，目前只有 README 和展示图，写明 Release coming soon，\u003cstrong>实现、权重及数据未核实发布\u003c/strong>。已读方法与消融。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>稀疏轨迹补全提供密集的动力学预训练监督，但临床测试时不能把真实未来病灶轨迹作为条件输入。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>根据初始 RGB-D 点云和 1–3 条完整未来点轨迹，预测所有点的十帧轨迹；预训练数据约 290 万合成帧。Perceiver 压缩视觉特征后使用 DiT，比较直接回归、FM 的速度预测与 JiT 风格端点预测。后训练用已规划机器人末端姿态替换稀疏未来轨迹条件。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>把 robot-free 轨迹补全用作通用几何动态预训练，再连接动作。Robot-free 并不表示无监督：合成器提供密集轨迹真值；端点形式也仍通过隐含速度损失训练。既有点的运动不能自然表示新病灶出现、肿瘤组织增生或消失。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 4 的二十条示范、无额外 actionless 视频对照，scratch \u003cstrong>80.5→预训练 88.2\u003c/strong>，但 Blockstack 单任务 93.5→93.2，并非普遍提高。主实验若额外使用一百条无动作视频，不能与这一干净消融混用；另一些对照还同时改变点流是否冻结。大量机器人 rollout 不等于大量独立患者证据。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可用训练患者的已配准病灶关键点或区域形变作为辅助标签，强化变化表征；测试只给历史、治疗和真实间隔。需要可靠对应，形变与组织增减要分开表示。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>缓存低分辨率病灶 token，比较轨迹辅助、体积辅助、直接潜状态预测及无辅助的相同网络；加入轨迹打乱对照，并与同输入预算的直接 pCR/OS 比较。评价病灶变化、长期误差和跨中心临床效用。\u003cstrong>否证结果\u003c/strong>：收益依赖输入真实未来轨迹，或简单体积监督达到相同效果。原文每变体约 \u003cstrong>8 H100 × 2 天，折合约 384 GPU 小时\u003c/strong>；医学最小实验只做小头估计单 GPU，当前不建议等待之外先照搬完整预训练。\u003c/p>\n\u003ch2>7. Recency Forcing: Bridging the Long-Horizon Gap in Autoregressive Video Generation\u003c/h2>\n\u003cp>作者：Tri Cao, Hung Nguyen, Phong Nguyen, Khoi Nguyen。原文：\u003ca href=\"https://arxiv.org/abs/2609.19729v1\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv v1\u003c/a>。v1：\u003cstrong>2026-09-17 05:40:53 UTC\u003c/strong>；无修订；预印本；\u003cstrong>未找到官方代码\u003c/strong>。\u003cstrong>仅阅读原站摘要与元数据；HTML 全文返回 404，未下载 PDF。\u003c/strong>\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>对使用长历史注意力和 KV 缓存淘汰的模型，训练与推理的记忆长度差异可能是长期漂移的来源。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>摘要提出以扰动测量位置响应，分析帧距与去噪时刻对注意力的影响，再用非正 Temporal Response Bias 降低远期帧影响，避免直接截断上下文；BAR 重参数化旨在兼容高效注意力。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>可迁移的是对历史注意力进行时间相关约束，而非简单增加历史窗口。摘要主张高效且改善长期生成，但本次无法核实完整目标、超参、定量结果或零开销主张。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法，条件性低优先级。\u003c/strong> 只有实际存在窗口淘汰或很长历史时才值得实验。三四次复查通常不满足这一条件；初始病灶与治疗切换点可能长期重要，不能机械按“越旧越不重要”处理。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在相同历史输入与容量下比较无偏置、截断、按真实时间间隔学习的偏置，始终保留基线与治疗节点；生成时间和临床时间分别编码。固定推理预算，比较 rollout 误差、病灶变化及同输入临床预测。\u003cstrong>否证结果\u003c/strong>：收益仅出现在人工长窗口而不出现在真实访视数，或遗忘关键治疗历史，则不应优先迁移。原论文算力未核实；缓存潜变量注意力消融可先单 GPU，属基于模块规模的估计。\u003c/p>\n\u003ch2>8. MedPCFM-TED: One-Step Point Cloud Flow Matching for Implant Generation via Teacher-Guided Endpoint Distillation\u003c/h2>\n\u003cp>作者：Kamil Kwarciak, Marek Wodzinski。原文：\u003ca href=\"https://arxiv.org/abs/2609.16934\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.16934v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v1\u003c/a>。v1：\u003cstrong>2026-09-15 10:10:17 UTC\u003c/strong>；无修订；预印本；\u003cstrong>未找到官方代码\u003c/strong>。已读完整方法、评价协议及主结果。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>有强条件约束的医学点云生成可以直接蒸馏到一步，但结果是否仍保留合理条件分布，需要超出平均形状质量的验证。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>以缺损颅骨点云为条件，用多步 PCFM 教师生成植入物端点。学生预测从相同噪声到教师端点的位移，目标包含位移 MSE、学生对教师 Chamfer、学生对真实植入物 Chamfer，三项权重均为 1，不显式执行轨迹拉直。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>相对先拉直再蒸馏，简化为端点监督并加入真值几何项。论文将 PSF 实现为教师 Chamfer 对照、IMLE 使用四候选最邻近监督；这些并不等于完整复现所有原方法训练流程。真值 Chamfer 还会改变纯教师分布蒸馏的目标，可能收缩多模态结果。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>SkullBreak DSC 教师 \u003cstrong>0.744→TED 0.766\u003c/strong>，但 Chamfer \u003cstrong>0.127→0.144\u003c/strong> 变差；SkullFix DSC \u003cstrong>0.824→0.801\u003c/strong>。单次生成耗时表列 \u003cstrong>3.195→0.0434 秒\u003c/strong>。质量指标却用多次随机生成、共识密度聚合后评价，不能直接当单次采样质量；聚合次数和后处理总延迟还需核对。Heun 的步数/NFE 文中口径存在混用，应实测网络调用数。两数据集共 600/70/210 个训练/验证/测试样本，不能自行等同独立患者数。没有患者级不确定性校准证据。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关于医学生成，面向纵向任务需迁移。\u003c/strong> 可以给已验证有效的 latent FM 增加一步学生。颅骨补全受当前几何强约束，治疗后的病灶变化不一定具有同等确定性。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>固定教师和训练划分，比较教师多步/少步、纯教师端点 MSE、加几何真值项、同容量直接回归。分别报告单样本与固定 K 聚合，计入教师训练和蒸馏成本；检查条件模态覆盖、energy score/CRPS、病灶变化误差与同预算直接 pCR/OS。\u003cstrong>否证结果\u003c/strong>：加速同时降低覆盖、消除少数患者响应模式，或优势来自聚合/后处理，则不能宣称保真蒸馏。原实验 \u003cstrong>GH200 96GB，教师 15,000 epochs、batch 16\u003c/strong>，学生使用相同训练超参；GPU 小时未核实。\u003c/p>\n\u003ch2>9. Conditionally linear, matrix normal state space models\u003c/h2>\n\u003cp>作者：Drew D. Creal, Marcelo C. Medeiros, Rodrigo Sarlo。原文：\u003ca href=\"https://arxiv.org/abs/2609.18734\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.18734v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v1\u003c/a>。v1：\u003cstrong>2026-09-16 14:31:37 UTC\u003c/strong>；无修订；预印本；\u003cstrong>未找到官方代码\u003c/strong>。已读模型假设、矩阵滤波、缺失处理和主要实证，未逐项复核全部推导。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>对具有实体与特征两轴的纵向状态，矩阵正态模型提供结构明确的概率基线，但计算优势依赖较强协方差假设。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>保持 \u003ccode>Y_t = D_t + Z_t A_t W_t^T + E_t\u003c/code> 的矩阵结构，构造 Kalman filter、似然、平滑及后验轨迹采样，避免朴素向量化产生的大 Kronecker 协方差。可加入混合频率、重尾与方差状态。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>统一推广矩阵状态的滤波和联合轨迹抽样。闭式递推要求共享右尺度矩阵及相容的测量结构；不是任意双边变换、任意相关性的免费加速。整行缺失与零散元素缺失不同，后者在附录回到向量化条件系统做插补。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>应用为美国五十州、十二经济变量，600 条观测序列压缩成 3×11 的潜因子矩阵。结果主要展示拟合、因子解释和 MCMC 混合；部分参数五万次 burn-in 后样本的有效样本数约 760。没有医学或严格前瞻预测胜过神经模型的证据。计算复杂度讨论针对朴素向量 Kalman，大幅理论比例不是实测端到端加速。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可用患者内“病灶/模态 × 低维特征”的状态，构造小样本概率对照；患者之间保持独立单位，不能用跨患者共同时间矩阵偷带测试信息。不规则临床间隔需要显式时间依赖转移；原文的月/季度混合频率不自动解决连续时间和信息性缺失。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在缓存特征上比较矩阵与向量 Kalman、线性趋势、GRU 和 latent FM；让转移使用同样治疗与间隔信息，并做中心留出。预测时只允许过滤，不用含未来观测的平滑状态。评价 CRPS/覆盖率、变化误差及 pCR/删失生存增量。\u003cstrong>否证结果\u003c/strong>：协方差约束导致系统性欠覆盖，或只有利用未来平滑后才改善。论文硬件/时长未核实；几十维最小滤波实验估计 CPU 可行，长链后验抽样需另测。\u003c/p>\n\u003ch2>10. Entropy Estimates from Stochastic Interpolants\u003c/h2>\n\u003cp>作者：Phillip M. Rauscher。原文：\u003ca href=\"https://arxiv.org/abs/2609.18093\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.18093v2\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v2\u003c/a>。v1：\u003cstrong>2026-09-16 03:58:52 UTC\u003c/strong>；v2：\u003cstrong>2026-09-17 13:40:33 UTC\u003c/strong>。预印本，首次推荐；修订差异未单独核实。官方代码：\u003ca href=\"https://github.com/Rauscher-Group/eesi\" target=\"_blank\" rel=\"noopener noreferrer\">Rauscher-Group/eesi\u003c/a>，论文直接链接且代码目录可访问；README 指出配套权重仓库尚未存在，不能声称权重全部可下载。已读方法、实验与实现说明。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>用速度与 score 的内积估计分布熵差，可为潜空间生成提供低成本分布诊断，但这个标量不是患者级可信度。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>连续性方程给出 \u003ccode>dH/du = -E[v dot score]\u003c/code>，从而避免昂贵的散度计算。若可直接采样两端分布及插值噪声，还可以用噪声回归形式减少单独学习 score 的需要，但这个版本不能直接迁移到没有目标样本的新分布。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>相对 continuous normalizing flow 中基于散度的密度计算，换成对分布取期望后的内积。两者只在期望层面相等，逐条轨迹的内积积分\u003cstrong>不能当作该样本的 log-likelihood\u003c/strong>。原文 Eq. 8 的 score 符号与后续 Eq. 13 存在表面不一致；实现前应以高斯解析例核验约定，不能照抄符号。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>覆盖四十维混合高斯、XY spins、十三粒子 Lennard-Jones 和主动聚合物。混合高斯中多数估计误差小于 0.5 nats，但依赖学习 score 的生成式估计误差约 \u003cstrong>3.5 nats\u003c/strong>。Lennard-Jones 的散度计算约比内积慢五十倍，这是该计算项的比较，不是整体训练提速。没有医学条件校准实验；训练集小到记忆样本时，估计也会偏移。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法，作为诊断优先于新主模型。\u003c/strong> 可比较固定潜坐标与归一化下，各临床时间间隔、治疗组的生成熵。不同编码器尺度改变会改变微分熵；高熵既可能反映合理多样性，也可能是无效噪声，低熵也不自动意味着准确。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>先用已知熵的条件高斯/混合分布对照散度估计，检查样本量、端点方差和符号；再在固定医学潜空间与 energy score、CRPS、覆盖率、病灶变化误差联合报告，保留直接临床预测对照。\u003cstrong>否证结果\u003c/strong>：熵排序主要受编码尺度影响，或熵看似合理但条件覆盖明显失败，则不能用于患者可信度判断。原文使用单 \u003cstrong>NVIDIA RTX PRO 2000 Blackwell\u003c/strong>；额外内积为 O(d)，但训练 score 的成本不可忽略，未核实总 GPU 小时。\u003c/p>\n\u003ch2>今天最值得读的一篇\u003c/h2>\n\u003cp>\u003cstrong>Spectral-Target Physical Latent Structuring for JEPA-Style World Models。\u003c/strong> 它把“没有塌缩”和“保留病灶相关信息”明确分开，能转化成缓存潜变量上的小型辅助头实验。最值得先检验的不是 Fourier 形式，而是简单病灶状态监督能否在同输入、容量和预算下提高患者特异变化预测，并对直接 pCR/OS 基线产生真实增量。\u003c/p>\n","markdown":"# 纵向医学世界模型论文雷达 | 2026-09-18\n\n今天扩充为 **10 篇：8 篇新论文、2 篇近期补充**，包含 8 篇通用算法、2 篇医学应用。前 3 篇重点精读，后 7 篇扩展阅读。最值得检验的假设是：**防止表征塌缩还不够，必须让潜状态显式保留病灶变化，并检验这些信息能否改善独立患者上的临床预测。** 生成速度、长期数值稳定性和不确定性分别需要独立评价，不能互相替代。\n\n## 阅读优先级\n\n| 顺序 | 论文 | 类型 / 首次日期 | 重点 | 证据 |\n|---|---|---|---|---|\n| 1 | [Spectral-Target Physical Latent Structuring for JEPA-Style World Models](https://arxiv.org/abs/2609.04264) | 可迁移算法；近期补充；9 月 2 日 | 防塌缩不等于学到任务关键状态 | HTML 方法与实验 |\n| 2 | [Dynamic Generalized Gromov-Wasserstein Optimal Transport](https://arxiv.org/abs/2609.20008) | 可迁移算法；新论文；9 月 17 日 | 让传输路径考虑结构变化，而非只匹配端点 | HTML 方法与实验 |\n| 3 | [Arti-JEPA: Adapting Video World Model to Real-Time MRI of the Vocal Tract for Speech-Production Analysis](https://arxiv.org/abs/2609.09757) | 医学应用；近期补充；9 月 9 日 | 视频 JEPA 适配 MRI；审查外部泛化与正文证据 | HTML 方法与实验 |\n| 4 | [Conservation Buys Stability and Factoring Buys Counterfactuals in Physical World Models](https://arxiv.org/abs/2609.19674) | 可迁移算法；新论文；9 月 17 日 | 稳定 rollout 与干预外推是两个问题 | HTML 方法与实验 |\n| 5 | [LIFD: Anchored Diffusion for 3D-Aware Scene Memory in Robotic Manipulation](https://arxiv.org/abs/2609.19796) | 可迁移算法；新论文；9 月 17 日 | 历史记忆与当前观测融合，先补全当前状态 | HTML 方法与实验 |\n| 6 | [PointZero: 3D Point Track Completion for Learning Transferable 3D Dynamics](https://arxiv.org/abs/2609.19142) | 可迁移算法；新论文；9 月 16 日 | 用结构轨迹作为训练监督，避免未来条件泄漏 | HTML 方法与实验 |\n| 7 | [Recency Forcing: Bridging the Long-Horizon Gap in Autoregressive Video Generation](https://arxiv.org/abs/2609.19729v1) | 可迁移算法；新论文；9 月 17 日 | 长历史注意力与短训练窗口失配 | 仅原站摘要 |\n| 8 | [MedPCFM-TED: One-Step Point Cloud Flow Matching for Implant Generation via Teacher-Guided Endpoint Distillation](https://arxiv.org/abs/2609.16934) | 医学应用；新论文；9 月 15 日 | 一步端点蒸馏；质量与多样性分开验证 | HTML 方法与实验 |\n| 9 | [Conditionally linear, matrix normal state space models](https://arxiv.org/abs/2609.18734) | 可迁移算法；新论文；9 月 16 日 | 小样本矩阵潜状态的结构化概率基线 | HTML 方法与实证 |\n| 10 | [Entropy Estimates from Stochastic Interpolants](https://arxiv.org/abs/2609.18093) | 可迁移算法；新论文；9 月 16 日 | 低开销熵诊断；不能替代患者级校准 | HTML 方法与实验 |\n\n日期均取 arXiv v1 提交记录的 UTC 日期，精确首次公告上线时间未独立核实；不是搜索结果显示的抓取日期。10 篇均为首次推荐。第 1、3 篇首次公开早于本次增量窗口，作为近期补充；没有把其 9 月 16 日修订当作新论文。修订差异未逐版核实，不宣称实质更新。全部为预印本，未核实正式接受。未下载 PDF，代码未运行。\n\n## 1. Spectral-Target Physical Latent Structuring for JEPA-Style World Models\n\n作者：Penghao Zhu, Salvatore Penachio, Kaustav Mukherjee, Aneesh Jonelagadda。\n\n原文：[arXiv:2609.04264](https://arxiv.org/abs/2609.04264)；[HTML v3](https://arxiv.org/html/2609.04264v3)。v1：**2026-09-02 18:05:06 UTC**；最新修订 v3：**2026-09-16 16:49:30 UTC**。预印本，近期补充。**未找到官方代码**。已读方法、主要实验和标注来源附录，未独立复现。\n\n### 一句话总结\n\n即使潜变量没有塌缩，JEPA 仍可能只编码背景或干扰物；一个受限容量的任务状态辅助头，可以迫使编码器和预测器保留决策所需信息。\n\n### 中文摘要\n\n论文从 LeWM 的潜状态预测和 SIGReg 正则出发，在可控物体与环境物体并存的模拟任务中发现：良好的整体表征统计不保证模型理解被控制对象。作者为一组可交换物体的框 `b_i=[x,y,w,h]` 构造固定随机 Fourier 目标 `sum_i [cos(W^T b_i), sin(W^T b_i)]`，用两层 MLP 从当前和预测的未来潜状态恢复该目标。该辅助头通常在推理时移除。\n\n### 创新点\n\n相对只约束预测一致性和非塌缩的目标，新增的是明确的物理状态监督。目标求和对物体排列不变，但有限 Fourier 频率不保证无歧义地恢复全部物体。浅头限制了“复杂头自行完成任务、主表征仍不保留状态”的可能性。辅助头自身只从真实编码状态学习；预测潜状态上的辅助梯度更新编码器/预测器，避免头追随不稳定预测漂移。默认辅助权重 0.1、SIGReg 权重 0.09。\n\n### 实验支持与局限\n\nTable 1 中，单环境球场景的 H=4 规划成功率 **1.1%→92.4%**，H=8 为 **0→62.1%**；Table 3 的 Push-T 为 **91.2%→95.2%**。五个 planning seeds 不等于五次独立训练复现。主实验框来自模拟器真值，检测器与噪声框分析是额外实验，不能说医学迁移无需标注。\n\n表征探针显示受控物体的相关性改善，但环境物体可下降；部分任务的潜距离与真实状态距离相关性仍弱。作者认为结构化目标改善规划，我的判断是证据支持“关键状态监督值得加”，尚不能证明 Fourier 形式优于所有简单病灶目标。极小样本下也不保证收益。\n\n### 和我方向的适配\n\n**可迁移算法，今天首选。** 可以在历史 MRI/CT 编码器和未来潜状态预测器上加病灶状态头，监督体积、位置、增强或纹理变化。需要训练患者的病灶标注或可靠测量。单病灶没有集合置换的明显需求；多病灶要保留器官与解剖身份，不能把不同组织直接无区别相加。医学中的治疗反应、坏死和新病灶也不是模拟球的运动。\n\n### 可借鉴动作\n\n固定现有编码器初始化和 `history, treatment, deltaT` 输入，比较同容量无辅助损失、原始体积/框回归、Fourier 集合目标、同标注的 ROI 监督。直接 pCR/OS 模型也应获得相同未来辅助监督、训练预算与参数容量，才能判断生成模块本身是否必要。\n\n同时报告有效秩/特征方差、病灶变化线性探针、相对复制最近观测及趋势外推的误差，以及中心留出的 pCR AUROC/AUPRC/Brier。生存评价固定 landmark、结局与删失处理，报告事件数及时间依赖 Brier；增加标签打乱对照，防止把中心差异当病灶变化。\n\n**否证结果**：只有秩或图像相似度提高，病灶变化和临床预测无增量；或简单体积头达到相同收益，则不支持复杂 spectral 目标的必要性。算力：原文给出小 ViT、64×64 或 224×224 输入及训练轮数，未核实 GPU 小时；缓存潜变量加浅头估计单 GPU 可做，依据是省去 3D 编码器反传，联合微调另计。\n\n## 2. Dynamic Generalized Gromov-Wasserstein Optimal Transport\n\n作者：Junda Ying, Zhiwei Zeng, Peijie Zhou, Lei Zhang。\n\n原文：[arXiv:2609.20008](https://arxiv.org/abs/2609.20008)；[HTML v1](https://arxiv.org/html/2609.20008v1)。v1：**2026-09-17 10:17:33 UTC**；无修订。预印本。**未找到官方代码**。已读方法、主要结果及实现附录，证明未逐条复核。\n\n### 一句话总结\n\n把结构约束放进传输路径本身，有机会减少中间状态的几何扭曲，但端点之间的插值成功并不等于能预测未知未来。\n\n### 中文摘要\n\n静态 GW/二次 OT 匹配数据内部关系，随后沿直线做 CFM 仍可能在中间路径破坏结构。本文引入 interacting pair dynamics：除运动能量外，惩罚成对距离变化的速率，用 travelling-pair flow matching 学习条件对路径，再得到单粒子边缘速度。实验涉及合成旋转与空间转录组，方法实现称 TP-DATE。\n\n### 创新点\n\n关键变化是“静态结构匹配 + 直线流”变成结构感知的动态路径。单粒子速度可由对速度条件期望获得，保持边缘连续性，但不意味着恢复了完整的二体联合动力学。速度分解存在不唯一性，需要先验选择；不能由此识别组织变化的唯一机制。实验中的交互约束主要作用于空间位置，表达特征采用运动代价；随机、含噪及 unbalanced 扩展未完成。\n\n### 实验支持与局限\n\nMouse Brain 的空间 W2 从 OT-CFM **0.09190→0.08678**，表达 W2 **6.52705→6.40989**，SCeMSE **1.52747→1.47693**。并非所有指标最佳：ARTISTA 中 stVCR 空间 W2 **0.08582** 优于 TP-DATE **0.09196**；肿瘤样本 TP-DATE 空间 **0.06959** 也逊于 ContextFlow **0.06768**。五随机种子不等于五个独立队列。\n\n肿瘤实验来自同一组织不同切片深度，**不是治疗前后纵向肿瘤预测**；空间转录组也不等于生成 H&E/WSI。实验用两个已知端点重建中间状态。合成 Distractor 的归一化联合使用起点、中点和终点，属于传导式预处理，不能照搬为严格前瞻流程；真实数据 PCA 拟合范围未充分核实。\n\n### 和我方向的适配\n\n**可迁移算法。** 可尝试让 lesion/organ tokens 的 FM 路径保留合理结构，或用于有空间对应的影像与组织表达对齐。需要可靠坐标、配准和实体对应。治疗导致的缩小、坏死、消失本来就是结构变化，强结构保持可能抑制真正反应。临床时间 `deltaT` 必须单独进入条件，不能拿生成过程时间代替。\n\n### 可借鉴动作\n\n先在可控形变和病灶体积变化的低维潜空间比较 OT-CFM、静态 FGW-CFM、动态 pair path、简单形变/趋势基线。训练可用配对历史与未来标签，测试必须只给预测时点前信息，不给未来端点或中间真值。所有归一化和 PCA 只在训练集拟合。\n\n分开评价结构失真、病灶变化误差、患者特异性与 pCR/OS 增量；直接预测模型使用同输入、容量和预算。若引入随机模型，再加 proper score 与覆盖率。**否证结果**：只提高空间匹配，却压低真实病灶变化幅度，或从插值改成未知未来预测后收益消失。原文附录使用单张 **NVIDIA 5070 Ti**、五层宽 128 的 MLP，未给可核实的 GPU 小时；医学 token 试验可先单 GPU，完整 3D 影像成本需另估。\n\n## 3. Arti-JEPA: Adapting Video World Model to Real-Time MRI of the Vocal Tract for Speech-Production Analysis\n\n作者：Hong Nguyen, Sean Foley, Christina Hagedorn, Yijing Lu, Sudarsana Reddy Kadiri, Dani Byrd, Shrikanth Narayanan。\n\n原文：[arXiv:2609.09757](https://arxiv.org/abs/2609.09757)；[HTML v2](https://arxiv.org/html/2609.09757v2)。v1：**2026-09-09 05:58:40 UTC**；v2：**2026-09-16 17:11:39 UTC**。预印本，近期补充。代码线索：[Hong7Cong/arti-jepa](https://github.com/Hong7Cong/arti-jepa)，已核实公开、作者同名资料及对应研究实现文件；论文原页未直接链接，官方归属仍有这一证据缺口，未验证完整复现。已读正文方法与实验。\n\n### 一句话总结\n\n视频 JEPA 可以经自监督域适配迁移到动态 MRI，但论文的外部测试规模和摘要正文冲突，要求我们把结论限定在已核对的实验上。\n\n### 中文摘要\n\n以预训练 V-JEPA 2 为起点，针对灰度、低分辨率声道实时 MRI 调整输入、增强及时间采样，用 EMA 教师提供 masked latent L1 目标。输入为 50 fps 下 32 帧，即约 640 ms，随后冻结表征，用探针分析发音与言语任务。训练监控特征标准差、有效秩及绝对余弦相似度，避免只看训练损失。\n\n### 创新点\n\n核心是模态适配与受控探针评估，而非新的长期病程生成器。相对直接使用自然视频 V-JEPA，新增 MRI 持续预训练、符合声道运动的帧率和增强。单次检查的毫秒动态并非跨周/月复查；masked context prediction 也不是天然只用历史预测未来。\n\n### 实验支持与局限\n\nTable 1 的外部音素帧级 Cohen kappa：Arti-JEPA **0.352±0.015**，适配 VideoMAE **0.264**，原始 V-JEPA 2 **0.156±0.016**。但该外部 USCLSS 测试来自**一位未见说话者**，不能称多中心临床验证。扩大上下文并加入 biLSTM 后为 0.421，两项同时变化，不能只归因于 LSTM。\n\n最新版内部存在冲突：摘要称约 62 小时，正文描述约 15 小时加 38 小时、超过 50 小时；摘要称口吃二分类没有改善，Table 7 却为 macro-F1 **0.789→0.817**；摘要的术后无下降说法也与正文个别受试者退化不一致。本报告采用正文可核对数字。口吃分析仅七人留一人测试；三种子波动不等于总体临床置信区间。术后分析仅三人。作者报告受试者分离，但非塌缩统计本身不能证明没有数据泄漏。\n\n### 和我方向的适配\n\n**直接相关于医学表征适配，病种和预测时间尺度仍需迁移。** 可借鉴自监督适配、冻结探针、表征诊断的组合。对纵向 MRI，预训练也要按患者与中心划分，测试患者的未标注影像不能自动视为无害。需要分别研究帧内时间、检查间时间和治疗阶段。\n\n### 可借鉴动作\n\n固定骨干和下游头，比较无适配、masked JEPA 适配、真实未来表征预测，并匹配数据量、上下文长度和训练预算；同时比较 MAE/对比学习与直接 pCR/OS 模型。检查 lesion-change probe、中心/扫描器可预测性、少标签曲线和中心留出 pCR/删失生存指标，保留复制/趋势对照。\n\n**否证结果**：域内探针或有效秩改善，但病灶变化与外部临床效用无收益，或收益由更多上下文解释，则不支持目标本身的迁移价值。原文计算为 **单 V100 32GB、26,875 updates、有效 batch 128**，FP16 与激活检查点；未核实 GPU 小时。全文网格缓存约 31 GiB/编码器，池化缓存约 123 MB，可先后者做最低成本探针。\n\n## 4. Conservation Buys Stability and Factoring Buys Counterfactuals in Physical World Models\n\n作者：Yufeng Wang, Parivesh Priye, Lu Wei, Haibin Ling。原文：[arXiv](https://arxiv.org/abs/2609.19674)；[HTML v1](https://arxiv.org/html/2609.19674v1)。v1：**2026-09-17 04:16:51 UTC**；无修订；预印本；**未找到官方代码**。已读方法、主要实验及计算附录。\n\n### 一句话总结\n\n长期不发散与改变干预条件后预测正确，需要不同的归纳偏置，不能用同一个 rollout 分数证明两者。\n\n### 中文摘要\n\n作者用 symplectic leapfrog 积分学习的 Hamiltonian，并将势能写成 `V(q,G)=G U_theta(q)`，在辛结构与参数分解的 2×2 对照中，分别测试长期稳定性和改变 G 符号后的迁移。\n\n### 创新点\n\n守恒结构约束数值演化，显式因子控制力随 G 的变化。负 G 下的规律来自参数化假设，而非仅凭正 G 观测被识别。理论上的近守恒针对满足条件的修正能量，不能直接等于真实物理能量准确。\n\n### 实验支持与局限\n\nTable 1 的 2000 步、约训练时距 100 倍实验中，辛模型 192 次均有限，但真实能量相对漂移仍为 **7.1，即约 710%**。有限不等于准确。因子化负 G 测试 nMSE 约 0.03–0.18，未因子化约 2.7；故意将真实 G² 写错成线性 G 时，域内仍拟合良好，反转测试误差却升到 0.343，正确 G² 为 0.022。该结果直接说明域内拟合不能验证干预规律。\n\n### 和我方向的适配\n\n**可迁移算法。** 借鉴“稳定约束 × 治疗机制分解”的实验设计。肿瘤治疗是开放、耗散、组织增减过程，不宜硬套能量守恒或剂量线性响应。反事实因果解释还需一致性、序贯可交换性、positivity、干预定义及缺失/删失假设。\n\n### 可借鉴动作\n\n先在已知治疗响应方程的模拟器做 2×2 对照，再考虑给真实患者潜状态添加可辩护的生理约束。匹配参数、输入和训练预算，比较多步误差/失败率、剂量外推、病灶变化和直接临床预测。**否证结果**：稳定但偏离真实变化，或参数假设轻微错误便让干预结论反转。原文 oracle 单实验单 GPU 约 1–4 分钟，多实验分布到八 GPU，像素任务更久；不是医学 3D 训练成本。\n\n## 5. LIFD: Anchored Diffusion for 3D-Aware Scene Memory in Robotic Manipulation\n\n作者：Wenbo Li, Yiteng Chen, Wenhao Li, Qingyao Wu。原文：[arXiv](https://arxiv.org/abs/2609.19796)；[HTML v1](https://arxiv.org/html/2609.19796v1)。v1：**2026-09-17 07:07:03 UTC**；无修订；预印本；**未找到官方代码**。已读方法、消融与泛化实验。\n\n### 一句话总结\n\n把历史记忆与当前观测作为不同条件注入生成器，适合研究缺失观测下的当前患者状态估计，但还不是治疗条件未来预测。\n\n### 中文摘要\n\n模型用几何适配的 VGGT 特征、多视角教师、自蒸馏与 GRU 记忆，将高斯噪声经 Rectified Flow 转为当前全局场景 token。记忆每获得一次新观测更新一次，在 ODE 采样中保持不变。\n\n### 创新点\n\nAGCA 在生成时间 u 中混合当前观测与历史记忆的 FiLM 条件，逐渐增强当前观测权重。它是学习到的 anchoring，并非严格几何约束。生成时间 u 与真实世界观测时间必须区分。\n\n### 实验支持与局限\n\nLIBERO 平均成功率 91.6%，joint 基线 88.5%；移除 anchor、memory 或 RF 均显著降低对应消融成绩。但方法额外使用约 11 万帧几何训练资料，跨方法输入与预算未完全匹配。RoboTwin easy/hard 为 **63.2/19.4**，OOD 差距明显。SCI 从 0.20 到 0.14 是相对教师的 token 一致性，不是几何真值准确度或概率校准。\n\n### 和我方向的适配\n\n**可迁移算法。** 可放在未来预测器之前，融合既往影像与当前缺失模态，估计当前患者状态。需要训练期完整/多模态教师；不能使用测试患者未来检查当教师，也不能假设治疗后的不可见组织仍维持旧状态。\n\n### 可借鉴动作\n\n比较拼接、GRU、确定性补全头、记忆条件 RF，并分别消融 anchor 与 memory。控制教师数据和算力，评价缺失 ROI/模态重建、未来病灶变化及同预算直接 pCR/OS；按观测可见和不可见区域分层。**否证结果**：只改善教师相似度，未来变化或临床任务不改善。原文 RTX 4090 上 50 RF 步约 190 ms、20 步约 75 ms，训练成本未核实；这些不是医学体数据延迟。\n\n## 6. PointZero: 3D Point Track Completion for Learning Transferable 3D Dynamics\n\n作者：Bardienus P. Duisterhof, Kaifeng Zhang, Adam Hung, Bowen Wen, Stan Birchfield, Yunzhu Li, Deva Ramanan, Jeffrey Ichnowski。原文：[arXiv](https://arxiv.org/abs/2609.19142)；[HTML v1](https://arxiv.org/html/2609.19142v1)；[项目页](https://pointzero-wm.github.io)。v1：**2026-09-16 17:59:30 UTC**；无修订；预印本。官方仓库：[Duisterhof/pointzero](https://github.com/Duisterhof/pointzero)，目前只有 README 和展示图，写明 Release coming soon，**实现、权重及数据未核实发布**。已读方法与消融。\n\n### 一句话总结\n\n稀疏轨迹补全提供密集的动力学预训练监督，但临床测试时不能把真实未来病灶轨迹作为条件输入。\n\n### 中文摘要\n\n根据初始 RGB-D 点云和 1–3 条完整未来点轨迹，预测所有点的十帧轨迹；预训练数据约 290 万合成帧。Perceiver 压缩视觉特征后使用 DiT，比较直接回归、FM 的速度预测与 JiT 风格端点预测。后训练用已规划机器人末端姿态替换稀疏未来轨迹条件。\n\n### 创新点\n\n把 robot-free 轨迹补全用作通用几何动态预训练，再连接动作。Robot-free 并不表示无监督：合成器提供密集轨迹真值；端点形式也仍通过隐含速度损失训练。既有点的运动不能自然表示新病灶出现、肿瘤组织增生或消失。\n\n### 实验支持与局限\n\nTable 4 的二十条示范、无额外 actionless 视频对照，scratch **80.5→预训练 88.2**，但 Blockstack 单任务 93.5→93.2，并非普遍提高。主实验若额外使用一百条无动作视频，不能与这一干净消融混用；另一些对照还同时改变点流是否冻结。大量机器人 rollout 不等于大量独立患者证据。\n\n### 和我方向的适配\n\n**可迁移算法。** 可用训练患者的已配准病灶关键点或区域形变作为辅助标签，强化变化表征；测试只给历史、治疗和真实间隔。需要可靠对应，形变与组织增减要分开表示。\n\n### 可借鉴动作\n\n缓存低分辨率病灶 token，比较轨迹辅助、体积辅助、直接潜状态预测及无辅助的相同网络；加入轨迹打乱对照，并与同输入预算的直接 pCR/OS 比较。评价病灶变化、长期误差和跨中心临床效用。**否证结果**：收益依赖输入真实未来轨迹，或简单体积监督达到相同效果。原文每变体约 **8 H100 × 2 天，折合约 384 GPU 小时**；医学最小实验只做小头估计单 GPU，当前不建议等待之外先照搬完整预训练。\n\n## 7. Recency Forcing: Bridging the Long-Horizon Gap in Autoregressive Video Generation\n\n作者：Tri Cao, Hung Nguyen, Phong Nguyen, Khoi Nguyen。原文：[arXiv v1](https://arxiv.org/abs/2609.19729v1)。v1：**2026-09-17 05:40:53 UTC**；无修订；预印本；**未找到官方代码**。**仅阅读原站摘要与元数据；HTML 全文返回 404，未下载 PDF。**\n\n### 一句话总结\n\n对使用长历史注意力和 KV 缓存淘汰的模型，训练与推理的记忆长度差异可能是长期漂移的来源。\n\n### 中文摘要\n\n摘要提出以扰动测量位置响应，分析帧距与去噪时刻对注意力的影响，再用非正 Temporal Response Bias 降低远期帧影响，避免直接截断上下文；BAR 重参数化旨在兼容高效注意力。\n\n### 创新点\n\n可迁移的是对历史注意力进行时间相关约束，而非简单增加历史窗口。摘要主张高效且改善长期生成，但本次无法核实完整目标、超参、定量结果或零开销主张。\n\n### 和我方向的适配\n\n**可迁移算法，条件性低优先级。** 只有实际存在窗口淘汰或很长历史时才值得实验。三四次复查通常不满足这一条件；初始病灶与治疗切换点可能长期重要，不能机械按“越旧越不重要”处理。\n\n### 可借鉴动作\n\n在相同历史输入与容量下比较无偏置、截断、按真实时间间隔学习的偏置，始终保留基线与治疗节点；生成时间和临床时间分别编码。固定推理预算，比较 rollout 误差、病灶变化及同输入临床预测。**否证结果**：收益仅出现在人工长窗口而不出现在真实访视数，或遗忘关键治疗历史，则不应优先迁移。原论文算力未核实；缓存潜变量注意力消融可先单 GPU，属基于模块规模的估计。\n\n## 8. MedPCFM-TED: One-Step Point Cloud Flow Matching for Implant Generation via Teacher-Guided Endpoint Distillation\n\n作者：Kamil Kwarciak, Marek Wodzinski。原文：[arXiv](https://arxiv.org/abs/2609.16934)；[HTML v1](https://arxiv.org/html/2609.16934v1)。v1：**2026-09-15 10:10:17 UTC**；无修订；预印本；**未找到官方代码**。已读完整方法、评价协议及主结果。\n\n### 一句话总结\n\n有强条件约束的医学点云生成可以直接蒸馏到一步，但结果是否仍保留合理条件分布，需要超出平均形状质量的验证。\n\n### 中文摘要\n\n以缺损颅骨点云为条件，用多步 PCFM 教师生成植入物端点。学生预测从相同噪声到教师端点的位移，目标包含位移 MSE、学生对教师 Chamfer、学生对真实植入物 Chamfer，三项权重均为 1，不显式执行轨迹拉直。\n\n### 创新点\n\n相对先拉直再蒸馏，简化为端点监督并加入真值几何项。论文将 PSF 实现为教师 Chamfer 对照、IMLE 使用四候选最邻近监督；这些并不等于完整复现所有原方法训练流程。真值 Chamfer 还会改变纯教师分布蒸馏的目标，可能收缩多模态结果。\n\n### 实验支持与局限\n\nSkullBreak DSC 教师 **0.744→TED 0.766**，但 Chamfer **0.127→0.144** 变差；SkullFix DSC **0.824→0.801**。单次生成耗时表列 **3.195→0.0434 秒**。质量指标却用多次随机生成、共识密度聚合后评价，不能直接当单次采样质量；聚合次数和后处理总延迟还需核对。Heun 的步数/NFE 文中口径存在混用，应实测网络调用数。两数据集共 600/70/210 个训练/验证/测试样本，不能自行等同独立患者数。没有患者级不确定性校准证据。\n\n### 和我方向的适配\n\n**直接相关于医学生成，面向纵向任务需迁移。** 可以给已验证有效的 latent FM 增加一步学生。颅骨补全受当前几何强约束，治疗后的病灶变化不一定具有同等确定性。\n\n### 可借鉴动作\n\n固定教师和训练划分，比较教师多步/少步、纯教师端点 MSE、加几何真值项、同容量直接回归。分别报告单样本与固定 K 聚合，计入教师训练和蒸馏成本；检查条件模态覆盖、energy score/CRPS、病灶变化误差与同预算直接 pCR/OS。**否证结果**：加速同时降低覆盖、消除少数患者响应模式，或优势来自聚合/后处理，则不能宣称保真蒸馏。原实验 **GH200 96GB，教师 15,000 epochs、batch 16**，学生使用相同训练超参；GPU 小时未核实。\n\n## 9. Conditionally linear, matrix normal state space models\n\n作者：Drew D. Creal, Marcelo C. Medeiros, Rodrigo Sarlo。原文：[arXiv](https://arxiv.org/abs/2609.18734)；[HTML v1](https://arxiv.org/html/2609.18734v1)。v1：**2026-09-16 14:31:37 UTC**；无修订；预印本；**未找到官方代码**。已读模型假设、矩阵滤波、缺失处理和主要实证，未逐项复核全部推导。\n\n### 一句话总结\n\n对具有实体与特征两轴的纵向状态，矩阵正态模型提供结构明确的概率基线，但计算优势依赖较强协方差假设。\n\n### 中文摘要\n\n保持 `Y_t = D_t + Z_t A_t W_t^T + E_t` 的矩阵结构，构造 Kalman filter、似然、平滑及后验轨迹采样，避免朴素向量化产生的大 Kronecker 协方差。可加入混合频率、重尾与方差状态。\n\n### 创新点\n\n统一推广矩阵状态的滤波和联合轨迹抽样。闭式递推要求共享右尺度矩阵及相容的测量结构；不是任意双边变换、任意相关性的免费加速。整行缺失与零散元素缺失不同，后者在附录回到向量化条件系统做插补。\n\n### 实验支持与局限\n\n应用为美国五十州、十二经济变量，600 条观测序列压缩成 3×11 的潜因子矩阵。结果主要展示拟合、因子解释和 MCMC 混合；部分参数五万次 burn-in 后样本的有效样本数约 760。没有医学或严格前瞻预测胜过神经模型的证据。计算复杂度讨论针对朴素向量 Kalman，大幅理论比例不是实测端到端加速。\n\n### 和我方向的适配\n\n**可迁移算法。** 可用患者内“病灶/模态 × 低维特征”的状态，构造小样本概率对照；患者之间保持独立单位，不能用跨患者共同时间矩阵偷带测试信息。不规则临床间隔需要显式时间依赖转移；原文的月/季度混合频率不自动解决连续时间和信息性缺失。\n\n### 可借鉴动作\n\n在缓存特征上比较矩阵与向量 Kalman、线性趋势、GRU 和 latent FM；让转移使用同样治疗与间隔信息，并做中心留出。预测时只允许过滤，不用含未来观测的平滑状态。评价 CRPS/覆盖率、变化误差及 pCR/删失生存增量。**否证结果**：协方差约束导致系统性欠覆盖，或只有利用未来平滑后才改善。论文硬件/时长未核实；几十维最小滤波实验估计 CPU 可行，长链后验抽样需另测。\n\n## 10. Entropy Estimates from Stochastic Interpolants\n\n作者：Phillip M. Rauscher。原文：[arXiv](https://arxiv.org/abs/2609.18093)；[HTML v2](https://arxiv.org/html/2609.18093v2)。v1：**2026-09-16 03:58:52 UTC**；v2：**2026-09-17 13:40:33 UTC**。预印本，首次推荐；修订差异未单独核实。官方代码：[Rauscher-Group/eesi](https://github.com/Rauscher-Group/eesi)，论文直接链接且代码目录可访问；README 指出配套权重仓库尚未存在，不能声称权重全部可下载。已读方法、实验与实现说明。\n\n### 一句话总结\n\n用速度与 score 的内积估计分布熵差，可为潜空间生成提供低成本分布诊断，但这个标量不是患者级可信度。\n\n### 中文摘要\n\n连续性方程给出 `dH/du = -E[v dot score]`，从而避免昂贵的散度计算。若可直接采样两端分布及插值噪声，还可以用噪声回归形式减少单独学习 score 的需要，但这个版本不能直接迁移到没有目标样本的新分布。\n\n### 创新点\n\n相对 continuous normalizing flow 中基于散度的密度计算，换成对分布取期望后的内积。两者只在期望层面相等，逐条轨迹的内积积分**不能当作该样本的 log-likelihood**。原文 Eq. 8 的 score 符号与后续 Eq. 13 存在表面不一致；实现前应以高斯解析例核验约定，不能照抄符号。\n\n### 实验支持与局限\n\n覆盖四十维混合高斯、XY spins、十三粒子 Lennard-Jones 和主动聚合物。混合高斯中多数估计误差小于 0.5 nats，但依赖学习 score 的生成式估计误差约 **3.5 nats**。Lennard-Jones 的散度计算约比内积慢五十倍，这是该计算项的比较，不是整体训练提速。没有医学条件校准实验；训练集小到记忆样本时，估计也会偏移。\n\n### 和我方向的适配\n\n**可迁移算法，作为诊断优先于新主模型。** 可比较固定潜坐标与归一化下，各临床时间间隔、治疗组的生成熵。不同编码器尺度改变会改变微分熵；高熵既可能反映合理多样性，也可能是无效噪声，低熵也不自动意味着准确。\n\n### 可借鉴动作\n\n先用已知熵的条件高斯/混合分布对照散度估计，检查样本量、端点方差和符号；再在固定医学潜空间与 energy score、CRPS、覆盖率、病灶变化误差联合报告，保留直接临床预测对照。**否证结果**：熵排序主要受编码尺度影响，或熵看似合理但条件覆盖明显失败，则不能用于患者可信度判断。原文使用单 **NVIDIA RTX PRO 2000 Blackwell**；额外内积为 O(d)，但训练 score 的成本不可忽略，未核实总 GPU 小时。\n\n## 今天最值得读的一篇\n\n**Spectral-Target Physical Latent Structuring for JEPA-Style World Models。** 它把“没有塌缩”和“保留病灶相关信息”明确分开，能转化成缓存潜变量上的小型辅助头实验。最值得先检验的不是 Fourier 形式，而是简单病灶状态监督能否在同输入、容量和预算下提高患者特异变化预测，并对直接 pCR/OS 基线产生真实增量。\n\n","paperIds":["arxiv:2609.04264","arxiv:2609.20008","arxiv:2609.09757","arxiv:2609.19674","arxiv:2609.19796","arxiv:2609.19142","arxiv:2609.19729","arxiv:2609.16934","arxiv:2609.18734","arxiv:2609.18093"]},{"date":"2026-09-17","summary":"\u003cp>今天精选 \u003cstrong>7 篇：6 篇新论文、1 篇近期补充\u003c/strong>，其中 6 篇通用算法、1 篇医学应用。最值得优先检验的是：\u003cstrong>未来表征监督能否以很小的额外成本改善直接预测，以及生成模块是否还能提供额外价值\u003c/strong>。其次关注少步 Flow Matching 的训练耦合，但应同时检查条件分布与校准。医学实验证据提醒我们，域内表现较好的 JEPA 表征可能在外部队列上落后于对比学习。\u003c/p>\n","html":"\u003cp>今天精选 \u003cstrong>7 篇：6 篇新论文、1 篇近期补充\u003c/strong>，其中 6 篇通用算法、1 篇医学应用。最值得优先检验的是：\u003cstrong>未来表征监督能否以很小的额外成本改善直接预测，以及生成模块是否还能提供额外价值\u003c/strong>。其次关注少步 Flow Matching 的训练耦合，但应同时检查条件分布与校准。医学实验证据提醒我们，域内表现较好的 JEPA 表征可能在外部队列上落后于对比学习。\u003c/p>\n\u003ch2>阅读优先级\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>顺序\u003c/th>\u003cth>论文\u003c/th>\u003cth>归类与日期\u003c/th>\u003cth>阅读重点\u003c/th>\u003cth>证据\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.17728\" target=\"_blank\" rel=\"noopener noreferrer\">RAF-VLA: Representation Alignment with the Future for End-to-End Autonomous Driving\u003c/a>\u003c/td>\u003ctd>可迁移算法；新论文；9 月 15 日\u003c/td>\u003ctd>为“生成是否必要”建立更强的直接预测对照\u003c/td>\u003ctd>HTML 方法与实验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.18488\" target=\"_blank\" rel=\"noopener noreferrer\">Beyond Random Couplings: Contrastive Noise Alignment in Generative Flows\u003c/a>\u003c/td>\u003ctd>可迁移算法；新论文；9 月 16 日\u003c/td>\u003ctd>训练时调整噪声粒子，改善少步采样；检查条件先验偏移\u003c/td>\u003ctd>HTML 方法与实验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.16551\" target=\"_blank\" rel=\"noopener noreferrer\">Which Pretext Task Transfers? Self-Supervised Pretraining Objectives for Lung Ultrasound\u003c/a>\u003c/td>\u003ctd>医学应用；新论文；9 月 15 日\u003c/td>\u003ctd>MAE、JEPA、MoCo 在外部数据上的排名反转\u003c/td>\u003ctd>HTML 全文\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.17815\" target=\"_blank\" rel=\"noopener noreferrer\">Principled Koopman Representations with Kalman Inference for Efficient Time-Series Prediction\u003c/a>\u003c/td>\u003ctd>可迁移算法；新论文；9 月 15 日\u003c/td>\u003ctd>低秩动力学；区分真实观测更新与自生成伪观测\u003c/td>\u003ctd>HTML 方法与实验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.17287\" target=\"_blank\" rel=\"noopener noreferrer\">Same Flow, Different Paths: Variance Reduction in Flow Matching\u003c/a>\u003c/td>\u003ctd>可迁移算法；新论文；9 月 15 日\u003c/td>\u003ctd>保持边缘分布和速度场的路径优化；计入路径搜索成本\u003c/td>\u003ctd>HTML 方法与实验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.17372\" target=\"_blank\" rel=\"noopener noreferrer\">XPACE: Joint World and Action Modeling from Heterogeneous Experience\u003c/a>\u003c/td>\u003ctd>可迁移算法；新论文；9 月 15 日\u003c/td>\u003ctd>用自身生成的历史训练多步预测，控制额外训练预算\u003c/td>\u003ctd>HTML 方法与实验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>\u003ca href=\"https://proceedings.mlr.press/v329/rousseau26a.html\" target=\"_blank\" rel=\"noopener noreferrer\">Scaling-Score Conformal Prediction for Multi-Target Regression\u003c/a>\u003c/td>\u003ctd>可迁移算法；近期补充；8 月 30 日\u003c/td>\u003ctd>多时点输出的联合覆盖，不能混同逐时点覆盖\u003c/td>\u003ctd>仅官方摘要\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>日期口径：除第 7 篇的 PMLR 正式发表日期外，表中日期取 arXiv v1 提交记录的 UTC 日期，精确首次公告上线时间未独立核实。7 篇均为首次推荐；未发现可以据此重复推荐的已核实实质修订。未下载 PDF。\u003c/p>\n\u003ch2>1. RAF-VLA: Representation Alignment with the Future for End-to-End Autonomous Driving\u003c/h2>\n\u003cp>作者：Dogun Kim, Yongjae Lee, Joonhee Lim, Yeina Lee, Junhyeok Park, Moogeun Park, Dongsuk Kum。\u003c/p>\n\u003cp>原文：\u003ca href=\"https://arxiv.org/abs/2609.17728\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.17728\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.17728v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML 全文\u003c/a>。首次公开口径：v1 提交于 \u003cstrong>2026-09-15 18:39:00 UTC\u003c/strong>；最新版本 v1，无修订记录。状态：预印本，未核实正式接受。\u003cstrong>未找到官方代码\u003c/strong>。证据范围：已读方法、消融和主要实验，未复现。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>用训练期的未来图像特征监督当前决策表征，可以获得一部分世界模型收益；这为判断医学未来生成的增量价值提供了关键对照。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>面向自动驾驶，现有 world-modeling VLA 同时生成未来画面和动作，以未来画面提供密集监督。RAF-VLA 在 Qwen2.5-VL 7B 视觉语言专家和动作专家之间引入按未来时距组织的 world queries，用冻结 Cosmos 编码器提取真实未来帧特征，监督当前输入下的预测表征。未来帧仅用于训练监督，推理时保留 world queries，移除教师和投影监督分支。随后可做 GRPO 强化微调。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>最接近的比较是显式生成未来画面的 VLA，以及仅训练动作的相同架构。变化在于把未来监督作用在内部特征上，简化为 \u003ccode>L = L_action + lambda * mean_h ||f(I_future,h) - g(Z_h)||^2\u003c/code>。默认 \u003ccode>lambda=1\u003c/code>，采用 1 秒和 4 秒两个目标时距，每个时距 4 个 queries，并限制时距之间的注意力方向。增加更多时距或 queries 并未继续改善论文中的消融结果。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>论文 Table III 中，SFT 的 PDMS 从 \u003cstrong>87.92 到 89.13\u003c/strong>；强化微调后从 \u003cstrong>88.85 到 90.03\u003c/strong>。同一消融报告训练时间 10.56 到 10.96 小时，使用 4 张 H200，即约 42.2 到 43.8 GPU 小时，包含在线提取教师特征；单张 H200、batch 1 的推理延迟从 0.152 到 0.153 秒。\u003c/p>\n\u003cp>作者据此主张未来对齐以较小额外开销提高规划表现。我的判断是，这支持“未来特征监督值得作为便宜的强基线”，但仍未完全隔离损失的作用：\u003cstrong>去掉对齐的消融同时去掉了 world queries\u003c/strong>，参数和内部计算也有变化。主表的 94.2 使用 best-of-N，不能与约 90.0 的标准单次推理混用；跨论文方法的预训练和训练预算并不统一。道路规划成绩不能直接推出 pCR 或生存预测收益。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法，优先级最高。\u003c/strong> 可迁移的是“当前历史编码器 + 按临床时距查询 + 训练期未来教师特征”模块。治疗、截至 landmark 的历史 MRI/CT、已知临床信息和时间间隔进入预测器；真实未来影像只作为训练标签。冻结医学编码器的目标应尽可能保留病灶变化，必要时分别比较全图与病灶区域特征。\u003c/p>\n\u003cp>医学数据需要患者内配对的后续检查、明确的治疗开始与检查时间、可核查的结局和划分。驾驶的密集规则帧不能替代稀疏、不规则、因临床状态而安排的复查；治疗条件相关性也不具备随机干预的因果解释。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>最小实验只改潜状态预测器的辅助目标，先固定同一医学编码器。比较五组：直接 pCR/OS；直接预测加相同 world queries 但无对齐；当前状态特征对齐；未来状态特征对齐；未来 latent Flow Matching 辅助训练。全部使用相同预测时点输入、训练患者和未来监督可用性，控制参数规模、超参选择次数及总训练预算。教师不得接触测试患者训练信息。\u003c/p>\n\u003cp>分开报告未来病灶体积/增强变化误差、患者特异变化相对“复制最近观测”和趋势外推的改善、pCR AUROC/AUPRC/Brier，以及固定 landmark 的生存 C-index、时间依赖 Brier 和有效事件数。OS 必须处理删失并报告相应假设。患者级划分，另做中心留出；特征 MSE 降低不能替代临床价值。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：未来对齐不优于同 queries 对照，或优势在匹配预算后消失，则该辅助目标价值不足；未来对齐已匹配生成模型的下游成绩，则削弱“必须生成才能获得临床增益”的假设。算力：原论文成本见上述 Table III；医学最小实验若缓存冻结特征、小型预测器训练，估计可用单 GPU，依据是省去 3D 编码器反传，具体显存与时长需按潜变量尺寸实测。\u003c/p>\n\u003ch2>2. Beyond Random Couplings: Contrastive Noise Alignment in Generative Flows\u003c/h2>\n\u003cp>作者：Lennart Wittke, Vinicius Azevedo。\u003c/p>\n\u003cp>原文：\u003ca href=\"https://arxiv.org/abs/2609.18488\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.18488\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.18488v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML 全文\u003c/a>。v1 提交：\u003cstrong>2026-09-16 11:21:31 UTC\u003c/strong>；最新 v1，无修订记录。状态：预印本，未核实正式接受。\u003cstrong>未找到官方代码\u003c/strong>；搜索到的同名 Noise-Contrastive-Alignment 语言模型仓库属于另一篇论文，不作为本文代码。证据：已读方法、实验与实现附录。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>除了重新配对固定噪声和数据，还可以直接优化训练噪声的位置；少步生成收益值得测试，但条件先验是否仍匹配是医学迁移的首要问题。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>独立噪声耦合会形成难学的传输路径，minibatch OT 通过重分配固定噪声缓解这一问题。CNA 将一个 batch 的噪声视为可移动粒子，保持目标分配后，用对比目标把粒子向其配对数据的方向对齐，再用角度排斥和径向约束避免塌缩。优化后的噪声与目标进入常规 Flow Matching；推理仍从标准高斯采样，不运行这个内层优化。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>变化在于优化耦合的噪声端，而不只优化排列。内层目标可概括为 \u003ccode>InfoNCE(noise, target) + beta * angular_repulsion + lambda * ||noise||^2\u003c/code>。实现使用 4 步 Adam、学习率 0.02、温度 0.01，且可从 OT 配对初始化。论文给出高维、较大 batch 和较强排斥极限下保持高斯投影结构的分析；高斯性推论采用 \u003ccode>lambda=0\u003c/code>，实际离散优化却需要径向正则。\u003cstrong>这不是有限 batch 下严格保持条件标准高斯的证明。\u003c/strong>\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>在 CIFAR-10、4 NFE 下，FID 分别为独立 CFM \u003cstrong>54.39\u003c/strong>、OT-CFM \u003cstrong>30.00\u003c/strong>、CNA \u003cstrong>28.87\u003c/strong>、CNA+OT（beta=2）\u003cstrong>22.64\u003c/strong>。2 NFE 下相应为 175.91、91.75、87.39、56.40。少步表现支持进一步筛查组合方法。\u003c/p>\n\u003cp>不能沿用正文中“所有预算都优于”的宽泛说法：CIFAR-10 的 128 NFE 下，CNA+OT（beta=2）FID \u003cstrong>5.25\u003c/strong>，逊于 OT 的 \u003cstrong>4.36\u003c/strong>；调整 beta=5 后为 4.06。ImageNet32 的 4 NFE 下，单独 CNA \u003cstrong>39.93\u003c/strong> 也逊于 OT \u003cstrong>36.95\u003c/strong>，组合 beta=5 为 26.86。收益依赖耦合初始化、超参和采样预算。实验是无条件 32×32 自然图像，未提供医学条件生成、患者特异预测或临床校准证据。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可以替换 latent FM 训练中“采噪声并构造插值”这一处，先固定 VQGAN/其他编码器。患者的历史、治疗和未来目标必须保持正确配对，不能用跨患者 OT 重分配未来标签。即使总体噪声看似高斯，也要检查 \u003ccode>p(noise | history, treatment)\u003c/code>：训练噪声若携带推理时不可得的目标信息，有限样本条件模型可能学到不匹配的源分布。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>先在已知真分布的条件混合高斯任务检查概率覆盖和模态保留，再在缓存医学潜空间比较独立噪声、OT、CNA、CNA+OT。只调整噪声，不打乱患者条件与未来标签；所有方法计入噪声优化及超参搜索的总成本。采样统一评估 1/2/4/16/64 NFE，同时记录实际延迟。\u003c/p>\n\u003cp>指标包括条件噪声均值/协方差与条件依赖诊断、energy score/可适用的 CRPS、覆盖率、模态覆盖、病灶变化误差及相对复制基线的增益。图像质量单独报告；只有状态预测确有改善后，才考察同输入预算的 pCR/OS 增量。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：低 NFE 视觉指标改善却损害覆盖或病灶变化预测，收益在高 NFE 或预算匹配下消失，均不足以支持医学采用。原实验 CIFAR-10 使用单 RTX 4090，ImageNet32 使用 8 张 RTX 4090；作者报告的约 2% 内层开销仅适用于原配置。对比项存在 batch 两两计算，医学 3D 潜空间开销不能直接沿用该比例。\u003c/p>\n\u003ch2>3. Which Pretext Task Transfers? Self-Supervised Pretraining Objectives for Lung Ultrasound\u003c/h2>\n\u003cp>作者：Moein Heidari, Junbo Rao, Jai Choraria, Wenjin Chen, David J. Foran, Ilker Hacihaliloglu。\u003c/p>\n\u003cp>原文：\u003ca href=\"https://arxiv.org/abs/2609.16551\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.16551\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.16551v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML 全文\u003c/a>。v1 提交：\u003cstrong>2026-09-15 02:48:45 UTC\u003c/strong>，以原页记录为准；最新 v1，无修订记录。状态：预印本，注明 \u003cstrong>Submitted to SPIE 2027\u003c/strong>，不是已接受。官方代码：\u003ca href=\"https://github.com/moeinheidari7829/LUSVideoSSL\" target=\"_blank\" rel=\"noopener noreferrer\">LUSVideoSSL\u003c/a>。已核查 VideoMAE、V-JEPA、数据清单和 probe 相关实现文件；未找到独立 MoCo 实现目录，不能声称三种方法均已完整复现。代码未执行。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>相同骨干和预训练条件下，JEPA/MAE 在一个医学测试集的优势，并未延续到外部队列；表征目标应依据外部临床效用选择。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>论文比较三类肺超声视频自监督任务：MoCo v3 风格对比学习、VideoMAE 像素重建、V-JEPA 潜空间预测。三者从随机初始化开始，共用 ViT-S/16、16 帧输入、tubelet 2、COVID-BLUeS 预训练数据与优化日程。冻结编码器后，在 POCUS 做患者级五折 probe 训练与测试，同时在从未参与预训练或 probe 拟合的 Mendeley-Uganda 外部集评估。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>贡献主要是受控比较，而非新的目标函数：MoCo 比较同视频增强视图的 InfoNCE；VideoMAE 以 90% tube masking 做像素 MSE；V-JEPA 使用 EMA 教师、stop-gradient 与潜特征 L1。比起使用不同数据和骨干的跨论文分数比较，这个设计更能反映目标选择的影响，但相同 epoch 不保证相同 FLOPs。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>100% 标签、线性 probe 的 balanced accuracy 如下：\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方法\u003c/th>\u003cth>POCUS\u003c/th>\u003cth>外部 Mendeley-Uganda\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MoCo\u003c/td>\u003ctd>42.1 ± 1.2\u003c/td>\u003ctd>\u003cstrong>62.7 ± 1.0\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VideoMAE\u003c/td>\u003ctd>\u003cstrong>66.5 ± 13.1\u003c/strong>\u003c/td>\u003ctd>53.8 ± 2.8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>V-JEPA\u003c/td>\u003ctd>65.4 ± 11.7\u003c/td>\u003ctd>35.1 ± 4.9\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>作者将其解释为域内 probe 排名不能预测外部迁移。这个结果支持增加中心留出评估，\u003cstrong>不支持“JEPA 普遍不适合医学”\u003c/strong>：论文是单骨干、小规模、三类诊断的初步实验。外部五次评估使用同一个外部队列和五个 POCUS fold 训练的 probe，不是五个独立外部中心，也不是五次独立预训练。文中表征层面的机制分析仍属计划，尚未证实排名反转是由塌缩或某种特征选择导致。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关于医学小样本表征选择和跨中心评价，但不是肿瘤纵向生成论文。\u003c/strong> 可迁移的是固定 backbone、数据、probe 和患者划分来比较预训练目标的实验结构。超声视频帧之间的快速变化不等同于数周治疗后的病灶演化，不能把连续视频片段直接当成治疗轨迹。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>先在同一 MRI/CT 编码器上比较对比学习、遮挡重建和未来潜特征预测，固定患者训练集与验证预算。额外记录各目标的实际 FLOPs/显存/时长，设置相同总算力的次级比较。以患者为单位抽取 5%/10%/50%/100% 标签，先做冻结 probe，避免每个目标各自调一个更强的下游模型。若事件数不足，不强行在每个小标签比例上估计 OS。\u003c/p>\n\u003cp>评价中心留出的 pCR AUROC/AUPRC、Brier、校准，以及病灶变化预测；报告患者 bootstrap 区间和事件数。加入仅监督的直接预测对照。\u003cstrong>否证结果\u003c/strong>：JEPA 只在内部队列上提升而在外部队列上不优或失效，则不能据此声称生成表征具有可泛化的临床价值。\u003c/p>\n\u003cp>算力：仓库说明包含 100 epochs 预训练设置，但论文未给出可核实硬件和 GPU 小时；小骨干/降采样的初步比较估计可单 GPU，完整 3D 训练成本必须另测，不能套用超声结果。\u003c/p>\n\u003ch2>4. Principled Koopman Representations with Kalman Inference for Efficient Time-Series Prediction\u003c/h2>\n\u003cp>作者：Ruiquan Li, Yuheng Bu。原文：\u003ca href=\"https://arxiv.org/abs/2609.17815\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.17815\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.17815v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML\u003c/a>。v1：\u003cstrong>2026-09-15 20:32:25 UTC\u003c/strong>；最新 v1，无修订。状态：预印本，正式接受未核实。\u003cstrong>未找到官方代码\u003c/strong>。已读 HTML 方法与实验。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>用有明确算子目标的低秩表征加线性高斯动力学做廉价多步预测，但论文中的 Kalman 输入是自身线性外推，不能直接解释为临床新观测更新。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>K2SVD 通过 Hilbert-Schmidt 目标学习 Koopman 算子的主要奇异函数，可概括为 \u003ccode>-2 tr(T[f,g]) + tr(M_f M_g)\u003c/code>。固定基函数后，训练小型线性高斯状态模型与解码器，结合 Kalman 推断平滑多步预测。与仅把神经潜空间命名为 Koopman space 的方法相比，变化是显式低秩算子近似目标与分阶段训练。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>算子表征与预测模型分开设计，适合检查小样本中高容量非线性动力学是否必要。典型实验 rank 16，相比 rank 128 是 \u003cstrong>12.5%\u003c/strong>，不沿用摘要中笼统的“低于 10%”。Table 2 的 Electricity NRMSE 为 0.8502，对照 K2VAE 为 0.8682；Weather 则是 0.3124，逊于 K2VAE 的 0.2853。Electricity 的数据集级推理耗时为 10.144 秒，对照 84.202 秒；内存 0.438 对 1.702 GB。这不是每名患者的延迟。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可用于固定医学表征后的低秩动力学基线。主要假设包括时间齐次 Markov 动力学、适当的算子紧性和高斯残差近似；治疗改变与不规则时间间隔需要显式扩展。§4.2 的 Kalman “observations”来自模型自己的 OLS 外推，不是后来真实测得的数据。主实验主要给 NRMSE，不能据此宣称概率预测已校准。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在缓存的患者潜序列上比较 rank 16/32/64、普通线性模型、小型时间/治疗条件 MLP 与 CDE；消融 Hilbert-Schmidt 表征目标。区分完全开环、用自身伪观测滤波、实际新检查到来后更新三种协议，后者不能与完全开环混用未来信息。评价逐步病灶变化误差、误差累积、energy score/覆盖率和运行成本，再检验同输入下游增益。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：去掉 Kalman 伪观测后表现相同，或不优于相同秩的普通线性预测，都会削弱机制必要性。论文使用单 GPU、50 epochs × 每 epoch 100 batches，分为 15+35 两阶段、5 seeds，未核实 GPU 型号；医学缓存特征实验估计可以单 GPU，基于 rank 较小而非原始 3D 重建。\u003c/p>\n\u003ch2>5. Same Flow, Different Paths: Variance Reduction in Flow Matching\u003c/h2>\n\u003cp>作者：Alexander Tyurin。原文：\u003ca href=\"https://arxiv.org/abs/2609.17287\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.17287\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.17287v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML\u003c/a>。v1：\u003cstrong>2026-09-15 15:01:04 UTC\u003c/strong>；最新 v1，无修订。状态：预印本，正式接受未核实。\u003cstrong>未找到官方代码\u003c/strong>。已读 HTML 理论框架与实验附录，未逐步验证全部证明。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>同一个 Flow Matching 目标可以由不同的样本路径实现，而路径会改变梯度方差；优化路径是否划算，还要把选路径的训练成本算进去。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>论文研究保持相同边缘分布 \u003ccode>p_t\u003c/code> 和边缘速度 \u003ccode>v*_t\u003c/code> 的路径族：目标不变，随机梯度方差和 SGD 收敛速度可以改变。PathOpt 在这一约束下优化路径，用 energy distance 及核化速度差异形成可由样本估计的约束。相比简单改变插值或仅降低方差，关键是同时维持原来的分布与速度场。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>一维高斯、线性模型给出较紧的迭代复杂度分析；一般问题依赖近似约束。论文明确展示不维持约束时，降低方差也可能减慢训练。5 seeds 的 CIFAR-10 FID 从 \u003cstrong>4.809 ± 0.081 到 4.586 ± 0.111\u003c/strong>，配对差值置信区间为 [-0.393, -0.053]；CIFAR-100 为 11.445 到 10.561，SVHN 为 13.596 到 10.282。固定 VAE 的 Flowers102 潜空间实验 \u003cstrong>13.071 对 13.071，无改善\u003c/strong>，其他潜空间结果也有区间跨零。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法，但低于 CNA 的实验优先级。\u003c/strong> 可替换 latent FM 的训练路径或生成时间采样。生成时间 \u003ccode>t\u003c/code> 是噪声到样本的插值参数，不能当成真实临床时间间隔。原实验路径搜索包含最多 4 个完整预算的候选训练，再用 FID 选择；最终一次训练预算相同，不等于研究总预算相同。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>先以 2D 条件混合分布验证边缘与速度约束，再固定医学编码器和小型 FM 比较直线路径、PathOpt、按重要性重加权的时间采样。后者必须用相应密度校正避免改变训练目标。计入所有路径搜索的训练成本，同时报告梯度方差、达到固定质量的 GPU 小时、病灶变化误差和概率评分。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：梯度方差降低但总预算内质量/临床预测没有提高，或改变了目标边缘分布，则不足以采用。原图像实验报告 2 张 H100 80 GB、BF16；医学缓存潜变量试验估计可显著缩小，但现有潜空间负面结果意味着不宜直接进行昂贵 3D 扩展。\u003c/p>\n\u003ch2>6. XPACE: Joint World and Action Modeling from Heterogeneous Experience\u003c/h2>\n\u003cp>作者：Jiacheng Wei, Jerry Bai, Xiaoyu Yue, Zidong Wang, Xiaoyang Guo, Cheng Chen, Fanqi Pu, Fan Wu, Zhixu Yue, Yizhuo Li, Feng Qiu, Bo Liu, Yuying Ge, Hui Zhou, Chenyi Chen, Yixiao Ge。原文：\u003ca href=\"https://arxiv.org/abs/2609.17372\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.17372\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.17372v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML\u003c/a>。v1：\u003cstrong>2026-09-15 16:07:34 UTC\u003c/strong>；最新 v1，无修订。状态：预印本，正式接受未核实。\u003cstrong>未找到官方代码\u003c/strong>，同名无关仓库不算。已读 HTML 方法和主要实验。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>共享视频动力学并用自身生成的前缀继续训练，可以缓解 rollout 的历史偏移；医学可迁移这一训练方式，但不能把模拟恢复轨迹当成有效治疗标签。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>XPACE 将有动作标注的人类/机器人视频与无动作视频整合到共享视频骨干：有标签时联合训练动作和视频，无标签时只计算视频损失。Self-Generated Context Fine-Tuning 先以 8 步 ODE 生成前缀并 detach，再重新编码前缀，用记录中的对应后续 chunk 监督 FM。采样器不反传，保持生成前缀与原轨迹后续目标的对应。另一阶段合成偏离和恢复轨迹，经视觉相似性规则过滤后混入策略训练。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>值得迁移的是“训练中接触自身预测历史”，而非额外增加一个图像损失。193 帧长序列的 ID PSNR 从 \u003cstrong>16.94 到 17.83\u003c/strong>，OOD 从 \u003cstrong>17.74 到 18.75\u003c/strong>；但基线使用 50 步 ODE，后者 8 步且有额外微调，需区分采样步数与训练方式。3 个机器人任务、每项 20 次测试的平均成功率从 61.7% 到 86.7%。作者承认缺少相同额外优化预算的对照，不能将全部增益归因于合成数据。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 至少需要 3 个真实随访时点、已记录治疗、真实间隔，才便于验证“先预测第二次检查，再以其预测第三次”。缺动作视频可借鉴为缺标签损失掩码，但医疗中未记录治疗并不等于无治疗。机器人可执行动作与临床治疗决策的可交换性、覆盖范围、效应延迟不同；模拟恢复不能充当观测到的疗效或反事实真值。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>固定潜空间模型，比较 teacher forcing、相同额外步数的 teacher forcing、使用自身生成历史的训练。后续监督始终来自真实配对患者，不给模拟状态编造 pCR/OS 标签。评价两步以上的病灶变化、漂移、患者间差异、energy score、覆盖率，并保留复制/线性外推和同输入的直接预测对照。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：与等额外训练对照相比没有稳定改善，或通过削弱患者差异换取低 MSE，则不支持该训练方式。原文给出策略微调少于一天，但完整硬件和总算力未披露；缓存医学潜状态的小型实验估计可单 GPU，依据是不生成高分辨率视频。论文中的视觉质量改善不是临床获益证据。\u003c/p>\n\u003ch2>7. Scaling-Score Conformal Prediction for Multi-Target Regression\u003c/h2>\n\u003cp>作者：Sylvain Rousseau, Soundouss Messoudi。正式原文：\u003ca href=\"https://proceedings.mlr.press/v329/rousseau26a.html\" target=\"_blank\" rel=\"noopener noreferrer\">PMLR 329:312–342\u003c/a>；\u003ca href=\"https://arxiv.org/abs/2609.17091\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.17091\u003c/a>。\u003cstrong>首次已核实公开记录为 2026-08-30 的正式论文集出版\u003c/strong>，会议为 Fifteenth Symposium on Conformal and Probabilistic Prediction with Applications（COPA 2026）。arXiv v1 为 \u003cstrong>2026-09-15 12:23:57 UTC\u003c/strong>，最新 v1，无修订。\u003cstrong>归类为近期补充，不能把新上传 arXiv 当成新论文。未找到官方代码。\u003c/strong>\u003c/p>\n\u003cp>证据范围：已核实 PMLR 元数据和官方摘要；arXiv HTML 返回 404，未下载 PDF，未读完整算法、证明或实验表。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>从一个固定点预测器的多维残差构造联合预测区域，适合启发“整条患者轨迹的覆盖”评价，但内接矩形和逐时点区间不能自动继承联合覆盖保证。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>论文针对多目标回归提出 scaling-score conformal。根据官方摘要，方法只需各维绝对残差和一个校准集，构造外接矩形 SCO、精确集合 R_alpha、阶梯近似 SC2 及内接矩形 SCI。gamma 调节基矩形的分位水平，与目标错误率 alpha 分开。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>相对未归一化的 max aggregation 或拆分校准集的矩形方法，目标是兼顾不同输出尺度、联合覆盖和校准样本利用率。作者摘要称在 29 个数据集上维持联合覆盖，并使 SC2 的体积具有竞争力；**未核实数值、算法细节及所有定理条件，不能给出定量改善或宣称已验证保证。**摘要明确给外接 SCO 有效联合覆盖，不能推断内接 SCI 也有同样保证。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可把多个未来时间点的病灶体积或潜状态指标作为多维输出，在固定预测器之后做校准。常规 conformal 的交换性等条件需要核查，跨中心漂移、信息性复查缺失、治疗选择和删失 OS 都不能自动满足。一次患者的多时点数据应共同作为一个校准单位。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>先设定完整可观测的多时点病灶目标，用独立患者校准集，比较逐点区间加 Bonferroni、归一化 max-residual 联合区域，以及在完整方法可核验后实现的 scaling-score。gamma 只用训练/验证资料选择；固定点预测器和校准患者数，评价整条轨迹同时覆盖率、各中心覆盖、区域体积与失败患者特征。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：总体覆盖合格却在某治疗/中心严重欠覆盖，或相同联合覆盖下体积并不更小，则优势不足。只分析完整复查者得到的覆盖，不能泛化到所有患者。算力估计为缓存残差上的 CPU 校准，依据是无须重新训练生成模型；本条属于实验建议，尚未实现，完整算法仍需全文支持。\u003c/p>\n\u003ch2>今天最值得读的一篇\u003c/h2>\n\u003cp>\u003cstrong>RAF-VLA。\u003c/strong> 它能直接改善研究设计：在声称“预测未来有助于 pCR/OS”前，先检查同样未来监督是否已经能通过廉价表征辅助训练带来收益。最有价值的实验不是只比生成模型与弱监督头，而是同输入、同容量、同预算下比较直接预测、未来表征对齐与概率未来生成。\u003c/p>\n","markdown":"# 纵向医学世界模型论文雷达 | 2026-09-17\n\n今天精选 **7 篇：6 篇新论文、1 篇近期补充**，其中 6 篇通用算法、1 篇医学应用。最值得优先检验的是：**未来表征监督能否以很小的额外成本改善直接预测，以及生成模块是否还能提供额外价值**。其次关注少步 Flow Matching 的训练耦合，但应同时检查条件分布与校准。医学实验证据提醒我们，域内表现较好的 JEPA 表征可能在外部队列上落后于对比学习。\n\n## 阅读优先级\n\n| 顺序 | 论文 | 归类与日期 | 阅读重点 | 证据 |\n|---|---|---|---|---|\n| 1 | [RAF-VLA: Representation Alignment with the Future for End-to-End Autonomous Driving](https://arxiv.org/abs/2609.17728) | 可迁移算法；新论文；9 月 15 日 | 为“生成是否必要”建立更强的直接预测对照 | HTML 方法与实验 |\n| 2 | [Beyond Random Couplings: Contrastive Noise Alignment in Generative Flows](https://arxiv.org/abs/2609.18488) | 可迁移算法；新论文；9 月 16 日 | 训练时调整噪声粒子，改善少步采样；检查条件先验偏移 | HTML 方法与实验 |\n| 3 | [Which Pretext Task Transfers? Self-Supervised Pretraining Objectives for Lung Ultrasound](https://arxiv.org/abs/2609.16551) | 医学应用；新论文；9 月 15 日 | MAE、JEPA、MoCo 在外部数据上的排名反转 | HTML 全文 |\n| 4 | [Principled Koopman Representations with Kalman Inference for Efficient Time-Series Prediction](https://arxiv.org/abs/2609.17815) | 可迁移算法；新论文；9 月 15 日 | 低秩动力学；区分真实观测更新与自生成伪观测 | HTML 方法与实验 |\n| 5 | [Same Flow, Different Paths: Variance Reduction in Flow Matching](https://arxiv.org/abs/2609.17287) | 可迁移算法；新论文；9 月 15 日 | 保持边缘分布和速度场的路径优化；计入路径搜索成本 | HTML 方法与实验 |\n| 6 | [XPACE: Joint World and Action Modeling from Heterogeneous Experience](https://arxiv.org/abs/2609.17372) | 可迁移算法；新论文；9 月 15 日 | 用自身生成的历史训练多步预测，控制额外训练预算 | HTML 方法与实验 |\n| 7 | [Scaling-Score Conformal Prediction for Multi-Target Regression](https://proceedings.mlr.press/v329/rousseau26a.html) | 可迁移算法；近期补充；8 月 30 日 | 多时点输出的联合覆盖，不能混同逐时点覆盖 | 仅官方摘要 |\n\n日期口径：除第 7 篇的 PMLR 正式发表日期外，表中日期取 arXiv v1 提交记录的 UTC 日期，精确首次公告上线时间未独立核实。7 篇均为首次推荐；未发现可以据此重复推荐的已核实实质修订。未下载 PDF。\n\n## 1. RAF-VLA: Representation Alignment with the Future for End-to-End Autonomous Driving\n\n作者：Dogun Kim, Yongjae Lee, Joonhee Lim, Yeina Lee, Junhyeok Park, Moogeun Park, Dongsuk Kum。\n\n原文：[arXiv:2609.17728](https://arxiv.org/abs/2609.17728)；[HTML 全文](https://arxiv.org/html/2609.17728v1)。首次公开口径：v1 提交于 **2026-09-15 18:39:00 UTC**；最新版本 v1，无修订记录。状态：预印本，未核实正式接受。**未找到官方代码**。证据范围：已读方法、消融和主要实验，未复现。\n\n### 一句话总结\n\n用训练期的未来图像特征监督当前决策表征，可以获得一部分世界模型收益；这为判断医学未来生成的增量价值提供了关键对照。\n\n### 中文摘要\n\n面向自动驾驶，现有 world-modeling VLA 同时生成未来画面和动作，以未来画面提供密集监督。RAF-VLA 在 Qwen2.5-VL 7B 视觉语言专家和动作专家之间引入按未来时距组织的 world queries，用冻结 Cosmos 编码器提取真实未来帧特征，监督当前输入下的预测表征。未来帧仅用于训练监督，推理时保留 world queries，移除教师和投影监督分支。随后可做 GRPO 强化微调。\n\n### 创新点\n\n最接近的比较是显式生成未来画面的 VLA，以及仅训练动作的相同架构。变化在于把未来监督作用在内部特征上，简化为 `L = L_action + lambda * mean_h ||f(I_future,h) - g(Z_h)||^2`。默认 `lambda=1`，采用 1 秒和 4 秒两个目标时距，每个时距 4 个 queries，并限制时距之间的注意力方向。增加更多时距或 queries 并未继续改善论文中的消融结果。\n\n### 实验支持与局限\n\n论文 Table III 中，SFT 的 PDMS 从 **87.92 到 89.13**；强化微调后从 **88.85 到 90.03**。同一消融报告训练时间 10.56 到 10.96 小时，使用 4 张 H200，即约 42.2 到 43.8 GPU 小时，包含在线提取教师特征；单张 H200、batch 1 的推理延迟从 0.152 到 0.153 秒。\n\n作者据此主张未来对齐以较小额外开销提高规划表现。我的判断是，这支持“未来特征监督值得作为便宜的强基线”，但仍未完全隔离损失的作用：**去掉对齐的消融同时去掉了 world queries**，参数和内部计算也有变化。主表的 94.2 使用 best-of-N，不能与约 90.0 的标准单次推理混用；跨论文方法的预训练和训练预算并不统一。道路规划成绩不能直接推出 pCR 或生存预测收益。\n\n### 和我方向的适配\n\n**可迁移算法，优先级最高。** 可迁移的是“当前历史编码器 + 按临床时距查询 + 训练期未来教师特征”模块。治疗、截至 landmark 的历史 MRI/CT、已知临床信息和时间间隔进入预测器；真实未来影像只作为训练标签。冻结医学编码器的目标应尽可能保留病灶变化，必要时分别比较全图与病灶区域特征。\n\n医学数据需要患者内配对的后续检查、明确的治疗开始与检查时间、可核查的结局和划分。驾驶的密集规则帧不能替代稀疏、不规则、因临床状态而安排的复查；治疗条件相关性也不具备随机干预的因果解释。\n\n### 可借鉴动作\n\n最小实验只改潜状态预测器的辅助目标，先固定同一医学编码器。比较五组：直接 pCR/OS；直接预测加相同 world queries 但无对齐；当前状态特征对齐；未来状态特征对齐；未来 latent Flow Matching 辅助训练。全部使用相同预测时点输入、训练患者和未来监督可用性，控制参数规模、超参选择次数及总训练预算。教师不得接触测试患者训练信息。\n\n分开报告未来病灶体积/增强变化误差、患者特异变化相对“复制最近观测”和趋势外推的改善、pCR AUROC/AUPRC/Brier，以及固定 landmark 的生存 C-index、时间依赖 Brier 和有效事件数。OS 必须处理删失并报告相应假设。患者级划分，另做中心留出；特征 MSE 降低不能替代临床价值。\n\n**否证结果**：未来对齐不优于同 queries 对照，或优势在匹配预算后消失，则该辅助目标价值不足；未来对齐已匹配生成模型的下游成绩，则削弱“必须生成才能获得临床增益”的假设。算力：原论文成本见上述 Table III；医学最小实验若缓存冻结特征、小型预测器训练，估计可用单 GPU，依据是省去 3D 编码器反传，具体显存与时长需按潜变量尺寸实测。\n\n## 2. Beyond Random Couplings: Contrastive Noise Alignment in Generative Flows\n\n作者：Lennart Wittke, Vinicius Azevedo。\n\n原文：[arXiv:2609.18488](https://arxiv.org/abs/2609.18488)；[HTML 全文](https://arxiv.org/html/2609.18488v1)。v1 提交：**2026-09-16 11:21:31 UTC**；最新 v1，无修订记录。状态：预印本，未核实正式接受。**未找到官方代码**；搜索到的同名 Noise-Contrastive-Alignment 语言模型仓库属于另一篇论文，不作为本文代码。证据：已读方法、实验与实现附录。\n\n### 一句话总结\n\n除了重新配对固定噪声和数据，还可以直接优化训练噪声的位置；少步生成收益值得测试，但条件先验是否仍匹配是医学迁移的首要问题。\n\n### 中文摘要\n\n独立噪声耦合会形成难学的传输路径，minibatch OT 通过重分配固定噪声缓解这一问题。CNA 将一个 batch 的噪声视为可移动粒子，保持目标分配后，用对比目标把粒子向其配对数据的方向对齐，再用角度排斥和径向约束避免塌缩。优化后的噪声与目标进入常规 Flow Matching；推理仍从标准高斯采样，不运行这个内层优化。\n\n### 创新点\n\n变化在于优化耦合的噪声端，而不只优化排列。内层目标可概括为 `InfoNCE(noise, target) + beta * angular_repulsion + lambda * ||noise||^2`。实现使用 4 步 Adam、学习率 0.02、温度 0.01，且可从 OT 配对初始化。论文给出高维、较大 batch 和较强排斥极限下保持高斯投影结构的分析；高斯性推论采用 `lambda=0`，实际离散优化却需要径向正则。**这不是有限 batch 下严格保持条件标准高斯的证明。**\n\n### 实验支持与局限\n\n在 CIFAR-10、4 NFE 下，FID 分别为独立 CFM **54.39**、OT-CFM **30.00**、CNA **28.87**、CNA+OT（beta=2）**22.64**。2 NFE 下相应为 175.91、91.75、87.39、56.40。少步表现支持进一步筛查组合方法。\n\n不能沿用正文中“所有预算都优于”的宽泛说法：CIFAR-10 的 128 NFE 下，CNA+OT（beta=2）FID **5.25**，逊于 OT 的 **4.36**；调整 beta=5 后为 4.06。ImageNet32 的 4 NFE 下，单独 CNA **39.93** 也逊于 OT **36.95**，组合 beta=5 为 26.86。收益依赖耦合初始化、超参和采样预算。实验是无条件 32×32 自然图像，未提供医学条件生成、患者特异预测或临床校准证据。\n\n### 和我方向的适配\n\n**可迁移算法。** 可以替换 latent FM 训练中“采噪声并构造插值”这一处，先固定 VQGAN/其他编码器。患者的历史、治疗和未来目标必须保持正确配对，不能用跨患者 OT 重分配未来标签。即使总体噪声看似高斯，也要检查 `p(noise | history, treatment)`：训练噪声若携带推理时不可得的目标信息，有限样本条件模型可能学到不匹配的源分布。\n\n### 可借鉴动作\n\n先在已知真分布的条件混合高斯任务检查概率覆盖和模态保留，再在缓存医学潜空间比较独立噪声、OT、CNA、CNA+OT。只调整噪声，不打乱患者条件与未来标签；所有方法计入噪声优化及超参搜索的总成本。采样统一评估 1/2/4/16/64 NFE，同时记录实际延迟。\n\n指标包括条件噪声均值/协方差与条件依赖诊断、energy score/可适用的 CRPS、覆盖率、模态覆盖、病灶变化误差及相对复制基线的增益。图像质量单独报告；只有状态预测确有改善后，才考察同输入预算的 pCR/OS 增量。\n\n**否证结果**：低 NFE 视觉指标改善却损害覆盖或病灶变化预测，收益在高 NFE 或预算匹配下消失，均不足以支持医学采用。原实验 CIFAR-10 使用单 RTX 4090，ImageNet32 使用 8 张 RTX 4090；作者报告的约 2% 内层开销仅适用于原配置。对比项存在 batch 两两计算，医学 3D 潜空间开销不能直接沿用该比例。\n\n## 3. Which Pretext Task Transfers? Self-Supervised Pretraining Objectives for Lung Ultrasound\n\n作者：Moein Heidari, Junbo Rao, Jai Choraria, Wenjin Chen, David J. Foran, Ilker Hacihaliloglu。\n\n原文：[arXiv:2609.16551](https://arxiv.org/abs/2609.16551)；[HTML 全文](https://arxiv.org/html/2609.16551v1)。v1 提交：**2026-09-15 02:48:45 UTC**，以原页记录为准；最新 v1，无修订记录。状态：预印本，注明 **Submitted to SPIE 2027**，不是已接受。官方代码：[LUSVideoSSL](https://github.com/moeinheidari7829/LUSVideoSSL)。已核查 VideoMAE、V-JEPA、数据清单和 probe 相关实现文件；未找到独立 MoCo 实现目录，不能声称三种方法均已完整复现。代码未执行。\n\n### 一句话总结\n\n相同骨干和预训练条件下，JEPA/MAE 在一个医学测试集的优势，并未延续到外部队列；表征目标应依据外部临床效用选择。\n\n### 中文摘要\n\n论文比较三类肺超声视频自监督任务：MoCo v3 风格对比学习、VideoMAE 像素重建、V-JEPA 潜空间预测。三者从随机初始化开始，共用 ViT-S/16、16 帧输入、tubelet 2、COVID-BLUeS 预训练数据与优化日程。冻结编码器后，在 POCUS 做患者级五折 probe 训练与测试，同时在从未参与预训练或 probe 拟合的 Mendeley-Uganda 外部集评估。\n\n### 创新点\n\n贡献主要是受控比较，而非新的目标函数：MoCo 比较同视频增强视图的 InfoNCE；VideoMAE 以 90% tube masking 做像素 MSE；V-JEPA 使用 EMA 教师、stop-gradient 与潜特征 L1。比起使用不同数据和骨干的跨论文分数比较，这个设计更能反映目标选择的影响，但相同 epoch 不保证相同 FLOPs。\n\n### 实验支持与局限\n\n100% 标签、线性 probe 的 balanced accuracy 如下：\n\n| 方法 | POCUS | 外部 Mendeley-Uganda |\n|---|---:|---:|\n| MoCo | 42.1 ± 1.2 | **62.7 ± 1.0** |\n| VideoMAE | **66.5 ± 13.1** | 53.8 ± 2.8 |\n| V-JEPA | 65.4 ± 11.7 | 35.1 ± 4.9 |\n\n作者将其解释为域内 probe 排名不能预测外部迁移。这个结果支持增加中心留出评估，**不支持“JEPA 普遍不适合医学”**：论文是单骨干、小规模、三类诊断的初步实验。外部五次评估使用同一个外部队列和五个 POCUS fold 训练的 probe，不是五个独立外部中心，也不是五次独立预训练。文中表征层面的机制分析仍属计划，尚未证实排名反转是由塌缩或某种特征选择导致。\n\n### 和我方向的适配\n\n**直接相关于医学小样本表征选择和跨中心评价，但不是肿瘤纵向生成论文。** 可迁移的是固定 backbone、数据、probe 和患者划分来比较预训练目标的实验结构。超声视频帧之间的快速变化不等同于数周治疗后的病灶演化，不能把连续视频片段直接当成治疗轨迹。\n\n### 可借鉴动作\n\n先在同一 MRI/CT 编码器上比较对比学习、遮挡重建和未来潜特征预测，固定患者训练集与验证预算。额外记录各目标的实际 FLOPs/显存/时长，设置相同总算力的次级比较。以患者为单位抽取 5%/10%/50%/100% 标签，先做冻结 probe，避免每个目标各自调一个更强的下游模型。若事件数不足，不强行在每个小标签比例上估计 OS。\n\n评价中心留出的 pCR AUROC/AUPRC、Brier、校准，以及病灶变化预测；报告患者 bootstrap 区间和事件数。加入仅监督的直接预测对照。**否证结果**：JEPA 只在内部队列上提升而在外部队列上不优或失效，则不能据此声称生成表征具有可泛化的临床价值。\n\n算力：仓库说明包含 100 epochs 预训练设置，但论文未给出可核实硬件和 GPU 小时；小骨干/降采样的初步比较估计可单 GPU，完整 3D 训练成本必须另测，不能套用超声结果。\n\n## 4. Principled Koopman Representations with Kalman Inference for Efficient Time-Series Prediction\n\n作者：Ruiquan Li, Yuheng Bu。原文：[arXiv:2609.17815](https://arxiv.org/abs/2609.17815)；[HTML](https://arxiv.org/html/2609.17815v1)。v1：**2026-09-15 20:32:25 UTC**；最新 v1，无修订。状态：预印本，正式接受未核实。**未找到官方代码**。已读 HTML 方法与实验。\n\n### 一句话总结\n\n用有明确算子目标的低秩表征加线性高斯动力学做廉价多步预测，但论文中的 Kalman 输入是自身线性外推，不能直接解释为临床新观测更新。\n\n### 中文摘要\n\nK2SVD 通过 Hilbert-Schmidt 目标学习 Koopman 算子的主要奇异函数，可概括为 `-2 tr(T[f,g]) + tr(M_f M_g)`。固定基函数后，训练小型线性高斯状态模型与解码器，结合 Kalman 推断平滑多步预测。与仅把神经潜空间命名为 Koopman space 的方法相比，变化是显式低秩算子近似目标与分阶段训练。\n\n### 创新点\n\n算子表征与预测模型分开设计，适合检查小样本中高容量非线性动力学是否必要。典型实验 rank 16，相比 rank 128 是 **12.5%**，不沿用摘要中笼统的“低于 10%”。Table 2 的 Electricity NRMSE 为 0.8502，对照 K2VAE 为 0.8682；Weather 则是 0.3124，逊于 K2VAE 的 0.2853。Electricity 的数据集级推理耗时为 10.144 秒，对照 84.202 秒；内存 0.438 对 1.702 GB。这不是每名患者的延迟。\n\n### 和我方向的适配\n\n**可迁移算法。** 可用于固定医学表征后的低秩动力学基线。主要假设包括时间齐次 Markov 动力学、适当的算子紧性和高斯残差近似；治疗改变与不规则时间间隔需要显式扩展。§4.2 的 Kalman “observations”来自模型自己的 OLS 外推，不是后来真实测得的数据。主实验主要给 NRMSE，不能据此宣称概率预测已校准。\n\n### 可借鉴动作\n\n在缓存的患者潜序列上比较 rank 16/32/64、普通线性模型、小型时间/治疗条件 MLP 与 CDE；消融 Hilbert-Schmidt 表征目标。区分完全开环、用自身伪观测滤波、实际新检查到来后更新三种协议，后者不能与完全开环混用未来信息。评价逐步病灶变化误差、误差累积、energy score/覆盖率和运行成本，再检验同输入下游增益。\n\n**否证结果**：去掉 Kalman 伪观测后表现相同，或不优于相同秩的普通线性预测，都会削弱机制必要性。论文使用单 GPU、50 epochs × 每 epoch 100 batches，分为 15+35 两阶段、5 seeds，未核实 GPU 型号；医学缓存特征实验估计可以单 GPU，基于 rank 较小而非原始 3D 重建。\n\n## 5. Same Flow, Different Paths: Variance Reduction in Flow Matching\n\n作者：Alexander Tyurin。原文：[arXiv:2609.17287](https://arxiv.org/abs/2609.17287)；[HTML](https://arxiv.org/html/2609.17287v1)。v1：**2026-09-15 15:01:04 UTC**；最新 v1，无修订。状态：预印本，正式接受未核实。**未找到官方代码**。已读 HTML 理论框架与实验附录，未逐步验证全部证明。\n\n### 一句话总结\n\n同一个 Flow Matching 目标可以由不同的样本路径实现，而路径会改变梯度方差；优化路径是否划算，还要把选路径的训练成本算进去。\n\n### 中文摘要\n\n论文研究保持相同边缘分布 `p_t` 和边缘速度 `v*_t` 的路径族：目标不变，随机梯度方差和 SGD 收敛速度可以改变。PathOpt 在这一约束下优化路径，用 energy distance 及核化速度差异形成可由样本估计的约束。相比简单改变插值或仅降低方差，关键是同时维持原来的分布与速度场。\n\n### 创新点\n\n一维高斯、线性模型给出较紧的迭代复杂度分析；一般问题依赖近似约束。论文明确展示不维持约束时，降低方差也可能减慢训练。5 seeds 的 CIFAR-10 FID 从 **4.809 ± 0.081 到 4.586 ± 0.111**，配对差值置信区间为 [-0.393, -0.053]；CIFAR-100 为 11.445 到 10.561，SVHN 为 13.596 到 10.282。固定 VAE 的 Flowers102 潜空间实验 **13.071 对 13.071，无改善**，其他潜空间结果也有区间跨零。\n\n### 和我方向的适配\n\n**可迁移算法，但低于 CNA 的实验优先级。** 可替换 latent FM 的训练路径或生成时间采样。生成时间 `t` 是噪声到样本的插值参数，不能当成真实临床时间间隔。原实验路径搜索包含最多 4 个完整预算的候选训练，再用 FID 选择；最终一次训练预算相同，不等于研究总预算相同。\n\n### 可借鉴动作\n\n先以 2D 条件混合分布验证边缘与速度约束，再固定医学编码器和小型 FM 比较直线路径、PathOpt、按重要性重加权的时间采样。后者必须用相应密度校正避免改变训练目标。计入所有路径搜索的训练成本，同时报告梯度方差、达到固定质量的 GPU 小时、病灶变化误差和概率评分。\n\n**否证结果**：梯度方差降低但总预算内质量/临床预测没有提高，或改变了目标边缘分布，则不足以采用。原图像实验报告 2 张 H100 80 GB、BF16；医学缓存潜变量试验估计可显著缩小，但现有潜空间负面结果意味着不宜直接进行昂贵 3D 扩展。\n\n## 6. XPACE: Joint World and Action Modeling from Heterogeneous Experience\n\n作者：Jiacheng Wei, Jerry Bai, Xiaoyu Yue, Zidong Wang, Xiaoyang Guo, Cheng Chen, Fanqi Pu, Fan Wu, Zhixu Yue, Yizhuo Li, Feng Qiu, Bo Liu, Yuying Ge, Hui Zhou, Chenyi Chen, Yixiao Ge。原文：[arXiv:2609.17372](https://arxiv.org/abs/2609.17372)；[HTML](https://arxiv.org/html/2609.17372v1)。v1：**2026-09-15 16:07:34 UTC**；最新 v1，无修订。状态：预印本，正式接受未核实。**未找到官方代码**，同名无关仓库不算。已读 HTML 方法和主要实验。\n\n### 一句话总结\n\n共享视频动力学并用自身生成的前缀继续训练，可以缓解 rollout 的历史偏移；医学可迁移这一训练方式，但不能把模拟恢复轨迹当成有效治疗标签。\n\n### 中文摘要\n\nXPACE 将有动作标注的人类/机器人视频与无动作视频整合到共享视频骨干：有标签时联合训练动作和视频，无标签时只计算视频损失。Self-Generated Context Fine-Tuning 先以 8 步 ODE 生成前缀并 detach，再重新编码前缀，用记录中的对应后续 chunk 监督 FM。采样器不反传，保持生成前缀与原轨迹后续目标的对应。另一阶段合成偏离和恢复轨迹，经视觉相似性规则过滤后混入策略训练。\n\n### 创新点\n\n值得迁移的是“训练中接触自身预测历史”，而非额外增加一个图像损失。193 帧长序列的 ID PSNR 从 **16.94 到 17.83**，OOD 从 **17.74 到 18.75**；但基线使用 50 步 ODE，后者 8 步且有额外微调，需区分采样步数与训练方式。3 个机器人任务、每项 20 次测试的平均成功率从 61.7% 到 86.7%。作者承认缺少相同额外优化预算的对照，不能将全部增益归因于合成数据。\n\n### 和我方向的适配\n\n**可迁移算法。** 至少需要 3 个真实随访时点、已记录治疗、真实间隔，才便于验证“先预测第二次检查，再以其预测第三次”。缺动作视频可借鉴为缺标签损失掩码，但医疗中未记录治疗并不等于无治疗。机器人可执行动作与临床治疗决策的可交换性、覆盖范围、效应延迟不同；模拟恢复不能充当观测到的疗效或反事实真值。\n\n### 可借鉴动作\n\n固定潜空间模型，比较 teacher forcing、相同额外步数的 teacher forcing、使用自身生成历史的训练。后续监督始终来自真实配对患者，不给模拟状态编造 pCR/OS 标签。评价两步以上的病灶变化、漂移、患者间差异、energy score、覆盖率，并保留复制/线性外推和同输入的直接预测对照。\n\n**否证结果**：与等额外训练对照相比没有稳定改善，或通过削弱患者差异换取低 MSE，则不支持该训练方式。原文给出策略微调少于一天，但完整硬件和总算力未披露；缓存医学潜状态的小型实验估计可单 GPU，依据是不生成高分辨率视频。论文中的视觉质量改善不是临床获益证据。\n\n## 7. Scaling-Score Conformal Prediction for Multi-Target Regression\n\n作者：Sylvain Rousseau, Soundouss Messoudi。正式原文：[PMLR 329:312–342](https://proceedings.mlr.press/v329/rousseau26a.html)；[arXiv:2609.17091](https://arxiv.org/abs/2609.17091)。**首次已核实公开记录为 2026-08-30 的正式论文集出版**，会议为 Fifteenth Symposium on Conformal and Probabilistic Prediction with Applications（COPA 2026）。arXiv v1 为 **2026-09-15 12:23:57 UTC**，最新 v1，无修订。**归类为近期补充，不能把新上传 arXiv 当成新论文。未找到官方代码。**\n\n证据范围：已核实 PMLR 元数据和官方摘要；arXiv HTML 返回 404，未下载 PDF，未读完整算法、证明或实验表。\n\n### 一句话总结\n\n从一个固定点预测器的多维残差构造联合预测区域，适合启发“整条患者轨迹的覆盖”评价，但内接矩形和逐时点区间不能自动继承联合覆盖保证。\n\n### 中文摘要\n\n论文针对多目标回归提出 scaling-score conformal。根据官方摘要，方法只需各维绝对残差和一个校准集，构造外接矩形 SCO、精确集合 R_alpha、阶梯近似 SC2 及内接矩形 SCI。gamma 调节基矩形的分位水平，与目标错误率 alpha 分开。\n\n### 创新点\n\n相对未归一化的 max aggregation 或拆分校准集的矩形方法，目标是兼顾不同输出尺度、联合覆盖和校准样本利用率。作者摘要称在 29 个数据集上维持联合覆盖，并使 SC2 的体积具有竞争力；**未核实数值、算法细节及所有定理条件，不能给出定量改善或宣称已验证保证。**摘要明确给外接 SCO 有效联合覆盖，不能推断内接 SCI 也有同样保证。\n\n### 和我方向的适配\n\n**可迁移算法。** 可把多个未来时间点的病灶体积或潜状态指标作为多维输出，在固定预测器之后做校准。常规 conformal 的交换性等条件需要核查，跨中心漂移、信息性复查缺失、治疗选择和删失 OS 都不能自动满足。一次患者的多时点数据应共同作为一个校准单位。\n\n### 可借鉴动作\n\n先设定完整可观测的多时点病灶目标，用独立患者校准集，比较逐点区间加 Bonferroni、归一化 max-residual 联合区域，以及在完整方法可核验后实现的 scaling-score。gamma 只用训练/验证资料选择；固定点预测器和校准患者数，评价整条轨迹同时覆盖率、各中心覆盖、区域体积与失败患者特征。\n\n**否证结果**：总体覆盖合格却在某治疗/中心严重欠覆盖，或相同联合覆盖下体积并不更小，则优势不足。只分析完整复查者得到的覆盖，不能泛化到所有患者。算力估计为缓存残差上的 CPU 校准，依据是无须重新训练生成模型；本条属于实验建议，尚未实现，完整算法仍需全文支持。\n\n## 今天最值得读的一篇\n\n**RAF-VLA。** 它能直接改善研究设计：在声称“预测未来有助于 pCR/OS”前，先检查同样未来监督是否已经能通过廉价表征辅助训练带来收益。最有价值的实验不是只比生成模型与弱监督头，而是同输入、同容量、同预算下比较直接预测、未来表征对齐与概率未来生成。\n\n","paperIds":["arxiv:2609.17728","arxiv:2609.18488","arxiv:2609.16551","arxiv:2609.17815","arxiv:2609.17287","arxiv:2609.17372","arxiv:2609.17091"]},{"date":"2026-09-16","summary":"\u003cp>今天精选 \u003cstrong>7 篇：5 篇通用算法、2 篇医学状态建模研究\u003c/strong>，均为增量窗口内首次公开、首次推荐的论文。本期最值得读的是 \u003cstrong>Reverse Spatio-Temporal Disease Progression Modelling\u003c/strong>：其配准后的主实验推翻了摘要容易造成的乐观印象，直接提醒我们先测清影像对齐与编码器重建误差，再判断模型是否学到了疾病变化。ACT-LAM 和 AsyncCouple-Flow 分别提供条件使用诊断、异步多模态联合轨迹生成的可验证改动。\u003c/p>\n","html":"\u003cp>今天精选 \u003cstrong>7 篇：5 篇通用算法、2 篇医学状态建模研究\u003c/strong>，均为增量窗口内首次公开、首次推荐的论文。本期最值得读的是 \u003cstrong>Reverse Spatio-Temporal Disease Progression Modelling\u003c/strong>：其配准后的主实验推翻了摘要容易造成的乐观印象，直接提醒我们先测清影像对齐与编码器重建误差，再判断模型是否学到了疾病变化。ACT-LAM 和 AsyncCouple-Flow 分别提供条件使用诊断、异步多模态联合轨迹生成的可验证改动。\u003c/p>\n\u003ch2>阅读总览\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>顺序\u003c/th>\u003cth>论文\u003c/th>\u003cth>类型 / v1 日期（UTC）\u003c/th>\u003cth>阅读理由\u003c/th>\u003cth>证据与代码\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.14590\" target=\"_blank\" rel=\"noopener noreferrer\">Reverse Spatio-Temporal Disease Progression Modelling\u003c/a>\u003c/td>\u003ctd>医学应用；新论文；09-13\u003c/td>\u003ctd>配准、复制基线与 VQ 重建误差怎样改变疾病轨迹结论\u003c/td>\u003ctd>全文方法与实验；未找到官方代码\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.15189\" target=\"_blank\" rel=\"noopener noreferrer\">Reconstructing Is Not Acting: Action-Centric Latent Dynamics Modeling\u003c/a>\u003c/td>\u003ctd>通用算法；新论文；09-14\u003c/td>\u003ctd>检验生成器是否真正使用条件，分开评价表征与重建\u003c/td>\u003ctd>全文方法与实验；官方仓库目前仅 README / LICENSE\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.16573\" target=\"_blank\" rel=\"noopener noreferrer\">AsyncCouple-Flow: Asynchronous Cross-Modal Coupling and Flow Matching for Spatio-Temporal Forecasting\u003c/a>\u003c/td>\u003ctd>通用算法；新论文；09-15\u003c/td>\u003ctd>不规则时间、缺失模态、整段未来联合生成\u003c/td>\u003ctd>全文方法与实验；未找到官方代码\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.16317\" target=\"_blank\" rel=\"noopener noreferrer\">Generative models for simulation based filtering: Formulations and Empirical Comparisons\u003c/a>\u003c/td>\u003ctd>通用算法；新论文；09-14\u003c/td>\u003ctd>新观测到达后如何校正患者潜状态分布\u003c/td>\u003ctd>全文方法与实验；官方仓库有实现，未运行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.16621\" target=\"_blank\" rel=\"noopener noreferrer\">Stable by Construction: Variational Latent Markov Operators for Long-Horizon PDE Prediction\u003c/a>\u003c/td>\u003ctd>通用算法；新论文；09-15\u003c/td>\u003ctd>用结构化潜变量扰动与分布对齐控制 rollout 误差\u003c/td>\u003ctd>全文主要方法与实验；未找到官方代码\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.14531\" target=\"_blank\" rel=\"noopener noreferrer\">Multi-source conformal prediction: leveraging heterogeneity via localization\u003c/a>\u003c/td>\u003ctd>通用算法；新论文；09-13\u003c/td>\u003ctd>跨中心预测区间及其适用假设\u003c/td>\u003ctd>全文算法、假设与实验；未找到官方代码\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>\u003ca href=\"https://arxiv.org/abs/2609.14709\" target=\"_blank\" rel=\"noopener noreferrer\">An immune world model for multiscale forecasting and therapeutic hypothesis generation\u003c/a>\u003c/td>\u003ctd>医学应用；新论文；09-13\u003c/td>\u003ctd>治疗与患者状态分离、变化量评价、锁定外部检验\u003c/td>\u003ctd>全文方法与实验；代码仍为待发布声明\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>7 篇当前均为 v1，未发现后续修订。日期采用 arXiv Submission history 的首次提交时间作为首次公开版本日期代理；精确公告上线时间未独立核实。今天没有以旧版本更新冒充新论文，也未重复推荐此前 8 篇。下文“全文”表示阅读了可访问 HTML 中的方法、结果和相应限制，不表示独立复现实验或逐条证明了理论。\u003c/p>\n\u003ch2>1. Reverse Spatio-Temporal Disease Progression Modelling\u003c/h2>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>冻结 VQ-GAN 后用逆向 Neural ODE 预测过去 MRI，但配准后的 ADNI 结果没有证明疾病特异的逆向轨迹；最有价值的是重建误差、配准和复制基线的诊断设计。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Ulugbek Shernazarov、Moucheng Xu、Inomjon Ramatov。v1：2026-09-13 15:17:59 UTC；无修订。\u003ca href=\"https://arxiv.org/abs/2609.14590\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.14590v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。当前可核实载体为预印本；作者在 arXiv 注明获 SASHIMI 2026（MICCAI workshop）接受，正式论文集记录本次未独立核实。\u003cstrong>未找到官方代码\u003c/strong>，不能将其引用的其他进展模型仓库当成实现。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>任务是根据晚期观测重建未观测的早期影像。先训练并冻结 3D VQ-GAN，逆序 ConvGRU 汇总晚期 latent，再用 \u003ccode>dz/dt = f_theta(z,t)\u003c/code> 向较早时刻积分；残差头相对已观测 anchor 累加变化。它改变的是纵向推断方向和残差时间模型，没有加入治疗效应识别或随机轨迹校准。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>相较向前进展生成，方法明确设置“缺失患者自身早期基线”的任务。损失为 \u003ccode>L = 0.2 L_direct + L_inter\u003c/code>，分别约束直接 latent 误差与帧间变化；真实连续时间与整数序列下标分开。方法强调 anchor 必须是已观测帧，不能偷偷取被遮蔽的最早帧。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>最关键的是全文 §5.2 / Table 1：配准至 1 mm 的 ADNI 测试为 \u003cstrong>25 名受试者\u003c/strong>。模型 MSE \u003cstrong>0.00238\u003c/strong>，VQ copy-nearest \u003cstrong>0.00168\u003c/strong>，原始像素 copy-nearest \u003cstrong>0.00088\u003c/strong>；模型 SSIM \u003cstrong>0.574\u003c/strong> 高于 VQ copy 的 \u003cstrong>0.454\u003c/strong>，但远低于原始像素 copy 的 \u003cstrong>0.957\u003c/strong>。仅做目标影像 encode-decode 的 MSE 已达 \u003cstrong>0.00131\u003c/strong>，说明编码器误差本身已大于复制基线误差。\u003c/p>\n\u003cp>变化幅度比 \u003ccode>Dyn\u003c/code> 为 \u003cstrong>1.29 ± 0.23\u003c/strong>，说明不是静态复制，却存在变化过冲；不同诊断分层的 \u003ccode>Rev\u003c/code> 均为负，整体为 \u003cstrong>-1.88\u003c/strong>。未配准 64³ 数据上的正面结果，作者在正文中明确解释为主要受到位姿和视野错配影响。因此，\u003cstrong>摘要中“所有分层为正”的表述不能代表配准后的主实验\u003c/strong>。合成数据能恢复非单调变化，不等于真实 MRI 已捕捉疾病机制。\u003c/p>\n\u003cp>另有两点待复现时核对：文中“382 T1 MRI”、至少五次就诊、80/10/10 划分和 25 名测试受试者的计数口径并不充分清楚；配准使用患者最早 baseline 为参考，实际逆向部署若该 baseline 不可得，预处理必须改为只依赖已观测 anchor。这是部署可用性问题，不能直接断言已发生模型输入泄漏。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关。\u003c/strong> VQ 潜空间、连续时间、残差预测与双向学习都贴近纵向影像路线。最值得迁移的是“先量化可观测疾病变化是否高于编码器误差”的评估。肿瘤治疗可能导致非单调反应、坏死、复发；“更早就是更健康”不适用，也不能将向后积分解释为撤除治疗的因果反事实。原文无 pCR、OS 或治疗条件实验。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>**改动位置：**先在现有冻结编码器的评估管线加入重建误差诊断，再试一个小型时间残差头。正向与反向各自只使用预测时可获得的 anchor 和预处理信息。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**对照：**原始像素复制、encode-decode 后复制、目标影像 encode-decode（仅诊断重建误差，不是可部署预测器）、线性趋势、同输入/参数量/训练预算的直接残差模型。固定患者划分，单独报告配准前后结果。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**指标：**全图与病灶 ROI 分开算误差；报告肿瘤体积变化 MAE、变化方向、变化幅度比，并按真实变化幅度分层。仅在病灶变化有效后，用同一 landmark 比较临床基线、真实历史直接预测、历史加生成状态的 pCR AUROC/AUPRC/Brier；OS 另用删失适配指标。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**否证：**配准后收益消失、只改善背景、变化不优于复制，或生成状态不优于同预算直接预测，则不支持“学到有临床价值的动态状态”。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**算力：**原文 §3.1 为冻结 34.1M 参数编码器、22,163 个时间模型参数、20,000 步 fp32；§5.3 报告 1 mm 阶段一约 36.2 GB 显存/48 GB 单卡。医学小实验若直接复用缓存 latent，可单卡起步，这是按小时间头估计，非原论文复现耗时承诺。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据：\u003ca href=\"https://arxiv.org/html/2609.14590v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §3–6、Table 1；独立笔记附原始英文摘要。上述医学实验为建议，尚未执行。\u003c/p>\n\u003ch2>2. Reconstructing Is Not Acting: Action-Centric Latent Dynamics Modeling\u
