ructure of system dynamics. To address this issue, we introduce K$^2$SVD, a method that explicitly learns the leading singular functions of the Koopman operator by optimizing a Hilbert-Schmidt objective. This yields a well-defined low-rank approximation of the Koopman operator with an interpretable linear combination, featuring a compact latent space with less than $10%$ of the dimensions used in previous work. In the learned Koopman space, K$^2$SVD further captures temporal evolution with a linear Gaussian state-space model and performs inference via Kalman filtering, mitigating noise accumulation during multi-step prediction. Empirical results show that K$^2$SVD outperforms state-of-the-art methods across multiple datasets, with significantly faster prediction speeds and lower computational cost than previous efficiency-focused models. This highlights the benefits of principled low-rank Koopman representations and opens up broader potential for applications.\u003c/p>\n","markdown":"作者：Ruiquan Li, Yuheng Bu。原文：[arXiv:2609.17815](https://arxiv.org/abs/2609.17815)；[HTML](https://arxiv.org/html/2609.17815v1)。v1：**2026-09-15 20:32:25 UTC**；最新 v1，无修订。状态：预印本，正式接受未核实。**未找到官方代码**。已读 HTML 方法与实验。\n\n### 一句话总结\n\n用有明确算子目标的低秩表征加线性高斯动力学做廉价多步预测，但论文中的 Kalman 输入是自身线性外推，不能直接解释为临床新观测更新。\n\n### 中文摘要\n\nK2SVD 通过 Hilbert-Schmidt 目标学习 Koopman 算子的主要奇异函数，可概括为 `-2 tr(T[f,g]) + tr(M_f M_g)`。固定基函数后，训练小型线性高斯状态模型与解码器，结合 Kalman 推断平滑多步预测。与仅把神经潜空间命名为 Koopman space 的方法相比，变化是显式低秩算子近似目标与分阶段训练。\n\n### 创新点\n\n算子表征与预测模型分开设计，适合检查小样本中高容量非线性动力学是否必要。典型实验 rank 16，相比 rank 128 是 **12.5%**，不沿用摘要中笼统的“低于 10%”。Table 2 的 Electricity NRMSE 为 0.8502，对照 K2VAE 为 0.8682；Weather 则是 0.3124，逊于 K2VAE 的 0.2853。Electricity 的数据集级推理耗时为 10.144 秒，对照 84.202 秒；内存 0.438 对 1.702 GB。这不是每名患者的延迟。\n\n### 和我方向的适配\n\n**可迁移算法。** 可用于固定医学表征后的低秩动力学基线。主要假设包括时间齐次 Markov 动力学、适当的算子紧性和高斯残差近似；治疗改变与不规则时间间隔需要显式扩展。§4.2 的 Kalman “observations”来自模型自己的 OLS 外推，不是后来真实测得的数据。主实验主要给 NRMSE，不能据此宣称概率预测已校准。\n\n### 可借鉴动作\n\n在缓存的患者潜序列上比较 rank 16/32/64、普通线性模型、小型时间/治疗条件 MLP 与 CDE；消融 Hilbert-Schmidt 表征目标。区分完全开环、用自身伪观测滤波、实际新检查到来后更新三种协议，后者不能与完全开环混用未来信息。评价逐步病灶变化误差、误差累积、energy score/覆盖率和运行成本，再检验同输入下游增益。\n\n**否证结果**：去掉 Kalman 伪观测后表现相同，或不优于相同秩的普通线性预测，都会削弱机制必要性。论文使用单 GPU、50 epochs × 每 epoch 100 batches，分为 15+35 两阶段、5 seeds，未核实 GPU 型号；医学缓存特征实验估计可以单 GPU，基于 rank 较小而非原始 3D 重建。\n\n\n\n## 原始摘要\n\nThe Koopman operator has been widely used for time-series prediction in dynamical systems. However, prior work that learns latent ``Koopman spaces'' using neural networks often did not construct a valid Koopman space for forecasting, as these representations may be mathematically inconsistent with the operator-theoretic formulation and fail to capture the intrinsic low-rank structure of system dynamics. To address this issue, we introduce K$^2$SVD, a method that explicitly learns the leading singular functions of the Koopman operator by optimizing a Hilbert-Schmidt objective. This yields a well-defined low-rank approximation of the Koopman operator with an interpretable linear combination, featuring a compact latent space with less than $10\\%$ of the dimensions used in previous work. In the learned Koopman space, K$^2$SVD further captures temporal evolution with a linear Gaussian state-space model and performs inference via Kalman filtering, mitigating noise accumulation during multi-step prediction. Empirical results show that K$^2$SVD outperforms state-of-the-art methods across multiple datasets, with significantly faster prediction speeds and lower computational cost than previous efficiency-focused models. This highlights the benefits of principled low-rank Koopman representations and opens up broader potential for applications."},{"id":"arxiv:2609.17287","title":"Same Flow, Different Paths: Variance Reduction in Flow Matching","short":"Same-Flow","date":"2026-09-17","rank":5,"category":"general","topic":"可迁移算法","summary":"同一个 Flow Matching 目标可以由不同的样本路径实现，而路径会改变梯度方差；优化路径是否划算，还要把选路径的训练成本算进去。","authors":"Tyurin, Alexander","firstDate":"2026-09-15","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.17287","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Alexander Tyurin。原文：\u003ca href=\"https://arxiv.org/abs/2609.17287\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.17287\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.17287v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML\u003c/a>。v1：\u003cstrong>2026-09-15 15:01:04 UTC\u003c/strong>；最新 v1，无修订。状态：预印本，正式接受未核实。\u003cstrong>未找到官方代码\u003c/strong>。已读 HTML 理论框架与实验附录，未逐步验证全部证明。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>同一个 Flow Matching 目标可以由不同的样本路径实现，而路径会改变梯度方差；优化路径是否划算，还要把选路径的训练成本算进去。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>论文研究保持相同边缘分布 \u003ccode>p_t\u003c/code> 和边缘速度 \u003ccode>v*_t\u003c/code> 的路径族：目标不变，随机梯度方差和 SGD 收敛速度可以改变。PathOpt 在这一约束下优化路径，用 energy distance 及核化速度差异形成可由样本估计的约束。相比简单改变插值或仅降低方差，关键是同时维持原来的分布与速度场。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>一维高斯、线性模型给出较紧的迭代复杂度分析；一般问题依赖近似约束。论文明确展示不维持约束时，降低方差也可能减慢训练。5 seeds 的 CIFAR-10 FID 从 \u003cstrong>4.809 ± 0.081 到 4.586 ± 0.111\u003c/strong>，配对差值置信区间为 [-0.393, -0.053]；CIFAR-100 为 11.445 到 10.561，SVHN 为 13.596 到 10.282。固定 VAE 的 Flowers102 潜空间实验 \u003cstrong>13.071 对 13.071，无改善\u003c/strong>，其他潜空间结果也有区间跨零。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法，但低于 CNA 的实验优先级。\u003c/strong> 可替换 latent FM 的训练路径或生成时间采样。生成时间 \u003ccode>t\u003c/code> 是噪声到样本的插值参数，不能当成真实临床时间间隔。原实验路径搜索包含最多 4 个完整预算的候选训练，再用 FID 选择；最终一次训练预算相同，不等于研究总预算相同。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>先以 2D 条件混合分布验证边缘与速度约束，再固定医学编码器和小型 FM 比较直线路径、PathOpt、按重要性重加权的时间采样。后者必须用相应密度校正避免改变训练目标。计入所有路径搜索的训练成本，同时报告梯度方差、达到固定质量的 GPU 小时、病灶变化误差和概率评分。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：梯度方差降低但总预算内质量/临床预测没有提高，或改变了目标边缘分布，则不足以采用。原图像实验报告 2 张 H100 80 GB、BF16；医学缓存潜变量试验估计可显著缩小，但现有潜空间负面结果意味着不宜直接进行昂贵 3D 扩展。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>In flow matching (FM), a velocity model $v_{\\theta}$ is trained using a predefined path $g_t$ that connects data and noise samples (e.g., $g_t(x_0, x_1) = (1 - t) x_0 + t x_1$). In this work, we study the choice of this path from an optimization perspective by analyzing the variance of stochastic gradients. We consider the class $G(p_t,v^\\star_t)$ of paths that induce the same marginal distributions $p_t$ and marginal velocity field $v^\\star_t$, and therefore the same FM objective. Our main finding is that the choice of path $g_t$ can fundamentally change the convergence rate of SGD, even when the FM objective remains exactly the same. (i) For a linear velocity model and one-dimensional Gaussian data, we derive a tight bound on the SGD iteration complexity up to logarithmic factors and find an analytically optimal path that minimizes this bound among linear paths inducing the same FM problem. (ii) We then extend the variance analysis to general FM problems and formulate path selection at a fixed $\\theta$ as the variance-minimization problem PathOpt$_\\theta$, constrained to $g_t\\in G(p_t,v^\\star_t)$. We show that this constraint is essential: reducing variance without it can lead to slower convergence. (iii) Since the constraint $g_t \\in G(p_t,v^\\star_t)$ cannot generally be verified directly, we derive an equivalent formulation with constraints that can be estimated from samples, allowing paths to be found numerically. Our theoretical results are supported by experiments with Gaussian data, Gaussian mixture models, and real datasets.\u003c/p>\n","markdown":"作者：Alexander Tyurin。原文：[arXiv:2609.17287](https://arxiv.org/abs/2609.17287)；[HTML](https://arxiv.org/html/2609.17287v1)。v1：**2026-09-15 15:01:04 UTC**；最新 v1，无修订。状态：预印本，正式接受未核实。**未找到官方代码**。已读 HTML 理论框架与实验附录，未逐步验证全部证明。\n\n### 一句话总结\n\n同一个 Flow Matching 目标可以由不同的样本路径实现，而路径会改变梯度方差；优化路径是否划算，还要把选路径的训练成本算进去。\n\n### 中文摘要\n\n论文研究保持相同边缘分布 `p_t` 和边缘速度 `v*_t` 的路径族：目标不变，随机梯度方差和 SGD 收敛速度可以改变。PathOpt 在这一约束下优化路径，用 energy distance 及核化速度差异形成可由样本估计的约束。相比简单改变插值或仅降低方差，关键是同时维持原来的分布与速度场。\n\n### 创新点\n\n一维高斯、线性模型给出较紧的迭代复杂度分析；一般问题依赖近似约束。论文明确展示不维持约束时，降低方差也可能减慢训练。5 seeds 的 CIFAR-10 FID 从 **4.809 ± 0.081 到 4.586 ± 0.111**，配对差值置信区间为 [-0.393, -0.053]；CIFAR-100 为 11.445 到 10.561，SVHN 为 13.596 到 10.282。固定 VAE 的 Flowers102 潜空间实验 **13.071 对 13.071，无改善**，其他潜空间结果也有区间跨零。\n\n### 和我方向的适配\n\n**可迁移算法，但低于 CNA 的实验优先级。** 可替换 latent FM 的训练路径或生成时间采样。生成时间 `t` 是噪声到样本的插值参数，不能当成真实临床时间间隔。原实验路径搜索包含最多 4 个完整预算的候选训练，再用 FID 选择；最终一次训练预算相同，不等于研究总预算相同。\n\n### 可借鉴动作\n\n先以 2D 条件混合分布验证边缘与速度约束，再固定医学编码器和小型 FM 比较直线路径、PathOpt、按重要性重加权的时间采样。后者必须用相应密度校正避免改变训练目标。计入所有路径搜索的训练成本，同时报告梯度方差、达到固定质量的 GPU 小时、病灶变化误差和概率评分。\n\n**否证结果**：梯度方差降低但总预算内质量/临床预测没有提高，或改变了目标边缘分布，则不足以采用。原图像实验报告 2 张 H100 80 GB、BF16；医学缓存潜变量试验估计可显著缩小，但现有潜空间负面结果意味着不宜直接进行昂贵 3D 扩展。\n\n\n\n## 原始摘要\n\nIn flow matching (FM), a velocity model $v_{\\theta}$ is trained using a predefined path $g_t$ that connects data and noise samples (e.g., $g_t(x_0, x_1) = (1 - t) x_0 + t x_1$). In this work, we study the choice of this path from an optimization perspective by analyzing the variance of stochastic gradients. We consider the class $G(p_t,v^\\star_t)$ of paths that induce the same marginal distributions $p_t$ and marginal velocity field $v^\\star_t$, and therefore the same FM objective. Our main finding is that the choice of path $g_t$ can fundamentally change the convergence rate of SGD, even when the FM objective remains exactly the same. (i) For a linear velocity model and one-dimensional Gaussian data, we derive a tight bound on the SGD iteration complexity up to logarithmic factors and find an analytically optimal path that minimizes this bound among linear paths inducing the same FM problem. (ii) We then extend the variance analysis to general FM problems and formulate path selection at a fixed $\\theta$ as the variance-minimization problem PathOpt$_\\theta$, constrained to $g_t\\in G(p_t,v^\\star_t)$. We show that this constraint is essential: reducing variance without it can lead to slower convergence. (iii) Since the constraint $g_t \\in G(p_t,v^\\star_t)$ cannot generally be verified directly, we derive an equivalent formulation with constraints that can be estimated from samples, allowing paths to be found numerically. Our theoretical results are supported by experiments with Gaussian data, Gaussian mixture models, and real datasets."},{"id":"arxiv:2609.17372","title":"XPACE: Joint World and Action Modeling from Heterogeneous Experience","short":"XPACE","date":"2026-09-17","rank":6,"category":"general","topic":"可迁移算法","summary":"共享视频动力学并用自身生成的前缀继续训练，可以缓解 rollout 的历史偏移；医学可迁移这一训练方式，但不能把模拟恢复轨迹当成有效治疗标签。","authors":"Wei, Jiacheng · Bai, Jerry · Yue, Xiaoyu · Wang, Zidong · Guo, Xiaoyang · Chen, Cheng · Pu, Fanqi · Wu, Fan · Yue, Zhixu · Li, Yizhuo · Qiu, Feng · Liu, Bo · Ge, Yuying · Zhou, Hui · Chen, Chenyi · Ge, Yixiao","firstDate":"2026-09-15","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.17372","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Jiacheng Wei, Jerry Bai, Xiaoyu Yue, Zidong Wang, Xiaoyang Guo, Cheng Chen, Fanqi Pu, Fan Wu, Zhixu Yue, Yizhuo Li, Feng Qiu, Bo Liu, Yuying Ge, Hui Zhou, Chenyi Chen, Yixiao Ge。原文：\u003ca href=\"https://arxiv.org/abs/2609.17372\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.17372\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.17372v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML\u003c/a>。v1：\u003cstrong>2026-09-15 16:07:34 UTC\u003c/strong>；最新 v1，无修订。状态：预印本，正式接受未核实。\u003cstrong>未找到官方代码\u003c/strong>，同名无关仓库不算。已读 HTML 方法和主要实验。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>共享视频动力学并用自身生成的前缀继续训练，可以缓解 rollout 的历史偏移；医学可迁移这一训练方式，但不能把模拟恢复轨迹当成有效治疗标签。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>XPACE 将有动作标注的人类/机器人视频与无动作视频整合到共享视频骨干：有标签时联合训练动作和视频，无标签时只计算视频损失。Self-Generated Context Fine-Tuning 先以 8 步 ODE 生成前缀并 detach，再重新编码前缀，用记录中的对应后续 chunk 监督 FM。采样器不反传，保持生成前缀与原轨迹后续目标的对应。另一阶段合成偏离和恢复轨迹，经视觉相似性规则过滤后混入策略训练。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>值得迁移的是“训练中接触自身预测历史”，而非额外增加一个图像损失。193 帧长序列的 ID PSNR 从 \u003cstrong>16.94 到 17.83\u003c/strong>，OOD 从 \u003cstrong>17.74 到 18.75\u003c/strong>；但基线使用 50 步 ODE，后者 8 步且有额外微调，需区分采样步数与训练方式。3 个机器人任务、每项 20 次测试的平均成功率从 61.7% 到 86.7%。作者承认缺少相同额外优化预算的对照，不能将全部增益归因于合成数据。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 至少需要 3 个真实随访时点、已记录治疗、真实间隔，才便于验证“先预测第二次检查，再以其预测第三次”。缺动作视频可借鉴为缺标签损失掩码，但医疗中未记录治疗并不等于无治疗。机器人可执行动作与临床治疗决策的可交换性、覆盖范围、效应延迟不同；模拟恢复不能充当观测到的疗效或反事实真值。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>固定潜空间模型，比较 teacher forcing、相同额外步数的 teacher forcing、使用自身生成历史的训练。后续监督始终来自真实配对患者，不给模拟状态编造 pCR/OS 标签。评价两步以上的病灶变化、漂移、患者间差异、energy score、覆盖率，并保留复制/线性外推和同输入的直接预测对照。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：与等额外训练对照相比没有稳定改善，或通过削弱患者差异换取低 MSE，则不支持该训练方式。原文给出策略微调少于一天，但完整硬件和总算力未披露；缓存医学潜状态的小型实验估计可单 GPU，依据是不生成高分辨率视频。论文中的视觉质量改善不是临床获益证据。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>A general-purpose robot needs to draw on diverse experience, choose actions, and anticipate how those actions will change the world. We introduce XPACE, a unified embodied world model that serves as both a world action model, jointly predicting executable robot actions and future video, and a world simulator, predicting the visual consequences of prescribed actions. Our key insight is that video prediction can both connect heterogeneous experience to action learning and generate new experience for policy improvement. With a shared video backbone between the policy and simulator, we use action-unlabeled video to learn visual dynamics and action-labeled human and robot demonstrations to jointly learn video and action prediction. Building on this architecture, a coarse-to-fine training curriculum progressively emphasizes robot control while retaining human experience, allowing the policy to learn behaviors beyond those covered by robot demonstrations. Beyond learning from recorded experience, XPACE uses its simulator to create additional recovery supervision for the policy. Specifically, we adapt the simulator to its own generated context, synthesize deviation-recovery trajectories around expert demonstrations, and fine-tune the policy on filtered recovery examples. Experiments on XPENG&#39;s IRON humanoid robot show that heterogeneous training improves robustness and enables transfer of human-observed skills to tasks absent from robot demonstrations, while recovery data generated by the model&#39;s own simulator further improves real-world task completion. Together, these results demonstrate how joint world and action modeling connects learning from heterogeneous experience with simulation-driven policy self-improvement.\u003c/p>\n","markdown":"作者：Jiacheng Wei, Jerry Bai, Xiaoyu Yue, Zidong Wang, Xiaoyang Guo, Cheng Chen, Fanqi Pu, Fan Wu, Zhixu Yue, Yizhuo Li, Feng Qiu, Bo Liu, Yuying Ge, Hui Zhou, Chenyi Chen, Yixiao Ge。原文：[arXiv:2609.17372](https://arxiv.org/abs/2609.17372)；[HTML](https://arxiv.org/html/2609.17372v1)。v1：**2026-09-15 16:07:34 UTC**；最新 v1，无修订。状态：预印本，正式接受未核实。**未找到官方代码**，同名无关仓库不算。已读 HTML 方法和主要实验。\n\n### 一句话总结\n\n共享视频动力学并用自身生成的前缀继续训练，可以缓解 rollout 的历史偏移；医学可迁移这一训练方式，但不能把模拟恢复轨迹当成有效治疗标签。\n\n### 中文摘要\n\nXPACE 将有动作标注的人类/机器人视频与无动作视频整合到共享视频骨干：有标签时联合训练动作和视频，无标签时只计算视频损失。Self-Generated Context Fine-Tuning 先以 8 步 ODE 生成前缀并 detach，再重新编码前缀，用记录中的对应后续 chunk 监督 FM。采样器不反传，保持生成前缀与原轨迹后续目标的对应。另一阶段合成偏离和恢复轨迹，经视觉相似性规则过滤后混入策略训练。\n\n### 创新点\n\n值得迁移的是“训练中接触自身预测历史”，而非额外增加一个图像损失。193 帧长序列的 ID PSNR 从 **16.94 到 17.83**，OOD 从 **17.74 到 18.75**；但基线使用 50 步 ODE，后者 8 步且有额外微调，需区分采样步数与训练方式。3 个机器人任务、每项 20 次测试的平均成功率从 61.7% 到 86.7%。作者承认缺少相同额外优化预算的对照，不能将全部增益归因于合成数据。\n\n### 和我方向的适配\n\n**可迁移算法。** 至少需要 3 个真实随访时点、已记录治疗、真实间隔，才便于验证“先预测第二次检查，再以其预测第三次”。缺动作视频可借鉴为缺标签损失掩码，但医疗中未记录治疗并不等于无治疗。机器人可执行动作与临床治疗决策的可交换性、覆盖范围、效应延迟不同；模拟恢复不能充当观测到的疗效或反事实真值。\n\n### 可借鉴动作\n\n固定潜空间模型，比较 teacher forcing、相同额外步数的 teacher forcing、使用自身生成历史的训练。后续监督始终来自真实配对患者，不给模拟状态编造 pCR/OS 标签。评价两步以上的病灶变化、漂移、患者间差异、energy score、覆盖率，并保留复制/线性外推和同输入的直接预测对照。\n\n**否证结果**：与等额外训练对照相比没有稳定改善，或通过削弱患者差异换取低 MSE，则不支持该训练方式。原文给出策略微调少于一天，但完整硬件和总算力未披露；缓存医学潜状态的小型实验估计可单 GPU，依据是不生成高分辨率视频。论文中的视觉质量改善不是临床获益证据。\n\n\n\n## 原始摘要\n\nA general-purpose robot needs to draw on diverse experience, choose actions, and anticipate how those actions will change the world. We introduce XPACE, a unified embodied world model that serves as both a world action model, jointly predicting executable robot actions and future video, and a world simulator, predicting the visual consequences of prescribed actions. Our key insight is that video prediction can both connect heterogeneous experience to action learning and generate new experience for policy improvement. With a shared video backbone between the policy and simulator, we use action-unlabeled video to learn visual dynamics and action-labeled human and robot demonstrations to jointly learn video and action prediction. Building on this architecture, a coarse-to-fine training curriculum progressively emphasizes robot control while retaining human experience, allowing the policy to learn behaviors beyond those covered by robot demonstrations. Beyond learning from recorded experience, XPACE uses its simulator to create additional recovery supervision for the policy. Specifically, we adapt the simulator to its own generated context, synthesize deviation-recovery trajectories around expert demonstrations, and fine-tune the policy on filtered recovery examples. Experiments on XPENG's IRON humanoid robot show that heterogeneous training improves robustness and enables transfer of human-observed skills to tasks absent from robot demonstrations, while recovery data generated by the model's own simulator further improves real-world task completion. Together, these results demonstrate how joint world and action modeling connects learning from heterogeneous experience with simulation-driven policy self-improvement."},{"id":"arxiv:2609.17091","title":"Scaling-Score Conformal Prediction for Multi-Target Regression","short":"Scaling-Score","date":"2026-09-17","rank":7,"category":"general","topic":"可迁移算法","summary":"从一个固定点预测器的多维残差构造联合预测区域，适合启发“整条患者轨迹的覆盖”评价，但内接矩形和逐时点区间不能自动继承联合覆盖保证。","authors":"Rousseau, Sylvain · Messoudi, Soundouss","firstDate":"2026-08-30","revisionDate":"","version":"v1","evidence":"仅摘要","publication":"COPA 2026 正式会议论文；PMLR 329:312–342","url":"https://proceedings.mlr.press/v329/rousseau26a.html","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Sylvain Rousseau, Soundouss Messoudi。正式原文：\u003ca href=\"https://proceedings.mlr.press/v329/rousseau26a.html\" target=\"_blank\" rel=\"noopener noreferrer\">PMLR 329:312–342\u003c/a>；\u003ca href=\"https://arxiv.org/abs/2609.17091\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.17091\u003c/a>。\u003cstrong>首次已核实公开记录为 2026-08-30 的正式论文集出版\u003c/strong>，会议为 Fifteenth Symposium on Conformal and Probabilistic Prediction with Applications（COPA 2026）。arXiv v1 为 \u003cstrong>2026-09-15 12:23:57 UTC\u003c/strong>，最新 v1，无修订。\u003cstrong>归类为近期补充，不能把新上传 arXiv 当成新论文。未找到官方代码。\u003c/strong>\u003c/p>\n\u003cp>证据范围：已核实 PMLR 元数据和官方摘要；arXiv HTML 返回 404，未下载 PDF，未读完整算法、证明或实验表。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>从一个固定点预测器的多维残差构造联合预测区域，适合启发“整条患者轨迹的覆盖”评价，但内接矩形和逐时点区间不能自动继承联合覆盖保证。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>论文针对多目标回归提出 scaling-score conformal。根据官方摘要，方法只需各维绝对残差和一个校准集，构造外接矩形 SCO、精确集合 R_alpha、阶梯近似 SC2 及内接矩形 SCI。gamma 调节基矩形的分位水平，与目标错误率 alpha 分开。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>相对未归一化的 max aggregation 或拆分校准集的矩形方法，目标是兼顾不同输出尺度、联合覆盖和校准样本利用率。作者摘要称在 29 个数据集上维持联合覆盖，并使 SC2 的体积具有竞争力；**未核实数值、算法细节及所有定理条件，不能给出定量改善或宣称已验证保证。**摘要明确给外接 SCO 有效联合覆盖，不能推断内接 SCI 也有同样保证。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可把多个未来时间点的病灶体积或潜状态指标作为多维输出，在固定预测器之后做校准。常规 conformal 的交换性等条件需要核查，跨中心漂移、信息性复查缺失、治疗选择和删失 OS 都不能自动满足。一次患者的多时点数据应共同作为一个校准单位。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>先设定完整可观测的多时点病灶目标，用独立患者校准集，比较逐点区间加 Bonferroni、归一化 max-residual 联合区域，以及在完整方法可核验后实现的 scaling-score。gamma 只用训练/验证资料选择；固定点预测器和校准患者数，评价整条轨迹同时覆盖率、各中心覆盖、区域体积与失败患者特征。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：总体覆盖合格却在某治疗/中心严重欠覆盖，或相同联合覆盖下体积并不更小，则优势不足。只分析完整复查者得到的覆盖，不能泛化到所有患者。算力估计为缓存残差上的 CPU 校准，依据是无须重新训练生成模型；本条属于实验建议，尚未实现，完整算法仍需全文支持。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Multi-target regression requires a model to simultaneously predict several related outputs. Conformal prediction provides distribution-free, finite-sample marginal coverage guarantees, but extending these to joint multi-dimensional regions in a model-agnostic, sample-efficient manner remains challenging: max-aggregation ignores scale differences, copula-based methods are only asymptotically valid, rectangular methods typically split the calibration set, and quantile or density-based methods require training a specialised model beyond a plain point predictor. We propose the scaling-score conformal method, which is model-agnostic (requires only component-wise absolute residuals), uses a single calibration set, and yields four nested output types: an outer rectangle (SCO) with valid joint coverage, the exact set R $\\alpha$ , a staircase (SC 2 ) over approximation of R $\\alpha$ , and an inner rectangle (SCI). A single hyperparameter $\\gamma$ $\\in$ (0, 1) controls the base-rectangle quantile level independently of $\\alpha$. We prove downward-closedness and a rectangular sandwich bound and derive a closed-form outer rectangle. Experiments on 29 realworld datasets confirm valid joint coverage; SC 2 with $\\gamma$ = 1-$\\alpha$ consistently achieves competitive volume relative to baselines, with the advantage growing with output dimension d.\u003c/p>\n","markdown":"作者：Sylvain Rousseau, Soundouss Messoudi。正式原文：[PMLR 329:312–342](https://proceedings.mlr.press/v329/rousseau26a.html)；[arXiv:2609.17091](https://arxiv.org/abs/2609.17091)。**首次已核实公开记录为 2026-08-30 的正式论文集出版**，会议为 Fifteenth Symposium on Conformal and Probabilistic Prediction with Applications（COPA 2026）。arXiv v1 为 **2026-09-15 12:23:57 UTC**，最新 v1，无修订。**归类为近期补充，不能把新上传 arXiv 当成新论文。未找到官方代码。**\n\n证据范围：已核实 PMLR 元数据和官方摘要；arXiv HTML 返回 404，未下载 PDF，未读完整算法、证明或实验表。\n\n### 一句话总结\n\n从一个固定点预测器的多维残差构造联合预测区域，适合启发“整条患者轨迹的覆盖”评价，但内接矩形和逐时点区间不能自动继承联合覆盖保证。\n\n### 中文摘要\n\n论文针对多目标回归提出 scaling-score conformal。根据官方摘要，方法只需各维绝对残差和一个校准集，构造外接矩形 SCO、精确集合 R_alpha、阶梯近似 SC2 及内接矩形 SCI。gamma 调节基矩形的分位水平，与目标错误率 alpha 分开。\n\n### 创新点\n\n相对未归一化的 max aggregation 或拆分校准集的矩形方法，目标是兼顾不同输出尺度、联合覆盖和校准样本利用率。作者摘要称在 29 个数据集上维持联合覆盖，并使 SC2 的体积具有竞争力；**未核实数值、算法细节及所有定理条件，不能给出定量改善或宣称已验证保证。**摘要明确给外接 SCO 有效联合覆盖，不能推断内接 SCI 也有同样保证。\n\n### 和我方向的适配\n\n**可迁移算法。** 可把多个未来时间点的病灶体积或潜状态指标作为多维输出，在固定预测器之后做校准。常规 conformal 的交换性等条件需要核查，跨中心漂移、信息性复查缺失、治疗选择和删失 OS 都不能自动满足。一次患者的多时点数据应共同作为一个校准单位。\n\n### 可借鉴动作\n\n先设定完整可观测的多时点病灶目标，用独立患者校准集，比较逐点区间加 Bonferroni、归一化 max-residual 联合区域，以及在完整方法可核验后实现的 scaling-score。gamma 只用训练/验证资料选择；固定点预测器和校准患者数，评价整条轨迹同时覆盖率、各中心覆盖、区域体积与失败患者特征。\n\n**否证结果**：总体覆盖合格却在某治疗/中心严重欠覆盖，或相同联合覆盖下体积并不更小，则优势不足。只分析完整复查者得到的覆盖，不能泛化到所有患者。算力估计为缓存残差上的 CPU 校准，依据是无须重新训练生成模型；本条属于实验建议，尚未实现，完整算法仍需全文支持。\n\n\n\n## 原始摘要\n\nMulti-target regression requires a model to simultaneously predict several related outputs. Conformal prediction provides distribution-free, finite-sample marginal coverage guarantees, but extending these to joint multi-dimensional regions in a model-agnostic, sample-efficient manner remains challenging: max-aggregation ignores scale differences, copula-based methods are only asymptotically valid, rectangular methods typically split the calibration set, and quantile or density-based methods require training a specialised model beyond a plain point predictor. We propose the scaling-score conformal method, which is model-agnostic (requires only component-wise absolute residuals), uses a single calibration set, and yields four nested output types: an outer rectangle (SCO) with valid joint coverage, the exact set R $\\alpha$ , a staircase (SC 2 ) over approximation of R $\\alpha$ , and an inner rectangle (SCI). A single hyperparameter $\\gamma$ $\\in$ (0, 1) controls the base-rectangle quantile level independently of $\\alpha$. We prove downward-closedness and a rectangular sandwich bound and derive a closed-form outer rectangle. Experiments on 29 realworld datasets confirm valid joint coverage; SC 2 with $\\gamma$ = 1-$\\alpha$ consistently achieves competitive volume relative to baselines, with the advantage growing with output dimension d."},{"id":"arxiv:2609.04264","title":"Spectral-Target Physical Latent Structuring for JEPA-Style World Models","short":"Spectral-Target","date":"2026-09-18","rank":1,"category":"general","topic":"可迁移算法","summary":"即使潜变量没有塌缩，JEPA 仍可能只编码背景或干扰物；一个受限容量的任务状态辅助头，可以迫使编码器和预测器保留决策所需信息。","authors":"Zhu, Penghao · Penachio, Salvatore · Mukherjee, Kaustav · Jonelagadda, Aneesh","firstDate":"2026-09-02","revisionDate":"2026-09-16","version":"v3","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.04264","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Penghao Zhu, Salvatore Penachio, Kaustav Mukherjee, Aneesh Jonelagadda。\u003c/p>\n\u003cp>原文：\u003ca href=\"https://arxiv.org/abs/2609.04264\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.04264\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.04264v3\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v3\u003c/a>。v1：\u003cstrong>2026-09-02 18:05:06 UTC\u003c/strong>；最新修订 v3：\u003cstrong>2026-09-16 16:49:30 UTC\u003c/strong>。预印本，近期补充。\u003cstrong>未找到官方代码\u003c/strong>。已读方法、主要实验和标注来源附录，未独立复现。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>即使潜变量没有塌缩，JEPA 仍可能只编码背景或干扰物；一个受限容量的任务状态辅助头，可以迫使编码器和预测器保留决策所需信息。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>论文从 LeWM 的潜状态预测和 SIGReg 正则出发，在可控物体与环境物体并存的模拟任务中发现：良好的整体表征统计不保证模型理解被控制对象。作者为一组可交换物体的框 \u003ccode>b_i=[x,y,w,h]\u003c/code> 构造固定随机 Fourier 目标 \u003ccode>sum_i [cos(W^T b_i), sin(W^T b_i)]\u003c/code>，用两层 MLP 从当前和预测的未来潜状态恢复该目标。该辅助头通常在推理时移除。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>相对只约束预测一致性和非塌缩的目标，新增的是明确的物理状态监督。目标求和对物体排列不变，但有限 Fourier 频率不保证无歧义地恢复全部物体。浅头限制了“复杂头自行完成任务、主表征仍不保留状态”的可能性。辅助头自身只从真实编码状态学习；预测潜状态上的辅助梯度更新编码器/预测器，避免头追随不稳定预测漂移。默认辅助权重 0.1、SIGReg 权重 0.09。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 1 中，单环境球场景的 H=4 规划成功率 \u003cstrong>1.1%→92.4%\u003c/strong>，H=8 为 \u003cstrong>0→62.1%\u003c/strong>；Table 3 的 Push-T 为 \u003cstrong>91.2%→95.2%\u003c/strong>。五个 planning seeds 不等于五次独立训练复现。主实验框来自模拟器真值，检测器与噪声框分析是额外实验，不能说医学迁移无需标注。\u003c/p>\n\u003cp>表征探针显示受控物体的相关性改善，但环境物体可下降；部分任务的潜距离与真实状态距离相关性仍弱。作者认为结构化目标改善规划，我的判断是证据支持“关键状态监督值得加”，尚不能证明 Fourier 形式优于所有简单病灶目标。极小样本下也不保证收益。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法，今天首选。\u003c/strong> 可以在历史 MRI/CT 编码器和未来潜状态预测器上加病灶状态头，监督体积、位置、增强或纹理变化。需要训练患者的病灶标注或可靠测量。单病灶没有集合置换的明显需求；多病灶要保留器官与解剖身份，不能把不同组织直接无区别相加。医学中的治疗反应、坏死和新病灶也不是模拟球的运动。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>固定现有编码器初始化和 \u003ccode>history, treatment, deltaT\u003c/code> 输入，比较同容量无辅助损失、原始体积/框回归、Fourier 集合目标、同标注的 ROI 监督。直接 pCR/OS 模型也应获得相同未来辅助监督、训练预算与参数容量，才能判断生成模块本身是否必要。\u003c/p>\n\u003cp>同时报告有效秩/特征方差、病灶变化线性探针、相对复制最近观测及趋势外推的误差，以及中心留出的 pCR AUROC/AUPRC/Brier。生存评价固定 landmark、结局与删失处理，报告事件数及时间依赖 Brier；增加标签打乱对照，防止把中心差异当病灶变化。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：只有秩或图像相似度提高，病灶变化和临床预测无增量；或简单体积头达到相同收益，则不支持复杂 spectral 目标的必要性。算力：原文给出小 ViT、64×64 或 224×224 输入及训练轮数，未核实 GPU 小时；缓存潜变量加浅头估计单 GPU 可做，依据是省去 3D 编码器反传，联合微调另计。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Latent world models have become increasingly popular as a method to predict and plan in latent space rather than pixel space. Recent architectures, such as LeWorldModel (LeWM), jointly train the encoder and predictor using regularization techniques like SIGReg to prevent representation collapse. Even with such regularization preventing representation collapse, we identify a new world model failure mode of physical representation laziness, particularly noted in highly dynamic environments. For these lazy cases, the learned latent states do not collapse but nonetheless fail to represent key physical properties, causing ubiquitous downstream planning failure. To resolve this issue, we propose training-time auxiliary supervision with a lightweight &quot;Fourier auxiliary head&quot;, which enforces physically-informed structuring of the latent space with no additional inference-time cost and can be generalized to any environment. Experimentally, we show that the auxiliary head substantially improves planning success rates in dynamic environments where the baseline LeWM exhibits physical representation laziness. It also leads to modest improvements in other environments, even when the baseline does not exhibit physical representation laziness. We further observe superior planning performance being accompanied by higher latent space correlations with key physical properties, indicating both the ability of our method to physically structure latent states and the potential planning-side benefit to the learned representation being physically structured. We also see in low-data regimes, auxiliary supervision is particularly impactful in increasing success rate. These findings support the use of our Fourier auxiliary head method to improve both overall success rate and data efficiency, while avoiding representation laziness in latent world models.\u003c/p>\n","markdown":"作者：Penghao Zhu, Salvatore Penachio, Kaustav Mukherjee, Aneesh Jonelagadda。\n\n原文：[arXiv:2609.04264](https://arxiv.org/abs/2609.04264)；[HTML v3](https://arxiv.org/html/2609.04264v3)。v1：**2026-09-02 18:05:06 UTC**；最新修订 v3：**2026-09-16 16:49:30 UTC**。预印本，近期补充。**未找到官方代码**。已读方法、主要实验和标注来源附录，未独立复现。\n\n### 一句话总结\n\n即使潜变量没有塌缩，JEPA 仍可能只编码背景或干扰物；一个受限容量的任务状态辅助头，可以迫使编码器和预测器保留决策所需信息。\n\n### 中文摘要\n\n论文从 LeWM 的潜状态预测和 SIGReg 正则出发，在可控物体与环境物体并存的模拟任务中发现：良好的整体表征统计不保证模型理解被控制对象。作者为一组可交换物体的框 `b_i=[x,y,w,h]` 构造固定随机 Fourier 目标 `sum_i [cos(W^T b_i), sin(W^T b_i)]`，用两层 MLP 从当前和预测的未来潜状态恢复该目标。该辅助头通常在推理时移除。\n\n### 创新点\n\n相对只约束预测一致性和非塌缩的目标，新增的是明确的物理状态监督。目标求和对物体排列不变，但有限 Fourier 频率不保证无歧义地恢复全部物体。浅头限制了“复杂头自行完成任务、主表征仍不保留状态”的可能性。辅助头自身只从真实编码状态学习；预测潜状态上的辅助梯度更新编码器/预测器，避免头追随不稳定预测漂移。默认辅助权重 0.1、SIGReg 权重 0.09。\n\n### 实验支持与局限\n\nTable 1 中，单环境球场景的 H=4 规划成功率 **1.1%→92.4%**，H=8 为 **0→62.1%**；Table 3 的 Push-T 为 **91.2%→95.2%**。五个 planning seeds 不等于五次独立训练复现。主实验框来自模拟器真值，检测器与噪声框分析是额外实验，不能说医学迁移无需标注。\n\n表征探针显示受控物体的相关性改善，但环境物体可下降；部分任务的潜距离与真实状态距离相关性仍弱。作者认为结构化目标改善规划，我的判断是证据支持“关键状态监督值得加”，尚不能证明 Fourier 形式优于所有简单病灶目标。极小样本下也不保证收益。\n\n### 和我方向的适配\n\n**可迁移算法，今天首选。** 可以在历史 MRI/CT 编码器和未来潜状态预测器上加病灶状态头，监督体积、位置、增强或纹理变化。需要训练患者的病灶标注或可靠测量。单病灶没有集合置换的明显需求；多病灶要保留器官与解剖身份，不能把不同组织直接无区别相加。医学中的治疗反应、坏死和新病灶也不是模拟球的运动。\n\n### 可借鉴动作\n\n固定现有编码器初始化和 `history, treatment, deltaT` 输入，比较同容量无辅助损失、原始体积/框回归、Fourier 集合目标、同标注的 ROI 监督。直接 pCR/OS 模型也应获得相同未来辅助监督、训练预算与参数容量，才能判断生成模块本身是否必要。\n\n同时报告有效秩/特征方差、病灶变化线性探针、相对复制最近观测及趋势外推的误差，以及中心留出的 pCR AUROC/AUPRC/Brier。生存评价固定 landmark、结局与删失处理，报告事件数及时间依赖 Brier；增加标签打乱对照，防止把中心差异当病灶变化。\n\n**否证结果**：只有秩或图像相似度提高，病灶变化和临床预测无增量；或简单体积头达到相同收益，则不支持复杂 spectral 目标的必要性。算力：原文给出小 ViT、64×64 或 224×224 输入及训练轮数，未核实 GPU 小时；缓存潜变量加浅头估计单 GPU 可做，依据是省去 3D 编码器反传，联合微调另计。\n\n\n\n## 原始摘要\n\nLatent world models have become increasingly popular as a method to predict and plan in latent space rather than pixel space. Recent architectures, such as LeWorldModel (LeWM), jointly train the encoder and predictor using regularization techniques like SIGReg to prevent representation collapse. Even with such regularization preventing representation collapse, we identify a new world model failure mode of physical representation laziness, particularly noted in highly dynamic environments. For these lazy cases, the learned latent states do not collapse but nonetheless fail to represent key physical properties, causing ubiquitous downstream planning failure. To resolve this issue, we propose training-time auxiliary supervision with a lightweight \"Fourier auxiliary head\", which enforces physically-informed structuring of the latent space with no additional inference-time cost and can be generalized to any environment. Experimentally, we show that the auxiliary head substantially improves planning success rates in dynamic environments where the baseline LeWM exhibits physical representation laziness. It also leads to modest improvements in other environments, even when the baseline does not exhibit physical representation laziness. We further observe superior planning performance being accompanied by higher latent space correlations with key physical properties, indicating both the ability of our method to physically structure latent states and the potential planning-side benefit to the learned representation being physically structured. We also see in low-data regimes, auxiliary supervision is particularly impactful in increasing success rate. These findings support the use of our Fourier auxiliary head method to improve both overall success rate and data efficiency, while avoiding representation laziness in latent world models."},{"id":"arxiv:2609.20008","title":"Dynamic Generalized Gromov-Wasserstein Optimal Transport","short":"TP-DATE","date":"2026-09-18","rank":2,"category":"general","topic":"可迁移算法","summary":"把结构约束放进传输路径本身，有机会减少中间状态的几何扭曲，但端点之间的插值成功并不等于能预测未知未来。","authors":"Ying, Junda · Zeng, Zhiwei · Zhou, Peijie · Zhang, Lei","firstDate":"2026-09-17","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.20008","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Junda Ying, Zhiwei Zeng, Peijie Zhou, Lei Zhang。\u003c/p>\n\u003cp>原文：\u003ca href=\"https://arxiv.org/abs/2609.20008\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.20008\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.20008v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v1\u003c/a>。v1：\u003cstrong>2026-09-17 10:17:33 UTC\u003c/strong>；无修订。预印本。\u003cstrong>未找到官方代码\u003c/strong>。已读方法、主要结果及实现附录，证明未逐条复核。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>把结构约束放进传输路径本身，有机会减少中间状态的几何扭曲，但端点之间的插值成功并不等于能预测未知未来。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>静态 GW/二次 OT 匹配数据内部关系，随后沿直线做 CFM 仍可能在中间路径破坏结构。本文引入 interacting pair dynamics：除运动能量外，惩罚成对距离变化的速率，用 travelling-pair flow matching 学习条件对路径，再得到单粒子边缘速度。实验涉及合成旋转与空间转录组，方法实现称 TP-DATE。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>关键变化是“静态结构匹配 + 直线流”变成结构感知的动态路径。单粒子速度可由对速度条件期望获得，保持边缘连续性，但不意味着恢复了完整的二体联合动力学。速度分解存在不唯一性，需要先验选择；不能由此识别组织变化的唯一机制。实验中的交互约束主要作用于空间位置，表达特征采用运动代价；随机、含噪及 unbalanced 扩展未完成。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Mouse Brain 的空间 W2 从 OT-CFM \u003cstrong>0.09190→0.08678\u003c/strong>，表达 W2 \u003cstrong>6.52705→6.40989\u003c/strong>，SCeMSE \u003cstrong>1.52747→1.47693\u003c/strong>。并非所有指标最佳：ARTISTA 中 stVCR 空间 W2 \u003cstrong>0.08582\u003c/strong> 优于 TP-DATE \u003cstrong>0.09196\u003c/strong>；肿瘤样本 TP-DATE 空间 \u003cstrong>0.06959\u003c/strong> 也逊于 ContextFlow \u003cstrong>0.06768\u003c/strong>。五随机种子不等于五个独立队列。\u003c/p>\n\u003cp>肿瘤实验来自同一组织不同切片深度，\u003cstrong>不是治疗前后纵向肿瘤预测\u003c/strong>；空间转录组也不等于生成 H&amp;E/WSI。实验用两个已知端点重建中间状态。合成 Distractor 的归一化联合使用起点、中点和终点，属于传导式预处理，不能照搬为严格前瞻流程；真实数据 PCA 拟合范围未充分核实。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可尝试让 lesion/organ tokens 的 FM 路径保留合理结构，或用于有空间对应的影像与组织表达对齐。需要可靠坐标、配准和实体对应。治疗导致的缩小、坏死、消失本来就是结构变化，强结构保持可能抑制真正反应。临床时间 \u003ccode>deltaT\u003c/code> 必须单独进入条件，不能拿生成过程时间代替。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>先在可控形变和病灶体积变化的低维潜空间比较 OT-CFM、静态 FGW-CFM、动态 pair path、简单形变/趋势基线。训练可用配对历史与未来标签，测试必须只给预测时点前信息，不给未来端点或中间真值。所有归一化和 PCA 只在训练集拟合。\u003c/p>\n\u003cp>分开评价结构失真、病灶变化误差、患者特异性与 pCR/OS 增量；直接预测模型使用同输入、容量和预算。若引入随机模型，再加 proper score 与覆盖率。\u003cstrong>否证结果\u003c/strong>：只提高空间匹配，却压低真实病灶变化幅度，或从插值改成未知未来预测后收益消失。原文附录使用单张 \u003cstrong>NVIDIA 5070 Ti\u003c/strong>、五层宽 128 的 MLP，未给可核实的 GPU 小时；医学 token 试验可先单 GPU，完整 3D 影像成本需另估。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Gromov--Wasserstein optimal transport (GW-OT) extends classical optimal transport by introducing structure-aware transport cost. This is particularly relevant for spatial transcriptomics, where dynamical reconstruction should preserve tissue structure in addition to matching expression patterns. While static formulations have been widely used for such structure-aware alignment, a general dynamic formulation for reconstructing continuous trajectories is still missing. We introduce Travelling Pair Dynamical Alignment and Trajectory Estimation (TP-DATE), a theoretical and computational framework to generalize GW-OT dynamically in a simulation-free manner. We formulate a broad class of static and dynamic Quadratic-form OT (QOT) through path actions and prove the static dynamic equivalence. We further develop travelling-pair flow matching, which allows interacting conditional paths and marginalizes their interactions into a single vector field. On synthetic and real spatial transcriptomics data, TP-DATE better preserves spatial structure and improves continuous 3D dynamics reconstruction.\u003c/p>\n","markdown":"作者：Junda Ying, Zhiwei Zeng, Peijie Zhou, Lei Zhang。\n\n原文：[arXiv:2609.20008](https://arxiv.org/abs/2609.20008)；[HTML v1](https://arxiv.org/html/2609.20008v1)。v1：**2026-09-17 10:17:33 UTC**；无修订。预印本。**未找到官方代码**。已读方法、主要结果及实现附录，证明未逐条复核。\n\n### 一句话总结\n\n把结构约束放进传输路径本身，有机会减少中间状态的几何扭曲，但端点之间的插值成功并不等于能预测未知未来。\n\n### 中文摘要\n\n静态 GW/二次 OT 匹配数据内部关系，随后沿直线做 CFM 仍可能在中间路径破坏结构。本文引入 interacting pair dynamics：除运动能量外，惩罚成对距离变化的速率，用 travelling-pair flow matching 学习条件对路径，再得到单粒子边缘速度。实验涉及合成旋转与空间转录组，方法实现称 TP-DATE。\n\n### 创新点\n\n关键变化是“静态结构匹配 + 直线流”变成结构感知的动态路径。单粒子速度可由对速度条件期望获得，保持边缘连续性，但不意味着恢复了完整的二体联合动力学。速度分解存在不唯一性，需要先验选择；不能由此识别组织变化的唯一机制。实验中的交互约束主要作用于空间位置，表达特征采用运动代价；随机、含噪及 unbalanced 扩展未完成。\n\n### 实验支持与局限\n\nMouse Brain 的空间 W2 从 OT-CFM **0.09190→0.08678**，表达 W2 **6.52705→6.40989**，SCeMSE **1.52747→1.47693**。并非所有指标最佳：ARTISTA 中 stVCR 空间 W2 **0.08582** 优于 TP-DATE **0.09196**；肿瘤样本 TP-DATE 空间 **0.06959** 也逊于 ContextFlow **0.06768**。五随机种子不等于五个独立队列。\n\n肿瘤实验来自同一组织不同切片深度，**不是治疗前后纵向肿瘤预测**；空间转录组也不等于生成 H&E/WSI。实验用两个已知端点重建中间状态。合成 Distractor 的归一化联合使用起点、中点和终点，属于传导式预处理，不能照搬为严格前瞻流程；真实数据 PCA 拟合范围未充分核实。\n\n### 和我方向的适配\n\n**可迁移算法。** 可尝试让 lesion/organ tokens 的 FM 路径保留合理结构，或用于有空间对应的影像与组织表达对齐。需要可靠坐标、配准和实体对应。治疗导致的缩小、坏死、消失本来就是结构变化，强结构保持可能抑制真正反应。临床时间 `deltaT` 必须单独进入条件，不能拿生成过程时间代替。\n\n### 可借鉴动作\n\n先在可控形变和病灶体积变化的低维潜空间比较 OT-CFM、静态 FGW-CFM、动态 pair path、简单形变/趋势基线。训练可用配对历史与未来标签，测试必须只给预测时点前信息，不给未来端点或中间真值。所有归一化和 PCA 只在训练集拟合。\n\n分开评价结构失真、病灶变化误差、患者特异性与 pCR/OS 增量；直接预测模型使用同输入、容量和预算。若引入随机模型，再加 proper score 与覆盖率。**否证结果**：只提高空间匹配，却压低真实病灶变化幅度，或从插值改成未知未来预测后收益消失。原文附录使用单张 **NVIDIA 5070 Ti**、五层宽 128 的 MLP，未给可核实的 GPU 小时；医学 token 试验可先单 GPU，完整 3D 影像成本需另估。\n\n\n\n## 原始摘要\n\nGromov--Wasserstein optimal transport (GW-OT) extends classical optimal transport by introducing structure-aware transport cost. This is particularly relevant for spatial transcriptomics, where dynamical reconstruction should preserve tissue structure in addition to matching expression patterns. While static formulations have been widely used for such structure-aware alignment, a general dynamic formulation for reconstructing continuous trajectories is still missing. We introduce Travelling Pair Dynamical Alignment and Trajectory Estimation (TP-DATE), a theoretical and computational framework to generalize GW-OT dynamically in a simulation-free manner. We formulate a broad class of static and dynamic Quadratic-form OT (QOT) through path actions and prove the static dynamic equivalence. We further develop travelling-pair flow matching, which allows interacting conditional paths and marginalizes their interactions into a single vector field. On synthetic and real spatial transcriptomics data, TP-DATE better preserves spatial structure and improves continuous 3D dynamics reconstruction."},{"id":"arxiv:2609.09757","title":"Arti-JEPA: Adapting Video World Model to Real-Time MRI of the Vocal Tract for Speech-Production Analysis","short":"Arti-JEPA","date":"2026-09-18","rank":3,"category":"medical","topic":"直接相关","summary":"视频 JEPA 可以经自监督域适配迁移到动态 MRI，但论文的外部测试规模和摘要正文冲突，要求我们把结论限定在已核对的实验上。","authors":"Nguyen, Hong · Foley, Sean · Hagedorn, Christina · Lu, Yijing · Kadiri, Sudarsana Reddy · Byrd, Dani · Narayanan, Shrikanth","firstDate":"2026-09-09","revisionDate":"2026-09-16","version":"v2","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.09757","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Hong Nguyen, Sean Foley, Christina Hagedorn, Yijing Lu, Sudarsana Reddy Kadiri, Dani Byrd, Shrikanth Narayanan。\u003c/p>\n\u003cp>原文：\u003ca href=\"https://arxiv.org/abs/2609.09757\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.09757\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.09757v2\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v2\u003c/a>。v1：\u003cstrong>2026-09-09 05:58:40 UTC\u003c/strong>；v2：\u003cstrong>2026-09-16 17:11:39 UTC\u003c/strong>。预印本，近期补充。代码线索：\u003ca href=\"https://github.com/Hong7Cong/arti-jepa\" target=\"_blank\" rel=\"noopener noreferrer\">Hong7Cong/arti-jepa\u003c/a>，已核实公开、作者同名资料及对应研究实现文件；论文原页未直接链接，官方归属仍有这一证据缺口，未验证完整复现。已读正文方法与实验。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>视频 JEPA 可以经自监督域适配迁移到动态 MRI，但论文的外部测试规模和摘要正文冲突，要求我们把结论限定在已核对的实验上。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>以预训练 V-JEPA 2 为起点，针对灰度、低分辨率声道实时 MRI 调整输入、增强及时间采样，用 EMA 教师提供 masked latent L1 目标。输入为 50 fps 下 32 帧，即约 640 ms，随后冻结表征，用探针分析发音与言语任务。训练监控特征标准差、有效秩及绝对余弦相似度，避免只看训练损失。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>核心是模态适配与受控探针评估，而非新的长期病程生成器。相对直接使用自然视频 V-JEPA，新增 MRI 持续预训练、符合声道运动的帧率和增强。单次检查的毫秒动态并非跨周/月复查；masked context prediction 也不是天然只用历史预测未来。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 1 的外部音素帧级 Cohen kappa：Arti-JEPA \u003cstrong>0.352±0.015\u003c/strong>，适配 VideoMAE \u003cstrong>0.264\u003c/strong>，原始 V-JEPA 2 \u003cstrong>0.156±0.016\u003c/strong>。但该外部 USCLSS 测试来自\u003cstrong>一位未见说话者\u003c/strong>，不能称多中心临床验证。扩大上下文并加入 biLSTM 后为 0.421，两项同时变化，不能只归因于 LSTM。\u003c/p>\n\u003cp>最新版内部存在冲突：摘要称约 62 小时，正文描述约 15 小时加 38 小时、超过 50 小时；摘要称口吃二分类没有改善，Table 7 却为 macro-F1 \u003cstrong>0.789→0.817\u003c/strong>；摘要的术后无下降说法也与正文个别受试者退化不一致。本报告采用正文可核对数字。口吃分析仅七人留一人测试；三种子波动不等于总体临床置信区间。术后分析仅三人。作者报告受试者分离，但非塌缩统计本身不能证明没有数据泄漏。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关于医学表征适配，病种和预测时间尺度仍需迁移。\u003c/strong> 可借鉴自监督适配、冻结探针、表征诊断的组合。对纵向 MRI，预训练也要按患者与中心划分，测试患者的未标注影像不能自动视为无害。需要分别研究帧内时间、检查间时间和治疗阶段。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>固定骨干和下游头，比较无适配、masked JEPA 适配、真实未来表征预测，并匹配数据量、上下文长度和训练预算；同时比较 MAE/对比学习与直接 pCR/OS 模型。检查 lesion-change probe、中心/扫描器可预测性、少标签曲线和中心留出 pCR/删失生存指标，保留复制/趋势对照。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：域内探针或有效秩改善，但病灶变化与外部临床效用无收益，或收益由更多上下文解释，则不支持目标本身的迁移价值。原文计算为 \u003cstrong>单 V100 32GB、26,875 updates、有效 batch 128\u003c/strong>，FP16 与激活检查点；未核实 GPU 小时。全文网格缓存约 31 GiB/编码器，池化缓存约 123 MB，可先后者做最低成本探针。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Real-time MRI (rtMRI) captures the dynamics of the entire vocal tract during speech, but labeled data are scarce and the modality - single-slice, grayscale, low-resolution - differs substantially from the natural videos that video foundation models are trained on. We introduce Arti-JEPA, a joint embedding predictive architecture to model vocal tract rtMRI by continuing its self-supervised objective on about 62h of unlabelled vocal-tract videos, and evaluate the frozen representation on three tasks: cross-domain phoneme prediction (on typical speakers), fluent-vs-disfluent classification (a corpus containing stuttered speech), and characterizing pre/post-operative transfer (after partial glossectomy). Three key findings emerge. (1) A temporal video prior decisively outperforms per-frame image encoders, and latent prediction (V-JEPA) is at least as strong as pixel reconstruction (VideoMAE), with the edge on fine-grained phonemes. (2) Domain adaptation is \\emph{task-dependent}: it roughly doubles cross-domain phoneme prediction $\\kappa$ (to 0.352) but does not help binary stuttering classification. (3) Arti-JEPA was able to recover phoneme signal from pre/post glossectomy speech --- an in-domain probe decodes patients at least as well as a typical speaker, indicating that the residual transfer gap is cross-speaker/domain misalignment, not surgical signal loss, and post-operative decoding does not fall below performance on pre-operative speech. Together, these position a frozen, domain-adapted rtMRI encoder as a reusable measurement tool for articulatory and clinical speech science.\u003c/p>\n","markdown":"作者：Hong Nguyen, Sean Foley, Christina Hagedorn, Yijing Lu, Sudarsana Reddy Kadiri, Dani Byrd, Shrikanth Narayanan。\n\n原文：[arXiv:2609.09757](https://arxiv.org/abs/2609.09757)；[HTML v2](https://arxiv.org/html/2609.09757v2)。v1：**2026-09-09 05:58:40 UTC**；v2：**2026-09-16 17:11:39 UTC**。预印本，近期补充。代码线索：[Hong7Cong/arti-jepa](https://github.com/Hong7Cong/arti-jepa)，已核实公开、作者同名资料及对应研究实现文件；论文原页未直接链接，官方归属仍有这一证据缺口，未验证完整复现。已读正文方法与实验。\n\n### 一句话总结\n\n视频 JEPA 可以经自监督域适配迁移到动态 MRI，但论文的外部测试规模和摘要正文冲突，要求我们把结论限定在已核对的实验上。\n\n### 中文摘要\n\n以预训练 V-JEPA 2 为起点，针对灰度、低分辨率声道实时 MRI 调整输入、增强及时间采样，用 EMA 教师提供 masked latent L1 目标。输入为 50 fps 下 32 帧，即约 640 ms，随后冻结表征，用探针分析发音与言语任务。训练监控特征标准差、有效秩及绝对余弦相似度，避免只看训练损失。\n\n### 创新点\n\n核心是模态适配与受控探针评估，而非新的长期病程生成器。相对直接使用自然视频 V-JEPA，新增 MRI 持续预训练、符合声道运动的帧率和增强。单次检查的毫秒动态并非跨周/月复查；masked context prediction 也不是天然只用历史预测未来。\n\n### 实验支持与局限\n\nTable 1 的外部音素帧级 Cohen kappa：Arti-JEPA **0.352±0.015**，适配 VideoMAE **0.264**，原始 V-JEPA 2 **0.156±0.016**。但该外部 USCLSS 测试来自**一位未见说话者**，不能称多中心临床验证。扩大上下文并加入 biLSTM 后为 0.421，两项同时变化，不能只归因于 LSTM。\n\n最新版内部存在冲突：摘要称约 62 小时，正文描述约 15 小时加 38 小时、超过 50 小时；摘要称口吃二分类没有改善，Table 7 却为 macro-F1 **0.789→0.817**；摘要的术后无下降说法也与正文个别受试者退化不一致。本报告采用正文可核对数字。口吃分析仅七人留一人测试；三种子波动不等于总体临床置信区间。术后分析仅三人。作者报告受试者分离，但非塌缩统计本身不能证明没有数据泄漏。\n\n### 和我方向的适配\n\n**直接相关于医学表征适配，病种和预测时间尺度仍需迁移。** 可借鉴自监督适配、冻结探针、表征诊断的组合。对纵向 MRI，预训练也要按患者与中心划分，测试患者的未标注影像不能自动视为无害。需要分别研究帧内时间、检查间时间和治疗阶段。\n\n### 可借鉴动作\n\n固定骨干和下游头，比较无适配、masked JEPA 适配、真实未来表征预测，并匹配数据量、上下文长度和训练预算；同时比较 MAE/对比学习与直接 pCR/OS 模型。检查 lesion-change probe、中心/扫描器可预测性、少标签曲线和中心留出 pCR/删失生存指标，保留复制/趋势对照。\n\n**否证结果**：域内探针或有效秩改善，但病灶变化与外部临床效用无收益，或收益由更多上下文解释，则不支持目标本身的迁移价值。原文计算为 **单 V100 32GB、26,875 updates、有效 batch 128**，FP16 与激活检查点；未核实 GPU 小时。全文网格缓存约 31 GiB/编码器，池化缓存约 123 MB，可先后者做最低成本探针。\n\n\n\n## 原始摘要\n\nReal-time MRI (rtMRI) captures the dynamics of the entire vocal tract during speech, but labeled data are scarce and the modality - single-slice, grayscale, low-resolution - differs substantially from the natural videos that video foundation models are trained on. We introduce Arti-JEPA, a joint embedding predictive architecture to model vocal tract rtMRI by continuing its self-supervised objective on about 62h of unlabelled vocal-tract videos, and evaluate the frozen representation on three tasks: cross-domain phoneme prediction (on typical speakers), fluent-vs-disfluent classification (a corpus containing stuttered speech), and characterizing pre/post-operative transfer (after partial glossectomy). Three key findings emerge. (1) A temporal video prior decisively outperforms per-frame image encoders, and latent prediction (V-JEPA) is at least as strong as pixel reconstruction (VideoMAE), with the edge on fine-grained phonemes. (2) Domain adaptation is \\emph{task-dependent}: it roughly doubles cross-domain phoneme prediction $\\kappa$ (to 0.352) but does not help binary stuttering classification. (3) Arti-JEPA was able to recover phoneme signal from pre/post glossectomy speech --- an in-domain probe decodes patients at least as well as a typical speaker, indicating that the residual transfer gap is cross-speaker/domain misalignment, not surgical signal loss, and post-operative decoding does not fall below performance on pre-operative speech. Together, these position a frozen, domain-adapted rtMRI encoder as a reusable measurement tool for articulatory and clinical speech science."},{"id":"arxiv:2609.19674","title":"Conservation Buys Stability and Factoring Buys Counterfactuals in Physical World Models","short":"Conservation","date":"2026-09-18","rank":4,"category":"general","topic":"可迁移算法","summary":"长期不发散与改变干预条件后预测正确，需要不同的归纳偏置，不能用同一个 rollout 分数证明两者。","authors":"Wang, Yufeng · Priye, Parivesh · Wei, Lu · Ling, Haibin","firstDate":"2026-09-17","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.19674","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Yufeng Wang, Parivesh Priye, Lu Wei, Haibin Ling。原文：\u003ca href=\"https://arxiv.org/abs/2609.19674\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.19674v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v1\u003c/a>。v1：\u003cstrong>2026-09-17 04:16:51 UTC\u003c/strong>；无修订；预印本；\u003cstrong>未找到官方代码\u003c/strong>。已读方法、主要实验及计算附录。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>长期不发散与改变干预条件后预测正确，需要不同的归纳偏置，不能用同一个 rollout 分数证明两者。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>作者用 symplectic leapfrog 积分学习的 Hamiltonian，并将势能写成 \u003ccode>V(q,G)=G U_theta(q)\u003c/code>，在辛结构与参数分解的 2×2 对照中，分别测试长期稳定性和改变 G 符号后的迁移。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>守恒结构约束数值演化，显式因子控制力随 G 的变化。负 G 下的规律来自参数化假设，而非仅凭正 G 观测被识别。理论上的近守恒针对满足条件的修正能量，不能直接等于真实物理能量准确。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 1 的 2000 步、约训练时距 100 倍实验中，辛模型 192 次均有限，但真实能量相对漂移仍为 \u003cstrong>7.1，即约 710%\u003c/strong>。有限不等于准确。因子化负 G 测试 nMSE 约 0.03–0.18，未因子化约 2.7；故意将真实 G² 写错成线性 G 时，域内仍拟合良好，反转测试误差却升到 0.343，正确 G² 为 0.022。该结果直接说明域内拟合不能验证干预规律。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 借鉴“稳定约束 × 治疗机制分解”的实验设计。肿瘤治疗是开放、耗散、组织增减过程，不宜硬套能量守恒或剂量线性响应。反事实因果解释还需一致性、序贯可交换性、positivity、干预定义及缺失/删失假设。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>先在已知治疗响应方程的模拟器做 2×2 对照，再考虑给真实患者潜状态添加可辩护的生理约束。匹配参数、输入和训练预算，比较多步误差/失败率、剂量外推、病灶变化和直接临床预测。\u003cstrong>否证结果\u003c/strong>：稳定但偏离真实变化，或参数假设轻微错误便让干预结论反转。原文 oracle 单实验单 GPU 约 1–4 分钟，多实验分布到八 GPU，像素任务更久；不是医学 3D 训练成本。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>A learned simulator can reproduce its training conditions accurately yet fail in two distinct ways once those conditions change. Over long rollouts, small errors accumulate until the trajectory drifts away from physically plausible behavior; under an intervention on a physical parameter, the model may continue to follow the law seen during training rather than the intervened one. We show that these two failures require different structural remedies. Evolving a learned energy with a symplectic integrator preserves the geometry of the conservative dynamics and keeps rollouts bounded and physically meaningful for up to $100\\times$ the training horizon, while equal-capacity predictors, an energy-regularized predictor, and a tuned neural ODE diverge. By contrast, encoding the physical coupling through an explicit linear factorization enables the model to follow a never-seen sign of that coupling, whereas an unrestricted parameterization remains locked to the training law. Crucially, the two mechanisms are separable: removing the structure responsible for long-horizon stability leaves counterfactual transfer intact, while removing the factorized coupling destroys counterfactual transfer without eliminating stability. This double dissociation, established with matched controls that remove or replace one structural component at a time, persists beyond the headline three-body system and remains visible when the physical state must be inferred from pixels rather than provided directly. The result is a concrete design principle for physical world models: long-horizon stability and changed-law generalization arise from distinct structural commitments, and each can be imposed deliberately without requiring the other.\u003c/p>\n","markdown":"作者：Yufeng Wang, Parivesh Priye, Lu Wei, Haibin Ling。原文：[arXiv](https://arxiv.org/abs/2609.19674)；[HTML v1](https://arxiv.org/html/2609.19674v1)。v1：**2026-09-17 04:16:51 UTC**；无修订；预印本；**未找到官方代码**。已读方法、主要实验及计算附录。\n\n### 一句话总结\n\n长期不发散与改变干预条件后预测正确，需要不同的归纳偏置，不能用同一个 rollout 分数证明两者。\n\n### 中文摘要\n\n作者用 symplectic leapfrog 积分学习的 Hamiltonian，并将势能写成 `V(q,G)=G U_theta(q)`，在辛结构与参数分解的 2×2 对照中，分别测试长期稳定性和改变 G 符号后的迁移。\n\n### 创新点\n\n守恒结构约束数值演化，显式因子控制力随 G 的变化。负 G 下的规律来自参数化假设，而非仅凭正 G 观测被识别。理论上的近守恒针对满足条件的修正能量，不能直接等于真实物理能量准确。\n\n### 实验支持与局限\n\nTable 1 的 2000 步、约训练时距 100 倍实验中，辛模型 192 次均有限，但真实能量相对漂移仍为 **7.1，即约 710%**。有限不等于准确。因子化负 G 测试 nMSE 约 0.03–0.18，未因子化约 2.7；故意将真实 G² 写错成线性 G 时，域内仍拟合良好，反转测试误差却升到 0.343，正确 G² 为 0.022。该结果直接说明域内拟合不能验证干预规律。\n\n### 和我方向的适配\n\n**可迁移算法。** 借鉴“稳定约束 × 治疗机制分解”的实验设计。肿瘤治疗是开放、耗散、组织增减过程，不宜硬套能量守恒或剂量线性响应。反事实因果解释还需一致性、序贯可交换性、positivity、干预定义及缺失/删失假设。\n\n### 可借鉴动作\n\n先在已知治疗响应方程的模拟器做 2×2 对照，再考虑给真实患者潜状态添加可辩护的生理约束。匹配参数、输入和训练预算，比较多步误差/失败率、剂量外推、病灶变化和直接临床预测。**否证结果**：稳定但偏离真实变化，或参数假设轻微错误便让干预结论反转。原文 oracle 单实验单 GPU 约 1–4 分钟，多实验分布到八 GPU，像素任务更久；不是医学 3D 训练成本。\n\n\n\n## 原始摘要\n\nA learned simulator can reproduce its training conditions accurately yet fail in two distinct ways once those conditions change. Over long rollouts, small errors accumulate until the trajectory drifts away from physically plausible behavior; under an intervention on a physical parameter, the model may continue to follow the law seen during training rather than the intervened one. We show that these two failures require different structural remedies. Evolving a learned energy with a symplectic integrator preserves the geometry of the conservative dynamics and keeps rollouts bounded and physically meaningful for up to $100\\times$ the training horizon, while equal-capacity predictors, an energy-regularized predictor, and a tuned neural ODE diverge. By contrast, encoding the physical coupling through an explicit linear factorization enables the model to follow a never-seen sign of that coupling, whereas an unrestricted parameterization remains locked to the training law. Crucially, the two mechanisms are separable: removing the structure responsible for long-horizon stability leaves counterfactual transfer intact, while removing the factorized coupling destroys counterfactual transfer without eliminating stability. This double dissociation, established with matched controls that remove or replace one structural component at a time, persists beyond the headline three-body system and remains visible when the physical state must be inferred from pixels rather than provided directly. The result is a concrete design principle for physical world models: long-horizon stability and changed-law generalization arise from distinct structural commitments, and each can be imposed deliberately without requiring the other."},{"id":"arxiv:2609.19796","title":"LIFD: Anchored Diffusion for 3D-Aware Scene Memory in Robotic Manipulation","short":"LIFD","date":"2026-09-18","rank":5,"category":"general","topic":"可迁移算法","summary":"把历史记忆与当前观测作为不同条件注入生成器，适合研究缺失观测下的当前患者状态估计，但还不是治疗条件未来预测。","authors":"Li, Wenbo · Chen, Yiteng · Li, Wenhao · Wu, Qingyao","firstDate":"2026-09-17","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.19796","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Wenbo Li, Yiteng Chen, Wenhao Li, Qingyao Wu。原文：\u003ca href=\"https://arxiv.org/abs/2609.19796\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.19796v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v1\u003c/a>。v1：\u003cstrong>2026-09-17 07:07:03 UTC\u003c/strong>；无修订；预印本；\u003cstrong>未找到官方代码\u003c/strong>。已读方法、消融与泛化实验。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>把历史记忆与当前观测作为不同条件注入生成器，适合研究缺失观测下的当前患者状态估计，但还不是治疗条件未来预测。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>模型用几何适配的 VGGT 特征、多视角教师、自蒸馏与 GRU 记忆，将高斯噪声经 Rectified Flow 转为当前全局场景 token。记忆每获得一次新观测更新一次，在 ODE 采样中保持不变。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>AGCA 在生成时间 u 中混合当前观测与历史记忆的 FiLM 条件，逐渐增强当前观测权重。它是学习到的 anchoring，并非严格几何约束。生成时间 u 与真实世界观测时间必须区分。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>LIBERO 平均成功率 91.6%，joint 基线 88.5%；移除 anchor、memory 或 RF 均显著降低对应消融成绩。但方法额外使用约 11 万帧几何训练资料，跨方法输入与预算未完全匹配。RoboTwin easy/hard 为 \u003cstrong>63.2/19.4\u003c/strong>，OOD 差距明显。SCI 从 0.20 到 0.14 是相对教师的 token 一致性，不是几何真值准确度或概率校准。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可放在未来预测器之前，融合既往影像与当前缺失模态，估计当前患者状态。需要训练期完整/多模态教师；不能使用测试患者未来检查当教师，也不能假设治疗后的不可见组织仍维持旧状态。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>比较拼接、GRU、确定性补全头、记忆条件 RF，并分别消融 anchor 与 memory。控制教师数据和算力，评价缺失 ROI/模态重建、未来病灶变化及同预算直接 pCR/OS；按观测可见和不可见区域分层。\u003cstrong>否证结果\u003c/strong>：只改善教师相似度，未来变化或临床任务不改善。原文 RTX 4090 上 50 RF 步约 190 ms、20 步约 75 ms，训练成本未核实；这些不是医学体数据延迟。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Robotic manipulation under partial observability requires spatial information that extends beyond the current view. Geometry-aware RGB features describe visible structure, but previously observed regions may disappear as the robot or scene moves. Maintaining a useful scene representation therefore requires retaining observation history while inferring missing content without losing its connection to visible evidence. We introduce LIFD (Look, Imagine, Focus, and Do), a framework for persistent, 3D-aware scene memory. LIFD learns a scene-token representation from multi-view agreement and completes it from a single RGB view and recurrent memory. A rectified-flow model generates the tokens while Anchor-Guided Cross-Attention conditions completion on current geometric features. Compact slot features connect this representation to a manipulation policy. Multi-view and geometric supervision are used during representation learning; deployment requires one RGB camera, proprioception, and a task instruction. LIFD (Staged) reaches 91.6% average success on LIBERO and 79.8% on MetaWorld, improving LIBERO average success by 3.1 percentage points over Joint training. On four UR5e task families with ten demonstrations per family, it achieves 56.0% mean success, compared with 40.5% for OpenVLA-7B.\u003c/p>\n","markdown":"作者：Wenbo Li, Yiteng Chen, Wenhao Li, Qingyao Wu。原文：[arXiv](https://arxiv.org/abs/2609.19796)；[HTML v1](https://arxiv.org/html/2609.19796v1)。v1：**2026-09-17 07:07:03 UTC**；无修订；预印本；**未找到官方代码**。已读方法、消融与泛化实验。\n\n### 一句话总结\n\n把历史记忆与当前观测作为不同条件注入生成器，适合研究缺失观测下的当前患者状态估计，但还不是治疗条件未来预测。\n\n### 中文摘要\n\n模型用几何适配的 VGGT 特征、多视角教师、自蒸馏与 GRU 记忆，将高斯噪声经 Rectified Flow 转为当前全局场景 token。记忆每获得一次新观测更新一次，在 ODE 采样中保持不变。\n\n### 创新点\n\nAGCA 在生成时间 u 中混合当前观测与历史记忆的 FiLM 条件，逐渐增强当前观测权重。它是学习到的 anchoring，并非严格几何约束。生成时间 u 与真实世界观测时间必须区分。\n\n### 实验支持与局限\n\nLIBERO 平均成功率 91.6%，joint 基线 88.5%；移除 anchor、memory 或 RF 均显著降低对应消融成绩。但方法额外使用约 11 万帧几何训练资料，跨方法输入与预算未完全匹配。RoboTwin easy/hard 为 **63.2/19.4**，OOD 差距明显。SCI 从 0.20 到 0.14 是相对教师的 token 一致性，不是几何真值准确度或概率校准。\n\n### 和我方向的适配\n\n**可迁移算法。** 可放在未来预测器之前，融合既往影像与当前缺失模态，估计当前患者状态。需要训练期完整/多模态教师；不能使用测试患者未来检查当教师，也不能假设治疗后的不可见组织仍维持旧状态。\n\n### 可借鉴动作\n\n比较拼接、GRU、确定性补全头、记忆条件 RF，并分别消融 anchor 与 memory。控制教师数据和算力，评价缺失 ROI/模态重建、未来病灶变化及同预算直接 pCR/OS；按观测可见和不可见区域分层。**否证结果**：只改善教师相似度，未来变化或临床任务不改善。原文 RTX 4090 上 50 RF 步约 190 ms、20 步约 75 ms，训练成本未核实；这些不是医学体数据延迟。\n\n\n\n## 原始摘要\n\nRobotic manipulation under partial observability requires spatial information that extends beyond the current view. Geometry-aware RGB features describe visible structure, but previously observed regions may disappear as the robot or scene moves. Maintaining a useful scene representation therefore requires retaining observation history while inferring missing content without losing its connection to visible evidence. We introduce LIFD (Look, Imagine, Focus, and Do), a framework for persistent, 3D-aware scene memory. LIFD learns a scene-token representation from multi-view agreement and completes it from a single RGB view and recurrent memory. A rectified-flow model generates the tokens while Anchor-Guided Cross-Attention conditions completion on current geometric features. Compact slot features connect this representation to a manipulation policy. Multi-view and geometric supervision are used during representation learning; deployment requires one RGB camera, proprioception, and a task instruction. LIFD (Staged) reaches 91.6% average success on LIBERO and 79.8% on MetaWorld, improving LIBERO average success by 3.1 percentage points over Joint training. On four UR5e task families with ten demonstrations per family, it achieves 56.0% mean success, compared with 40.5% for OpenVLA-7B."},{"id":"arxiv:2609.19142","title":"PointZero: 3D Point Track Completion for Learning Transferable 3D Dynamics","short":"PointZero","date":"2026-09-18","rank":6,"category":"general","topic":"可迁移算法","summary":"稀疏轨迹补全提供密集的动力学预训练监督，但临床测试时不能把真实未来病灶轨迹作为条件输入。","authors":"Duisterhof, Bardienus P. · Zhang, Kaifeng · Hung, Adam · Wen, Bowen · Birchfield, Stan · Li, Yunzhu · Ramanan, Deva · Ichnowski, Jeffrey","firstDate":"2026-09-16","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.19142","codeUrl":"https://github.com/Duisterhof/pointzero","image":"","imageLabel":"","html":"\u003cp>作者：Bardienus P. Duisterhof, Kaifeng Zhang, Adam Hung, Bowen Wen, Stan Birchfield, Yunzhu Li, Deva Ramanan, Jeffrey Ichnowski。原文：\u003ca href=\"https://arxiv.org/abs/2609.19142\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.19142v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v1\u003c/a>；\u003ca href=\"https://pointzero-wm.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\">项目页\u003c/a>。v1：\u003cstrong>2026-09-16 17:59:30 UTC\u003c/strong>；无修订；预印本。官方仓库：\u003ca href=\"https://github.com/Duisterhof/pointzero\" target=\"_blank\" rel=\"noopener noreferrer\">Duisterhof/pointzero\u003c/a>，目前只有 README 和展示图，写明 Release coming soon，\u003cstrong>实现、权重及数据未核实发布\u003c/strong>。已读方法与消融。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>稀疏轨迹补全提供密集的动力学预训练监督，但临床测试时不能把真实未来病灶轨迹作为条件输入。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>根据初始 RGB-D 点云和 1–3 条完整未来点轨迹，预测所有点的十帧轨迹；预训练数据约 290 万合成帧。Perceiver 压缩视觉特征后使用 DiT，比较直接回归、FM 的速度预测与 JiT 风格端点预测。后训练用已规划机器人末端姿态替换稀疏未来轨迹条件。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>把 robot-free 轨迹补全用作通用几何动态预训练，再连接动作。Robot-free 并不表示无监督：合成器提供密集轨迹真值；端点形式也仍通过隐含速度损失训练。既有点的运动不能自然表示新病灶出现、肿瘤组织增生或消失。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 4 的二十条示范、无额外 actionless 视频对照，scratch \u003cstrong>80.5→预训练 88.2\u003c/strong>，但 Blockstack 单任务 93.5→93.2，并非普遍提高。主实验若额外使用一百条无动作视频，不能与这一干净消融混用；另一些对照还同时改变点流是否冻结。大量机器人 rollout 不等于大量独立患者证据。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可用训练患者的已配准病灶关键点或区域形变作为辅助标签，强化变化表征；测试只给历史、治疗和真实间隔。需要可靠对应，形变与组织增减要分开表示。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>缓存低分辨率病灶 token，比较轨迹辅助、体积辅助、直接潜状态预测及无辅助的相同网络；加入轨迹打乱对照，并与同输入预算的直接 pCR/OS 比较。评价病灶变化、长期误差和跨中心临床效用。\u003cstrong>否证结果\u003c/strong>：收益依赖输入真实未来轨迹，或简单体积监督达到相同效果。原文每变体约 \u003cstrong>8 H100 × 2 天，折合约 384 GPU 小时\u003c/strong>；医学最小实验只做小头估计单 GPU，当前不建议等待之外先照搬完整预训练。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>World models endow perceptual systems with the ability to predict how scenes evolve under interaction. They are most beneficial when trained on diverse volumes of data, to instill a rich prior into downstream applications. Existing methods typically require robot action labels to learn action-conditioned 3D dynamics, which excludes web video data from the training pool. We study 3D point track completion as a pre-training objective for learning transferable 3D dynamics without robot data. Given a single RGB-D observation and sparse partial 3D trajectories (tracks), we predict future 3D tracks of all observed points. We show this objective produces a rich 3D dynamics prior, without requiring robot action labels. We contribute a diverse dataset of 2.9 million synthetic frames spanning deformable, articulated, and rigid objects, and use it to train PointZero. We show that a flexible and expressive transformer, PointZero, outperforms prior methods on the same data. We demonstrate the utility of our pre-training objective by post-training PointZero for two downstream applications: (1) action-conditioned 3D dynamics prediction and (2) imitation learning. When fine-tuned to condition on end-effector pose, PointZero outperforms the baselines on the recent PGND 3D dynamics benchmark. When fine-tuned to predict robot actions and 3D tracks, PointZero outperforms or matches the baselines on 6/7 simulated and real-world robot manipulation tasks. We furthermore evaluate training PointZero from scratch to isolate the benefits of our proposed architecture from those of our proposed pre-training objective and dataset. We release the dataset, checkpoints, and full training recipe.\u003c/p>\n","markdown":"作者：Bardienus P. Duisterhof, Kaifeng Zhang, Adam Hung, Bowen Wen, Stan Birchfield, Yunzhu Li, Deva Ramanan, Jeffrey Ichnowski。原文：[arXiv](https://arxiv.org/abs/2609.19142)；[HTML v1](https://arxiv.org/html/2609.19142v1)；[项目页](https://pointzero-wm.github.io)。v1：**2026-09-16 17:59:30 UTC**；无修订；预印本。官方仓库：[Duisterhof/pointzero](https://github.com/Duisterhof/pointzero)，目前只有 README 和展示图，写明 Release coming soon，**实现、权重及数据未核实发布**。已读方法与消融。\n\n### 一句话总结\n\n稀疏轨迹补全提供密集的动力学预训练监督，但临床测试时不能把真实未来病灶轨迹作为条件输入。\n\n### 中文摘要\n\n根据初始 RGB-D 点云和 1–3 条完整未来点轨迹，预测所有点的十帧轨迹；预训练数据约 290 万合成帧。Perceiver 压缩视觉特征后使用 DiT，比较直接回归、FM 的速度预测与 JiT 风格端点预测。后训练用已规划机器人末端姿态替换稀疏未来轨迹条件。\n\n### 创新点\n\n把 robot-free 轨迹补全用作通用几何动态预训练，再连接动作。Robot-free 并不表示无监督：合成器提供密集轨迹真值；端点形式也仍通过隐含速度损失训练。既有点的运动不能自然表示新病灶出现、肿瘤组织增生或消失。\n\n### 实验支持与局限\n\nTable 4 的二十条示范、无额外 actionless 视频对照，scratch **80.5→预训练 88.2**，但 Blockstack 单任务 93.5→93.2，并非普遍提高。主实验若额外使用一百条无动作视频，不能与这一干净消融混用；另一些对照还同时改变点流是否冻结。大量机器人 rollout 不等于大量独立患者证据。\n\n### 和我方向的适配\n\n**可迁移算法。** 可用训练患者的已配准病灶关键点或区域形变作为辅助标签，强化变化表征；测试只给历史、治疗和真实间隔。需要可靠对应，形变与组织增减要分开表示。\n\n### 可借鉴动作\n\n缓存低分辨率病灶 token，比较轨迹辅助、体积辅助、直接潜状态预测及无辅助的相同网络；加入轨迹打乱对照，并与同输入预算的直接 pCR/OS 比较。评价病灶变化、长期误差和跨中心临床效用。**否证结果**：收益依赖输入真实未来轨迹，或简单体积监督达到相同效果。原文每变体约 **8 H100 × 2 天，折合约 384 GPU 小时**；医学最小实验只做小头估计单 GPU，当前不建议等待之外先照搬完整预训练。\n\n\n\n## 原始摘要\n\nWorld models endow perceptual systems with the ability to predict how scenes evolve under interaction. They are most beneficial when trained on diverse volumes of data, to instill a rich prior into downstream applications. Existing methods typically require robot action labels to learn action-conditioned 3D dynamics, which excludes web video data from the training pool. We study 3D point track completion as a pre-training objective for learning transferable 3D dynamics without robot data. Given a single RGB-D observation and sparse partial 3D trajectories (tracks), we predict future 3D tracks of all observed points. We show this objective produces a rich 3D dynamics prior, without requiring robot action labels. We contribute a diverse dataset of 2.9 million synthetic frames spanning deformable, articulated, and rigid objects, and use it to train PointZero. We show that a flexible and expressive transformer, PointZero, outperforms prior methods on the same data. We demonstrate the utility of our pre-training objective by post-training PointZero for two downstream applications: (1) action-conditioned 3D dynamics prediction and (2) imitation learning. When fine-tuned to condition on end-effector pose, PointZero outperforms the baselines on the recent PGND 3D dynamics benchmark. When fine-tuned to predict robot actions and 3D tracks, PointZero outperforms or matches the baselines on 6/7 simulated and real-world robot manipulation tasks. We furthermore evaluate training PointZero from scratch to isolate the benefits of our proposed architecture from those of our proposed pre-training objective and dataset. We release the dataset, checkpoints, and full training recipe."},{"id":"arxiv:2609.19729","title":"Recency Forcing: Bridging the Long-Horizon Gap in Autoregressive Video Generation","short":"Recency-Forcing","date":"2026-09-18","rank":7,"category":"general","topic":"可迁移算法","summary":"对使用长历史注意力和 KV 缓存淘汰的模型，训练与推理的记忆长度差异可能是长期漂移的来源。","authors":"Cao, Tri · Nguyen, Hung · Nguyen, Phong · Nguyen, Khoi","firstDate":"2026-09-17","revisionDate":"","version":"v1","evidence":"仅摘要","publication":"预印本","url":"https://arxiv.org/abs/2609.19729v1","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Tri Cao, Hung Nguyen, Phong Nguyen, Khoi Nguyen。原文：\u003ca href=\"https://arxiv.org/abs/2609.19729v1\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv v1\u003c/a>。v1：\u003cstrong>2026-09-17 05:40:53 UTC\u003c/strong>；无修订；预印本；\u003cstrong>未找到官方代码\u003c/strong>。\u003cstrong>仅阅读原站摘要与元数据；HTML 全文返回 404，未下载 PDF。\u003c/strong>\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>对使用长历史注意力和 KV 缓存淘汰的模型，训练与推理的记忆长度差异可能是长期漂移的来源。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>摘要提出以扰动测量位置响应，分析帧距与去噪时刻对注意力的影响，再用非正 Temporal Response Bias 降低远期帧影响，避免直接截断上下文；BAR 重参数化旨在兼容高效注意力。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>可迁移的是对历史注意力进行时间相关约束，而非简单增加历史窗口。摘要主张高效且改善长期生成，但本次无法核实完整目标、超参、定量结果或零开销主张。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法，条件性低优先级。\u003c/strong> 只有实际存在窗口淘汰或很长历史时才值得实验。三四次复查通常不满足这一条件；初始病灶与治疗切换点可能长期重要，不能机械按“越旧越不重要”处理。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在相同历史输入与容量下比较无偏置、截断、按真实时间间隔学习的偏置，始终保留基线与治疗节点；生成时间和临床时间分别编码。固定推理预算，比较 rollout 误差、病灶变化及同输入临床预测。\u003cstrong>否证结果\u003c/strong>：收益仅出现在人工长窗口而不出现在真实访视数，或遗忘关键治疗历史，则不应优先迁移。原论文算力未核实；缓存潜变量注意力消融可先单 GPU，属基于模块规模的估计。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Autoregressive (AR) video generation degrades over long horizons due to an overlooked train-inference discrepancy we term KV eviction mismatch: models train on short clips where all context frames reside in the KV cache, but at inference, memory constraints force distant frames to be evicted from the KV cache - removing context the model was conditioned on. Rather than simulating eviction via context truncation - which discards temporal information the model still needs and degrades motion coherence - we keep the context but while progressively reducing the influence of distant frames, making their eventual eviction negligible. To guide this design, we introduce the positional response $R( \\Delta, , t_{\\text{denoise}})$, a perturbation-based sensitivity measure revealing that context influence decays steeply with temporal distance and varies systematically across denoising steps. Motivated by this analysis, we propose Recency Forcing, which applies a non-positive, timestep-dependent bias, termed Temporal Response Bias (TRB), on pre-softmax attention logits derived directly from $R$, closing the train-inference gap without modifying context length or training objectives. We further introduce Biased Attention Reparameterization (BAR), an exact reformulation that moves the bias outside the softmax, making TRB a standard FlashAttention call at zero overhead. Recency Forcing operates in both training-free mode and training-based mode. Experiments on VBench and VBench-Long demonstrate state-of-the-art long-horizon generation quality at no additional inference cost.\u003c/p>\n","markdown":"作者：Tri Cao, Hung Nguyen, Phong Nguyen, Khoi Nguyen。原文：[arXiv v1](https://arxiv.org/abs/2609.19729v1)。v1：**2026-09-17 05:40:53 UTC**；无修订；预印本；**未找到官方代码**。**仅阅读原站摘要与元数据；HTML 全文返回 404，未下载 PDF。**\n\n### 一句话总结\n\n对使用长历史注意力和 KV 缓存淘汰的模型，训练与推理的记忆长度差异可能是长期漂移的来源。\n\n### 中文摘要\n\n摘要提出以扰动测量位置响应，分析帧距与去噪时刻对注意力的影响，再用非正 Temporal Response Bias 降低远期帧影响，避免直接截断上下文；BAR 重参数化旨在兼容高效注意力。\n\n### 创新点\n\n可迁移的是对历史注意力进行时间相关约束，而非简单增加历史窗口。摘要主张高效且改善长期生成，但本次无法核实完整目标、超参、定量结果或零开销主张。\n\n### 和我方向的适配\n\n**可迁移算法，条件性低优先级。** 只有实际存在窗口淘汰或很长历史时才值得实验。三四次复查通常不满足这一条件；初始病灶与治疗切换点可能长期重要，不能机械按“越旧越不重要”处理。\n\n### 可借鉴动作\n\n在相同历史输入与容量下比较无偏置、截断、按真实时间间隔学习的偏置，始终保留基线与治疗节点；生成时间和临床时间分别编码。固定推理预算，比较 rollout 误差、病灶变化及同输入临床预测。**否证结果**：收益仅出现在人工长窗口而不出现在真实访视数，或遗忘关键治疗历史，则不应优先迁移。原论文算力未核实；缓存潜变量注意力消融可先单 GPU，属基于模块规模的估计。\n\n\n\n## 原始摘要\n\nAutoregressive (AR) video generation degrades over long horizons due to an overlooked train-inference discrepancy we term KV eviction mismatch: models train on short clips where all context frames reside in the KV cache, but at inference, memory constraints force distant frames to be evicted from the KV cache - removing context the model was conditioned on. Rather than simulating eviction via context truncation - which discards temporal information the model still needs and degrades motion coherence - we keep the context but while progressively reducing the influence of distant frames, making their eventual eviction negligible. To guide this design, we introduce the positional response $R( \\Delta, \\, t_{\\text{denoise}})$, a perturbation-based sensitivity measure revealing that context influence decays steeply with temporal distance and varies systematically across denoising steps. Motivated by this analysis, we propose Recency Forcing, which applies a non-positive, timestep-dependent bias, termed Temporal Response Bias (TRB), on pre-softmax attention logits derived directly from $R$, closing the train-inference gap without modifying context length or training objectives. We further introduce Biased Attention Reparameterization (BAR), an exact reformulation that moves the bias outside the softmax, making TRB a standard FlashAttention call at zero overhead. Recency Forcing operates in both training-free mode and training-based mode. Experiments on VBench and VBench-Long demonstrate state-of-the-art long-horizon generation quality at no additional inference cost."},{"id":"arxiv:2609.16934","title":"MedPCFM-TED: One-Step Point Cloud Flow Matching for Implant Generation via Teacher-Guided Endpoint Distillation","short":"MedPCFM-TED","date":"2026-09-18","rank":8,"category":"medical","topic":"直接相关","summary":"有强条件约束的医学点云生成可以直接蒸馏到一步，但结果是否仍保留合理条件分布，需要超出平均形状质量的验证。","authors":"Kwarciak, Kamil · Wodzinski, Marek","firstDate":"2026-09-15","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.16934","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Kamil Kwarciak, Marek Wodzinski。原文：\u003ca href=\"https://arxiv.org/abs/2609.16934\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.16934v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v1\u003c/a>。v1：\u003cstrong>2026-09-15 10:10:17 UTC\u003c/strong>；无修订；预印本；\u003cstrong>未找到官方代码\u003c/strong>。已读完整方法、评价协议及主结果。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>有强条件约束的医学点云生成可以直接蒸馏到一步，但结果是否仍保留合理条件分布，需要超出平均形状质量的验证。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>以缺损颅骨点云为条件，用多步 PCFM 教师生成植入物端点。学生预测从相同噪声到教师端点的位移，目标包含位移 MSE、学生对教师 Chamfer、学生对真实植入物 Chamfer，三项权重均为 1，不显式执行轨迹拉直。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>相对先拉直再蒸馏，简化为端点监督并加入真值几何项。论文将 PSF 实现为教师 Chamfer 对照、IMLE 使用四候选最邻近监督；这些并不等于完整复现所有原方法训练流程。真值 Chamfer 还会改变纯教师分布蒸馏的目标，可能收缩多模态结果。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>SkullBreak DSC 教师 \u003cstrong>0.744→TED 0.766\u003c/strong>，但 Chamfer \u003cstrong>0.127→0.144\u003c/strong> 变差；SkullFix DSC \u003cstrong>0.824→0.801\u003c/strong>。单次生成耗时表列 \u003cstrong>3.195→0.0434 秒\u003c/strong>。质量指标却用多次随机生成、共识密度聚合后评价，不能直接当单次采样质量；聚合次数和后处理总延迟还需核对。Heun 的步数/NFE 文中口径存在混用，应实测网络调用数。两数据集共 600/70/210 个训练/验证/测试样本，不能自行等同独立患者数。没有患者级不确定性校准证据。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关于医学生成，面向纵向任务需迁移。\u003c/strong> 可以给已验证有效的 latent FM 增加一步学生。颅骨补全受当前几何强约束，治疗后的病灶变化不一定具有同等确定性。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>固定教师和训练划分，比较教师多步/少步、纯教师端点 MSE、加几何真值项、同容量直接回归。分别报告单样本与固定 K 聚合，计入教师训练和蒸馏成本；检查条件模态覆盖、energy score/CRPS、病灶变化误差与同预算直接 pCR/OS。\u003cstrong>否证结果\u003c/strong>：加速同时降低覆盖、消除少数患者响应模式，或优势来自聚合/后处理，则不能宣称保真蒸馏。原实验 \u003cstrong>GH200 96GB，教师 15,000 epochs、batch 16\u003c/strong>，学生使用相同训练超参；GPU 小时未核实。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Cranial implant generation is an important task in medical imaging. Recent point cloud based generative methods, particularly flow matching, offer strong reconstruction quality and efficient sampling, but still require multiple neural function evaluations during inference. This limits rapid generation of multiple plausible implant candidates. We propose Teacher-guided Endpoint Distillation (TED), a simple one-step distillation framework for conditional cranial implant generation on point clouds. TED trains a one-step student using teacher-guided endpoint supervision and geometric matching losses, while avoiding explicit path straightening. We evaluate TED on the SkullFix and SkullBreak benchmarks. TED achieves the best overall performance on the SkullBreak dataset, remains competitive on SkullFix, and provides the strongest Chamfer distance performance among the compared one-step methods. In addition, TED generates implants in approximately 0.04s per sample. These results show that one-step distillation can substantially accelerate conditional point cloud implant generation without sacrificing reconstruction quality.\u003c/p>\n","markdown":"作者：Kamil Kwarciak, Marek Wodzinski。原文：[arXiv](https://arxiv.org/abs/2609.16934)；[HTML v1](https://arxiv.org/html/2609.16934v1)。v1：**2026-09-15 10:10:17 UTC**；无修订；预印本；**未找到官方代码**。已读完整方法、评价协议及主结果。\n\n### 一句话总结\n\n有强条件约束的医学点云生成可以直接蒸馏到一步，但结果是否仍保留合理条件分布，需要超出平均形状质量的验证。\n\n### 中文摘要\n\n以缺损颅骨点云为条件，用多步 PCFM 教师生成植入物端点。学生预测从相同噪声到教师端点的位移，目标包含位移 MSE、学生对教师 Chamfer、学生对真实植入物 Chamfer，三项权重均为 1，不显式执行轨迹拉直。\n\n### 创新点\n\n相对先拉直再蒸馏，简化为端点监督并加入真值几何项。论文将 PSF 实现为教师 Chamfer 对照、IMLE 使用四候选最邻近监督；这些并不等于完整复现所有原方法训练流程。真值 Chamfer 还会改变纯教师分布蒸馏的目标，可能收缩多模态结果。\n\n### 实验支持与局限\n\nSkullBreak DSC 教师 **0.744→TED 0.766**，但 Chamfer **0.127→0.144** 变差；SkullFix DSC **0.824→0.801**。单次生成耗时表列 **3.195→0.0434 秒**。质量指标却用多次随机生成、共识密度聚合后评价，不能直接当单次采样质量；聚合次数和后处理总延迟还需核对。Heun 的步数/NFE 文中口径存在混用，应实测网络调用数。两数据集共 600/70/210 个训练/验证/测试样本，不能自行等同独立患者数。没有患者级不确定性校准证据。\n\n### 和我方向的适配\n\n**直接相关于医学生成，面向纵向任务需迁移。** 可以给已验证有效的 latent FM 增加一步学生。颅骨补全受当前几何强约束，治疗后的病灶变化不一定具有同等确定性。\n\n### 可借鉴动作\n\n固定教师和训练划分，比较教师多步/少步、纯教师端点 MSE、加几何真值项、同容量直接回归。分别报告单样本与固定 K 聚合，计入教师训练和蒸馏成本；检查条件模态覆盖、energy score/CRPS、病灶变化误差与同预算直接 pCR/OS。**否证结果**：加速同时降低覆盖、消除少数患者响应模式，或优势来自聚合/后处理，则不能宣称保真蒸馏。原实验 **GH200 96GB，教师 15,000 epochs、batch 16**，学生使用相同训练超参；GPU 小时未核实。\n\n\n\n## 原始摘要\n\nCranial implant generation is an important task in medical imaging. Recent point cloud based generative methods, particularly flow matching, offer strong reconstruction quality and efficient sampling, but still require multiple neural function evaluations during inference. This limits rapid generation of multiple plausible implant candidates. We propose Teacher-guided Endpoint Distillation (TED), a simple one-step distillation framework for conditional cranial implant generation on point clouds. TED trains a one-step student using teacher-guided endpoint supervision and geometric matching losses, while avoiding explicit path straightening. We evaluate TED on the SkullFix and SkullBreak benchmarks. TED achieves the best overall performance on the SkullBreak dataset, remains competitive on SkullFix, and provides the strongest Chamfer distance performance among the compared one-step methods. In addition, TED generates implants in approximately 0.04s per sample. These results show that one-step distillation can substantially accelerate conditional point cloud implant generation without sacrificing reconstruction quality."},{"id":"arxiv:2609.18734","title":"Conditionally linear, matrix normal state space models","short":"Matrix-SSM","date":"2026-09-18","rank":9,"category":"general","topic":"可迁移算法","summary":"对具有实体与特征两轴的纵向状态，矩阵正态模型提供结构明确的概率基线，但计算优势依赖较强协方差假设。","authors":"Creal, Drew D. · Medeiros, Marcelo C. · Sarlo, Rodrigo","firstDate":"2026-09-16","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.18734","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Drew D. Creal, Marcelo C. Medeiros, Rodrigo Sarlo。原文：\u003ca href=\"https://arxiv.org/abs/2609.18734\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.18734v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML v1\u003c/a>。v1：\u003cstrong>2026-09-16 14:31:37 UTC\u003c/strong>；无修订；预印本；\u003cstrong>未找到官方代码\u003c/strong>。已读模型假设、矩阵滤波、缺失处理和主要实证，未逐项复核全部推导。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>对具有实体与特征两轴的纵向状态，矩阵正态模型提供结构明确的概率基线，但计算优势依赖较强协方差假设。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>保持 \u003ccode>Y_t = D_t + Z_t A_t W_t^T + E_t\u003c/code> 的矩阵结构，构造 Kalman filter、似然、平滑及后验轨迹采样，避免朴素向量化产生的大 Kronecker 协方差。可加入混合频率、重尾与方差状态。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>统一推广矩阵状态的滤波和联合轨迹抽样。闭式递推要求共享右尺度矩阵及相容的测量结构；不是任意双边变换、任意相关性的免费加速。整行缺失与零散元素缺失不同，后者在附录回到向量化条件系统做插补。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>应用为美国五十州、十二经济变量，600 条观测序列压缩成 3×11 的潜因子矩阵。结果主要展示拟合、因子解释和 MCMC 混合；部分参数五万次 burn-in 后样本的有效样本数约 760。没有医学或严格前瞻预测胜过神经模型的证据。计算复杂度讨论针对朴素向量 Kalman，大幅理论比例不是实测端到端加速。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可用患者内“病灶/模态 × 低维特征”的状态，构造小样本概率对照；患者之间保持独立单位，不能用跨患者共同时间矩阵偷带测试信息。不规则临床间隔需要显式时间依赖转移；原文的月/季度混合频率不自动解决连续时间
