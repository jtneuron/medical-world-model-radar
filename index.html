生存模型。另设“额外训练预算但不生成”的控制，区别生成目标收益与训练量收益。\n\n**评价**：按患者划分，全部调参仅在训练/验证集；报告各预测间隔的潜误差、病灶内变化误差、体积变化 MAE、增长/缩小方向、两步误差增量。全图 SSIM 单列。下游比较 AUPRC、AUROC、Brier；有合法生存标签时，在统一 landmark 用 IPCW C-index、时间依赖 AUC、IBS，并对整个训练流程作患者层面的重复验证。不能让生成器见过测试患者后再评价其生成表征的价值。\n\n**推翻标准**：联合 FM 在患者配对置信区间内未优于确定性联合预测；改善仅见于全局相似度；或同预算直接模型消除了下游收益。尤其要检查大变化患者是否仍回归到平均/复制状态。\n\n**算力**：原文 Appendix A 报告单张 RTX 6000 Ada、20 epochs、batch 128、h=5；没有给可迁移到你数据的训练时长。冻结编码器、全局/少量 ROI token 的小头试验估计可在单卡完成，依据是只训练低维潜头；体积 token 版本需另做显存估算，不把机器人耗时外推为 3D MRI 耗时。\n\n### 原始摘要或证据来源\n\n原始英文摘要逐字保存在 `论文记录` 及对应独立论文笔记。上述机制来自全文 §3-4，结果与对照限制来自 §5、Appendix A。\n\n## 2. Observation-Anchored Selective Assimilation（OASA）\n\n### 一句话总结\n\n治疗后胶质瘤预测中，以最新 MRI 的标签衍生状态为基准，谨慎接纳模型预测变化；主要价值是展示了强复制基线和阈值收益的边界。\n\n### 来源与状态\n\n- 作者：Yeonjae Jung、Minwoo Shin。\n\n- [原始页面](https://arxiv.org/abs/2609.12435)；[已读全文 v1](https://arxiv.org/html/2609.12435v1)。v1：2026-09-11 04:55:54 UTC；无后续修订。预印本，未核实正式录用。\n\n- [官方代码](https://github.com/jsudg436/longitudinal-proxy-forecasting)：论文链接与公开仓库匹配，含配置、源代码和实验产物目录；未核验仓库结果是否逐项复现论文。\n\n\n### 中文摘要与创新点\n\n使用 MU-Glioma Post 的 203 名患者、594 次随访；236 个候选三时点组合经“区间内无记录的新治疗开始”过滤后，保留 **72 名患者的 120 个 triplets**，训练/验证/测试为 81/24/15 triplets，按患者隔离。\n\n预测的 p 不是未来 MRI，也不是实测肿瘤细胞密度。它由非增强核心、FLAIR 异常、增强病灶标签分别赋权 0.7/0.4/1.0 后平滑得到。模型单次输入包括四种 MRI、当前 proxy、切除腔和按 180 天归一化的时间间隔。SegMamba 输出变化分数 q 与速度 v，先作残差预测；OASA 再根据前一段预测与新观测的差异 I、预测变化范围 B，选择病例级缩放 beta，并按体素门控：\n\n`p_hat_t2 = clip(p_observed_t1 + beta(I,B) * q12 * (p_direct_t2 - p_observed_t1), 0, 1)`。\n\n训练包括变化加权 L1、Dice、速度、变化 BCE 和稳定区正则。病例分档规则来自验证集，不是校准过的概率置信度。“Calibration”另外把接近 0.2 的值抬到 0.201，是评价阈值附近的 support 调整。\n\n### 实验支持什么\n\n| 方法 | RMSE，低为好 | Dice@0.2 | Dice@0.5 |\n|---|---:|---:|---:|\n| 最新观测复制 | 0.0465 | 0.6070 | 0.3981 |\n| 直接预测 | 0.0674 ± 0.0027 | 0.6021 ± 0.0189 | 0.2777 ± 0.0121 |\n| OASA | 0.0472 ± 0.0005 | 0.6071 ± 0.0025 | 0.4269 ± 0.0079 |\n| OASA + 阈值调整 | 0.0471 ± 0.0006 | 0.6178 ± 0.0025 | 0.4269 ± 0.0079 |\n\n作者报告 OASA 相对直接预测的 Dice@0.5 配对提升为 0.1493，95% CI 0.0291–0.3055；**相对复制和形态学膨胀的 Dice 差异 CI 包含 0**。阈值调整提高 Dice@0.2，但 FP 从 11,836 增到 18,663，同时 FN 从 22,107 降到 17,536。表中 ± 是三个种子的总体标准差，不是患者泛化置信区间。\n\n我的判断：证据支持“保守更新比这个直接预测器稳定”，不支持“已学到更准确的肿瘤生物学”。测试只有 15 triplets；统计 bootstrap 按 triplet 抽样，如果同患者贡献多个 triplet，需要进一步采用患者聚类 bootstrap。源标签质量、proxy 权重和固定裁剪也会改变评价结果。“无新治疗开始”仍可能包含既往治疗的持续效应，不能解释为 untreated natural history。\n\n### 和我方向的适配\n\n**直接相关，主要用于评价和状态更新设计。** 它匹配胶质瘤 MRI、不规则间隔、有限纵向历史，但不包含可比较的治疗方案效应，不预测 OS/pCR，也不生成完整影像。对 I-SPY2 可迁移“新访视到达后更新状态”的机制，但治疗诱导的明显变化可能被保守门控压掉，必须按响应幅度分层评估。\n\n### 可借鉴动作：最小验证实验\n\n**改动位置**：在既有未来 latent/病灶状态预测之后增加一个验证集拟合的残差缩放器，先不改模型训练。以最近两次已知访视的预测误差作为可用历史信号。\n\n**必要对照**：最新观测复制、线性时间外推、原模型、固定残差缩放、历史误差自适应缩放；若预测 mask/proxy，加入简单膨胀/腐蚀与单独阈值调整。只允许在验证集定门控与阈值。\n\n**评价**：同时报告连续变化误差、变化区域 Dice、增长/缩小方向、FP/FN、新病灶召回和体积变化；对小变化、大变化分别统计，以患者聚类 bootstrap 给 CI。最新观测已到达的更新任务，与尚未获得新影像的纯 rollout 必须分开比较。\n\n**推翻标准**：优势可被复制、固定缩放或阈值调整解释；或门控使大幅进展/治疗响应的召回下降。门控没有临床收益时，不因整体 RMSE 好看而保留。\n\n**算力**：原文 §3.2 为两张 RTX A6000、60 epochs、128^3 crop、每 GPU batch 2。本建议首步只重算已有预测和小缩放器，通常无需重训大模型；这是基于实验设计的估计。\n\n### 原始摘要或证据来源\n\n全文 §2.1-2.4 给出 proxy、门控与阈值操作；§3 给队列/硬件；Table 1、§4.1 和 §5 给性能与结论边界。英文摘要保存在独立论文笔记和结构化记录。\n\n## 3. PAWBench\n\n### 一句话总结\n\n一个未来样本看起来合理，不代表模型给不同未来分配了正确概率；PAWBench 将有效结果覆盖、概率偏差和无法判读率分开评价。\n\n### 来源与状态\n\n- 作者：Yuandong Pu、Le Zhuo、Sayak Paul、Gabriel Jorge Menezes、Avram Đorđević、Shiyang Li、Yifan Zhou、Bin Fu、Wenlong Zhang、Junjun He、Yu Qiao、Yihao Liu、Jinbo Xing、Xi Chen。\n\n- [原始页面](https://arxiv.org/abs/2608.27345)；[已读全文 v3](https://arxiv.org/html/2608.27345v3)。v1：2026-08-27 16:46:38 UTC；v2：08-28；v3：2026-09-03 08:39:17 UTC。预印本，未核实正式录用。\n\n- [项目页](https://pawbench.github.io) 直接链接 [官方代码](https://github.com/Andrew0613/PAWBench) 和数据。仓库可访问且有评价代码；未运行其自动判读器。\n\n\n### 中文摘要与创新点\n\n最近的评价框架大多逐个视频判断视觉质量、动作一致性或物理合理性。该工作固定初始图像与动作，多次采样，再把每条视频映射为终末结果类别，比较经验结果分布。\n\n50 个场景分成两类：25 个有解析/对称性参考概率的 PAW-Calibration，使用 `TVD = 0.5 * sum_y |p_hat(y)-q(y)|`；另 25 个只知道有效结果集合的 PAW-Coverage，报告已生成有效结果占全部有效结果的比例。自动判读失败单列，不把失败虚构成新的未来类型。\n\n### 实验支持什么\n\n11 个视频模型，每模型每场景采样 50 次。主实验的场景至少要有 20 次可判读结果才进入条件分数，另报 Scene Pass Rate。作者发现没有一个模型同时稳定满足概率校准、有效支持覆盖和跨场景可靠性；例如最优单项仍不能消除其他维度的失败。\n\n我的判断：这是对评价对象的有效澄清。要注意条件 TVD/coverage 是在通过可判读门槛的场景上平均，不是完整失败率；比较必须连同 SPR 和失败数。参考概率部分依赖物理对称性与人工场景设计，不能移植成患者的已知结局概率。单个患者无法重复经历同一治疗条件，真实个体未来分布通常不可直接观测；随机样本方差也不能自动区分模型不确定性与生物学随机性。\n\n### 和我方向的适配\n\n**可迁移评价，优先于扩大采样量或强调多样性。** 从同一个患者历史、治疗和查询时间采样 K 次，投影到有医学意义的量：病灶体积变化、预先定义的增长/稳定/缩小类别，或固定临床预测头的风险。MRI 的信号强度随机变化不应算作临床有意义的多样性。\n\n不把生成影像上的“无可见肿瘤”直接当作病理 pCR；不把条件生成分布写成因果治疗效应。后者至少需要明确干预、时间顺序、一致性、序贯可交换性、positivity，以及对信息性失访/删失的处理。\n\n### 可借鉴动作：最小验证实验\n\n**改动位置**：只扩展随机推理与评价脚本，每患者生成 K=20、50 个样本，固定临床条件和解码规则，记录失败样本，不挑 best-of-K 作为主要成绩。\n\n**必要对照**：单样本、确定性预测、同预算小 ensemble、FM 多样本；另用简单随机增长/治疗响应模拟器产生已知概率的状态轨迹，仅作为校准机制试验，不把模拟器视为人体真值。\n\n**评价**：模拟数据测 TVD/有效支持恢复；真实患者用群体及预设亚组的 Brier、CRPS/energy score、预测区间覆盖率与宽度，并报告采样误差。针对生存结局用删失感知评分，不能把早期失访当作未发生事件。评价头需独立锁定，防止生成器与评价器相互迎合。\n\n**推翻标准**：多样性升高但 proper score、覆盖率或病灶变化误差没有改善；增加 K 仅减少 Monte Carlo 噪声而不改变系统性失校准；或者模型在医学上有效的未来集合仍有明显塌缩。\n\n**算力**：主评估采样规模由原文 §4.1 给出，为 11×50×50 条视频，不是医学复现要求。本地新增成本约为患者数×K×单次生成成本；优先在潜空间读出病灶量，仅抽查少量图像解码，先实测单样本延迟再估总预算。\n\n### 原始摘要或证据来源\n\n全文 §2-4、Table 1 与 Appendix B；英文摘要保存在独立论文笔记和结构化记录。\n\n## 4. Beyond MSE\n\n### 一句话总结与中文摘要\n\n普通观测点 MSE 对随访密集区域赋予更多权重；Continuous-time Squared Error（CSE）用随访时间密度的倒数加权，以估计统一时间尺度上的误差。它改变的是评价的目标分布，不是生成器。\n\n### 来源与创新点\n\n作者：Rongwen Li、Haixin Xie、Xiao Wang、Changjian Chen。v1：**2026-08-18 02:47:04 UTC**，无后续修订；[原文](https://arxiv.org/abs/2608.17293)、[已读全文](https://arxiv.org/html/2608.17293v1)、[官方代码](https://github.com/hnu-vis/ITS-Bench)。预印本。\n\n其核心为每条轨迹的自归一化权重 `w_i = 1 / p_hat(t_i | trajectory)`，先算 `sum(w_i * error_i^2)/sum(w_i)`，再对患者平均。论文用 leave-one-out KDE 估计时间密度，在合成、半合成及 8 个真实数据集上展示连续时间风险恢复及排名改变。\n\n### 和我方向的适配\n\n**可迁移评价。** 病情加重时更密集的随访，会使评价与就医过程纠缠。但理论依赖给定轨迹后时间采样的条件 IID、密度有正下界、密度估计一致，以及每条轨迹观测数趋大。I-SPY2 式 2-4 次 MRI 不能据此宣称 KDE 已可靠恢复个体观测密度；信息性缺失也不会被简单重新加权自动消除。正文称五个 seeds，而部分附表标题称三个，重复次数存在报告口径不一致，需代码核对。\n\n### 可借鉴动作与原始证据\n\n最小实验只改评价器：固定同一批预测，比较患者等权 MSE、预设临床时间窗口误差、诊疗计划定义的时间权重与 CSE 敏感性分析。必要对照是在有密集真值的模拟/半合成轨迹中重采样，检查排名是否更接近真实时间积分误差。若权重裁剪或 bandwidth 的轻微变化就翻转结论，或 CSE 更偏离已知真值，则推翻其在当前样本量的可靠性。无须训练新生成器，主要为 CPU 统计成本。证据：全文 Eq.6-8、Assumption 4.1、§5 和 Appendix D；英文摘要单独保存。\n\n## 5. Pretreatment DCE-MRI Resolves Response Quality Within Pathologic Endpoints in Neoadjuvant Breast Cancer\n\n### 一句话总结与中文摘要\n\n即使病理达到 pCR，治疗前 MRI 内部异质性仍可能标记复发风险差异；生成状态的研究价值不应只用 pCR 分类来证明。\n\n### 来源与创新点\n\n作者：Dattatreya Kantha、Murray H. Loew。v1：**2026-08-22 20:23:03 UTC**（北京时间 08-23），无后续修订；[原始页面](https://arxiv.org/abs/2608.22097)。预印本，**仅核验摘要与元数据，未读取方法全文**；未找到官方代码。PDF 可访问但未下载。没有把标题相似、作者不符的 GitHub 仓库当成其代码。\n\n作者以治疗前 DCE-MRI entropy 与 pCR/RCB 交叉分层，报告四个队列共 1,200 例。在 I-SPY2，219 名完全响应者中 55 名被分为结构不利；一个合并的 HER2 阳性响应者分析含 33 人、10 个事件，报告 HR 2.87（95% CI 1.38-5.96）；Duke 908 人、76 个事件的调整 HR 为 0.61（0.41-0.91）。这是影像指标与复发的关联，不是生成影像改善临床决策的证据。\n\n### 和我方向的适配\n\n**直接相关，但证据等级低于前三篇。** pCR、RCB 与复发分别反映不同终点，应对未来状态是否保留风险相关异质性单独检验。少事件亚组 HR 波动大；一处分析合并病理确认 pCR 与 best-response proxy，两者不能视为同一定义。摘要的总体人数与跨队列复用关系、entropy 算法和阈值预设过程尚不能逐项核验，所以不照搬阈值、效应量或因果结论。“Pathologic endpoints”在此指病理疗效终点，不意味着方法输入了 WSI。\n\n### 可借鉴动作与原始证据\n\n最小实验：在统一预测 landmark，比较临床+当前 MRI 的直接模型、加预设 entropy/变化指标的直接模型、再加生成状态统计量的模型。坚持同等输入时点、预算与患者划分；OS/复发采用删失感知指标和校准，报告事件数、患者 bootstrap CI，极小亚组只作描述。pCR 尚未知的治疗前任务不能把术后 pCR 当输入；pCR 已知后的风险分层则另定义术后 landmark。若简单当前影像指标已解释全部收益，或生成状态增量在外部验证中消失，则不支持生成模块必要性。只训练小预测头时成本较低，属估计；原文摘要未给硬件或时长。原始英文摘要保存于结构化记录和独立笔记。\n\n## 少量奠基论文，均为旧文补充\n\n这里只提供概念定位，本轮核验 arXiv 元数据与摘要；不将它们计入今日 5 篇，也不声称完成全文复读或正式发表状态复核。\n\n| 论文 | v1 / 最新 arXiv 版本日期 | 本轮应回看的内容 |\n|---|---|---|\n| [Flow Matching for Generative Modeling](https://arxiv.org/abs/2210.02747) | 2022-10-06 / 2023-02-08，v2 | 向量场回归与条件路径；生成时间不等于临床时间 |\n| [Diffusion Forcing: Next-token Prediction Meets Full-Sequence Diffusion](https://arxiv.org/abs/2407.01392) | 2024-07-01 / 2024-12-10，v4 | 各 token 独立噪声水平、历史条件与长程序列生成 |\n| [Latent ODEs for Irregularly-Sampled Time Series](https://arxiv.org/abs/1907.03907) | 2019-07-08 / 无后续修订，v1 | 连续时间状态与观测事件更新；显式建模观测时间过程 |\n\n## 本周起点与优先研究假设\n\n这是新任务首次运行，以 30 天资料建立周回顾起点，不伪称已连续观察一周。下次例行周回顾安排在 2026-09-21，回顾此前 7 天记录。\n\n1. **优先验证评价能否识别真实变化。** 先锁定复制/线性趋势/直接预测对照，分开报告全图相似度、病灶变化、下游价值；OASA 显示复杂预测器可能输给复制。\n\n2. **再验证联合潜轨迹 FM。** 用同预算确定性联合预测、单步 FM 与直接临床头，拆开多步建模、随机目标和额外容量的贡献。\n\n3. **概率评价与临床终点并行设计。** 多样性不等于校准；pCR 不等于无复发；稀疏随访不足以直接识别个体连续轨迹分布。先用模拟真值查评价机制，再在真实队列作删失感知的群体校准。\n\n\n**今天最值得读的一篇：Flow-JEPA。** 先读 §4、§5.1 和 Appendix A，再看成绩表。它提供了足够具体的潜头替换方案，也清楚暴露了需要你补上的真实时间、历史信息、公平对照和临床价值验证。本轮仅提供实验建议，没有修改模型或启动训练。\n","paperIds":["arxiv:2608.29029","arxiv:2609.12435","arxiv:2608.27345","arxiv:2608.17293","arxiv:2608.22097"]}],"papers":[{"id":"arxiv:2608.29029","title":"Flow-JEPA: Flow Matching for Robust Latent Dynamics in JEPA World Models","short":"Flow-JEPA","date":"2026-09-14","rank":1,"category":"general","topic":"潜空间联合轨迹生成","summary":"把未来多个时间点的潜表征作为一个联合随机变量，用条件 Flow Matching 一起生成，替换 LeWorldModel 的确定性单步自回归预测器。","authors":"Huo, Yanchen · Song, Ziying · Luo, Yadan","firstDate":"2026-08-29","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2608.29029","codeUrl":"https://github.com/HuoYanchen/Flow-JEPA","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>把未来多个时间点的潜表征作为一个联合随机变量，用条件 Flow Matching 一起生成，替换 LeWorldModel 的确定性单步自回归预测器。\u003c/p>\n\u003ch3>来源与状态\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>作者：Yanchen Huo、Ziying Song、Yadan Luo。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://arxiv.org/abs/2608.29029\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>；\u003ca href=\"https://arxiv.org/html/2608.29029v1\" target=\"_blank\" rel=\"noopener noreferrer\">已读全文 v1\u003c/a>。v1：2026-08-29 03:40:06 UTC；无后续修订。未核实到正式录用记录，按预印本处理。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://github.com/HuoYanchen/Flow-JEPA\" target=\"_blank\" rel=\"noopener noreferrer\">官方代码\u003c/a>：论文直接链接，仓库可访问，包含训练、评价和模型文件；未运行代码。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>中文摘要与创新点\u003c/h3>\n\u003cp>最近的方法是 LeWorldModel：编码当前图像并回归下一步潜状态，多步预测反复使用自己的输出；以 SIGReg 约束表征分布避免塌缩。Flow-JEPA 保留编码器与该正则，把未来 h 个潜状态堆成 Z，以高斯轨迹 Z0 为起点，训练\u003c/p>\n\u003cp>\u003ccode>X_tau = (1-tau) Z0 + tau Z\u003c/code>\u003c/p>\n\u003cp>\u003ccode>L = E[||v_theta(X_tau, tau, z_current, actions) - (Z-Z0)||^2] + lambda_SIG L_SIG\u003c/code>。\u003c/p>\n\u003cp>Transformer 同时处理所有未来 token，交叉注意力读取当前潜状态与对应动作，AdaLN 注入生成过程时间 tau；推理采用 Euler 积分，论文主要设置为 8 步。这里 \u003cstrong>tau 是噪声到潜轨迹的生成时间，不是真实世界时间\u003c/strong>。未来位置由序列位置表示，原文没有解决不规则临床间隔。\u003c/p>\n\u003ch3>实验支持什么\u003c/h3>\n\u003cp>作者在 Two-Room、Reacher、Push-T、OGBench-Cube 四个环境报告平均规划成功率：干净输入 LeWM 86%、Flow-JEPA 92%；局部背景高斯扰动下 67% 与 86%。这是机器人闭环规划成功率，不是未来影像质量或不确定性校准。\u003c/p>\n\u003cp>关键限制是训练历史长度为 1、预测长度为 5；背景噪声不能代表跨中心 MRI 分布偏移。主表部分基线引用前作结果，Push-T 主设置的 CEM 搜索次数不相同，文中有额外预算消融；Push-T 还复用了并冻结 LeWM 编码器。因此主表不足以单独识别“随机生成”“多时点联合输出”和“编码器/优化配置”各自贡献。也没有验证 pCR、OS 或因果治疗效应。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法，优先级最高。\u003c/strong> 迁移对象是潜空间动力学预测头，不必先重训 3D 解码器。医学版本应以历史潜表征、截至预测时点可用的临床变量、治疗记录及未来查询间隔为条件。若使用未来治疗序列，只能是预测时已知的计划或明确设定的情景，不能用后来实际实施的方案泄漏未来信息。\u003c/p>\n\u003cp>需要同一患者至少两个可配准/可比较时点；验证联合多步生成最好有三个以上时点。两时点患者可支持单步或带观测掩码的目标，但“仅对已观测 token 计算损失”是医学扩展方案，原文并未证明它能识别未观测的连续轨迹。不能直接搬用机器人已知动力学、可重复干预或等间隔采样假设。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cp>\u003cstrong>假设\u003c/strong>：在相同输入与预算下，联合潜轨迹 FM 比单步 FM 递推更好地预测病灶变化，并给下游预测提供增量信息。\u003c/p>\n\u003cp>\u003cstrong>改动位置\u003c/strong>：冻结现有影像编码器，先缓存每次访问的全局/ROI 潜表征；将当前状态预测头改为两未来时点的联合 FM 头，增加真实 \u003ccode>delta_days\u003c/code> 与观测掩码。暂不更改图像解码器。\u003c/p>\n\u003cp>\u003cstrong>必要对照\u003c/strong>：最新状态复制；确定性单步递推；确定性多时点联合回归；单步 FM 递推；联合 FM；同输入、相近参数量和训练预算的直接 pCR/生存模型。另设“额外训练预算但不生成”的控制，区别生成目标收益与训练量收益。\u003c/p>\n\u003cp>\u003cstrong>评价\u003c/strong>：按患者划分，全部调参仅在训练/验证集；报告各预测间隔的潜误差、病灶内变化误差、体积变化 MAE、增长/缩小方向、两步误差增量。全图 SSIM 单列。下游比较 AUPRC、AUROC、Brier；有合法生存标签时，在统一 landmark 用 IPCW C-index、时间依赖 AUC、IBS，并对整个训练流程作患者层面的重复验证。不能让生成器见过测试患者后再评价其生成表征的价值。\u003c/p>\n\u003cp>\u003cstrong>推翻标准\u003c/strong>：联合 FM 在患者配对置信区间内未优于确定性联合预测；改善仅见于全局相似度；或同预算直接模型消除了下游收益。尤其要检查大变化患者是否仍回归到平均/复制状态。\u003c/p>\n\u003cp>\u003cstrong>算力\u003c/strong>：原文 Appendix A 报告单张 RTX 6000 Ada、20 epochs、batch 128、h=5；没有给可迁移到你数据的训练时长。冻结编码器、全局/少量 ROI token 的小头试验估计可在单卡完成，依据是只训练低维潜头；体积 token 版本需另做显存估算，不把机器人耗时外推为 3D MRI 耗时。\u003c/p>\n\u003ch3>原始摘要或证据来源\u003c/h3>\n\u003cp>原始英文摘要逐字保存在 \u003ccode>论文记录\u003c/code> 及对应独立论文笔记。上述机制来自全文 §3-4，结果与对照限制来自 §5、Appendix A。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Joint-Embedding Predictive Architectures (JEPAs) have shown strong potential for learning compact predictive representations, and LeWorldModel (LeWM) extends this paradigm to reconstruction-free latent world modeling from pixels. However, its deterministic autoregressive predictor generates future states through repeated one-step transitions, which can accumulate errors and remain sensitive to task-irrelevant visual perturbations. In this work, we propose Flow-JEPA (F-JEPA), a conditional flow matching dynamics model that jointly generates a sequence of future latent states conditioned on the current observation and actions. A Gaussian distribution serves as the flow source, exposing the vector field to perturbed latent trajectories as it learns to transport them toward clean future representations. This formulation retains the reconstruction-free JEPA framework while replacing point-wise transition regression with stochastic trajectory-level prediction. F-JEPA raises mean success from $86%$ to $92%$ under clean observations and from $67%$ to $86%$ under noisy conditions, suggesting that conditional flow matching provides a promising alternative to deterministic autoregressive dynamics in JEPA world models.\u003c/p>\n","markdown":"### 一句话总结\n\n把未来多个时间点的潜表征作为一个联合随机变量，用条件 Flow Matching 一起生成，替换 LeWorldModel 的确定性单步自回归预测器。\n\n### 来源与状态\n\n- 作者：Yanchen Huo、Ziying Song、Yadan Luo。\n\n- [原始页面](https://arxiv.org/abs/2608.29029)；[已读全文 v1](https://arxiv.org/html/2608.29029v1)。v1：2026-08-29 03:40:06 UTC；无后续修订。未核实到正式录用记录，按预印本处理。\n\n- [官方代码](https://github.com/HuoYanchen/Flow-JEPA)：论文直接链接，仓库可访问，包含训练、评价和模型文件；未运行代码。\n\n\n### 中文摘要与创新点\n\n最近的方法是 LeWorldModel：编码当前图像并回归下一步潜状态，多步预测反复使用自己的输出；以 SIGReg 约束表征分布避免塌缩。Flow-JEPA 保留编码器与该正则，把未来 h 个潜状态堆成 Z，以高斯轨迹 Z0 为起点，训练\n\n`X_tau = (1-tau) Z0 + tau Z`\n\n`L = E[||v_theta(X_tau, tau, z_current, actions) - (Z-Z0)||^2] + lambda_SIG L_SIG`。\n\nTransformer 同时处理所有未来 token，交叉注意力读取当前潜状态与对应动作，AdaLN 注入生成过程时间 tau；推理采用 Euler 积分，论文主要设置为 8 步。这里 **tau 是噪声到潜轨迹的生成时间，不是真实世界时间**。未来位置由序列位置表示，原文没有解决不规则临床间隔。\n\n### 实验支持什么\n\n作者在 Two-Room、Reacher、Push-T、OGBench-Cube 四个环境报告平均规划成功率：干净输入 LeWM 86%、Flow-JEPA 92%；局部背景高斯扰动下 67% 与 86%。这是机器人闭环规划成功率，不是未来影像质量或不确定性校准。\n\n关键限制是训练历史长度为 1、预测长度为 5；背景噪声不能代表跨中心 MRI 分布偏移。主表部分基线引用前作结果，Push-T 主设置的 CEM 搜索次数不相同，文中有额外预算消融；Push-T 还复用了并冻结 LeWM 编码器。因此主表不足以单独识别“随机生成”“多时点联合输出”和“编码器/优化配置”各自贡献。也没有验证 pCR、OS 或因果治疗效应。\n\n### 和我方向的适配\n\n**可迁移算法，优先级最高。** 迁移对象是潜空间动力学预测头，不必先重训 3D 解码器。医学版本应以历史潜表征、截至预测时点可用的临床变量、治疗记录及未来查询间隔为条件。若使用未来治疗序列，只能是预测时已知的计划或明确设定的情景，不能用后来实际实施的方案泄漏未来信息。\n\n需要同一患者至少两个可配准/可比较时点；验证联合多步生成最好有三个以上时点。两时点患者可支持单步或带观测掩码的目标，但“仅对已观测 token 计算损失”是医学扩展方案，原文并未证明它能识别未观测的连续轨迹。不能直接搬用机器人已知动力学、可重复干预或等间隔采样假设。\n\n### 可借鉴动作：最小验证实验\n\n**假设**：在相同输入与预算下，联合潜轨迹 FM 比单步 FM 递推更好地预测病灶变化，并给下游预测提供增量信息。\n\n**改动位置**：冻结现有影像编码器，先缓存每次访问的全局/ROI 潜表征；将当前状态预测头改为两未来时点的联合 FM 头，增加真实 `delta_days` 与观测掩码。暂不更改图像解码器。\n\n**必要对照**：最新状态复制；确定性单步递推；确定性多时点联合回归；单步 FM 递推；联合 FM；同输入、相近参数量和训练预算的直接 pCR/生存模型。另设“额外训练预算但不生成”的控制，区别生成目标收益与训练量收益。\n\n**评价**：按患者划分，全部调参仅在训练/验证集；报告各预测间隔的潜误差、病灶内变化误差、体积变化 MAE、增长/缩小方向、两步误差增量。全图 SSIM 单列。下游比较 AUPRC、AUROC、Brier；有合法生存标签时，在统一 landmark 用 IPCW C-index、时间依赖 AUC、IBS，并对整个训练流程作患者层面的重复验证。不能让生成器见过测试患者后再评价其生成表征的价值。\n\n**推翻标准**：联合 FM 在患者配对置信区间内未优于确定性联合预测；改善仅见于全局相似度；或同预算直接模型消除了下游收益。尤其要检查大变化患者是否仍回归到平均/复制状态。\n\n**算力**：原文 Appendix A 报告单张 RTX 6000 Ada、20 epochs、batch 128、h=5；没有给可迁移到你数据的训练时长。冻结编码器、全局/少量 ROI token 的小头试验估计可在单卡完成，依据是只训练低维潜头；体积 token 版本需另做显存估算，不把机器人耗时外推为 3D MRI 耗时。\n\n### 原始摘要或证据来源\n\n原始英文摘要逐字保存在 `论文记录` 及对应独立论文笔记。上述机制来自全文 §3-4，结果与对照限制来自 §5、Appendix A。\n\n\n\n## 原始摘要\n\nJoint-Embedding Predictive Architectures (JEPAs) have shown strong potential for learning compact predictive representations, and LeWorldModel (LeWM) extends this paradigm to reconstruction-free latent world modeling from pixels. However, its deterministic autoregressive predictor generates future states through repeated one-step transitions, which can accumulate errors and remain sensitive to task-irrelevant visual perturbations. In this work, we propose Flow-JEPA (F-JEPA), a conditional flow matching dynamics model that jointly generates a sequence of future latent states conditioned on the current observation and actions. A Gaussian distribution serves as the flow source, exposing the vector field to perturbed latent trajectories as it learns to transport them toward clean future representations. This formulation retains the reconstruction-free JEPA framework while replacing point-wise transition regression with stochastic trajectory-level prediction. F-JEPA raises mean success from $86\\%$ to $92\\%$ under clean observations and from $67\\%$ to $86\\%$ under noisy conditions, suggesting that conditional flow matching provides a promising alternative to deterministic autoregressive dynamics in JEPA world models."},{"id":"arxiv:2609.12435","title":"Observation-Anchored Selective Assimilation for Longitudinal Tumor-State Proxy Forecasting in Post-Treatment Glioma","short":"OASA","date":"2026-09-14","rank":2,"category":"medical","topic":"胶质瘤纵向状态预测","summary":"治疗后胶质瘤预测中，以最新 MRI 的标签衍生状态为基准，谨慎接纳模型预测变化；主要价值是展示了强复制基线和阈值收益的边界。","authors":"Jung, Yeonjae · Shin, Minwoo","firstDate":"2026-09-11","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.12435","codeUrl":"https://github.com/jsudg436/longitudinal-proxy-forecasting","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>治疗后胶质瘤预测中，以最新 MRI 的标签衍生状态为基准，谨慎接纳模型预测变化；主要价值是展示了强复制基线和阈值收益的边界。\u003c/p>\n\u003ch3>来源与状态\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>作者：Yeonjae Jung、Minwoo Shin。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://arxiv.org/abs/2609.12435\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.12435v1\" target=\"_blank\" rel=\"noopener noreferrer\">已读全文 v1\u003c/a>。v1：2026-09-11 04:55:54 UTC；无后续修订。预印本，未核实正式录用。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://github.com/jsudg436/longitudinal-proxy-forecasting\" target=\"_blank\" rel=\"noopener noreferrer\">官方代码\u003c/a>：论文链接与公开仓库匹配，含配置、源代码和实验产物目录；未核验仓库结果是否逐项复现论文。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>中文摘要与创新点\u003c/h3>\n\u003cp>使用 MU-Glioma Post 的 203 名患者、594 次随访；236 个候选三时点组合经“区间内无记录的新治疗开始”过滤后，保留 \u003cstrong>72 名患者的 120 个 triplets\u003c/strong>，训练/验证/测试为 81/24/15 triplets，按患者隔离。\u003c/p>\n\u003cp>预测的 p 不是未来 MRI，也不是实测肿瘤细胞密度。它由非增强核心、FLAIR 异常、增强病灶标签分别赋权 0.7/0.4/1.0 后平滑得到。模型单次输入包括四种 MRI、当前 proxy、切除腔和按 180 天归一化的时间间隔。SegMamba 输出变化分数 q 与速度 v，先作残差预测；OASA 再根据前一段预测与新观测的差异 I、预测变化范围 B，选择病例级缩放 beta，并按体素门控：\u003c/p>\n\u003cp>\u003ccode>p_hat_t2 = clip(p_observed_t1 + beta(I,B) * q12 * (p_direct_t2 - p_observed_t1), 0, 1)\u003c/code>。\u003c/p>\n\u003cp>训练包括变化加权 L1、Dice、速度、变化 BCE 和稳定区正则。病例分档规则来自验证集，不是校准过的概率置信度。“Calibration”另外把接近 0.2 的值抬到 0.201，是评价阈值附近的 support 调整。\u003c/p>\n\u003ch3>实验支持什么\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方法\u003c/th>\u003cth>RMSE，低为好\u003c/th>\u003cth>Dice@0.2\u003c/th>\u003cth>Dice@0.5\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>最新观测复制\u003c/td>\u003ctd>0.0465\u003c/td>\u003ctd>0.6070\u003c/td>\u003ctd>0.3981\u003c/td>\u003c/tr>\u003ctr>\u003ctd>直接预测\u003c/td>\u003ctd>0.0674 ± 0.0027\u003c/td>\u003ctd>0.6021 ± 0.0189\u003c/td>\u003ctd>0.2777 ± 0.0121\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OASA\u003c/td>\u003ctd>0.0472 ± 0.0005\u003c/td>\u003ctd>0.6071 ± 0.0025\u003c/td>\u003ctd>0.4269 ± 0.0079\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OASA + 阈值调整\u003c/td>\u003ctd>0.0471 ± 0.0006\u003c/td>\u003ctd>0.6178 ± 0.0025\u003c/td>\u003ctd>0.4269 ± 0.0079\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>作者报告 OASA 相对直接预测的 Dice@0.5 配对提升为 0.1493，95% CI 0.0291–0.3055；\u003cstrong>相对复制和形态学膨胀的 Dice 差异 CI 包含 0\u003c/strong>。阈值调整提高 Dice@0.2，但 FP 从 11,836 增到 18,663，同时 FN 从 22,107 降到 17,536。表中 ± 是三个种子的总体标准差，不是患者泛化置信区间。\u003c/p>\n\u003cp>我的判断：证据支持“保守更新比这个直接预测器稳定”，不支持“已学到更准确的肿瘤生物学”。测试只有 15 triplets；统计 bootstrap 按 triplet 抽样，如果同患者贡献多个 triplet，需要进一步采用患者聚类 bootstrap。源标签质量、proxy 权重和固定裁剪也会改变评价结果。“无新治疗开始”仍可能包含既往治疗的持续效应，不能解释为 untreated natural history。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关，主要用于评价和状态更新设计。\u003c/strong> 它匹配胶质瘤 MRI、不规则间隔、有限纵向历史，但不包含可比较的治疗方案效应，不预测 OS/pCR，也不生成完整影像。对 I-SPY2 可迁移“新访视到达后更新状态”的机制，但治疗诱导的明显变化可能被保守门控压掉，必须按响应幅度分层评估。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cp>\u003cstrong>改动位置\u003c/strong>：在既有未来 latent/病灶状态预测之后增加一个验证集拟合的残差缩放器，先不改模型训练。以最近两次已知访视的预测误差作为可用历史信号。\u003c/p>\n\u003cp>\u003cstrong>必要对照\u003c/strong>：最新观测复制、线性时间外推、原模型、固定残差缩放、历史误差自适应缩放；若预测 mask/proxy，加入简单膨胀/腐蚀与单独阈值调整。只允许在验证集定门控与阈值。\u003c/p>\n\u003cp>\u003cstrong>评价\u003c/strong>：同时报告连续变化误差、变化区域 Dice、增长/缩小方向、FP/FN、新病灶召回和体积变化；对小变化、大变化分别统计，以患者聚类 bootstrap 给 CI。最新观测已到达的更新任务，与尚未获得新影像的纯 rollout 必须分开比较。\u003c/p>\n\u003cp>\u003cstrong>推翻标准\u003c/strong>：优势可被复制、固定缩放或阈值调整解释；或门控使大幅进展/治疗响应的召回下降。门控没有临床收益时，不因整体 RMSE 好看而保留。\u003c/p>\n\u003cp>\u003cstrong>算力\u003c/strong>：原文 §3.2 为两张 RTX A6000、60 epochs、128^3 crop、每 GPU batch 2。本建议首步只重算已有预测和小缩放器，通常无需重训大模型；这是基于实验设计的估计。\u003c/p>\n\u003ch3>原始摘要或证据来源\u003c/h3>\n\u003cp>全文 §2.1-2.4 给出 proxy、门控与阈值操作；§3 给队列/硬件；Table 1、§4.1 和 §5 给性能与结论边界。英文摘要保存在独立论文笔记和结构化记录。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Post-treatment MRI in patients with glioma provides serial observations for updating patient-specific tumor-state proxy estimates, but variable appearances and trajectories complicate forecasting. We formulate forecasting as an observation-aware digital-twin update in which an intermediate observation anchors the patient-specific state. Among 203 patients and 594 follow-up time points, a predefined no-new-treatment criterion retained 120 of 236 candidate triplets, split into 81/24/15 training/validation/test triplets at the patient level. Each time point was represented by a continuous voxel-wise tumor-state proxy map in [0,1] derived from MRI lesion labels. A SegMamba-based single-step forecaster predicted update proposals from multimodal source-state tensors. Observation-Anchored Selective Assimilation (OASA) retained the observed intermediate proxy as the state anchor and selectively applied updates through a validation-selected tiered case-level rule and voxel-wise soft gate. We compared initial-scan forecasting, rollout without assimilation, latest-observation persistence, direct prediction, OASA, OASA + calibration, and morphological dilation. Checkpoints, OASA rules, and calibration thresholds were selected using validation data only. Across three seeds on 15 held-out test triplets, OASA maintained Dice at $\\tau$ = 0.2 comparable to persistence (0.6071 $\\pm$ 0.0025 vs. 0.6070) while yielding numerically higher Dice at $\\tau$ = 0.5 (0.4269 $\\pm$ 0.0079 vs. 0.3981), with a small RMSE increase. Calibration increased Dice at $\\tau$ = 0.2 to 0.6178 $\\pm$ 0.0025, increased false-positive (FP) support (11,836$\\rightarrow$18,663), and reduced false-negative (FN) support (22,107$\\rightarrow$17,536). This reflects near-threshold support calibration rather than improved biological predictive capability. Code is publicly available at \u003ca href=\"https://github.com/jsudg436/longitudinal-proxy-forecasting\" target=\"_blank\" rel=\"noopener noreferrer\">https://github.com/jsudg436/longitudinal-proxy-forecasting\u003c/a>.\u003c/p>\n","markdown":"### 一句话总结\n\n治疗后胶质瘤预测中，以最新 MRI 的标签衍生状态为基准，谨慎接纳模型预测变化；主要价值是展示了强复制基线和阈值收益的边界。\n\n### 来源与状态\n\n- 作者：Yeonjae Jung、Minwoo Shin。\n\n- [原始页面](https://arxiv.org/abs/2609.12435)；[已读全文 v1](https://arxiv.org/html/2609.12435v1)。v1：2026-09-11 04:55:54 UTC；无后续修订。预印本，未核实正式录用。\n\n- [官方代码](https://github.com/jsudg436/longitudinal-proxy-forecasting)：论文链接与公开仓库匹配，含配置、源代码和实验产物目录；未核验仓库结果是否逐项复现论文。\n\n\n### 中文摘要与创新点\n\n使用 MU-Glioma Post 的 203 名患者、594 次随访；236 个候选三时点组合经“区间内无记录的新治疗开始”过滤后，保留 **72 名患者的 120 个 triplets**，训练/验证/测试为 81/24/15 triplets，按患者隔离。\n\n预测的 p 不是未来 MRI，也不是实测肿瘤细胞密度。它由非增强核心、FLAIR 异常、增强病灶标签分别赋权 0.7/0.4/1.0 后平滑得到。模型单次输入包括四种 MRI、当前 proxy、切除腔和按 180 天归一化的时间间隔。SegMamba 输出变化分数 q 与速度 v，先作残差预测；OASA 再根据前一段预测与新观测的差异 I、预测变化范围 B，选择病例级缩放 beta，并按体素门控：\n\n`p_hat_t2 = clip(p_observed_t1 + beta(I,B) * q12 * (p_direct_t2 - p_observed_t1), 0, 1)`。\n\n训练包括变化加权 L1、Dice、速度、变化 BCE 和稳定区正则。病例分档规则来自验证集，不是校准过的概率置信度。“Calibration”另外把接近 0.2 的值抬到 0.201，是评价阈值附近的 support 调整。\n\n### 实验支持什么\n\n| 方法 | RMSE，低为好 | Dice@0.2 | Dice@0.5 |\n|---|---:|---:|---:|\n| 最新观测复制 | 0.0465 | 0.6070 | 0.3981 |\n| 直接预测 | 0.0674 ± 0.0027 | 0.6021 ± 0.0189 | 0.2777 ± 0.0121 |\n| OASA | 0.0472 ± 0.0005 | 0.6071 ± 0.0025 | 0.4269 ± 0.0079 |\n| OASA + 阈值调整 | 0.0471 ± 0.0006 | 0.6178 ± 0.0025 | 0.4269 ± 0.0079 |\n\n作者报告 OASA 相对直接预测的 Dice@0.5 配对提升为 0.1493，95% CI 0.0291–0.3055；**相对复制和形态学膨胀的 Dice 差异 CI 包含 0**。阈值调整提高 Dice@0.2，但 FP 从 11,836 增到 18,663，同时 FN 从 22,107 降到 17,536。表中 ± 是三个种子的总体标准差，不是患者泛化置信区间。\n\n我的判断：证据支持“保守更新比这个直接预测器稳定”，不支持“已学到更准确的肿瘤生物学”。测试只有 15 triplets；统计 bootstrap 按 triplet 抽样，如果同患者贡献多个 triplet，需要进一步采用患者聚类 bootstrap。源标签质量、proxy 权重和固定裁剪也会改变评价结果。“无新治疗开始”仍可能包含既往治疗的持续效应，不能解释为 untreated natural history。\n\n### 和我方向的适配\n\n**直接相关，主要用于评价和状态更新设计。** 它匹配胶质瘤 MRI、不规则间隔、有限纵向历史，但不包含可比较的治疗方案效应，不预测 OS/pCR，也不生成完整影像。对 I-SPY2 可迁移“新访视到达后更新状态”的机制，但治疗诱导的明显变化可能被保守门控压掉，必须按响应幅度分层评估。\n\n### 可借鉴动作：最小验证实验\n\n**改动位置**：在既有未来 latent/病灶状态预测之后增加一个验证集拟合的残差缩放器，先不改模型训练。以最近两次已知访视的预测误差作为可用历史信号。\n\n**必要对照**：最新观测复制、线性时间外推、原模型、固定残差缩放、历史误差自适应缩放；若预测 mask/proxy，加入简单膨胀/腐蚀与单独阈值调整。只允许在验证集定门控与阈值。\n\n**评价**：同时报告连续变化误差、变化区域 Dice、增长/缩小方向、FP/FN、新病灶召回和体积变化；对小变化、大变化分别统计，以患者聚类 bootstrap 给 CI。最新观测已到达的更新任务，与尚未获得新影像的纯 rollout 必须分开比较。\n\n**推翻标准**：优势可被复制、固定缩放或阈值调整解释；或门控使大幅进展/治疗响应的召回下降。门控没有临床收益时，不因整体 RMSE 好看而保留。\n\n**算力**：原文 §3.2 为两张 RTX A6000、60 epochs、128^3 crop、每 GPU batch 2。本建议首步只重算已有预测和小缩放器，通常无需重训大模型；这是基于实验设计的估计。\n\n### 原始摘要或证据来源\n\n全文 §2.1-2.4 给出 proxy、门控与阈值操作；§3 给队列/硬件；Table 1、§4.1 和 §5 给性能与结论边界。英文摘要保存在独立论文笔记和结构化记录。\n\n\n\n## 原始摘要\n\nPost-treatment MRI in patients with glioma provides serial observations for updating patient-specific tumor-state proxy estimates, but variable appearances and trajectories complicate forecasting. We formulate forecasting as an observation-aware digital-twin update in which an intermediate observation anchors the patient-specific state. Among 203 patients and 594 follow-up time points, a predefined no-new-treatment criterion retained 120 of 236 candidate triplets, split into 81/24/15 training/validation/test triplets at the patient level. Each time point was represented by a continuous voxel-wise tumor-state proxy map in [0,1] derived from MRI lesion labels. A SegMamba-based single-step forecaster predicted update proposals from multimodal source-state tensors. Observation-Anchored Selective Assimilation (OASA) retained the observed intermediate proxy as the state anchor and selectively applied updates through a validation-selected tiered case-level rule and voxel-wise soft gate. We compared initial-scan forecasting, rollout without assimilation, latest-observation persistence, direct prediction, OASA, OASA + calibration, and morphological dilation. Checkpoints, OASA rules, and calibration thresholds were selected using validation data only. Across three seeds on 15 held-out test triplets, OASA maintained Dice at $\\tau$ = 0.2 comparable to persistence (0.6071 $\\pm$ 0.0025 vs. 0.6070) while yielding numerically higher Dice at $\\tau$ = 0.5 (0.4269 $\\pm$ 0.0079 vs. 0.3981), with a small RMSE increase. Calibration increased Dice at $\\tau$ = 0.2 to 0.6178 $\\pm$ 0.0025, increased false-positive (FP) support (11,836$\\rightarrow$18,663), and reduced false-negative (FN) support (22,107$\\rightarrow$17,536). This reflects near-threshold support calibration rather than improved biological predictive capability. Code is publicly available at https://github.com/jsudg436/longitudinal-proxy-forecasting."},{"id":"arxiv:2608.27345","title":"PAWBench: How Far Are We from Probabilistically Aligned World Modeling?","short":"PAWBench","date":"2026-09-14","rank":3,"category":"general","topic":"概率预测与可靠性","summary":"一个未来样本看起来合理，不代表模型给不同未来分配了正确概率；PAWBench 将有效结果覆盖、概率偏差和无法判读率分开评价。","authors":"Pu, Yuandong · Zhuo, Le · Paul, Sayak · Menezes, Gabriel Jorge · Đorđević, Avram · Li, Shiyang · Zhou, Yifan · Fu, Bin · Zhang, Wenlong · He, Junjun · Qiao, Yu · Liu, Yihao · Xing, Jinbo · Chen, Xi","firstDate":"2026-08-27","revisionDate":"2026-09-03","version":"v3","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2608.27345","codeUrl":"https://github.com/Andrew0613/PAWBench","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>一个未来样本看起来合理，不代表模型给不同未来分配了正确概率；PAWBench 将有效结果覆盖、概率偏差和无法判读率分开评价。\u003c/p>\n\u003ch3>来源与状态\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>作者：Yuandong Pu、Le Zhuo、Sayak Paul、Gabriel Jorge Menezes、Avram Đorđević、Shiyang Li、Yifan Zhou、Bin Fu、Wenlong Zhang、Junjun He、Yu Qiao、Yihao Liu、Jinbo Xing、Xi Chen。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://arxiv.org/abs/2608.27345\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>；\u003ca href=\"https://arxiv.org/html/2608.27345v3\" target=\"_blank\" rel=\"noopener noreferrer\">已读全文 v3\u003c/a>。v1：2026-08-27 16:46:38 UTC；v2：08-28；v3：2026-09-03 08:39:17 UTC。预印本，未核实正式录用。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://pawbench.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\">项目页\u003c/a> 直接链接 \u003ca href=\"https://github.com/Andrew0613/PAWBench\" target=\"_blank\" rel=\"noopener noreferrer\">官方代码\u003c/a> 和数据。仓库可访问且有评价代码；未运行其自动判读器。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>中文摘要与创新点\u003c/h3>\n\u003cp>最近的评价框架大多逐个视频判断视觉质量、动作一致性或物理合理性。该工作固定初始图像与动作，多次采样，再把每条视频映射为终末结果类别，比较经验结果分布。\u003c/p>\n\u003cp>50 个场景分成两类：25 个有解析/对称性参考概率的 PAW-Calibration，使用 \u003ccode>TVD = 0.5 * sum_y |p_hat(y)-q(y)|\u003c/code>；另 25 个只知道有效结果集合的 PAW-Coverage，报告已生成有效结果占全部有效结果的比例。自动判读失败单列，不把失败虚构成新的未来类型。\u003c/p>\n\u003ch3>实验支持什么\u003c/h3>\n\u003cp>11 个视频模型，每模型每场景采样 50 次。主实验的场景至少要有 20 次可判读结果才进入条件分数，另报 Scene Pass Rate。作者发现没有一个模型同时稳定满足概率校准、有效支持覆盖和跨场景可靠性；例如最优单项仍不能消除其他维度的失败。\u003c/p>\n\u003cp>我的判断：这是对评价对象的有效澄清。要注意条件 TVD/coverage 是在通过可判读门槛的场景上平均，不是完整失败率；比较必须连同 SPR 和失败数。参考概率部分依赖物理对称性与人工场景设计，不能移植成患者的已知结局概率。单个患者无法重复经历同一治疗条件，真实个体未来分布通常不可直接观测；随机样本方差也不能自动区分模型不确定性与生物学随机性。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移评价，优先于扩大采样量或强调多样性。\u003c/strong> 从同一个患者历史、治疗和查询时间采样 K 次，投影到有医学意义的量：病灶体积变化、预先定义的增长/稳定/缩小类别，或固定临床预测头的风险。MRI 的信号强度随机变化不应算作临床有意义的多样性。\u003c/p>\n\u003cp>不把生成影像上的“无可见肿瘤”直接当作病理 pCR；不把条件生成分布写成因果治疗效应。后者至少需要明确干预、时间顺序、一致性、序贯可交换性、positivity，以及对信息性失访/删失的处理。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cp>\u003cstrong>改动位置\u003c/strong>：只扩展随机推理与评价脚本，每患者生成 K=20、50 个样本，固定临床条件和解码规则，记录失败样本，不挑 best-of-K 作为主要成绩。\u003c/p>\n\u003cp>\u003cstrong>必要对照\u003c/strong>：单样本、确定性预测、同预算小 ensemble、FM 多样本；另用简单随机增长/治疗响应模拟器产生已知概率的状态轨迹，仅作为校准机制试验，不把模拟器视为人体真值。\u003c/p>\n\u003cp>\u003cstrong>评价\u003c/strong>：模拟数据测 TVD/有效支持恢复；真实患者用群体及预设亚组的 Brier、CRPS/energy score、预测区间覆盖率与宽度，并报告采样误差。针对生存结局用删失感知评分，不能把早期失访当作未发生事件。评价头需独立锁定，防止生成器与评价器相互迎合。\u003c/p>\n\u003cp>\u003cstrong>推翻标准\u003c/strong>：多样性升高但 proper score、覆盖率或病灶变化误差没有改善；增加 K 仅减少 Monte Carlo 噪声而不改变系统性失校准；或者模型在医学上有效的未来集合仍有明显塌缩。\u003c/p>\n\u003cp>\u003cstrong>算力\u003c/strong>：主评估采样规模由原文 §4.1 给出，为 11×50×50 条视频，不是医学复现要求。本地新增成本约为患者数×K×单次生成成本；优先在潜空间读出病灶量，仅抽查少量图像解码，先实测单样本延迟再估总预算。\u003c/p>\n\u003ch3>原始摘要或证据来源\u003c/h3>\n\u003cp>全文 §2-4、Table 1 与 Appendix B；英文摘要保存在独立论文笔记和结构化记录。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Recent video generation models are increasingly framed as world models. Many physical processes can unfold in more than one valid way. Therefore, a world model should reproduce not only a plausible trajectory, but also the distribution of possible behaviors under the same initial observation and action. We call this distribution-level requirement probabilistic alignment. However, existing evaluations largely assess individual-video plausibility and do not test whether repeated generations recover the correct distribution. This raises a central question: how far are current video generators from probabilistically aligned world modeling? To answer it, we formalize probabilistic alignment as a distributional criterion for world models and introduce PAWBench, a benchmark for evaluating video generators as stochastic samplers of world dynamics. We further introduce PAWEval, an outcome-level protocol that converts repeated video rollouts into empirical distributions over possible physical behaviors. Across 50 scenarios and eleven current systems, no model consistently matches the reference probabilities while recovering the range of valid behaviors. Having established this gap, we test whether language prompts, initial noise sampling, or model training can reshape the model&#39;s predictive distribution. We believe our work can serve as a foundation for future efforts to move towards probabilistically aligned world modeling.\u003c/p>\n","markdown":"### 一句话总结\n\n一个未来样本看起来合理，不代表模型给不同未来分配了正确概率；PAWBench 将有效结果覆盖、概率偏差和无法判读率分开评价。\n\n### 来源与状态\n\n- 作者：Yuandong Pu、Le Zhuo、Sayak Paul、Gabriel Jorge Menezes、Avram Đorđević、Shiyang Li、Yifan Zhou、Bin Fu、Wenlong Zhang、Junjun He、Yu Qiao、Yihao Liu、Jinbo Xing、Xi Chen。\n\n- [原始页面](https://arxiv.org/abs/2608.27345)；[已读全文 v3](https://arxiv.org/html/2608.27345v3)。v1：2026-08-27 16:46:38 UTC；v2：08-28；v3：2026-09-03 08:39:17 UTC。预印本，未核实正式录用。\n\n- [项目页](https://pawbench.github.io) 直接链接 [官方代码](https://github.com/Andrew0613/PAWBench) 和数据。仓库可访问且有评价代码；未运行其自动判读器。\n\n\n### 中文摘要与创新点\n\n最近的评价框架大多逐个视频判断视觉质量、动作一致性或物理合理性。该工作固定初始图像与动作，多次采样，再把每条视频映射为终末结果类别，比较经验结果分布。\n\n50 个场景分成两类：25 个有解析/对称性参考概率的 PAW-Calibration，使用 `TVD = 0.5 * sum_y |p_hat(y)-q(y)|`；另 25 个只知道有效结果集合的 PAW-Coverage，报告已生成有效结果占全部有效结果的比例。自动判读失败单列，不把失败虚构成新的未来类型。\n\n### 实验支持什么\n\n11 个视频模型，每模型每场景采样 50 次。主实验的场景至少要有 20 次可判读结果才进入条件分数，另报 Scene Pass Rate。作者发现没有一个模型同时稳定满足概率校准、有效支持覆盖和跨场景可靠性；例如最优单项仍不能消除其他维度的失败。\n\n我的判断：这是对评价对象的有效澄清。要注意条件 TVD/coverage 是在通过可判读门槛的场景上平均，不是完整失败率；比较必须连同 SPR 和失败数。参考概率部分依赖物理对称性与人工场景设计，不能移植成患者的已知结局概率。单个患者无法重复经历同一治疗条件，真实个体未来分布通常不可直接观测；随机样本方差也不能自动区分模型不确定性与生物学随机性。\n\n### 和我方向的适配\n\n**可迁移评价，优先于扩大采样量或强调多样性。** 从同一个患者历史、治疗和查询时间采样 K 次，投影到有医学意义的量：病灶体积变化、预先定义的增长/稳定/缩小类别，或固定临床预测头的风险。MRI 的信号强度随机变化不应算作临床有意义的多样性。\n\n不把生成影像上的“无可见肿瘤”直接当作病理 pCR；不把条件生成分布写成因果治疗效应。后者至少需要明确干预、时间顺序、一致性、序贯可交换性、positivity，以及对信息性失访/删失的处理。\n\n### 可借鉴动作：最小验证实验\n\n**改动位置**：只扩展随机推理与评价脚本，每患者生成 K=20、50 个样本，固定临床条件和解码规则，记录失败样本，不挑 best-of-K 作为主要成绩。\n\n**必要对照**：单样本、确定性预测、同预算小 ensemble、FM 多样本；另用简单随机增长/治疗响应模拟器产生已知概率的状态轨迹，仅作为校准机制试验，不把模拟器视为人体真值。\n\n**评价**：模拟数据测 TVD/有效支持恢复；真实患者用群体及预设亚组的 Brier、CRPS/energy score、预测区间覆盖率与宽度，并报告采样误差。针对生存结局用删失感知评分，不能把早期失访当作未发生事件。评价头需独立锁定，防止生成器与评价器相互迎合。\n\n**推翻标准**：多样性升高但 proper score、覆盖率或病灶变化误差没有改善；增加 K 仅减少 Monte Carlo 噪声而不改变系统性失校准；或者模型在医学上有效的未来集合仍有明显塌缩。\n\n**算力**：主评估采样规模由原文 §4.1 给出，为 11×50×50 条视频，不是医学复现要求。本地新增成本约为患者数×K×单次生成成本；优先在潜空间读出病灶量，仅抽查少量图像解码，先实测单样本延迟再估总预算。\n\n### 原始摘要或证据来源\n\n全文 §2-4、Table 1 与 Appendix B；英文摘要保存在独立论文笔记和结构化记录。\n\n\n\n## 原始摘要\n\nRecent video generation models are increasingly framed as world models. Many physical processes can unfold in more than one valid way. Therefore, a world model should reproduce not only a plausible trajectory, but also the distribution of possible behaviors under the same initial observation and action. We call this distribution-level requirement probabilistic alignment. However, existing evaluations largely assess individual-video plausibility and do not test whether repeated generations recover the correct distribution. This raises a central question: how far are current video generators from probabilistically aligned world modeling? To answer it, we formalize probabilistic alignment as a distributional criterion for world models and introduce PAWBench, a benchmark for evaluating video generators as stochastic samplers of world dynamics. We further introduce PAWEval, an outcome-level protocol that converts repeated video rollouts into empirical distributions over possible physical behaviors. Across 50 scenarios and eleven current systems, no model consistently matches the reference probabilities while recovering the range of valid behaviors. Having established this gap, we test whether language prompts, initial noise sampling, or model training can reshape the model's predictive distribution. We believe our work can serve as a foundation for future efforts to move towards probabilistically aligned world modeling."},{"id":"arxiv:2608.17293","title":"Beyond MSE: Rethinking the Evaluation Metric and Benchmarking for Irregular Time Series Forecasting","short":"Beyond MSE","date":"2026-09-14","rank":4,"category":"general","topic":"不规则时间序列评价","summary":"普通观测点 MSE 对随访密集区域赋予更多权重；Continuous-time Squared Error（CSE）用随访时间密度的倒数加权，以估计统一时间尺度上的误差。它改变的是评价的目标分布，不是生成器。","authors":"Li, Rongwen · Xie, Haixin · Wang, Xiao · Chen, Changjian","firstDate":"2026-08-18","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2608.17293","codeUrl":"https://github.com/hnu-vis/ITS-Bench","image":"","imageLabel":"","html":"\u003ch3>一句话总结与中文摘要\u003c/h3>\n\u003cp>普通观测点 MSE 对随访密集区域赋予更多权重；Continuous-time Squared Error（CSE）用随访时间密度的倒数加权，以估计统一时间尺度上的误差。它改变的是评价的目标分布，不是生成器。\u003c/p>\n\u003ch3>来源与创新点\u003c/h3>\n\u003cp>作者：Rongwen Li、Haixin Xie、Xiao Wang、Changjian Chen。v1：\u003cstrong>2026-08-18 02:47:04 UTC\u003c/strong>，无后续修订；\u003ca href=\"https://arxiv.org/abs/2608.17293\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>、\u003ca href=\"https://arxiv.org/html/2608.17293v1\" target=\"_blank\" rel=\"noopener noreferrer\">已读全文\u003c/a>、\u003ca href=\"https://github.com/hnu-vis/ITS-Bench\" target=\"_blank\" rel=\"noopener noreferrer\">官方代码\u003c/a>。预印本。\u003c/p>\n\u003cp>其核心为每条轨迹的自归一化权重 \u003ccode>w_i = 1 / p_hat(t_i | trajectory)\u003c/code>，先算 \u003ccode>sum(w_i * error_i^2)/sum(w_i)\u003c/code>，再对患者平均。论文用 leave-one-out KDE 估计时间密度，在合成、半合成及 8 个真实数据集上展示连续时间风险恢复及排名改变。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移评价。\u003c/strong> 病情加重时更密集的随访，会使评价与就医过程纠缠。但理论依赖给定轨迹后时间采样的条件 IID、密度有正下界、密度估计一致，以及每条轨迹观测数趋大。I-SPY2 式 2-4 次 MRI 不能据此宣称 KDE 已可靠恢复个体观测密度；信息性缺失也不会被简单重新加权自动消除。正文称五个 seeds，而部分附表标题称三个，重复次数存在报告口径不一致，需代码核对。\u003c/p>\n\u003ch3>可借鉴动作与原始证据\u003c/h3>\n\u003cp>最小实验只改评价器：固定同一批预测，比较患者等权 MSE、预设临床时间窗口误差、诊疗计划定义的时间权重与 CSE 敏感性分析。必要对照是在有密集真值的模拟/半合成轨迹中重采样，检查排名是否更接近真实时间积分误差。若权重裁剪或 bandwidth 的轻微变化就翻转结论，或 CSE 更偏离已知真值，则推翻其在当前样本量的可靠性。无须训练新生成器，主要为 CPU 统计成本。证据：全文 Eq.6-8、Assumption 4.1、§5 和 Appendix D；英文摘要单独保存。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Existing research on irregular time-series forecasting has primarily focused on model design, while evaluation metrics remain insufficiently studied. Existing benchmarks typically use mean squared error (MSE) as the evaluation metric. We show that, in irregular forecasting, MSE is determined not only by the model prediction but also by the sample-specific timestamp sampling distributions, leading to a biased assessment of the models&#39; continuous-time predictive performance. To address this issue, we propose the Continuous-time Squared Error (CSE), which employs importance weighting to eliminate the influence of the timestamp sampling distributions. We further theoretically prove that CSE&#39;s asymptotic estimation error with respect to continuous-time risk is no greater than that of MSE. Finally, we construct a systematic benchmark covering synthetic, semi-synthetic, and eight real-world datasets to validate the effectiveness of CSE and systematically evaluate models&#39; continuous-time predictive performance. Experiments show that CSE can recover continuous-time risk more accurately than MSE, while relying solely on MSE may not fully reflect models&#39; continuous-time predictive performance in real-world scenarios. Our code can be obtained at \u003ca href=\"https://github.com/hnu-vis/ITS-Bench\" target=\"_blank\" rel=\"noopener noreferrer\">https://github.com/hnu-vis/ITS-Bench\u003c/a>.\u003c/p>\n","markdown":"### 一句话总结与中文摘要\n\n普通观测点 MSE 对随访密集区域赋予更多权重；Continuous-time Squared Error（CSE）用随访时间密度的倒数加权，以估计统一时间尺度上的误差。它改变的是评价的目标分布，不是生成器。\n\n### 来源与创新点\n\n作者：Rongwen Li、Haixin Xie、Xiao Wang、Changjian Chen。v1：**2026-08-18 02:47:04 UTC**，无后续修订；[原文](https://arxiv.org/abs/2608.17293)、[已读全文](https://arxiv.org/html/2608.17293v1)、[官方代码](https://github.com/hnu-vis/ITS-Bench)。预印本。\n\n其核心为每条轨迹的自归一化权重 `w_i = 1 / p_hat(t_i | trajectory)`，先算 `sum(w_i * error_i^2)/sum(w_i)`，再对患者平均。论文用 leave-one-out KDE 估计时间密度，在合成、半合成及 8 个真实数据集上展示连续时间风险恢复及排名改变。\n\n### 和我方向的适配\n\n**可迁移评价。** 病情加重时更密集的随访，会使评价与就医过程纠缠。但理论依赖给定轨迹后时间采样的条件 IID、密度有正下界、密度估计一致，以及每条轨迹观测数趋大。I-SPY2 式 2-4 次 MRI 不能据此宣称 KDE 已可靠恢复个体观测密度；信息性缺失也不会被简单重新加权自动消除。正文称五个 seeds，而部分附表标题称三个，重复次数存在报告口径不一致，需代码核对。\n\n### 可借鉴动作与原始证据\n\n最小实验只改评价器：固定同一批预测，比较患者等权 MSE、预设临床时间窗口误差、诊疗计划定义的时间权重与 CSE 敏感性分析。必要对照是在有密集真值的模拟/半合成轨迹中重采样，检查排名是否更接近真实时间积分误差。若权重裁剪或 bandwidth 的轻微变化就翻转结论，或 CSE 更偏离已知真值，则推翻其在当前样本量的可靠性。无须训练新生成器，主要为 CPU 统计成本。证据：全文 Eq.6-8、Assumption 4.1、§5 和 Appendix D；英文摘要单独保存。\n\n\n\n## 原始摘要\n\nExisting research on irregular time-series forecasting has primarily focused on model design, while evaluation metrics remain insufficiently studied. Existing benchmarks typically use mean squared error (MSE) as the evaluation metric. We show that, in irregular forecasting, MSE is determined not only by the model prediction but also by the sample-specific timestamp sampling distributions, leading to a biased assessment of the models' continuous-time predictive performance. To address this issue, we propose the Continuous-time Squared Error (CSE), which employs importance weighting to eliminate the influence of the timestamp sampling distributions. We further theoretically prove that CSE's asymptotic estimation error with respect to continuous-time risk is no greater than that of MSE. Finally, we construct a systematic benchmark covering synthetic, semi-synthetic, and eight real-world datasets to validate the effectiveness of CSE and systematically evaluate models' continuous-time predictive performance. Experiments show that CSE can recover continuous-time risk more accurately than MSE, while relying solely on MSE may not fully reflect models' continuous-time predictive performance in real-world scenarios. Our code can be obtained at https://github.com/hnu-vis/ITS-Bench."},{"id":"arxiv:2608.22097","title":"Pretreatment DCE-MRI Resolves Response Quality Within Pathologic Endpoints in Neoadjuvant Breast Cancer","short":"DCE-MRI · Response Quality","date":"2026-09-14","rank":5,"category":"medical","topic":"乳腺 MRI 与临床结局","summary":"即使病理达到 pCR，治疗前 MRI 内部异质性仍可能标记复发风险差异；生成状态的研究价值不应只用 pCR 分类来证明。","authors":"Kantha, Dattatreya · Loew, Murray H.","firstDate":"2026-08-22","revisionDate":"","version":"v1","evidence":"仅摘要","publication":"预印本","url":"https://arxiv.org/abs/2608.22097","codeUrl":"","image":"","imageLabel":"","html":"\u003ch3>一句话总结与中文摘要\u003c/h3>\n\u003cp>即使病理达到 pCR，治疗前 MRI 内部异质性仍可能标记复发风险差异；生成状态的研究价值不应只用 pCR 分类来证明。\u003c/p>\n\u003ch3>来源与创新点\u003c/h3>\n\u003cp>作者：Dattatreya Kantha、Murray H. Loew。v1：\u003cstrong>2026-08-22 20:23:03 UTC\u003c/strong>（北京时间 08-23），无后续修订；\u003ca href=\"https://arxiv.org/abs/2608.22097\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>。预印本，\u003cstrong>仅核验摘要与元数据，未读取方法全文\u003c/strong>；未找到官方代码。PDF 可访问但未下载。没有把标题相似、作者不符的 GitHub 仓库当成其代码。\u003c/p>\n\u003cp>作者以治疗前 DCE-MRI entropy 与 pCR/RCB 交叉分层，报告四个队列共 1,200 例。在 I-SPY2，219 名完全响应者中 55 名被分为结构不利；一个合并的 HER2 阳性响应者分析含 33 人、10 个事件，报告 HR 2.87（95% CI 1.38-5.96）；Duke 908 人、76 个事件的调整 HR 为 0.61（0.41-0.91）。这是影像指标与复发的关联，不是生成影像改善临床决策的证据。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关，但证据等级低于前三篇。\u003c/strong> pCR、RCB 与复发分别反映不同终点，应对未来状态是否保留风险相关异质性单独检验。少事件亚组 HR 波动大；一处分析合并病理确认 pCR 与 best-response proxy，两者不能视为同一定义。摘要的总体人数与跨队列复用关系、entropy 算法和阈值预设过程尚不能逐项核验，所以不照搬阈值、效应量或因果结论。“Pathologic endpoints”在此指病理疗效终点，不意味着方法输入了 WSI。\u003c/p>\n\u003ch3>可借鉴动作与原始证据\u003c/h3>\n\u003cp>最小实验：在统一预测 landmark，比较临床+当前 MRI 的直接模型、加预设 entropy/变化指标的直接模型、再加生成状态统计量的模型。坚持同等输入时点、预算与患者划分；OS/复发采用删失感知指标和校准，报告事件数、患者 bootstrap CI，极小亚组只作描述。pCR 尚未知的治疗前任务不能把术后 pCR 当输入；pCR 已知后的风险分层则另定义术后 landmark。若简单当前影像指标已解释全部收益，或生成状态增量在外部验证中消失，则不支持生成模块必要性。只训练小预测头时成本较低，属估计；原文摘要未给硬件或时长。原始英文摘要保存于结构化记录和独立笔记。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Pathologic complete response (pCR) is a strong neoadjuvant endpoint, yet 5-15% of complete responders recur and clinical/genomic variables do not reliably identify them. We tested whether pretreatment dynamic contrast-enhanced MRI entropy - intratumoral enhancement heterogeneity - resolves response quality hidden within pCR and residual cancer burden (RCB). Across four cohorts (1,200 patients), a prespecified entropy threshold defined favorable and adverse structural states. Crossing structure with pathology yielded a four-tier framework spanning 4.1-fold recurrence in I-SPY1 and 7.7-fold at response extremes. In I-SPY2, 55 of 219 complete responders (25.1%) were structurally adverse, pretreatment. In an external HER2-positive responder synthesis (I-SPY1 pathology-confirmed pCR plus UCSF best-response proxy; n = 33, 10 events), adverse structure was associated with higher recurrence risk (HR = 2.87, 95% CI 1.38-5.96) capturing 7 of 10 recurrences, enriching rather than determining risk. In a HER2-positive RCB-0 subset, recurrence was 12.5% with favorable and 80.0% with adverse structure; Firth Cox regression preserved the association (HR = 8.13, 95% CI 1.71-49.21; n = 21, 6 events). In Duke (n = 908; 76 events), favorable structure remained independently associated with lower distant-recurrence risk (adjusted HR = 0.61, 95% CI 0.41-0.91). RNA linked favorable structure to a directionally reproduced immune-architecture program among non-overlapping patients within ISPY2; EMT-pathway enrichment was favorable-side, while the adverse tier contained a broadly immune-depleted substate. Yet full-cohort RNA models weakly discriminated structural state and did not recover continuous entropy. Pretreatment MRI therefore does not replace pCR or RCB; it reveals response-quality differences that these endpoints compress and identifies a recurrence-enriched group for prospective validation.\u003c/p>\n","markdown":"### 一句话总结与中文摘要\n\n即使病理达到 pCR，治疗前 MRI 内部异质性仍可能标记复发风险差异；生成状态的研究价值不应只用 pCR 分类来证明。\n\n### 来源与创新点\n\n作者：Dattatreya Kantha、Murray H. Loew。v1：**2026-08-22 20:23:03 UTC**（北京时间 08-23），无后续修订；[原始页面](https://arxiv.org/abs/2608.22097)。预印本，**仅核验摘要与元数据，未读取方法全文**；未找到官方代码。PDF 可访问但未下载。没有把标题相似、作者不符的 GitHub 仓库当成其代码。\n\n作者以治疗前 DCE-MRI entropy 与 pCR/RCB 交叉分层，报告四个队列共 1,200 例。在 I-SPY2，219 名完全响应者中 55 名被分为结构不利；一个合并的 HER2 阳性响应者分析含 33 人、10 个事件，报告 HR 2.87（95% CI 1.38-5.96）；Duke 908 人、76 个事件的调整 HR 为 0.61（0.41-0.91）。这是影像指标与复发的关联，不是生成影像改善临床决策的证据。\n\n### 和我方向的适配\n\n**直接相关，但证据等级低于前三篇。** pCR、RCB 与复发分别反映不同终点，应对未来状态是否保留风险相关异质性单独检验。少事件亚组 HR 波动大；一处分析合并病理确认 pCR 与 best-response proxy，两者不能视为同一定义。摘要的总体人数与跨队列复用关系、entropy 算法和阈值预设过程尚不能逐项核验，所以不照搬阈值、效应量或因果结论。“Pathologic endpoints”在此指病理疗效终点，不意味着方法输入了 WSI。\n\n### 可借鉴动作与原始证据\n\n最小实验：在统一预测 landmark，比较临床+当前 MRI 的直接模型、加预设 entropy/变化指标的直接模型、再加生成状态统计量的模型。坚持同等输入时点、预算与患者划分；OS/复发采用删失感知指标和校准，报告事件数、患者 bootstrap CI，极小亚组只作描述。pCR 尚未知的治疗前任务不能把术后 pCR 当输入；pCR 已知后的风险分层则另定义术后 landmark。若简单当前影像指标已解释全部收益，或生成状态增量在外部验证中消失，则不支持生成模块必要性。只训练小预测头时成本较低，属估计；原文摘要未给硬件或时长。原始英文摘要保存于结构化记录和独立笔记。\n\n\n\n## 原始摘要\n\nPathologic complete response (pCR) is a strong neoadjuvant endpoint, yet 5-15% of complete responders recur and clinical/genomic variables do not reliably identify them. We tested whether pretreatment dynamic contrast-enhanced MRI entropy - intratumoral enhancement heterogeneity - resolves response quality hidden within pCR and residual cancer burden (RCB). Across four cohorts (1,200 patients), a prespecified entropy threshold defined favorable and adverse structural states. Crossing structure with pathology yielded a four-tier framework spanning 4.1-fold recurrence in I-SPY1 and 7.7-fold at response extremes. In I-SPY2, 55 of 219 complete responders (25.1%) were structurally adverse, pretreatment. In an external HER2-positive responder synthesis (I-SPY1 pathology-confirmed pCR plus UCSF best-response proxy; n = 33, 10 events), adverse structure was associated with higher recurrence risk (HR = 2.87, 95% CI 1.38-5.96) capturing 7 of 10 recurrences, enriching rather than determining risk. In a HER2-positive RCB-0 subset, recurrence was 12.5% with favorable and 80.0% with adverse structure; Firth Cox regression preserved the association (HR = 8.13, 95% CI 1.71-49.21; n = 21, 6 events). In Duke (n = 908; 76 events), favorable structure remained independently associated with lower distant-recurrence risk (adjusted HR = 0.61, 95% CI 0.41-0.91). RNA linked favorable structure to a directionally reproduced immune-architecture program among non-overlapping patients within ISPY2; EMT-pathway enrichment was favorable-side, while the adverse tier contained a broadly immune-depleted substate. Yet full-cohort RNA models weakly discriminated structural state and did not recover continuous entropy. Pretreatment MRI therefore does not replace pCR or RCB; it reveals response-quality differences that these endpoints compress and identifies a recurrence-enriched group for prospective validation."},{"id":"arxiv:2609.13909","title":"DiTAR+: Dual Optimization for Robust Autoregressive Diffusion Speech Synthesis","short":"DiTAR+","date":"2026-09-15","rank":1,"category":"general","topic":"历史条件与长程生成","summary":"在语音 AR-DiT 中，稀疏保留远期历史改善长程一致性，浅层限制历史直接注意力改善复杂条件遵循，但两者的收益不能假定普遍叠加。","authors":"Zhang, Ziyu · Zuo, Tianlun · Li, Hanzhao · Zhang, Haoyu · Xie, Lei","firstDate":"2026-09-12","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.13909","codeUrl":"","image":"https://arxiv.org/html/2609.13909v1/fig1_arch.png","imageLabel":"DiTAR+ · 方法结构图","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>在语音 AR-DiT 中，稀疏保留远期历史改善长程一致性，浅层限制历史直接注意力改善复杂条件遵循，但两者的收益不能假定普遍叠加。\u003c/p>\n\u003cp>\u003cstrong>元数据与来源。\u003c/strong> Ziyu Zhang、Tianlun Zuo、Hanzhao Li、Haoyu Zhang、Lei Xie。首次版本：2026-09-12 12:32:02 UTC；最新 v1，无后续修订记录；预印本，未核实正式接受。\u003ca href=\"https://arxiv.org/abs/2609.13909\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.13909v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。\u003cstrong>未找到官方代码\u003c/strong>；全文给出的 seed-tts-eval 是外部评测工具，不能当作本论文实现。PDF 链接存在，本次未下载，未测试 PDF 可访问性。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>DiTAR 先用自回归模块生成当前语音片段的语义条件，再由 LocDiT 依据该条件、噪声片段和相邻历史生成连续声学潜变量。作者认为长语音失稳包含两种问题：历史窗口太短，以及生成器过度延续历史声学模式、忽略语义条件。DiTAR+ 分别加入 Dilated Context Sampling（DCS）与 Hierarchical Acoustic Masking（HAM），没有提出新的临床时间动力学或新的流匹配目标。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>相对最接近的 DiTAR，DCS 保留最近连续片段，同时按固定步长抽取更远片段，按原时间顺序拼接：\u003ccode>C_i = [P_(i-nj), ..., P_(i-j), P_(i-c), ..., P_(i-1)]\u003c/code>。它改变历史条件的构造，不把时间序列重新排序。\u003c/p>\n\u003cp>HAM 在前 \u003ccode>N1\u003c/code> 个 Transformer 块中，把“当前片段 query → 历史片段 key”的 attention logits 设为负无穷，后续层恢复访问；语义条件与生成时间仍可用。这里的“先后”是\u003cstrong>网络深度\u003c/strong>，不是前几次 ODE 求解步，也不是临床治疗阶段。该 mask 只切断直接注意力边；上游语义条件可能已汇总历史，因此不能把它解释为与历史信息完全独立。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>全文 §3.1–3.5、Table 1/3：Emilia 语音训练；ZH-Hard 与 ZH-Long 各 400 条，后者预期时长 25–35 秒。相对 DiTAR，完整方法在 ZH-Hard 的 WER 为 \u003cstrong>12.478% → 9.893%\u003c/strong>；ZH-Long 的 WER 为 \u003cstrong>2.778% → 2.173%\u003c/strong>，speaker similarity 为 \u003cstrong>0.741 → 0.759\u003c/strong>。\u003c/p>\n\u003cp>消融比总榜更值得读：HAM 单独使用时，ZH-Hard WER 为 \u003cstrong>9.889%\u003c/strong>，但 ZH-Long WER 恶化至 \u003cstrong>3.056%\u003c/strong>；DCS 单独使用的 ZH-Long WER 为 \u003cstrong>2.165%\u003c/strong>，略优于完整方法的 2.173%。完整方法也未提升所有主观指标，Q-MOS 为 3.82，基线为 3.88。作者把两者称为互补机制；我的判断是它支持“任务依赖的折中”，不支持所有条件下的严格协同。没有看到重复训练种子或这些微小差值的置信区间，不能给 0.004 或 0.008 个百分点差异排序。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可迁移 LocDiT 的分层条件通路到未来影像/残差潜变量生成器：浅层主要读取治疗、真实时间差和患者摘要，深层再注入历史空间细节。它针对“生成结果像输入，但病灶变化没学到”的诊断问题。\u003c/p>\n\u003cp>医疗迁移需要至少基线及一个后续观测；验证远期历史价值最好有至少三个可用时点。I-SPY2 类每人仅 2–4 次 MRI 时，应保留所有已观测时点并显式编码真实天数，不能照搬等间隔语音的 stride。患者解剖与病灶历史本身是必要信息，过度屏蔽可能损害患者特异性；治疗条件也不像文本那样指定唯一目标。生成时间 \u003ccode>s∈[0,1]\u003c/code> 与临床时间差 \u003ccode>Δt\u003c/code> 必须分开输入。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>改动位置：\u003c/strong> 冻结既有影像编码器，仅在历史 token 到未来 latent/残差生成器的 attention mask 处加入浅层屏蔽。先不更换 VQGAN 或扩大生成器。没有分层 attention 的模型不硬套 HAM。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>必要对照：\u003c/strong> 同结构、参数量、数据和训练步数下比较原始条件、随机 condition dropout、HAM；有足够时点时再做历史扩展 × HAM 的 2×2 消融。加入最新观测复制、线性趋势和同输入/相近容量的直接残差预测器；额外历史 token 的算量也应计入匹配预算。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>评价：\u003c/strong> 分别报告全图/病灶 ROI 相似度，肿瘤体积变化 MAE 与变化方向，逐预测步误差；将病灶预测均值相对“复制输入”的改善单独列出。随机生成评估体积 CRPS、联合 latent 的 energy score、区间覆盖率及宽度，不用 best-of-K 代替校准。用训练集定义的大变化阈值分组，避免多数稳定患者掩盖失败。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>否证结果：\u003c/strong> 若 HAM 仅降低全图误差、病灶变化不优于复制，或移除治疗/打乱历史后性能基本不变，则削弱“改善条件使用”的假设；若只增加治疗敏感性但真实预测或校准变差，同样不支持它。置换条件属于模型依赖性诊断，不是因果治疗效应实验。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>算力：\u003c/strong> 原文 §3.1 为 \u003cstrong>32 张 H20、每卡 batch 8\u003c/strong>，未给完整 GPU 小时。医学最小实验估计只需单卡训练缓存 latent 上的小生成头；这是基于冻结编码器、控制 token 数的工程估计，须以实际 token 数/显存/每步耗时定预算，不声称单卡可复现原语音模型。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据为 \u003ca href=\"https://arxiv.org/html/2609.13909v1\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv v1 全文\u003c/a> §2.2–2.3、Algorithm 1、§3.1、Table 1–3。独立论文笔记附原始英文摘要。本报告中的医学迁移及否证标准是研究建议，原文没有 MRI、pCR 或生存实验。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Continuous-latent Autoregressive Diffusion Transformer (AR-DiT) models have demonstrated immense potential in zero-shot speech generation. However, they still suffer from limited decoding stability when synthesizing long utterances or complex linguistic structures. This instability primarily stems from a restricted historical receptive field and an acoustic inertia dependency within the diffusion decoder, which causes the model to ignore semantic conditions. To address these challenges, we propose DiTAR+, a dual-optimization framework. First, we introduce Dilated Context Sampling to expand the macro-level historical receptive field without violating physical temporal continuity, thereby preventing cumulative error propagation. Second, we propose Hierarchical Acoustic Masking to prevent shallow layers from attending to acoustic pre-context, explicitly decoupling semantic alignment from acoustic detail reconstruction. Extensive experiments show that our framework effectively mitigates pronunciation errors and semantic hallucinations, enhances generation robustness on challenging sentences, and maintains exceptionally high speaker similarity throughout the entirety of long-form utterances. On the linguistically challenging ZH-Hard set, DiTAR+ reduces the word error rate from 12.478% to 9.893%, and on extended utterances of 25 to 35 seconds it improves speaker similarity from 0.741 to 0.759 while simultaneously lowering the word error rate from 2.778% to 2.173%, outperforming both discrete-token and pure flow-matching baselines.\u003c/p>\n","markdown":"### 一句话总结\n\n在语音 AR-DiT 中，稀疏保留远期历史改善长程一致性，浅层限制历史直接注意力改善复杂条件遵循，但两者的收益不能假定普遍叠加。\n\n**元数据与来源。** Ziyu Zhang、Tianlun Zuo、Hanzhao Li、Haoyu Zhang、Lei Xie。首次版本：2026-09-12 12:32:02 UTC；最新 v1，无后续修订记录；预印本，未核实正式接受。[原始页面](https://arxiv.org/abs/2609.13909)；[全文](https://arxiv.org/html/2609.13909v1)。**未找到官方代码**；全文给出的 seed-tts-eval 是外部评测工具，不能当作本论文实现。PDF 链接存在，本次未下载，未测试 PDF 可访问性。\n\n### 中文摘要\n\nDiTAR 先用自回归模块生成当前语音片段的语义条件，再由 LocDiT 依据该条件、噪声片段和相邻历史生成连续声学潜变量。作者认为长语音失稳包含两种问题：历史窗口太短，以及生成器过度延续历史声学模式、忽略语义条件。DiTAR+ 分别加入 Dilated Context Sampling（DCS）与 Hierarchical Acoustic Masking（HAM），没有提出新的临床时间动力学或新的流匹配目标。\n\n### 创新点与机制\n\n相对最接近的 DiTAR，DCS 保留最近连续片段，同时按固定步长抽取更远片段，按原时间顺序拼接：`C_i = [P_(i-nj), ..., P_(i-j), P_(i-c), ..., P_(i-1)]`。它改变历史条件的构造，不把时间序列重新排序。\n\nHAM 在前 `N1` 个 Transformer 块中，把“当前片段 query → 历史片段 key”的 attention logits 设为负无穷，后续层恢复访问；语义条件与生成时间仍可用。这里的“先后”是**网络深度**，不是前几次 ODE 求解步，也不是临床治疗阶段。该 mask 只切断直接注意力边；上游语义条件可能已汇总历史，因此不能把它解释为与历史信息完全独立。\n\n### 实验支持与局限\n\n全文 §3.1–3.5、Table 1/3：Emilia 语音训练；ZH-Hard 与 ZH-Long 各 400 条，后者预期时长 25–35 秒。相对 DiTAR，完整方法在 ZH-Hard 的 WER 为 **12.478% → 9.893%**；ZH-Long 的 WER 为 **2.778% → 2.173%**，speaker similarity 为 **0.741 → 0.759**。\n\n消融比总榜更值得读：HAM 单独使用时，ZH-Hard WER 为 **9.889%**，但 ZH-Long WER 恶化至 **3.056%**；DCS 单独使用的 ZH-Long WER 为 **2.165%**，略优于完整方法的 2.173%。完整方法也未提升所有主观指标，Q-MOS 为 3.82，基线为 3.88。作者把两者称为互补机制；我的判断是它支持“任务依赖的折中”，不支持所有条件下的严格协同。没有看到重复训练种子或这些微小差值的置信区间，不能给 0.004 或 0.008 个百分点差异排序。\n\n### 和我方向的适配\n\n**可迁移算法。** 可迁移 LocDiT 的分层条件通路到未来影像/残差潜变量生成器：浅层主要读取治疗、真实时间差和患者摘要，深层再注入历史空间细节。它针对“生成结果像输入，但病灶变化没学到”的诊断问题。\n\n医疗迁移需要至少基线及一个后续观测；验证远期历史价值最好有至少三个可用时点。I-SPY2 类每人仅 2–4 次 MRI 时，应保留所有已观测时点并显式编码真实天数，不能照搬等间隔语音的 stride。患者解剖与病灶历史本身是必要信息，过度屏蔽可能损害患者特异性；治疗条件也不像文本那样指定唯一目标。生成时间 `s∈[0,1]` 与临床时间差 `Δt` 必须分开输入。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：** 冻结既有影像编码器，仅在历史 token 到未来 latent/残差生成器的 attention mask 处加入浅层屏蔽。先不更换 VQGAN 或扩大生成器。没有分层 attention 的模型不硬套 HAM。\n\n- **必要对照：** 同结构、参数量、数据和训练步数下比较原始条件、随机 condition dropout、HAM；有足够时点时再做历史扩展 × HAM 的 2×2 消融。加入最新观测复制、线性趋势和同输入/相近容量的直接残差预测器；额外历史 token 的算量也应计入匹配预算。\n\n- **评价：** 分别报告全图/病灶 ROI 相似度，肿瘤体积变化 MAE 与变化方向，逐预测步误差；将病灶预测均值相对“复制输入”的改善单独列出。随机生成评估体积 CRPS、联合 latent 的 energy score、区间覆盖率及宽度，不用 best-of-K 代替校准。用训练集定义的大变化阈值分组，避免多数稳定患者掩盖失败。\n\n- **否证结果：** 若 HAM 仅降低全图误差、病灶变化不优于复制，或移除治疗/打乱历史后性能基本不变，则削弱“改善条件使用”的假设；若只增加治疗敏感性但真实预测或校准变差，同样不支持它。置换条件属于模型依赖性诊断，不是因果治疗效应实验。\n\n- **算力：** 原文 §3.1 为 **32 张 H20、每卡 batch 8**，未给完整 GPU 小时。医学最小实验估计只需单卡训练缓存 latent 上的小生成头；这是基于冻结编码器、控制 token 数的工程估计，须以实际 token 数/显存/每步耗时定预算，不声称单卡可复现原语音模型。\n\n\n### 原始摘要或 Evidence Source\n\n证据为 [arXiv v1 全文](https://arxiv.org/html/2609.13909v1) §2.2–2.3、Algorithm 1、§3.1、Table 1–3。独立论文笔记附原始英文摘要。本报告中的医学迁移及否证标准是研究建议，原文没有 MRI、pCR 或生存实验。\n\n\n\n## 原始摘要\n\nContinuous-latent Autoregressive Diffusion Transformer (AR-DiT) models have demonstrated immense potential in zero-shot speech generation. However, they still suffer from limited decoding stability when synthesizing long utterances or complex linguistic structures. This instability primarily stems from a restricted historical receptive field and an acoustic inertia dependency within the diffusion decoder, which causes the model to ignore semantic conditions. To address these challenges, we propose DiTAR+, a dual-optimization framework. First, we introduce Dilated Context Sampling to expand the macro-level historical receptive field without violating physical temporal continuity, thereby preventing cumulative error propagation. Second, we propose Hierarchical Acoustic Masking to prevent shallow layers from attending to acoustic pre-context, explicitly decoupling semantic alignment from acoustic detail reconstruction. Extensive experiments show that our framework effectively mitigates pronunciation errors and semantic hallucinations, enhances generation robustness on challenging sentences, and maintains exceptionally high speaker similarity throughout the entirety of long-form utterances. On the linguistically challenging ZH-Hard set, DiTAR+ reduces the word error rate from 12.478% to 9.893%, and on extended utterances of 25 to 35 seconds it improves speaker similarity from 0.741 to 0.759 while simultaneously lowering the word error rate from 2.778% to 2.173%, outperforming both discrete-token and pure flow-matching baselines."},{"id":"arxiv:2609.13984","title":"What Makes an Efficient VLA? Navigating Action-Head Design, Scaling, and Latency","short":"EffVLA","date":"2026-09-15","rank":2,"category":"general","topic":"表征对齐与公平对照","summary":"同样的预测头，初始化改变可能比“回归还是 FM”更重要；论文最可靠的启发是如何设计对照，而不是证明回归普遍胜过生成。","authors":"Sun, Luoyang · Xia, Guoyang · Li, Fengfa · Ren, Lei · Cui, Xinyu · Zhang, Haifeng · Feng, Fangxiang · Zhang, Kaike · Zhan, Kun · Xie, Yan · Wang, Jun · Deng, Cheng","firstDate":"2026-09-12","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.13984","codeUrl":"https://github.com/MindVLA-Team/EFFVLA","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>同样的预测头，初始化改变可能比“回归还是 FM”更重要；论文最可靠的启发是如何设计对照，而不是证明回归普遍胜过生成。\u003c/p>\n\u003cp>\u003cstrong>元数据与来源。\u003c/strong> Luoyang Sun、Guoyang Xia、Fengfa Li、Lei Ren、Xinyu Cui、Haifeng Zhang、Fangxiang Feng、Kaike Zhang、Kun Zhan、Yan Xie、Jun Wang、Cheng Deng。首次版本：2026-09-12 14:55:15 UTC；最新 v1，无后续修订记录；预印本，未核实正式接受。\u003ca href=\"https://arxiv.org/abs/2609.13984\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.13984v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>；\u003ca href=\"https://github.com/MindVLA-Team/EFFVLA\" target=\"_blank\" rel=\"noopener noreferrer\">已核实官方代码\u003c/a>。仓库公开且含 EffVLA/Pi0 模型模块；README 要求外部 starVLA 框架，因此它不是已验证可独立复现的完整训练包。本次未运行代码、未下载 PDF。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>固定 SigLIP2、Qwen2.5 家族和 DROID → LIBERO 训练流程，作者考察预测头结构、初始化、L1/FM 损失、推理次数及模块规模。EffVLA 使用从语言骨干最后四层复制权重的 Transformer 预测头，通过 KV-share 读取骨干，单次 L1 回归动作块。它主要是一项系统对照研究和由此选出的配置，不是新的生成分布建模理论。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>对同结构 L1 头，随机初始化与骨干初始化是清晰的权重对照；目标为动作块的 L1 误差。FM 头则学习带噪动作到目标动作的 rectified-flow 路径，实验固定四次推理。可迁移的核心是把\u003cstrong>表征接口、初始化、预测目标、采样预算\u003c/strong>逐项匹配，避免把预训练带来的收益归因于某一生成损失。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 2：同 Transformer/L1/单次推理下，骨干初始化使 LIBERO-Plus 成功率 \u003cstrong>72.7% → 79.8%\u003c/strong>。固定四次推理，已初始化的 L1 头为 79.6%，对应 FM 为 75.2%。但 Appendix A 明确说明随机 FM 用 DiT/adaLN 块，初始化 FM 用普通块，所以 FM 的随机/初始化比较\u003cstrong>同时改变块类型\u003c/strong>，不是纯初始化消融；四步 FM 也没有充分采样步数搜索。\u003c/p>\n\u003cp>作者报告 63 个配置，但多数仅一个训练种子。五种子重复是 EffVLA 与 MLP/OFT 的比较，均值为 \u003cstrong>79.0±1.2% 与 77.9±1.5%\u003c/strong>，不是对 7.1 点随机/初始化差异的五种子重复。大部分模拟任务较短，噪声扰动下 MLP 更强；真实机器人没有完整替代头对照。作者将 representation alignment 作为解释，并承认尚未与“特定预训练权重的作用”分离。我的判断：适合提高你的比较标准，不足以否定患者未来状态的随机生成价值。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法/训练设计。\u003c/strong> 可迁移同架构不同初始化、同输入同预算直接预测的试验矩阵。若医疗骨干与动力学头的维度、注意力结构兼容，可比较复制骨干块与同构随机块；若目前是卷积 VQGAN 编码器，则没有可直接复制的语言 Transformer，不能机械照搬。\u003c/p>\n\u003cp>机器人成功率没有检验未来分布校准，更没有删失生存风险。基础病理特征、真实时间差、治疗信息和训练数据量都要对各比较组一致；不能让生成分支使用额外随访监督而不给直接模型同等预训练机会。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>改动位置：\u003c/strong> 冻结患者编码器，在未来 latent/残差预测头处做同结构的 \u003ccode>初始化（随机/预训练）× 目标（确定性回归/FM）\u003c/code> 对照。仅在模块兼容时开展；同时记录参数、训练 FLOPs、GPU 时间和 NFE。保持 block 类型及时间嵌入一致。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>必要对照：\u003c/strong> 同患者历史直接预测 pCR 的模型；给予相同纵向监督和额外预算的直接模型；最新观测复制。若主张“对齐”机制，再加破坏对齐的预训练权重对照，但旋转/置换也可能影响优化，不能视为完美因果干预。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>评价：\u003c/strong> 未来病灶变化误差与 proper scores 单独报告；pCR 使用嵌套患者级验证的 AUROC、AUPRC、Brier、校准斜率与预设阈值净获益。增加 CKA 或条件遮挡诊断仅帮助解释，不能替代临床端点。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>否证结果：\u003c/strong> 若匹配初始化与额外预算后，生成分支的下游增益消失，则“生成本身创造额外临床信息”的证据不足；如果仍改善分布预测但不改善 pCR，应保留前者、放弃后者的论断。小样本差异 CI 宽时结论是证据不足。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>算力：\u003c/strong> 原文给出约 3.75B 总参数、0.35B 动作头、LIBERO 微调 100k steps；\u003cstrong>39.2 ms\u003c/strong> 是 RTX 5090 上的特定推理测量，不是训练成本，也不含图像预处理。未核实总训练 GPU 小时。医学版先在缓存 latent 上匹配小头预算，按单卡实测估算，不复刻 63 个大模型配置。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据为 \u003ca href=\"https://arxiv.org/html/2609.13984v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a> §3、Table 2、§8、Appendix A/I/J/N，以及\u003ca href=\"https://github.com/MindVLA-Team/EFFVLA\" target=\"_blank\" rel=\"noopener noreferrer\">官方仓库\u003c/a>。独立笔记附原始英文摘要。论文中“loss only”之类总括表述应结合 Appendix A 的结构混杂一起理解。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Vision-Language-Action (VLA) models combine a pretrained vision encoder, a language backbone, and an action head, but their relative contribution has not been established under controlled, latency-paired conditions. We fix the backbone families (SigLIP2 and Qwen2.5) and the training pipeline, sweep action-head design and module scale, and pair each configuration with measured on-device latency. The study yields three findings. First, action-head performance is governed primarily by initialization rather than decoder architecture, loss, or inference budget: copying the last transformer layers of the language backbone into the head is the single largest lever, at no latency cost, and the only axis that helps at every module scale. Alignment also explains the other axes: flow matching and a heavier decoder pay off only while the head is misaligned and reverse once it is aligned, and extra inference passes give no measurable benefit; expressiveness appears to substitute for missing alignment. We read this as representation transfer: the aligned head keeps attending to the instruction&#39;s object nouns and stays close to the backbone in weight space rather than relearning to act from scratch. Because we reach alignment only through initialization, we offer this as the account that best organizes the measurements, not a demonstrated cause, and name the control that would settle it. Second, capacity pays only after alignment: the aligned action head is the highest-return module to scale. Third, those returns diminish sharply near the size today&#39;s $\\pi$-series VLAs already use, so further growth buys little in-domain accuracy for its latency. These specify EffVLA, a compact model matching the strongest open-source VLAs on standard LIBERO, leading on most LIBERO-Plus perturbation axes at lower latency, and transferring to a real SO-ARM101 arm with the recipe unchanged.\u003c/p>\n","markdown":"### 一句话总结\n\n同样的预测头，初始化改变可能比“回归还是 FM”更重要；论文最可靠的启发是如何设计对照，而不是证明回归普遍胜过生成。\n\n**元数据与来源。** Luoyang Sun、Guoyang Xia、Fengfa Li、Lei Ren、Xinyu Cui、Haifeng Zhang、Fangxiang Feng、Kaike Zhang、Kun Zhan、Yan Xie、Jun Wang、Cheng Deng。首次版本：2026-09-12 14:55:15 UTC；最新 v1，无后续修订记录；预印本，未核实正式接受。[原始页面](https://arxiv.org/abs/2609.13984)；[全文](https://arxiv.org/html/2609.13984v1)；[已核实官方代码](https://github.com/MindVLA-Team/EFFVLA)。仓库公开且含 EffVLA/Pi0 模型模块；README 要求外部 starVLA 框架，因此它不是已验证可独立复现的完整训练包。本次未运行代码、未下载 PDF。\n\n### 中文摘要\n\n固定 SigLIP2、Qwen2.5 家族和 DROID → LIBERO 训练流程，作者考察预测头结构、初始化、L1/FM 损失、推理次数及模块规模。EffVLA 使用从语言骨干最后四层复制权重的 Transformer 预测头，通过 KV-share 读取骨干，单次 L1 回归动作块。它主要是一项系统对照研究和由此选出的配置，不是新的生成分布建模理论。\n\n### 创新点与机制\n\n对同结构 L1 头，随机初始化与骨干初始化是清晰的权重对照；目标为动作块的 L1 误差。FM 头则学习带噪动作到目标动作的 rectified-flow 路径，实验固定四次推理。可迁移的核心是把**表征接口、初始化、预测目标、采样预算**逐项匹配，避免把预训练带来的收益归因于某一生成损失。\n\n### 实验支持与局限\n\nTable 2：同 Transformer/L1/单次推理下，骨干初始化使 LIBERO-Plus 成功率 **72.7% → 79.8%**。固定四次推理，已初始化的 L1 头为 79.6%，对应 FM 为 75.2%。但 Appendix A 明确说明随机 FM 用 DiT/adaLN 块，初始化 FM 用普通块，所以 FM 的随机/初始化比较**同时改变块类型**，不是纯初始化消融；四步 FM 也没有充分采样步数搜索。\n\n作者报告 63 个配置，但多数仅一个训练种子。五种子重复是 EffVLA 与 MLP/OFT 的比较，均值为 **79.0±1.2% 与 77.9±1.5%**，不是对 7.1 点随机/初始化差异的五种子重复。大部分模拟任务较短，噪声扰动下 MLP 更强；真实机器人没有完整替代头对照。作者将 representation alignment 作为解释，并承认尚未与“特定预训练权重的作用”分离。我的判断：适合提高你的比较标准，不足以否定患者未来状态的随机生成价值。\n\n### 和我方向的适配\n\n**可迁移算法/训练设计。** 可迁移同架构不同初始化、同输入同预算直接预测的试验矩阵。若医疗骨干与动力学头的维度、注意力结构兼容，可比较复制骨干块与同构随机块；若目前是卷积 VQGAN 编码器，则没有可直接复制的语言 Transformer，不能机械照搬。\n\n机器人成功率没有检验未来分布校准，更没有删失生存风险。基础病理特征、真实时间差、治疗信息和训练数据量都要对各比较组一致；不能让生成分支使用额外随访监督而不给直接模型同等预训练机会。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：** 冻结患者编码器，在未来 latent/残差预测头处做同结构的 `初始化（随机/预训练）× 目标（确定性回归/FM）` 对照。仅在模块兼容时开展；同时记录参数、训练 FLOPs、GPU 时间和 NFE。保持 block 类型及时间嵌入一致。\n\n- **必要对照：** 同患者历史直接预测 pCR 的模型；给予相同纵向监督和额外预算的直接模型；最新观测复制。若主张“对齐”机制，再加破坏对齐的预训练权重对照，但旋转/置换也可能影响优化，不能视为完美因果干预。\n\n- **评价：** 未来病灶变化误差与 proper scores 单独报告；pCR 使用嵌套患者级验证的 AUROC、AUPRC、Brier、校准斜率与预设阈值净获益。增加 CKA 或条件遮挡诊断仅帮助解释，不能替代临床端点。\n\n- **否证结果：** 若匹配初始化与额外预算后，生成分支的下游增益消失，则“生成本身创造额外临床信息”的证据不足；如果仍改善分布预测但不改善 pCR，应保留前者、放弃后者的论断。小样本差异 CI 宽时结论是证据不足。\n\n- **算力：** 原文给出约 3.75B 总参数、0.35B 动作头、LIBERO 微调 100k steps；**39.2 ms** 是 RTX 5090 上的特定推理测量，不是训练成本，也不含图像预处理。未核实总训练 GPU 小时。医学版先在缓存 latent 上匹配小头预算，按单卡实测估算，不复刻 63 个大模型配置。\n\n\n### 原始摘要或 Evidence Source\n\n证据为 [全文](https://arxiv.org/html/2609.13984v1) §3、Table 2、§8、Appendix A/I/J/N，以及[官方仓库](https://github.com/MindVLA-Team/EFFVLA)。独立笔记附原始英文摘要。论文中“loss only”之类总括表述应结合 Appendix A 的结构混杂一起理解。\n\n\n\n## 原始摘要\n\nVision-Language-Action (VLA) models combine a pretrained vision encoder, a language backbone, and an action head, but their relative contribution has not been established under controlled, latency-paired conditions. We fix the backbone families (SigLIP2 and Qwen2.5) and the training pipeline, sweep action-head design and module scale, and pair each configuration with measured on-device latency. The study yields three findings. First, action-head performance is governed primarily by initialization rather than decoder architecture, loss, or inference budget: copying the last transformer layers of the language backbone into the head is the single largest lever, at no latency cost, and the only axis that helps at every module scale. Alignment also explains the other axes: flow matching and a heavier decoder pay off only while the head is misaligned and reverse once it is aligned, and extra inference passes give no measurable benefit; expressiveness appears to substitute for missing alignment. We read this as representation transfer: the aligned head keeps attending to the instruction's object nouns and stays close to the backbone in weight space rather than relearning to act from scratch. Because we reach alignment only through initialization, we offer this as the account that best organizes the measurements, not a demonstrated cause, and name the control that would settle it. Second, capacity pays only after alignment: the aligned action head is the highest-return module to scale. Third, those returns diminish sharply near the size today's $\\pi$-series VLAs already use, so further growth buys little in-domain accuracy for its latency. These specify EffVLA, a compact model matching the strongest open-source VLAs on standard LIBERO, leading on most LIBERO-Plus perturbation axes at lower latency, and transferring to a real SO-ARM101 arm with the recipe unchanged."},{"id":"doi:10.4274/dir.2026.264036","title":"Comparing clinicopathological factors and quantitative background parenchymal enhancement to predict pathological complete response after neoadjuvant chemotherapy in breast cancer","short":"BPE & pCR","date":"2026-09-15","rank":3,"category":"medical","topic":"乳腺 MRI 与 pCR","summary":"142 例、57 个 pCR 事件的单中心研究中，自动 BPE 量化较可靠，但并未超越 HER2 + Ki-67 的简洁预测基线，且研究没有早期疗中 MRI。","authors":"Süleyman Öncü · Murat Yüce · Ahmet İrfan Temur","firstDate":"2026-09-14","revisionDate":"","version":"publisher_online_2026-09-14","evidence":"全文已核实","publication":"期刊在线发表","url":"https://doi.org/10.4274/dir.2026.264036","codeUrl":"","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>142 例、57 个 pCR 事件的单中心研究中，自动 BPE 量化较可靠，但并未超越 HER2 + Ki-67 的简洁预测基线，且研究没有早期疗中 MRI。\u003c/p>\n\u003cp>\u003cstrong>元数据与来源。\u003c/strong> Süleyman Öncü、Murat Yüce、Ahmet İrfan Temur。完整标题见总览。\u003ca href=\"https://doi.org/10.4274/dir.2026.264036\" target=\"_blank\" rel=\"noopener noreferrer\">期刊 DOI / HTML 全文\u003c/a>；\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/42734038/\" target=\"_blank\" rel=\"noopener noreferrer\">PubMed PMID 42734038\u003c/a>。已核实在线发表 \u003cstrong>2026-09-14\u003c/strong>，接受日期 2026-07-27，收稿 2026-04-02；状态为 Diagnostic and Interventional Radiology 在线优先。未找到更早预印本，最早已核实公开日期采用期刊在线日期；论文修订日期未披露。PubMed 的 9 月 14 日 DateRevised 是索引元数据。\u003cstrong>未找到官方代码\u003c/strong>，nnU-Net 工具本身不等于本研究完整代码。PDF 链接存在，未下载、未测试 PDF 可访问性。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>研究纳入 142 人、284 次治疗前/后 MRI，通过 3D nnU-Net 分割左右乳腺实质及肿瘤，按增强信号和 SER 阈值计算 BPE，再用 logistic regression 检验 BPE、体积和临床变量对 pCR 的预测价值。57/142 人达到 pCR，定义为 \u003cstrong>ypT0/Tis ypN0\u003c/strong>。它研究真实观测的正常乳腺背景增强变化，不生成未来图像；这里的病理是术后终点与临床标志物，没有 CT-to-WSI 或组织学图像生成。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>相对定性 BPE 或单一阈值研究，改变在于左右乳腺分割、两类增强定义及多个阈值、亚组与简洁临床基线比较。百分比信号增强为 \u003ccode>100 × (SI_postcontrast − SI_precontrast) / SI_precontrast\u003c/code>；这里 post/precontrast 是\u003cstrong>一次扫描内的造影相位\u003c/strong>，另一层 pre/post-NACT 才是治疗前后。不能混为同一时间轴。\u003c/p>\n\u003cp>原文分割训练 121 人，内部测试 21 人；禁止左右镜像增强以保留 laterality。其目标并非设计新的 nnU-Net 损失，而是检验自动表型能否带来临床增益。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>全文 Results：乳腺实质 Dice 为 \u003cstrong>0.85/0.87\u003c/strong>，肿瘤为 \u003cstrong>0.61±0.36\u003c/strong>；只看大于 100 个预测体素的肿瘤可升至 0.70，但那是改变分析子集，不能替代全体表现。\u003c/p>\n\u003cp>完整模型表观 AUC \u003cstrong>0.76\u003c/strong>，五折验证 \u003cstrong>0.694±0.075\u003c/strong>；仅 HER2 + Ki-67 为 \u003cstrong>0.71±0.08\u003c/strong>。表观 +0.05 的差异 DeLong \u003ccode>P=0.12\u003c/code>，加入 BPE 的拟合改善 \u003ccode>P=0.28\u003c/code>，未显示增量价值。这是本队列没有建立增益，\u003cstrong>不是证明 BPE 或影像纵向信息在所有患者中无效\u003c/strong>。\u003c/p>\n\u003cp>HR+、HER2− 等亚组出现信号，但多重比较未校正；Luminal A/B 仅 8 个 pCR 事件。治疗后 MRI 在末次化疗至少三周之后，临近手术；缺少早期疗中扫描，不能直接否定 I-SPY2 的早期 delta-BPE。月经周期未记录、治疗按亚型分配、单中心和排除缺失 MRI 患者均限制推广。全文未充分明确特征选择是否完全嵌套于结局交叉验证、以及分割输出是否对每个结局验证折均来自独立训练，故不把报告的五折 AUC 当作完全独立外部检验。作者明确排除了术后病理变量作为多变量预测输入，不应仅因其出现在单因素表就断言最终模型用了终点泄漏。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关。\u003c/strong> 它提供乳腺纵向 MRI → pCR 的负面/边界证据，也给出正常背景、病灶变化和临床终点应分开评价的实例。值得把 BPE 作为背景通道审查：模型可能学会全乳腺治疗相关变化，却没有增加对残余肿瘤的认识。原文没有测试 latent 世界模型或生存结局。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>改动位置：\u003c/strong> 先在分析层补充预设临床基线与病灶/背景分解，不需要先改生成器。以治疗前或首次疗中扫描建立独立 landmark，预测最终 pCR，只使用该时点已经可知的输入。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>必要对照：\u003c/strong> HER2 + Ki-67 + 预先指定临床/治疗变量；同历史直接预测；真实可用病灶/BPE 特征；以及加生成未来状态的模型。真实未来状态只作单独标明的事后参照，不能混入部署预测。所有组同患者、同输入历史与训练预算，特征选择、阈值和校准均在训练折内完成。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>评价：\u003c/strong> 分割/影像误差、肿瘤体积或强化变化、pCR 增益三层分开。pCR 报告 paired ΔAUROC、ΔBrier、校准和预设阈值净获益及患者级区间；亚型样本与事件数同时列出。跨中心验证优先于反复优化阈值。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>否证结果：\u003c/strong> 若生成状态仅复现背景增强，且加入后不优于同输入的直接模型或临床基线，就不能宣称临床有用；仅某个事后挑选阈值/亚组有效也不能支持总体结论。CI 未排除有意义增益时标为证据不足。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>算力：\u003c/strong> 原文未给 GPU 型号或训练时长。若已有独立生成的分割/latent，最小比较主要是 CPU 上的小模型与重采样；若需重新训练 3D 分割，必须另行估算，不能把前述低成本评估等同于全流程成本。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据为\u003ca href=\"https://doi.org/10.4274/dir.2026.264036\" target=\"_blank\" rel=\"noopener noreferrer\">期刊全文\u003c/a>的 Methods、Results、Discussion 和 PubMed 结构化摘要。正文讨论了早期疗中 BPE 与本研究终末治疗后 BPE 的时间窗差别。独立笔记附原始英文摘要。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>PURPOSE: To investigate the predictive value of deep learning (nnU-Net)-based fully automated quantitative background parenchymal enhancement (BPE) metrics and clinicopathological factors for pathological complete response (pCR) in patients with breast cancer receiving neoadjuvant chemotherapy (NACT).\nMETHODS: This retrospective study included 142 patients who underwent NACT and had pre- and post-treatment magnetic resonance imaging (MRI) scans. The breast parenchyma and tumors were automatically segmented using nnU-Net. Quantitative BPE metrics were calculated using multiple threshold values based on signal intensity and the signal enhancement ratio. Clinicopathological variables analyzed included age, menopausal status, body mass index (BMI), hormone receptor (HR) status (estrogen receptor, progesterone receptor), human epidermal growth factor receptor 2 (HER2) status, Ki-67 proliferation index, histologic grade, tumor and breast parenchymal volumes, and pre-/post-treatment pathological findings. The BPE parameters and clinicopathological data were evaluated using univariate and multivariable logistic regression models. Pre-specified subgroup analyses were performed using Mann-Whitney U tests, and the independence of subgroup BPE signals from menopausal status and BMI was tested in adjusted logistic models.\nRESULTS: None of the evaluated quantitative BPE metrics showed a statistically significant association with pCR in the overall cohort (P &gt; 0.05 for all). In pre-specified exploratory subgroup analyses, however, baseline BPE was significantly lower among patients with pCR in the HER2-negative subgroup (median 49.8% vs. 59.3%, P = 0.014) and in HR-positive disease (median 44.6% vs. 58.3%, P = 0.003), and a relative increase in BPE during NACT was associated with pCR in HR-positive tumors (P = 0.017). In triple-negative disease, lower post-treatment BPE accompanied pCR (P = 0.010). Multivariable analysis revealed that a high Ki-67 proliferation index [adjusted odds ratio (OR) 1.03 per unit, 95% confidence interval (CI), 1.01-1.04; P = 0.0029] and HER2 positivity (adjusted OR: 2.99, 95% CI, 1.19-7.56; P = 0.020) were strong and independent predictors of pCR. The diagnostic performance [area under the curve (AUC)] of the multivariable model was 0.76 (95% CI: 0.69-0.83).\nCONCLUSION: Even when standardized and reproducible quantitative measurements are obtained via deep learning algorithms, BPE dynamics did not independently predict pCR in this single-center cohort; however, hypothesis-generating subgroup-specific signals in HER2-negative and HR-positive disease warrant prospective evaluation. Traditional clinicopathological features reflecting the tumor&#39;s intrinsic biology remain the most reliable determinants in this cohort for predicting NACT response.\nCLINICAL SIGNIFICANCE: Although custom-trained deep learning models enable standardized and reproducible quantification of BPE, our findings show that BPE dynamics do not independently predict pCR across an unselected NACT cohort. Even a model combining BPE with clinicopathological variables achieved only modest cross-validated discrimination (AUC ≈ 0.69), and this discrimination was fully accounted for by Ki-67 and HER2 status; quantitative BPE added no incremental value. These results do not support the standalone clinical use of quantitative BPE for early response prediction. Clinicians should continue to prioritize intrinsic tumor markers (Ki-67 index, HER2 status), but the subgroup-specific BPE signals observed here are exploratory and require prospective validation before any clinical application.\u003c/p>\n","markdown":"### 一句话总结\n\n142 例、57 个 pCR 事件的单中心研究中，自动 BPE 量化较可靠，但并未超越 HER2 + Ki-67 的简洁预测基线，且研究没有早期疗中 MRI。\n\n**元数据与来源。** Süleyman Öncü、Murat Yüce、Ahmet İrfan Temur。完整标题见总览。[期刊 DOI / HTML 全文](https://doi.org/10.4274/dir.2026.264036)；[PubMed PMID 42734038](https://pubmed.ncbi.nlm.nih.gov/42734038/)。已核实在线发表 **2026-09-14**，接受日期 2026-07-27，收稿 2026-04-02；状态为 Diagnostic and Interventional Radiology 在线优先。未找到更早预印本，最早已核实公开日期采用期刊在线日期；论文修订日期未披露。PubMed 的 9 月 14 日 DateRevised 是索引元数据。**未找到官方代码**，nnU-Net 工具本身不等于本研究完整代码。PDF 链接存在，未下载、未测试 PDF 可访问性。\n\n### 中文摘要\n\n研究纳入 142 人、284 次治疗前/后 MRI，通过 3D nnU-Net 分割左右乳腺实质及肿瘤，按增强信号和 SER 阈值计算 BPE，再用 logistic regression 检验 BPE、体积和临床变量对 pCR 的预测价值。57/142 人达到 pCR，定义为 **ypT0/Tis ypN0**。它研究真实观测的正常乳腺背景增强变化，不生成未来图像；这里的病理是术后终点与临床标志物，没有 CT-to-WSI 或组织学图像生成。\n\n### 创新点与机制\n\n相对定性 BPE 或单一阈值研究，改变在于左右乳腺分割、两类增强定义及多个阈值、亚组与简洁临床基线比较。百分比信号增强为 `100 × (SI_postcontrast − SI_precontrast) / SI_precontrast`；这里 post/precontrast 是**一次扫描内的造影相位**，另一层 pre/post-NACT 才是治疗前后。不能混为同一时间轴。\n\n原文分割训练 121 人，内部测试 21 人；禁止左右镜像增强以保留 laterality。其目标并非设计新的 nnU-Net 损失，而是检验自动表型能否带来临床增益。\n\n### 实验支持与局限\n\n全文 Results：乳腺实质 Dice 为 **0.85/0.87**，肿瘤为 **0.61±0.36**；只看大于 100 个预测体素的肿瘤可升至 0.70，但那是改变分析子集，不能替代全体表现。\n\n完整模型表观 AUC **0.76**，五折验证 **0.694±0.075**；仅 HER2 + Ki-67 为 **0.71±0.08**。表观 +0.05 的差异 DeLong `P=0.12`，加入 BPE 的拟合改善 `P=0.28`，未显示增量价值。这是本队列没有建立增益，**不是证明 BPE 或影像纵向信息在所有患者中无效**。\n\nHR+、HER2− 等亚组出现信号，但多重比较未校正；Luminal A/B 仅 8 个 pCR 事件。治疗后 MRI 在末次化疗至少三周之后，临近手术；缺少早期疗中扫描，不能直接否定 I-SPY2 的早期 delta-BPE。月经周期未记录、治疗按亚型分配、单中心和排除缺失 MRI 患者均限制推广。全文未充分明确特征选择是否完全嵌套于结局交叉验证、以及分割输出是否对每个结局验证折均来自独立训练，故不把报告的五折 AUC 当作完全独立外部检验。作者明确排除了术后病理变量作为多变量预测输入，不应仅因其出现在单因素表就断言最终模型用了终点泄漏。\n\n### 和我方向的适配\n\n**直接相关。** 它提供乳腺纵向 MRI → pCR 的负面/边界证据，也给出正常背景、病灶变化和临床终点应分开评价的实例。值得把 BPE 作为背景通道审查：模型可能学会全乳腺治疗相关变化，却没有增加对残余肿瘤的认识。原文没有测试 latent 世界模型或生存结局。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：** 先在分析层补充预设临床基线与病灶/背景分解，不需要先改生成器。以治疗前或首次疗中扫描建立独立 landmark，预测最终 pCR，只使用该时点已经可知的输入。\n\n- **必要对照：** HER2 + Ki-67 + 预先指定临床/治疗变量；同历史直接预测；真实可用病灶/BPE 特征；以及加生成未来状态的模型。真实未来状态只作单独标明的事后参照，不能混入部署预测。所有组同患者、同输入历史与训练预算，特征选择、阈值和校准均在训练折内完成。\n\n- **评价：** 分割/影像误差、肿瘤体积或强化变化、pCR 增益三层分开。pCR 报告 paired ΔAUROC、ΔBrier、校准和预设阈值净获益及患者级区间；亚型样本与事件数同时列出。跨中心验证优先于反复优化阈值。\n\n- **否证结果：** 若生成状态仅复现背景增强，且加入后不优于同输入的直接模型或临床基线，就不能宣称临床有用；仅某个事后挑选阈值/亚组有效也不能支持总体结论。CI 未排
