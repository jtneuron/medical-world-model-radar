除有意义增益时标为证据不足。\n\n- **算力：** 原文未给 GPU 型号或训练时长。若已有独立生成的分割/latent，最小比较主要是 CPU 上的小模型与重采样；若需重新训练 3D 分割，必须另行估算，不能把前述低成本评估等同于全流程成本。\n\n\n### 原始摘要或 Evidence Source\n\n证据为[期刊全文](https://doi.org/10.4274/dir.2026.264036)的 Methods、Results、Discussion 和 PubMed 结构化摘要。正文讨论了早期疗中 BPE 与本研究终末治疗后 BPE 的时间窗差别。独立笔记附原始英文摘要。\n\n\n\n## 原始摘要\n\nPURPOSE: To investigate the predictive value of deep learning (nnU-Net)-based fully automated quantitative background parenchymal enhancement (BPE) metrics and clinicopathological factors for pathological complete response (pCR) in patients with breast cancer receiving neoadjuvant chemotherapy (NACT).\nMETHODS: This retrospective study included 142 patients who underwent NACT and had pre- and post-treatment magnetic resonance imaging (MRI) scans. The breast parenchyma and tumors were automatically segmented using nnU-Net. Quantitative BPE metrics were calculated using multiple threshold values based on signal intensity and the signal enhancement ratio. Clinicopathological variables analyzed included age, menopausal status, body mass index (BMI), hormone receptor (HR) status (estrogen receptor, progesterone receptor), human epidermal growth factor receptor 2 (HER2) status, Ki-67 proliferation index, histologic grade, tumor and breast parenchymal volumes, and pre-/post-treatment pathological findings. The BPE parameters and clinicopathological data were evaluated using univariate and multivariable logistic regression models. Pre-specified subgroup analyses were performed using Mann-Whitney U tests, and the independence of subgroup BPE signals from menopausal status and BMI was tested in adjusted logistic models.\nRESULTS: None of the evaluated quantitative BPE metrics showed a statistically significant association with pCR in the overall cohort (P > 0.05 for all). In pre-specified exploratory subgroup analyses, however, baseline BPE was significantly lower among patients with pCR in the HER2-negative subgroup (median 49.8% vs. 59.3%, P = 0.014) and in HR-positive disease (median 44.6% vs. 58.3%, P = 0.003), and a relative increase in BPE during NACT was associated with pCR in HR-positive tumors (P = 0.017). In triple-negative disease, lower post-treatment BPE accompanied pCR (P = 0.010). Multivariable analysis revealed that a high Ki-67 proliferation index [adjusted odds ratio (OR) 1.03 per unit, 95% confidence interval (CI), 1.01-1.04; P = 0.0029] and HER2 positivity (adjusted OR: 2.99, 95% CI, 1.19-7.56; P = 0.020) were strong and independent predictors of pCR. The diagnostic performance [area under the curve (AUC)] of the multivariable model was 0.76 (95% CI: 0.69-0.83).\nCONCLUSION: Even when standardized and reproducible quantitative measurements are obtained via deep learning algorithms, BPE dynamics did not independently predict pCR in this single-center cohort; however, hypothesis-generating subgroup-specific signals in HER2-negative and HR-positive disease warrant prospective evaluation. Traditional clinicopathological features reflecting the tumor's intrinsic biology remain the most reliable determinants in this cohort for predicting NACT response.\nCLINICAL SIGNIFICANCE: Although custom-trained deep learning models enable standardized and reproducible quantification of BPE, our findings show that BPE dynamics do not independently predict pCR across an unselected NACT cohort. Even a model combining BPE with clinicopathological variables achieved only modest cross-validated discrimination (AUC ≈ 0.69), and this discrimination was fully accounted for by Ki-67 and HER2 status; quantitative BPE added no incremental value. These results do not support the standalone clinical use of quantitative BPE for early response prediction. Clinicians should continue to prioritize intrinsic tumor markers (Ki-67 index, HER2 status), but the subgroup-specific BPE signals observed here are exploratory and require prospective validation before any clinical application."},{"id":"arxiv:2609.14590","title":"Reverse Spatio-Temporal Disease Progression Modelling","short":"Reverse-Progression","date":"2026-09-16","rank":1,"category":"medical","topic":"直接相关","summary":"冻结 VQ-GAN 后用逆向 Neural ODE 预测过去 MRI，但配准后的 ADNI 结果没有证明疾病特异的逆向轨迹；最有价值的是重建误差、配准和复制基线的诊断设计。","authors":"Shernazarov, Ulugbek · Xu, Moucheng · Ramatov, Inomjon","firstDate":"2026-09-13","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.14590","codeUrl":"","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>冻结 VQ-GAN 后用逆向 Neural ODE 预测过去 MRI，但配准后的 ADNI 结果没有证明疾病特异的逆向轨迹；最有价值的是重建误差、配准和复制基线的诊断设计。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Ulugbek Shernazarov、Moucheng Xu、Inomjon Ramatov。v1：2026-09-13 15:17:59 UTC；无修订。\u003ca href=\"https://arxiv.org/abs/2609.14590\" target=\"_blank\" rel=\"noopener noreferrer\">原始页面\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.14590v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。当前可核实载体为预印本；作者在 arXiv 注明获 SASHIMI 2026（MICCAI workshop）接受，正式论文集记录本次未独立核实。\u003cstrong>未找到官方代码\u003c/strong>，不能将其引用的其他进展模型仓库当成实现。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>任务是根据晚期观测重建未观测的早期影像。先训练并冻结 3D VQ-GAN，逆序 ConvGRU 汇总晚期 latent，再用 \u003ccode>dz/dt = f_theta(z,t)\u003c/code> 向较早时刻积分；残差头相对已观测 anchor 累加变化。它改变的是纵向推断方向和残差时间模型，没有加入治疗效应识别或随机轨迹校准。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>相较向前进展生成，方法明确设置“缺失患者自身早期基线”的任务。损失为 \u003ccode>L = 0.2 L_direct + L_inter\u003c/code>，分别约束直接 latent 误差与帧间变化；真实连续时间与整数序列下标分开。方法强调 anchor 必须是已观测帧，不能偷偷取被遮蔽的最早帧。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>最关键的是全文 §5.2 / Table 1：配准至 1 mm 的 ADNI 测试为 \u003cstrong>25 名受试者\u003c/strong>。模型 MSE \u003cstrong>0.00238\u003c/strong>，VQ copy-nearest \u003cstrong>0.00168\u003c/strong>，原始像素 copy-nearest \u003cstrong>0.00088\u003c/strong>；模型 SSIM \u003cstrong>0.574\u003c/strong> 高于 VQ copy 的 \u003cstrong>0.454\u003c/strong>，但远低于原始像素 copy 的 \u003cstrong>0.957\u003c/strong>。仅做目标影像 encode-decode 的 MSE 已达 \u003cstrong>0.00131\u003c/strong>，说明编码器误差本身已大于复制基线误差。\u003c/p>\n\u003cp>变化幅度比 \u003ccode>Dyn\u003c/code> 为 \u003cstrong>1.29 ± 0.23\u003c/strong>，说明不是静态复制，却存在变化过冲；不同诊断分层的 \u003ccode>Rev\u003c/code> 均为负，整体为 \u003cstrong>-1.88\u003c/strong>。未配准 64³ 数据上的正面结果，作者在正文中明确解释为主要受到位姿和视野错配影响。因此，\u003cstrong>摘要中“所有分层为正”的表述不能代表配准后的主实验\u003c/strong>。合成数据能恢复非单调变化，不等于真实 MRI 已捕捉疾病机制。\u003c/p>\n\u003cp>另有两点待复现时核对：文中“382 T1 MRI”、至少五次就诊、80/10/10 划分和 25 名测试受试者的计数口径并不充分清楚；配准使用患者最早 baseline 为参考，实际逆向部署若该 baseline 不可得，预处理必须改为只依赖已观测 anchor。这是部署可用性问题，不能直接断言已发生模型输入泄漏。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关。\u003c/strong> VQ 潜空间、连续时间、残差预测与双向学习都贴近纵向影像路线。最值得迁移的是“先量化可观测疾病变化是否高于编码器误差”的评估。肿瘤治疗可能导致非单调反应、坏死、复发；“更早就是更健康”不适用，也不能将向后积分解释为撤除治疗的因果反事实。原文无 pCR、OS 或治疗条件实验。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>**改动位置：**先在现有冻结编码器的评估管线加入重建误差诊断，再试一个小型时间残差头。正向与反向各自只使用预测时可获得的 anchor 和预处理信息。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**对照：**原始像素复制、encode-decode 后复制、目标影像 encode-decode（仅诊断重建误差，不是可部署预测器）、线性趋势、同输入/参数量/训练预算的直接残差模型。固定患者划分，单独报告配准前后结果。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**指标：**全图与病灶 ROI 分开算误差；报告肿瘤体积变化 MAE、变化方向、变化幅度比，并按真实变化幅度分层。仅在病灶变化有效后，用同一 landmark 比较临床基线、真实历史直接预测、历史加生成状态的 pCR AUROC/AUPRC/Brier；OS 另用删失适配指标。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**否证：**配准后收益消失、只改善背景、变化不优于复制，或生成状态不优于同预算直接预测，则不支持“学到有临床价值的动态状态”。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**算力：**原文 §3.1 为冻结 34.1M 参数编码器、22,163 个时间模型参数、20,000 步 fp32；§5.3 报告 1 mm 阶段一约 36.2 GB 显存/48 GB 单卡。医学小实验若直接复用缓存 latent，可单卡起步，这是按小时间头估计，非原论文复现耗时承诺。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据：\u003ca href=\"https://arxiv.org/html/2609.14590v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §3–6、Table 1；独立笔记附原始英文摘要。上述医学实验为建议，尚未执行。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Deep learning-based spatio-temporal disease progression models commonly overlook the incubation period of progressive diseases, limiting the use of those models in early interventions, which are vital for not easily reversible diseases such as Alzheimer&#39;s. This is because, the existing deep learning based longitudinal disease-progression models are almost always run forward: from an observed baseline they predict future decline. In many clinical settings, however, imaging begins only after pathology is suspected or already visible, the earlier, healthier patient-specific reference was never acquired. To address this, we propose to study reverse disease progression prediction: given later diseased anatomy, reconstruct the unobserved healthier anatomy that preceded it. We use a two-stage model in which a frozen 3D vector-quantised autoencoder defines a compact discrete latent space, while a Neural Ordinary Differential Equation (ODE) learns continuous-time dynamics in that space. A recurrent encoder reads late observations in reverse temporal order, initialises the latent state, and the ODE is integrated backwards across the trajectory. On a controlled Morpho-MNIST benchmark with a sinusoidal perturbation, our model successfully recovered the unseen previous states from later observations of the non-monotonic trajectory. On longitudinal brain MRIs from Alzheimer&#39;s Disease Neuroimaging Initiative, at the task to recover the previous unseen trajectory towards healthy states of the patients from observed later diseased states, our model outperforms the baselines that uses copy-nearest and mean-observed, with positive disease-reversal scores in every diagnostic stratum. We hope that our work can provide insights and tools towards discovering the incubation periods from single-shot scans, and developing early interventions of diseases based on imaging.\u003c/p>\n","markdown":"### 一句话总结\n\n冻结 VQ-GAN 后用逆向 Neural ODE 预测过去 MRI，但配准后的 ADNI 结果没有证明疾病特异的逆向轨迹；最有价值的是重建误差、配准和复制基线的诊断设计。\n\n**元数据。** Ulugbek Shernazarov、Moucheng Xu、Inomjon Ramatov。v1：2026-09-13 15:17:59 UTC；无修订。[原始页面](https://arxiv.org/abs/2609.14590)；[全文](https://arxiv.org/html/2609.14590v1)。当前可核实载体为预印本；作者在 arXiv 注明获 SASHIMI 2026（MICCAI workshop）接受，正式论文集记录本次未独立核实。**未找到官方代码**，不能将其引用的其他进展模型仓库当成实现。\n\n### 中文摘要\n\n任务是根据晚期观测重建未观测的早期影像。先训练并冻结 3D VQ-GAN，逆序 ConvGRU 汇总晚期 latent，再用 `dz/dt = f_theta(z,t)` 向较早时刻积分；残差头相对已观测 anchor 累加变化。它改变的是纵向推断方向和残差时间模型，没有加入治疗效应识别或随机轨迹校准。\n\n### 创新点与机制\n\n相较向前进展生成，方法明确设置“缺失患者自身早期基线”的任务。损失为 `L = 0.2 L_direct + L_inter`，分别约束直接 latent 误差与帧间变化；真实连续时间与整数序列下标分开。方法强调 anchor 必须是已观测帧，不能偷偷取被遮蔽的最早帧。\n\n### 实验支持与局限\n\n最关键的是全文 §5.2 / Table 1：配准至 1 mm 的 ADNI 测试为 **25 名受试者**。模型 MSE **0.00238**，VQ copy-nearest **0.00168**，原始像素 copy-nearest **0.00088**；模型 SSIM **0.574** 高于 VQ copy 的 **0.454**，但远低于原始像素 copy 的 **0.957**。仅做目标影像 encode-decode 的 MSE 已达 **0.00131**，说明编码器误差本身已大于复制基线误差。\n\n变化幅度比 `Dyn` 为 **1.29 ± 0.23**，说明不是静态复制，却存在变化过冲；不同诊断分层的 `Rev` 均为负，整体为 **-1.88**。未配准 64³ 数据上的正面结果，作者在正文中明确解释为主要受到位姿和视野错配影响。因此，**摘要中“所有分层为正”的表述不能代表配准后的主实验**。合成数据能恢复非单调变化，不等于真实 MRI 已捕捉疾病机制。\n\n另有两点待复现时核对：文中“382 T1 MRI”、至少五次就诊、80/10/10 划分和 25 名测试受试者的计数口径并不充分清楚；配准使用患者最早 baseline 为参考，实际逆向部署若该 baseline 不可得，预处理必须改为只依赖已观测 anchor。这是部署可用性问题，不能直接断言已发生模型输入泄漏。\n\n### 和我方向的适配\n\n**直接相关。** VQ 潜空间、连续时间、残差预测与双向学习都贴近纵向影像路线。最值得迁移的是“先量化可观测疾病变化是否高于编码器误差”的评估。肿瘤治疗可能导致非单调反应、坏死、复发；“更早就是更健康”不适用，也不能将向后积分解释为撤除治疗的因果反事实。原文无 pCR、OS 或治疗条件实验。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：**先在现有冻结编码器的评估管线加入重建误差诊断，再试一个小型时间残差头。正向与反向各自只使用预测时可获得的 anchor 和预处理信息。\n\n- **对照：**原始像素复制、encode-decode 后复制、目标影像 encode-decode（仅诊断重建误差，不是可部署预测器）、线性趋势、同输入/参数量/训练预算的直接残差模型。固定患者划分，单独报告配准前后结果。\n\n- **指标：**全图与病灶 ROI 分开算误差；报告肿瘤体积变化 MAE、变化方向、变化幅度比，并按真实变化幅度分层。仅在病灶变化有效后，用同一 landmark 比较临床基线、真实历史直接预测、历史加生成状态的 pCR AUROC/AUPRC/Brier；OS 另用删失适配指标。\n\n- **否证：**配准后收益消失、只改善背景、变化不优于复制，或生成状态不优于同预算直接预测，则不支持“学到有临床价值的动态状态”。\n\n- **算力：**原文 §3.1 为冻结 34.1M 参数编码器、22,163 个时间模型参数、20,000 步 fp32；§5.3 报告 1 mm 阶段一约 36.2 GB 显存/48 GB 单卡。医学小实验若直接复用缓存 latent，可单卡起步，这是按小时间头估计，非原论文复现耗时承诺。\n\n\n### 原始摘要或 Evidence Source\n\n证据：[v1 全文](https://arxiv.org/html/2609.14590v1) §3–6、Table 1；独立笔记附原始英文摘要。上述医学实验为建议，尚未执行。\n\n\n\n## 原始摘要\n\nDeep learning-based spatio-temporal disease progression models commonly overlook the incubation period of progressive diseases, limiting the use of those models in early interventions, which are vital for not easily reversible diseases such as Alzheimer's. This is because, the existing deep learning based longitudinal disease-progression models are almost always run forward: from an observed baseline they predict future decline. In many clinical settings, however, imaging begins only after pathology is suspected or already visible, the earlier, healthier patient-specific reference was never acquired. To address this, we propose to study reverse disease progression prediction: given later diseased anatomy, reconstruct the unobserved healthier anatomy that preceded it. We use a two-stage model in which a frozen 3D vector-quantised autoencoder defines a compact discrete latent space, while a Neural Ordinary Differential Equation (ODE) learns continuous-time dynamics in that space. A recurrent encoder reads late observations in reverse temporal order, initialises the latent state, and the ODE is integrated backwards across the trajectory. On a controlled Morpho-MNIST benchmark with a sinusoidal perturbation, our model successfully recovered the unseen previous states from later observations of the non-monotonic trajectory. On longitudinal brain MRIs from Alzheimer's Disease Neuroimaging Initiative, at the task to recover the previous unseen trajectory towards healthy states of the patients from observed later diseased states, our model outperforms the baselines that uses copy-nearest and mean-observed, with positive disease-reversal scores in every diagnostic stratum. We hope that our work can provide insights and tools towards discovering the incubation periods from single-shot scans, and developing early interventions of diseases based on imaging."},{"id":"arxiv:2609.15189","title":"Reconstructing Is Not Acting: Action-Centric Latent Dynamics Modeling","short":"ACT-LAM","date":"2026-09-16","rank":2,"category":"general","topic":"可迁移算法","summary":"ACT-LAM 将条件提取和条件使用分开设计，控制任务收益与影像重建指标并不一致；其长程误差结果也提醒我们不要把条件敏感性当成预测正确性。","authors":"Fu, Dingjie · Shi, Dianxing · Xu, Yangyang · Yu, Jun","firstDate":"2026-09-14","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.15189","codeUrl":"https://github.com/DingjieFu/ACT-LAM","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>ACT-LAM 将条件提取和条件使用分开设计，控制任务收益与影像重建指标并不一致；其长程误差结果也提醒我们不要把条件敏感性当成预测正确性。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Dingjie Fu、Dianxing Shi、Yangyang Xu、Jun Yu。v1：2026-09-14 08:10:46 UTC；无修订；技术报告/预印本，未核实正式接受。\u003ca href=\"https://arxiv.org/abs/2609.15189\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.15189v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>；\u003ca href=\"https://github.com/DingjieFu/ACT-LAM\" target=\"_blank\" rel=\"noopener noreferrer\">官方仓库\u003c/a>。仓库与论文互链已核实，但当前根目录只有 \u003cstrong>README.md 和 LICENSE，没有模型源码\u003c/strong>，不能称为已可复现实现。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>基于冻结 DINOv2，AQ-IDM 用可学习 query 读取相邻状态差，并通过门控汇总为 latent action；AT-FDM 把 action 变成随 state token 一起更新的 token，在每层继续调制状态。它针对当前状态造成的预测捷径，以及重建训练并未充分约束 latent action 含义的问题。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>相对 DiLA，方法取消较重的特征处理模块，强化逆向与正向动态模块。未来状态采用残差形式 \u003ccode>s_next = s + F(s,z_action)\u003c/code>；总目标组合特征重建、状态差 SmoothL1、动作一致性、前后方向对称与动作方差项。参数量从 \u003cstrong>123M 降至 55M\u003c/strong>，因此主榜并非只改变一个损失的等容量对照。论文的条件使用实验固定 IDM，替换 FDM 的条件通路，再把正确 action 换为常量，比较 rollout 状态误差的相对增量。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 5 的 VP² 归一化 aggregate 为 \u003cstrong>49.04 对 41.44\u003c/strong>，提高 \u003cstrong>7.60 个百分点\u003c/strong>；该 aggregate 按 simulator 成功率归一化，并非普通平均临床成功率。结果来自四个种子。\u003c/p>\n\u003cp>Table 3 的 RT-1 重建 MSE：短程 @1，ACT-LAM \u003cstrong>0.119\u003c/strong>、DiLA \u003cstrong>0.215\u003c/strong>；@15 则 ACT-LAM \u003cstrong>0.705\u003c/strong>、DiLA \u003cstrong>0.323\u003c/strong>。正文说明 ACT-LAM 仅 teacher forcing，而 DiLA 用 rollout 微调的官方 checkpoint，训练阶段差异限制了归因。论文支持“更好的动作表示可以与更差的长程重建共存”，不支持“所有生成和长程指标全面领先”。移除动作使误差上升，仅证明模型依赖该输入，不能单独证明使用方式正确。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 优先借鉴 state-aware 条件 token 和条件干预诊断；用已知治疗类型、剂量及真实时间差初始化 token。逆向模型从真实未来影像提取的 action 只能用于训练期辅助监督，预测时不可作为输入，否则发生未来信息泄漏。肿瘤缩小并不能唯一反推治疗，前后方向对称也不等于临床过程可逆；\u003ccode>L_sym\u003c/code> 不应直接照搬为撤药或逆疗效约束。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>**改动位置：**只替换小型 latent 残差预测头的治疗条件注入模块，比较固定拼接/FiLM 与逐层交互 token；保持治疗编码器与影像编码器一致。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**对照：**同输入、近似同参数量与预算，包含不使用治疗、正确治疗、置换治疗、复制和直接残差预测；置换仅作条件使用诊断，不估计治疗效应。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**指标：**分开报告单步/多步 latent 误差、病灶变化 MAE、患者间变化排序，以及 landmark 固定的 pCR 增益。记录移除条件后的误差差值，但不把该差值作为主要成绩。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**否证：**治疗敏感性增加却不改善真实预测、校准或下游任务，或收益仅出现在训练可获得未来 action 的设置，则否定本次迁移假设。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**算力：**原文 Appendix A.2 使用 \u003cstrong>4 × RTX A6000 48 GB、50k 步、16 帧 256²、fp32\u003c/strong>。仅改缓存 latent 上的小头估计可单卡验证；不据此估计完整视频预训练时长。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据：\u003ca href=\"https://arxiv.org/html/2609.15189v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §3–4、Tables 1/3/5、Appendix A.2/B.8；官方仓库目录为本次读取结果。独立笔记附原始摘要。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Latent action models (LAMs) learn action representations from unlabeled videos by inferring latent actions from visual transitions and reconstructing future states. However, we identify a fundamental $\\textbf{reconstruction-action mismatch}$: lower reconstruction error does not necessarily yield better latent dynamics or downstream performance. We attribute this mismatch to two underconstrained aspects of reconstruction-based latent dynamics modeling: (i) the inverse dynamics model (IDM) is not explicitly encouraged to distinguish action-related transitions from nuisance appearance, and (ii) the forward dynamics model (FDM) can underutilize the inferred latent action by exploiting predictive shortcuts from the current state. To address both limitations, we propose $\\textbf{ACT-LAM}$, a lightweight action-centric framework that strengthens both action extraction and action utilization. Specifically, its Action Query IDM (AQ-IDM) employs learnable action queries and gated aggregation to selectively extract rich action-related transition cues without strong information bottlenecks. And its Action Token FDM (AT-FDM) projects latent actions into action tokens that progressively interact with evolving state representations, enabling continuous state-aware action conditioning. ACT-LAM further streamlines feature processing to concentrate model capacity on latent dynamics modeling. Extensive experiments on several robotic datasets and the VP$^2$ benchmark demonstrate stronger latent action consistency, forward dynamics, and downstream visual planning performance with fewer trainable parameters and lower computational overhead. In particular, ACT-LAM surpasses the previous state of the art by $\\textbf{7.6%}$ on the aggregated VP$^2$ success rate. Codes at $\\href{\u003ca href=\"https://github.com/DingjieFu/ACT-LAM%7D%7Burl%7D$\" target=\"_blank\" rel=\"noopener noreferrer\">https://github.com/DingjieFu/ACT-LAM}{url}$\u003c/a>.\u003c/p>\n","markdown":"### 一句话总结\n\nACT-LAM 将条件提取和条件使用分开设计，控制任务收益与影像重建指标并不一致；其长程误差结果也提醒我们不要把条件敏感性当成预测正确性。\n\n**元数据。** Dingjie Fu、Dianxing Shi、Yangyang Xu、Jun Yu。v1：2026-09-14 08:10:46 UTC；无修订；技术报告/预印本，未核实正式接受。[原文](https://arxiv.org/abs/2609.15189)；[全文](https://arxiv.org/html/2609.15189v1)；[官方仓库](https://github.com/DingjieFu/ACT-LAM)。仓库与论文互链已核实，但当前根目录只有 **README.md 和 LICENSE，没有模型源码**，不能称为已可复现实现。\n\n### 中文摘要\n\n基于冻结 DINOv2，AQ-IDM 用可学习 query 读取相邻状态差，并通过门控汇总为 latent action；AT-FDM 把 action 变成随 state token 一起更新的 token，在每层继续调制状态。它针对当前状态造成的预测捷径，以及重建训练并未充分约束 latent action 含义的问题。\n\n### 创新点与机制\n\n相对 DiLA，方法取消较重的特征处理模块，强化逆向与正向动态模块。未来状态采用残差形式 `s_next = s + F(s,z_action)`；总目标组合特征重建、状态差 SmoothL1、动作一致性、前后方向对称与动作方差项。参数量从 **123M 降至 55M**，因此主榜并非只改变一个损失的等容量对照。论文的条件使用实验固定 IDM，替换 FDM 的条件通路，再把正确 action 换为常量，比较 rollout 状态误差的相对增量。\n\n### 实验支持与局限\n\nTable 5 的 VP² 归一化 aggregate 为 **49.04 对 41.44**，提高 **7.60 个百分点**；该 aggregate 按 simulator 成功率归一化，并非普通平均临床成功率。结果来自四个种子。\n\nTable 3 的 RT-1 重建 MSE：短程 @1，ACT-LAM **0.119**、DiLA **0.215**；@15 则 ACT-LAM **0.705**、DiLA **0.323**。正文说明 ACT-LAM 仅 teacher forcing，而 DiLA 用 rollout 微调的官方 checkpoint，训练阶段差异限制了归因。论文支持“更好的动作表示可以与更差的长程重建共存”，不支持“所有生成和长程指标全面领先”。移除动作使误差上升，仅证明模型依赖该输入，不能单独证明使用方式正确。\n\n### 和我方向的适配\n\n**可迁移算法。** 优先借鉴 state-aware 条件 token 和条件干预诊断；用已知治疗类型、剂量及真实时间差初始化 token。逆向模型从真实未来影像提取的 action 只能用于训练期辅助监督，预测时不可作为输入，否则发生未来信息泄漏。肿瘤缩小并不能唯一反推治疗，前后方向对称也不等于临床过程可逆；`L_sym` 不应直接照搬为撤药或逆疗效约束。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：**只替换小型 latent 残差预测头的治疗条件注入模块，比较固定拼接/FiLM 与逐层交互 token；保持治疗编码器与影像编码器一致。\n\n- **对照：**同输入、近似同参数量与预算，包含不使用治疗、正确治疗、置换治疗、复制和直接残差预测；置换仅作条件使用诊断，不估计治疗效应。\n\n- **指标：**分开报告单步/多步 latent 误差、病灶变化 MAE、患者间变化排序，以及 landmark 固定的 pCR 增益。记录移除条件后的误差差值，但不把该差值作为主要成绩。\n\n- **否证：**治疗敏感性增加却不改善真实预测、校准或下游任务，或收益仅出现在训练可获得未来 action 的设置，则否定本次迁移假设。\n\n- **算力：**原文 Appendix A.2 使用 **4 × RTX A6000 48 GB、50k 步、16 帧 256²、fp32**。仅改缓存 latent 上的小头估计可单卡验证；不据此估计完整视频预训练时长。\n\n\n### 原始摘要或 Evidence Source\n\n证据：[v1 全文](https://arxiv.org/html/2609.15189v1) §3–4、Tables 1/3/5、Appendix A.2/B.8；官方仓库目录为本次读取结果。独立笔记附原始摘要。\n\n\n\n## 原始摘要\n\nLatent action models (LAMs) learn action representations from unlabeled videos by inferring latent actions from visual transitions and reconstructing future states. However, we identify a fundamental $\\textbf{reconstruction-action mismatch}$: lower reconstruction error does not necessarily yield better latent dynamics or downstream performance. We attribute this mismatch to two underconstrained aspects of reconstruction-based latent dynamics modeling: (i) the inverse dynamics model (IDM) is not explicitly encouraged to distinguish action-related transitions from nuisance appearance, and (ii) the forward dynamics model (FDM) can underutilize the inferred latent action by exploiting predictive shortcuts from the current state. To address both limitations, we propose $\\textbf{ACT-LAM}$, a lightweight action-centric framework that strengthens both action extraction and action utilization. Specifically, its Action Query IDM (AQ-IDM) employs learnable action queries and gated aggregation to selectively extract rich action-related transition cues without strong information bottlenecks. And its Action Token FDM (AT-FDM) projects latent actions into action tokens that progressively interact with evolving state representations, enabling continuous state-aware action conditioning. ACT-LAM further streamlines feature processing to concentrate model capacity on latent dynamics modeling. Extensive experiments on several robotic datasets and the VP$^2$ benchmark demonstrate stronger latent action consistency, forward dynamics, and downstream visual planning performance with fewer trainable parameters and lower computational overhead. In particular, ACT-LAM surpasses the previous state of the art by $\\textbf{7.6%}$ on the aggregated VP$^2$ success rate. Codes at $\\href{https://github.com/DingjieFu/ACT-LAM}{url}$."},{"id":"arxiv:2609.16573","title":"AsyncCouple-Flow: Asynchronous Cross-Modal Coupling and Flow Matching for Spatio-Temporal Forecasting","short":"AsyncCouple-Flow","date":"2026-09-16","rank":3,"category":"general","topic":"可迁移算法","summary":"用原生时间戳的稀疏跨模态图构造条件，再由 Flow Matching 联合预测整段未来；它可以启发 MRI、临床变量和治疗记录不同步时的历史融合。","authors":"Wu, Zhixiang · Liu, Yining · Zhao, Bo · Chen, Szu-Yu · Duan, Huiran · Lin, Chu · Yang, Chuanguang","firstDate":"2026-09-15","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.16573","codeUrl":"","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>用原生时间戳的稀疏跨模态图构造条件，再由 Flow Matching 联合预测整段未来；它可以启发 MRI、临床变量和治疗记录不同步时的历史融合。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Zhixiang Wu、Yining Liu、Bo Zhao、Szu-Yu Chen、Huiran Duan、Chu Lin、Ch 3c/p>\n\u003c/li>\n\u003cli>\u003cp>**否证：**只在随机缺失上有效、对真实缺失失效；联合采样增加多样性却恶化 proper scores；或相同输入预算的直接回归更好，均削弱迁移理由。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>算力：\u003c/strong>§4.1 报告 \u003cstrong>8 × A100、100 epochs、batch 32\u003c/strong>；§4.6 单 A100 推理约 \u003cstrong>150 ms\u003c/strong>，只适用于其数据/分辨率。医学小实验估计先用缓存 latent 单卡训练小头，不能沿用该延迟数字。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据：\u003ca href=\"https://arxiv.org/html/2609.16573v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §3–4、Table 1、Figures 2–5。独立笔记附原始摘要。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Multi-modal spatio-temporal forecasting (MM-STF) supports weather nowcasting, traffic prediction, and earth-system modeling by combining heterogeneous sources such as physical fields, satellite imagery, and in-situ sensors. Three obstacles persist: (i) modalities have different spatio-temporal sampling rates, forcing lossy interpolation onto a unified grid; (ii) modalities are frequently missing at deployment due to sensor outages or revisit gaps, while most methods train with full availability; and (iii) autoregressive decoders accumulate errors over long horizons, amplified by multi-modal conditioning. We propose AsyncCouple-Flow to address these issues jointly. A Modality-Aware Token Sparsification (MATS) module performs scale-aware tokenization and uses a shared importance scorer to select top-k tokens per timestep, producing equal-length sequences. An Asynchronous Cross-Modal Coupling Graph (ACCG) replaces fixed cross-attention with a learnable graph whose edges encode time offsets, semantic similarity, and modality-specific physical priors, enabling fusion under arbitrary asynchrony and missingness. A Flow-Matching Forecasting Head models multi-step prediction as a conditional ODE, trained with stochastic modality dropout and integrated jointly to avoid autoregressive drift. Experiments on ERA5+GOES+ISD weather forecasting and PEMS-BAY traffic prediction with multi-source side information show that AsyncCouple-Flow outperforms state-of-the-art baselines and remains robust with up to two missing modalities. The code will be released upon acceptance.\u003c/p>\n","markdown":"### 一句话总结\n\n用原生时间戳的稀疏跨模态图构造条件，再由 Flow Matching 联合预测整段未来；它可以启发 MRI、临床变量和治疗记录不同步时的历史融合。\n\n**元数据。** Zhixiang Wu、Yining Liu、Bo Zhao、Szu-Yu Chen、Huiran Duan、Chu Lin、Chuanguang Yang。v1：**2026-09-15 03:15:14 UTC**，以原页历史为准，搜索结果显示的 09-14 不采用；无修订。[原文](https://arxiv.org/abs/2609.16573)；[全文](https://arxiv.org/html/2609.16573v1)。预印本；作者注明 ICONIP 2026 接受，未独立核实正式论文集。**未找到官方代码**，摘要仍称接受后发布。\n\n### 中文摘要\n\nMATS 在各模态各时点保留少量 token；ACCG 的边结合真实时间差、语义相似度与模态对先验，缺失模态直接不建立节点；FM head 把整个未来张量作为一个联合随机变量生成。相对插值后拼接或逐步自回归，它同时改变历史融合与未来输出组织方式。\n\n### 创新点与机制\n\n边权大致为时间衰减 × query-key 相似度 × 模态对先验。生成时间 `s ∈ [0,1]` 与真实观测时间分开：`x_s = (1-s) noise + s Y_future`，回归速度 `Y_future - noise`，再加一步预测 L1 与 token 预算正则。训练随机整模态 dropout 为 **0.3**。“一次 ODE 求解”仍包含 **25 次 Euler 更新**，不是一次网络前向，也不保证未来误差不增长。\n\n### 实验支持与局限\n\nTable 1：WeatherBench-MM 24 h 的 RMSE **1.67 对 CrossViViT 1.89**，CRPS **0.93 对 1.06**；PEMS-BAY-MM 60 min MAE **1.61 对 1.79**。论文称五个种子均值，但该表没有给种子离散度或差异置信区间。缺失模态实验通过随机删除 0/1/2 个模态完成，不能推及临床按病情选择检查的缺失机制。\n\n作者将优点描述为避免自回归漂移；我的判断是它消除了显式逐步回灌，但 Figure 4 中误差仍随预测距离增长。它没有证明医学长程外推、治疗效应识别或跨中心校准，插值式基线和融合模块同时改变也需要拆开消融。\n\n### 和我方向的适配\n\n**可迁移算法。** 可以迁移真实时间差边和“整段未来 latent”的输出方式；需要影像、化验、临床记录各自可信的采集时间，以及预测时点之前的治疗信息。少量 MRI 的场景可先保留全部时点，避免未经验证的 top-k 丢掉小病灶。天气模态之间的物理先验不能直接换成未经验证的影像—病理因果关系。预测跨度超过已知治疗方案时，需要明确后续治疗的条件假设。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：**冻结编码器，用时间差图或简单时间戳 attention 融合历史，再比较联合未来 latent 与自回归输出。\n\n- **对照：**2×2 消融：插值/原生时间融合 × 直接回归/FM，另加复制和同预算自回归模型；匹配可用历史、参数量、训练步数与采样预算。\n\n- **指标：**按真实间隔报告病灶体积变化 MAE、每一步误差、CRPS、联合 energy score、区间覆盖率与宽度。分别测试随机缺失和真实就诊缺失，后者需记录缺失指示及时间信息。\n\n- **否证：**只在随机缺失上有效、对真实缺失失效；联合采样增加多样性却恶化 proper scores；或相同输入预算的直接回归更好，均削弱迁移理由。\n\n- **算力：**§4.1 报告 **8 × A100、100 epochs、batch 32**；§4.6 单 A100 推理约 **150 ms**，只适用于其数据/分辨率。医学小实验估计先用缓存 latent 单卡训练小头，不能沿用该延迟数字。\n\n\n### 原始摘要或 Evidence Source\n\n证据：[v1 全文](https://arxiv.org/html/2609.16573v1) §3–4、Table 1、Figures 2–5。独立笔记附原始摘要。\n\n\n\n## 原始摘要\n\nMulti-modal spatio-temporal forecasting (MM-STF) supports weather nowcasting, traffic prediction, and earth-system modeling by combining heterogeneous sources such as physical fields, satellite imagery, and in-situ sensors. Three obstacles persist: (i) modalities have different spatio-temporal sampling rates, forcing lossy interpolation onto a unified grid; (ii) modalities are frequently missing at deployment due to sensor outages or revisit gaps, while most methods train with full availability; and (iii) autoregressive decoders accumulate errors over long horizons, amplified by multi-modal conditioning. We propose AsyncCouple-Flow to address these issues jointly. A Modality-Aware Token Sparsification (MATS) module performs scale-aware tokenization and uses a shared importance scorer to select top-k tokens per timestep, producing equal-length sequences. An Asynchronous Cross-Modal Coupling Graph (ACCG) replaces fixed cross-attention with a learnable graph whose edges encode time offsets, semantic similarity, and modality-specific physical priors, enabling fusion under arbitrary asynchrony and missingness. A Flow-Matching Forecasting Head models multi-step prediction as a conditional ODE, trained with stochastic modality dropout and integrated jointly to avoid autoregressive drift. Experiments on ERA5+GOES+ISD weather forecasting and PEMS-BAY traffic prediction with multi-source side information show that AsyncCouple-Flow outperforms state-of-the-art baselines and remains robust with up to two missing modalities. The code will be released upon acceptance."},{"id":"arxiv:2609.16317","title":"Generative models for simulation based filtering: Formulations and Empirical Comparisons","short":"Generative-Filters","date":"2026-09-16","rank":4,"category":"general","topic":"可迁移算法","summary":"把新观测下的后验校正统一成条件 transport，比较 FM、随机插值和 Schrodinger bridge；算法选择依赖粒子数和在线计算预算，没有普遍赢家。","authors":"Al-Jarrah, Mohammad · Deng, Wei · Hosseini, Bamdad · Taghvaei, Amirhossein","firstDate":"2026-09-14","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.16317","codeUrl":"https://github.com/Mohd9485/Generative_Filters","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>把新观测下的后验校正统一成条件 transport，比较 FM、随机插值和 Schrodinger bridge；算法选择依赖粒子数和在线计算预算，没有普遍赢家。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Mohammad Al-Jarrah、Wei Deng、Bamdad Hosseini、Amirhossein Taghvaei。v1：2026-09-14 20:31:29 UTC；无修订；预印本。\u003ca href=\"https://arxiv.org/abs/2609.16317\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.16317v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>；\u003ca href=\"https://github.com/Mohd9485/Generative_Filters\" target=\"_blank\" rel=\"noopener noreferrer\">官方代码\u003c/a>。论文链接与仓库目录已核验，有 SIF.py、SBF.py、OTF.py、KRF.py、SIR.py、EnKF.py 及调参脚本；未运行代码。README 提及的 FMF.py 未出现在本次根目录列表中，不能据此宣称所有比较方法均已完整发布。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>已知状态转移和观测模拟器时，先生成 forecast ensemble，再学习依赖新观测的 transport 得到过滤后验。通过保持观测坐标的三角映射统一不同模型，并把初始训练调参与每次新观测的在线 refinement 分开。\u003c/p>\n\u003ch3>创新点与实验边界\u003c/h3>\n\u003cp>两类合成动力学测试用 aa-SW2、粒子数、在线成本和二十次模拟评价。正文 §IV-C 明确：二次观测任务中 \u003cstrong>SBF 是未恢复双峰的例外\u003c/strong>，不能照摘要转述“所有生成过滤器都恢复多峰”。小粒子数 Lorenz-63 下 OTF/KRF 更稳定；某些 SIF 最低误差设置的在线成本比 EnKF/SIR 高约四个数量级。aa-SW2 逐坐标投影不能充分检查联合相关结构。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 适合“疗中 MRI 到达后校正患者状态分布”，与从基线一次性预测未来是不同任务。前提是有可用状态转移与观测模型；MRI 测量噪声、潜状态可辨识性、信息性随访不能当作已知。原文没有临床疗效/生存证据。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在固定低维病灶状态预测器后增加观测校正层，比较无校正、线性/Kalman 更新、小粒子滤波、FM transport；相同观测与在线预算。用观测到来之后的下一次随访检验变化 MAE、energy score 和覆盖率，不能用刚吸收的观测当“未来预测”成绩。若仅观测拟合变好而下一次预测无增益，或增加成本后不优于简单滤波，否定复杂生成校正的必要性。先做低维模拟和缓存 latent，CPU/单卡估计可起步；具体训练预算需实测，原文比较的是随方法变化的在线成本。\u003c/p>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>\u003ca href=\"https://arxiv.org/html/2609.16317v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §II–V、Figures 1–2；独立笔记附原始摘要。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>This letter presents a unified formulation and a controlled numerical comparison of generative-model approaches to the nonlinear filtering problem. Under this formulation the analysis step is realized by a transport of the forecast distribution to the posterior, the approaches differing only in how that transport is selected and learned. We derive three new filters, based on stochastic interpolants, their deterministic flow-matching limit, and Schr&quot;odinger bridges realized through forward--backward SDEs. We develop a two-stage tuning procedure that separates the training of the generative model from its online refinement. The resulting methods are compared against the optimal transport filter (OTF), the Knothe--Rosenblatt filter (KRF), the sequential importance resampling (SIR) particle filter and the ensemble Kalman filter (EnKF), in terms of accuracy, computational time, and sensitivity to ensemble size and state dimension. The results indicate that every generative filter resolves multimodal posteriors that the EnKF and SIR do not, that no single generative framework dominates, the preferred method being set by the available online budget and ensemble size, and that the filters differ in the regularity of the particle trajectories they produce.\u003c/p>\n","markdown":"### 一句话总结\n\n把新观测下的后验校正统一成条件 transport，比较 FM、随机插值和 Schrodinger bridge；算法选择依赖粒子数和在线计算预算，没有普遍赢家。\n\n**元数据。** Mohammad Al-Jarrah、Wei Deng、Bamdad Hosseini、Amirhossein Taghvaei。v1：2026-09-14 20:31:29 UTC；无修订；预印本。[原文](https://arxiv.org/abs/2609.16317)；[全文](https://arxiv.org/html/2609.16317v1)；[官方代码](https://github.com/Mohd9485/Generative_Filters)。论文链接与仓库目录已核验，有 SIF.py、SBF.py、OTF.py、KRF.py、SIR.py、EnKF.py 及调参脚本；未运行代码。README 提及的 FMF.py 未出现在本次根目录列表中，不能据此宣称所有比较方法均已完整发布。\n\n### 中文摘要\n\n已知状态转移和观测模拟器时，先生成 forecast ensemble，再学习依赖新观测的 transport 得到过滤后验。通过保持观测坐标的三角映射统一不同模型，并把初始训练调参与每次新观测的在线 refinement 分开。\n\n### 创新点与实验边界\n\n两类合成动力学测试用 aa-SW2、粒子数、在线成本和二十次模拟评价。正文 §IV-C 明确：二次观测任务中 **SBF 是未恢复双峰的例外**，不能照摘要转述“所有生成过滤器都恢复多峰”。小粒子数 Lorenz-63 下 OTF/KRF 更稳定；某些 SIF 最低误差设置的在线成本比 EnKF/SIR 高约四个数量级。aa-SW2 逐坐标投影不能充分检查联合相关结构。\n\n### 和我方向的适配\n\n**可迁移算法。** 适合“疗中 MRI 到达后校正患者状态分布”，与从基线一次性预测未来是不同任务。前提是有可用状态转移与观测模型；MRI 测量噪声、潜状态可辨识性、信息性随访不能当作已知。原文没有临床疗效/生存证据。\n\n### 可借鉴动作\n\n在固定低维病灶状态预测器后增加观测校正层，比较无校正、线性/Kalman 更新、小粒子滤波、FM transport；相同观测与在线预算。用观测到来之后的下一次随访检验变化 MAE、energy score 和覆盖率，不能用刚吸收的观测当“未来预测”成绩。若仅观测拟合变好而下一次预测无增益，或增加成本后不优于简单滤波，否定复杂生成校正的必要性。先做低维模拟和缓存 latent，CPU/单卡估计可起步；具体训练预算需实测，原文比较的是随方法变化的在线成本。\n\n### 原始摘要或 Evidence Source\n\n[v1 全文](https://arxiv.org/html/2609.16317v1) §II–V、Figures 1–2；独立笔记附原始摘要。\n\n\n\n## 原始摘要\n\nThis letter presents a unified formulation and a controlled numerical comparison of generative-model approaches to the nonlinear filtering problem. Under this formulation the analysis step is realized by a transport of the forecast distribution to the posterior, the approaches differing only in how that transport is selected and learned. We derive three new filters, based on stochastic interpolants, their deterministic flow-matching limit, and Schr\\\"odinger bridges realized through forward--backward SDEs. We develop a two-stage tuning procedure that separates the training of the generative model from its online refinement. The resulting methods are compared against the optimal transport filter (OTF), the Knothe--Rosenblatt filter (KRF), the sequential importance resampling (SIR) particle filter and the ensemble Kalman filter (EnKF), in terms of accuracy, computational time, and sensitivity to ensemble size and state dimension. The results indicate that every generative filter resolves multimodal posteriors that the EnKF and SIR do not, that no single generative framework dominates, the preferred method being set by the available online budget and ensemble size, and that the filters differ in the regularity of the particle trajectories they produce."},{"id":"arxiv:2609.16621","title":"Stable by Construction: Variational Latent Markov Operators for Long-Horizon PDE Prediction","short":"VAMO","date":"2026-09-16","rank":5,"category":"general","topic":"可迁移算法","summary":"VAMO 用空间相关的潜变量扰动和相邻状态分布 KL 对齐改善长程 rollout；其部署使用确定性均值，不能直接作为不确定性已校准的依据。","authors":"Liao, Junyi · Guilleminot, Johann · Tarokh, Vahid","firstDate":"2026-09-15","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.16621","codeUrl":"","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>VAMO 用空间相关的潜变量扰动和相邻状态分布 KL 对齐改善长程 rollout；其部署使用确定性均值，不能直接作为不确定性已校准的依据。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Junyi Liao、Johann Guilleminot、Vahid Tarokh。v1：2026-09-15 04:28:59 UTC；无修订；预印本。\u003ca href=\"https://arxiv.org/abs/2609.16621\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.16621v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。\u003cstrong>未找到官方代码\u003c/strong>。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>编码器保留空间 latent field，残差 FNO 预测下一状态。训练在编码和转移处加入有谱结构的 Gaussian 扰动，目标为 \u003ccode>L_pred + beta KL(q(z_next|x_next) || p(z_next|z)) + lambda L_rec\u003c/code>。推理只编码一次，随后潜空间递推并解码，关闭采样。\u003c/p>\n\u003ch3>创新点与实验边界\u003c/h3>\n\u003cp>相对确定性 latent FNO 和普通 Gaussian noise baseline，新增的是结构化噪声及分布转移对齐。2D CFD 从训练区间 \u003ccode>[0,1]\u003c/code> 外推至 \u003ccode>10\u003c/code>：Table 4 的平均相对 L2 \u003cstrong>0.0565\u003c/strong>，FNO-AE \u003cstrong>0.2526\u003c/strong>；H1 \u003cstrong>0.4044 对 2.3394\u003c/strong>。这是真实的长于训练时域的合成 PDE 测试，但物理系统使用规则网格和固定步长，理论界依赖正则性，不能把标题理解为任意疾病动力学均稳定。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可迁移结构化 latent 扰动与下一时点表示对齐，以检验小样本下局部预测误差的累积。治疗与不规则时间差必须另行建模；MRI 空间纹理不具有周期流体边界，频谱噪声不能未经检验直接照搬。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在同一个小型 latent transition 上比较无噪声、等方差独立噪声、空间相关噪声，以及是否加入下一状态 KL 的消融。至少需要三次观测才能检查真实多步误差；少于此时只检验单步，不构造伪随访证明长程稳定。报告 rollout 各步病灶误差、频谱/边界保真与少事件临床结局；若只是平滑病灶而失去变化信息，或 KL 导致表征塌缩，则否证。单卡小头是工程估计；本次未核实全文硬件总耗时，不作原实验算力承诺。\u003c/p>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>\u003ca href=\"https://arxiv.org/html/2609.16621v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §4–6、Tables 2/4；本次未逐条复核附录证明，独立笔记附原始摘要。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Neural PDE solvers provide efficient surrogates for time-dependent physical systems, but autoregressive prediction over long horizons remains challenging because local errors can induce distribution shift and accumulate under recursive deployment. We develop a variational approach to this problem by introducing latent Markov dynamics in which physical states are represented by latent distributions and evolved through probabilistic transitions. The framework is formulated directly on function spaces and specialized to functional Gaussian models, where structured latent perturbations induce a spectral geometry and variational transition alignment regularizes the learned dynamics. We further analyze how these mechanisms affect autoregressive error propagation, providing a theoretical connection between variational training and long-horizon prediction. We instantiate the framework as the Variational Autoencoding Markov Operator (VAMO), which combines spatially resolved latent fields, structured Gaussian perturbations, and a neural-operator transition. Empirically, we demonstrate the effectiveness of VAMO on several fluid-dynamics benchmarks with prediction horizons extending substantially beyond those represented during training, where it consistently reduces error accumulation and improves rollout stability over several deterministic and noise-injection baselines. Overall, these results highlight variational modeling as a complementary approach to robust long-horizon neural PDE dynamics.\u003c/p>\n","markdown":"### 一句话总结\n\nVAMO 用空间相关的潜变量扰动和相邻状态分布 KL 对齐改善长程 rollout；其部署使用确定性均值，不能直接作为不确定性已校准的依据。\n\n**元数据。** Junyi Liao、Johann Guilleminot、Vahid Tarokh。v1：2026-09-15 04:28:59 UTC；无修订；预印本。[原文](https://arxiv.org/abs/2609.16621)；[全文](https://arxiv.org/html/2609.16621v1)。**未找到官方代码**。\n\n### 中文摘要\n\n编码器保留空间 latent field，残差 FNO 预测下一状态。训练在编码和转移处加入有谱结构的 Gaussian 扰动，目标为 `L_pred + beta KL(q(z_next|x_next) || p(z_next|z)) + lambda L_rec`。推理只编码一次，随后潜空间递推并解码，关闭采样。\n\n### 创新点与实验边界\n\n相对确定性 latent FNO 和普通 Gaussian noise baseline，新增的是结构化噪声及分布转移对齐。2D CFD 从训练区间 `[0,1]` 外推至 `10`：Table 4 的平均相对 L2 **0.0565**，FNO-AE **0.2526**；H1 **0.4044 对 2.3394**。这是真实的长于训练时域的合成 PDE 测试，但物理系统使用规则网格和固定步长，理论界依赖正则性，不能把标题理解为任意疾病动力学均稳定。\n\n### 和我方向的适配\n\n**可迁移算法。** 可迁移结构化 latent 扰动与下一时点表示对齐，以检验小样本下局部预测误差的累积。治疗与不规则时间差必须另行建模；MRI 空间纹理不具有周期流体边界，频谱噪声不能未经检验直接照搬。\n\n### 可借鉴动作\n\n在同一个小型 latent transition 上比较无噪声、等方差独立噪声、空间相关噪声，以及是否加入下一状态 KL 的消融。至少需要三次观测才能检查真实多步误差；少于此时只检验单步，不构造伪随访证明长程稳定。报告 rollout 各步病灶误差、频谱/边界保真与少事件临床结局；若只是平滑病灶而失去变化信息，或 KL 导致表征塌缩，则否证。单卡小头是工程估计；本次未核实全文硬件总耗时，不作原实验算力承诺。\n\n### 原始摘要或 Evidence Source\n\n[v1 全文](https://arxiv.org/html/2609.16621v1) §4–6、Tables 2/4；本次未逐条复核附录证明，独立笔记附原始摘要。\n\n\n\n## 原始摘要\n\nNeural PDE solvers provide efficient surrogates for time-dependent physical systems, but autoregressive prediction over long horizons remains challenging because local errors can induce distribution shift and accumulate under recursive deployment. We develop a variational approach to this problem by introducing latent Markov dynamics in which physical states are represented by latent distributions and evolved through probabilistic transitions. The framework is formulated directly on function spaces and specialized to functional Gaussian models, where structured latent perturbations induce a spectral geometry and variational transition alignment regularizes the learned dynamics. We further analyze how these mechanisms affect autoregressive error propagation, providing a theoretical connection between variational training and long-horizon prediction. We instantiate the framework as the Variational Autoencoding Markov Operator (VAMO), which combines spatially resolved latent fields, structured Gaussian perturbations, and a neural-operator transition. Empirically, we demonstrate the effectiveness of VAMO on several fluid-dynamics benchmarks with prediction horizons extending substantially beyond those represented during training, where it consistently reduces error accumulation and improves rollout stability over several deterministic and noise-injection baselines. Overall, these results highlight variational modeling as a complementary approach to robust long-horizon neural PDE dynamics."},{"id":"arxiv:2609.14531","title":"Multi-source conformal prediction: leveraging heterogeneity via localization","short":"MS-RLCP","date":"2026-09-16","rank":6,"category":"general","topic":"可迁移算法","summary":"MS-RLCP 根据测试样本附近的数据支持选择校准来源，适合研究多中心区间预测，但依赖跨来源共享 P(Y|X)，不提供任意中心漂移下的保证。","authors":"Hore, Rohan · Chatterjee, Anirban · Choudhury, Sayantan","firstDate":"2026-09-13","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.14531","codeUrl":"","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>MS-RLCP 根据测试样本附近的数据支持选择校准来源，适合研究多中心区间预测，但依赖跨来源共享 \u003ccode>P(Y|X)\u003c/code>，不提供任意中心漂移下的保证。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Rohan Hore、Anirban Chatterjee、Sayantan Choudhury。v1：2026-09-13 14:08:28 UTC；无修订；预印本。\u003ca href=\"https://arxiv.org/abs/2609.14531\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.14531v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。\u003cstrong>未找到官方代码\u003c/strong>。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>各来源分别训练 score 并留出 calibration set；对随机局部化的测试特征，以训练样本核密度估计选择局部支持最强的来源，再构造该来源的加权 conformal 集合。选择规则使用训练分区，避免直接依照校准标签挑选最有利来源。\u003c/p>\n\u003ch3>创新点与实验边界\u003c/h3>\n\u003cp>理论允许测试特征分布超出简单来源混合，但需要共享条件响应分布、envelope 支持及相应正则性。不是无条件的有限样本逐患者覆盖保证。目标覆盖 90% 时，FMoW 实验实际总体 \u003cstrong>88.59 ± 0.82%\u003c/strong>；MEPS 三个 panel 总体 \u003cstrong>89.4–89.8%\u003c/strong>，其中一个来源仅 \u003cstrong>88.1–88.3%\u003c/strong>。这些数字说明应报告具体亚组不足，不能只写“达到了 90% 校准”。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可为肿瘤变化量或 pCR 预测集合增加跨中心校准层。治疗选择、终点定义或疾病谱导致 \u003ccode>P(Y|X)\u003c/code> 改变时，核心假设可能失效；删失生存不能把未观察到的生存时间直接当连续标签套用。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>固定预测模型，按患者/中心分开 train、calibration、test；比较 pooled split conformal、中心内校准和 MS-RLCP，做留一中心测试。报告总体和逐中心覆盖率、区间宽度、worst-group coverage、校准样本数。带宽只在训练/验证集选择。若低样本中心持续欠覆盖，或仅靠极宽/无界集合达到覆盖，否定实用价值；也须把机制漂移与协变量漂移分别分析。缓存特征上的校准主要是 CPU 工作，复杂度与校准集规模、核计算有关，不需要重新训练生成器。\u003c/p>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>\u003ca href=\"https://arxiv.org/html/2609.14531v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> Algorithm 1、§3–5、Table 1；理论结论按其假设转述，未独立验证全部证明。独立笔记附原始摘要。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Many modern prediction tasks involve data from multiple heterogeneous sources, while the test distribution may differ substantially from any individual source. Although heterogeneity poses challenges, it also offers an opportunity: different sources may provide complementary information, with some regions of the feature space better represented in one source than another. We propose Multi-Source Randomly Localized Conformal Prediction (MS-RLCP), which builds on the local coverage properties of randomly localized conformal prediction (RLCP) (Hore and Barber, 2025) and extends it to multiple sources through data-adaptive source selection. Under the widely adopted assumption of a shared response distribution conditional on the features across sources and the test population, we establish finite-sample coverage bounds using an interpretable notion of envelope distribution that captures their aggregate feature-space representation. Our analysis allows the test feature distribution to be absolutely continuous with respect to the envelope, extending beyond mixtures of source distributions. Under additional regularity conditions, we also establish asymptotic test-conditional coverage. Simulations and real-world experiments demonstrate the effectiveness of MS-RLCP across varying levels of data heterogeneity.\u003c/p>\n","markdown":"### 一句话总结\n\nMS-RLCP 根据测试样本附近的数据支持选择校准来源，适合研究多中心区间预测，但依赖跨来源共享 `P(Y|X)`，不提供任意中心漂移下的保证。\n\n**元数据。** Rohan Hore、Anirban Chatterjee、Sayantan Choudhury。v1：2026-09-13 14:08:28 UTC；无修订；预印本。[原文](https://arxiv.org/abs/2609.14531)；[全文](https://arxiv.org/html/2609.14531v1)。**未找到官方代码**。\n\n### 中文摘要\n\n各来源分别训练 score 并留出 calibration set；对随机局部化的测试特征，以训练样本核密度估计选择局部支持最强的来源，再构造该来源的加权 conformal 集合。选择规则使用训练分区，避免直接依照校准标签挑选最有利来源。\n\n### 创新点与实验边界\n\n理论允许测试特征分布超出简单来源混合，但需要共享条件响应分布、envelope 支持及相应正则性。不是无条件的有限样本逐患者覆盖保证。目标覆盖 90% 时，FMoW 实验实际总体 **88.59 ± 0.82%**；MEPS 三个 panel 总体 **89.4–89.8%**，其中一个来源仅 **88.1–88.3%**。这些数字说明应报告具体亚组不足，不能只写“达到了 90% 校准”。\n\n### 和我方向的适配\n\n**可迁移算法。** 可为肿瘤变化量或 pCR 预测集合增加跨中心校准层。治疗选择、终点定义或疾病谱导致 `P(Y|X)` 改变时，核心假设可能失效；删失生存不能把未观察到的生存时间直接当连续标签套用。\n\n### 可借鉴动作\n\n固定预测模型，按患者/中心分开 train、calibration、test；比较 pooled split conformal、中心内校准和 MS-RLCP，做留一中心测试。报告总体和逐中心覆盖率、区间宽度、worst-group coverage、校准样本数。带宽只在训练/验证集选择。若低样本中心持续欠覆盖，或仅靠极宽/无界集合达到覆盖，否定实用价值；也须把机制漂移与协变量漂移分别分析。缓存特征上的校准主要是 CPU 工作，复杂度与校准集规模、核计算有关，不需要重新训练生成器。\n\n### 原始摘要或 Evidence Source\n\n[v1 全文](https://arxiv.org/html/2609.14531v1) Algorithm 1、§3–5、Table 1；理论结论按其假设转述，未独立验证全部证明。独立笔记附原始摘要。\n\n\n\n## 原始摘要\n\nMany modern prediction tasks involve data from multiple heterogeneous sources, while the test distribution may differ substantially from any individual source. Although heterogeneity poses challenges, it also offers an opportunity: different sources may provide complementary information, with some regions of the feature space better represented in one source than another. We propose Multi-Source Randomly Localized Conformal Prediction (MS-RLCP), which builds on the local coverage properties of randomly localized conformal prediction (RLCP) (Hore and Barber, 2025) and extends it to multiple sources through data-adaptive source selection. Under the widely adopted assumption of a shared response distribution conditional on the features across sources and the test population, we establish finite-sample coverage bounds using an interpretable notion of envelope distribution that captures their aggregate feature-space representation. Our analysis allows the test feature distribution to be absolutely continuous with respect to the envelope, extending beyond mixtures of source distributions. Under additional regularity conditions, we also establish asymptotic test-conditional coverage. Simulations and real-world experiments demonstrate the effectiveness of MS-RLCP across varying levels of data heterogeneity."},{"id":"arxiv:2609.14709","title":"An immune world model for multiscale forecasting and therapeutic hypothesis generation","short":"Immune-World-Model","date":"2026-09-16","rank":7,"category":"medical","topic":"直接相关","summary":"把免疫干预与患者背景分开建模，强调变化量和锁定评估；治疗组合仍是计算提出的假设，尚无新实验或临床疗效验证。","authors":"Cui, Taoyong · Wang, Xi · Li, Zonghang · Ding, Jinchao · You, Lingsen · Xu, Yuzhi · Xu, Wanghan · Wu, Fang · Ying, Kejun · Ouyang, Wanli · Heng, Pheng Ann · Yang, Ling · Yin, Zhenfei · Wu, Yingcheng","firstDate":"2026-09-13","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.14709","codeUrl":"","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>把免疫干预与患者背景分开建模，强调变化量和锁定评估；治疗组合仍是计算提出的假设，尚无新实验或临床疗效验证。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Taoyong Cui、Xi Wang、Zonghang Li、Jinchao Ding、Lingsen You、Yuzhi Xu、Wanghan Xu、Fang Wu、Kejun Ying、Wanli Ouyang、Pheng Ann Heng、Ling Yang、Zhenfei Yin、Yingcheng Wu。v1：2026-09-13 18:06:18 UTC；无修订；预印本。\u003ca href=\"https://arxiv.org/abs/2609.14709\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.14709v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。\u003cstrong>未找到官方代码\u003c/strong>；Data and code availability 使用将来时，称之后发布软件与版本化数据清单。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>将细胞状态、组织微环境和患者背景组织为结构化 state，把目标干预作为独立 action，学习 \u003ccode>S_next = F(S, A)\u003c/code>，用 decoder 输出表达变化、程序分数及临床响应相关读数。作者还报告模型搜索、冻结和独立确认流程，但公开配置和划分清单尚待发布，本次未独立审计这些隔离措施。\u003c/p>\n\u003ch3>创新点与实验边界\u003c/h3>\n\u003cp>原始细胞图谱约一千万细胞，但只有 \u003cstrong>12 名供者\u003c/strong>；细胞数不等于患者样本量。Figure 3 的平均 gene-delta cosine 中，模型与 \u003cstrong>condition-mean 均为 0.46\u003c/strong>，不能声称所有基线都被超越。抗 PD-1 的 all-cell state LOO AUC 为 \u003cstrong>0.92，95% CI 0.79–1.00\u003c/strong>，并非生成未来状态优于同输入直接预测的充分证据。23 个未见组合中 19 个改善；所谓跨尺度 rollout 包含示例，全文仍把队列级递归验证列为未来工作。研究使用公开既有数据，没有新增湿实验，IL-36gamma + SIRPalpha inhibition 只是待验证假设。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关于治疗条件下的生物状态建模；对 MRI/CT 模块属于外围启发。\u003c/strong> 值得借鉴干预与既往治疗分离、变化量而非绝对状态评价，以及在模型选择后锁定测试集。组织层表示主要来自组学/免疫上下文，不是 CT-to-WSI 生成，也未证明组织切片形态预测。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在同一患者划分上，比较临床直接预测、真实影像/组学联合直接预测、预测未来状态辅助模型；匹配输入、容量与训练预算，单独加入 condition-mean 与置换背景对照。以供者/患者为统计单位，评估变化量、pCR/response 的 AUROC/AUPRC/Brier 和中心外表现；假如生成辅助不优于直接模型，或收益依赖反复筛选测试集，就不支持临床增益。计算组合预测不自动识别治疗因果效应，仍需一致性、可交换性、positivity、清晰干预定义及缺失/删失假设。先做缓存特征小头是单卡估计；完整 AI Scientist/组学流程总算力未核实。\u003c/p>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>\u003ca href=\"https://arxiv.org/html/2609.14709v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> Figures 2–4、Methods、Discussion、Resource availability；独立笔记附原始摘要。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Immune therapies act across cell-intrinsic programs, tissue ecosystems, and patient-specific immune states, yet most predictors address these scales separately. We used a governed evolutionary AI Scientist to construct the Immune World Model, an action-conditioned model that learns how interventions move immune states across cellular, tissue, and individual levels. The Immune World Model--building Scientist searched candidate architectures and workflows, and the resulting world model was frozen before independent confirmation. The frozen model generalized to unseen interventions and biological contexts, recovered intervention-specific cellular programs, integrated cell and tissue information to improve ecosystem and patient-response prediction, and forecast unseen perturbation combinations. Immune World Model--guided analysis then combined measured perturbations with cross-axis inference to nominate IL-36$\\gamma$ plus SIRP$\\alpha$ inhibition as a complementary-axis therapeutic hypothesis, whereas a governed self-correction audit rejected every screened cytokine pair. The Immune World Model provides a framework for multiscale immune simulation that connects AI Scientist-driven model construction, intervention forecasting, and the generation of prospectively testable therapeutic hypotheses.\u003c/p>\n","markdown":"### 一句话总结\n\n把免疫干预与患者背景分开建模，强调变化量和锁定评估；治疗组合仍是计算提出的假设，尚无新实验或临床疗效验证。\n\n**元数据。** Taoyong Cui、Xi Wang、Zonghang Li、Jinchao Ding、Lingsen You、Yuzhi Xu、Wanghan Xu、Fang Wu、Kejun Ying、Wanli Ouyang、Pheng Ann Heng、Ling Yang、Zhenfei Yin、Yingcheng Wu。v1：2026-09-13 18:06:18 UTC；无修订；预印本。[原文](https://arxiv.org/abs/2609.14709)；[全文](https://arxiv.org/html/2609.14709v1)。**未找到官方代码**；Data and code availability 使用将来时，称之后发布软件与版本化数据清单。\n\n### 中文摘要\n\n将细胞状态、组织微环境和患者背景组织为结构化 state，把目标干预作为独立 action，学习 `S_next = F(S, A)`，用 decoder 输出表达变化、程序分数及临床响应相关读数。作者还报告模型搜索、冻结和独立确认流程，但公开配置和划分清单尚待发布，本次未独立审计这些隔离措施。\n\n### 创新点与实验边界\n\n原始细胞图谱约一千万细胞，但只有 **12 名供者**；细胞数不等于患者样本量。Figure 3 的平均 gene-delta cosine 中，模型与 **condition-mean 均为 0.46**，不能声称所有基线都被超越。抗 PD-1 的 all-cell state LOO AUC 为 **0.92，95% CI 0.79–1.00**，并非生成未来状态优于同输入直接预测的充分证据。23 个未见组合中 19 个改善；所谓跨尺度 rollout 包含示例，全文仍把队列级递归验证列为未来工作。研究使用公开既有数据，没有新增湿实验，IL-36gamma + SIRPalpha inhibition 只是待验证假设。\n\n### 和我方向的适配\n\n**直接相关于治疗条件下的生物状态建模；对 MRI/CT 模块属于外围启发。** 值得借鉴干预与既往治疗分离、变化量而非绝对状态评价，以及在模型选择后锁定测试集。组织层表示主要来自组学/免疫上下文，不是 CT-to-WSI 生成，也未证明组织切片形态预测。\n\n### 可借鉴动作\n\n在同一患者划分上，比较临床直接预测、真实影像/组学联合直接预测、预测未来状态辅助模型；匹配输入、容量与训练预算，单独加入 condition-mean 与置换背景对照。以供者/患者为统计单位，评估变化量、pCR/response 的 AUROC/AUPRC/Brier 和中心外表现；假如生成辅助不优于直接模型，或收益依赖反复筛选测试集，就不支持临床增益。计算组合预测不自动识别治疗因果效应，仍需一致性、可交换性、positivity、清晰干预定义及缺失/删失假设。先做缓存特征小头是单卡估计；完整 AI Scientist/组学流程总算力未核实。\n\n### 原始摘要或 Evidence Source\n\n[v1 全文](https://arxiv.org/html/2609.14709v1) Figures 2–4、Methods、Discussion、Resource availability；独立笔记附原始摘要。\n\n\n\n## 原始摘要\n\nImmune therapies act across cell-intrinsic programs, tissue ecosystems, and patient-specific immune states, yet most predictors address these scales separately. We used a governed evolutionary AI Scientist to construct the Immune World Model, an action-conditioned model that learns how interventions move immune states across cellular, tissue, and individual levels. The Immune World Model--building Scientist searched candidate architectures and workflows, and the resulting world model was frozen before independent confirmation. The frozen model generalized to unseen interventions and biological contexts, recovered intervention-specific cellular programs, integrated cell and tissue information to improve ecosystem and patient-response prediction, and forecast unseen perturbation combinations. Immune World Model--guided analysis then combined measured perturbations with cross-axis inference to nominate IL-36$\\gamma$ plus SIRP$\\alpha$ inhibition as a complementary-axis therapeutic hypothesis, whereas a governed self-correction audit rejected every screened cytokine pair. The Immune World Model provides a framework for multiscale immune simulation that connects AI Scientist-driven model construction, intervention forecasting, and the generation of prospectively testable therapeutic hypotheses."}],"icons":{"Radar":[["path",{"d":"M19.07 4.93A10 10 0 0 0 6.99 3.34"}],["path",{"d":"M4 6h.01"}],["path",{"d":"M2.29 9.62A10 10 0 1 0 21.31 8.35"}],["path",{"d":"M16.24 7.76A6 6 0 1 0 8.23 16.67"}],["path",{"d":"M12 18h.01"}],["path",{"d":"M17.99 11.66A6 6 0 0 1 15.77 16.67"}],["circle",{"cx":"12","cy":"12","r":"2"}],["path",{"d":"m13.41 10.59 5.66-5.66"}]],"BookOpen":[["path",{"d":"M12 7v14"}],[   <script>(() => {
  'use strict';
  const main = document.querySelector('#main');
  const sidebar = document.querySelector('#sidebar');
  const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (name, cls = '') => `<svg class="icon ${cls}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${(DATA.icons[name] || []).map(([tag, attributes]) => `<${tag} ${Object.entries(attributes).map(([key, value]) => `${key}="${esc(value)}"`).join(' ')}></${tag}>`).join('')}</svg>`;
  const getStored = key => {
    try { const value = JSON.parse(localStorage.getItem(`radar.${key}`) || '[]'); return new Set(Array.isArray(value) ? value.filter(id => DATA.papers.some(p => p.id === id)) : []); }
    catch { return new Set(); }
  };
  const saved = getStored('saved');
  const read = getStored('read');
  let route = {};
  let query = '';
  let category = 'all';
  let reading = 'all';
  let sort = 'priority';
  let reportTab = false;
  let toastTimer;
  const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  const dateParts = value => { const d = new Date(`${value}T00:00:00Z`); return { month: d.getUTCMonth() + 1, day: d.getUTCDate(), week: weekdays[d.getUTCDay()] }; };
  const dateLabel = date => { const d = dateParts(date); return `${d.month} 月 ${d.day} 日`; };
  const currentReport = () => DATA.reports.find(r => r.date === route.value) || DATA.reports[0];
  const toast = message => {
    const el = document.querySelector('#toast');
    el.textContent = message; el.classList.add('visible');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('visible'), 2800);
  };
  const persist = (key, set) => {
    try { localStorage.setItem(`radar.${key}`, JSON.stringify([...set])); }
    catch { toast('浏览器未能保存阅读状态'); }
  };
  const toggle = (key, id) => {
    const set = key === 'saved' ? saved : read;
    if (set.has(id)) set.delete(id); else set.add(id);
    persist(key, set);
    if (route.type === 'paper') updatePaperActions(); else renderList();
    renderSidebar();
  };
  const paperRoute = id => `#paper/${encodeURIComponent(id)}`;
  const iconButton = (name, title, attrs = '', active = false) => `<button type="button" class="icon-button ${active ? 'active' : ''}" title="${esc(title)}" aria-label="${esc(title)}" ${attrs}>${icon(name)}</button>`;
  const badges = paper => `<span class="tag ${paper.category}">${paper.category === 'medical' ? '医学应用' : '通用算法'}</span><span class="evidence">${icon(paper.evidence === '仅摘要' ? 'CircleAlert' : 'Check')}${esc(paper.evidence)}</span>`;

  function renderSidebar() {
    const selectedDate = route.type === 'day' ? currentReport().date : '';
    sidebar.innerHTML = `<a class="brand" href="#day/${DATA.latestDate}"><span class="brand-mark">${icon('Radar')}</span><span>文献雷达<small>RESEARCH RADAR</small></span></a>
      <nav class="primary-nav" aria-label="主导航">
        <a class="nav-item ${route.type === 'day' ? 'selected' : ''}" href="#day/${DATA.latestDate}">${icon('BookOpen')}<span>每日精选</span><span class="nav-count">${DATA.reports.length}</span></a>
        <a class="nav-item ${route.type === 'library' ? 'selected' : ''}" href="#library">${icon('Library')}<span>全部论文</span><span class="nav-count">${DATA.papers.length}</span></a>
        <a class="nav-item ${route.type === 'saved' ? 'selected' : ''}" href="#saved">${icon('Bookmark')}<span>我的收藏</span><span class="nav-count">${saved.size}</span></a>
      </nav>
      <div class="sidebar-section-title">阅读归档 <span>${DATA.latestDate.slice(0, 4)}</span></div>
      <nav class="date-nav" aria-label="日期归档">${DATA.reports.map(report => `<a class="date-item ${selectedDate === report.date ? 'selected' : ''}" href="#day/${report.date}" ${selectedDate === report.date ? 'aria-current="date"' : ''}><span class="date-dot"></span><span>${dateLabel(report.date)}</span><small>${report.paperIds.length} 篇</small></a>`).join('')}</nav>
      <div class="sidebar-bottom"><div class="small-label">研究主题</div><p>纵向医学世界模型</p><div class="topic-labels"><span>MRI / CT</span><span>Flow Matching</span><span>pCR / Survival</span></div><div class="sidebar-rule"></div><div class="sidebar-published"><span class="live-dot"></span>最新一期 <time>${DATA.latestDate}</time></div></div>`;
  }

  function closeMenu() {
    document.body.classList.remove('menu-open');
    document.querySelector('#menu-button').setAttribute('aria-expanded', 'false');
  }

  function parseRoute() {
    const hash = location.hash.slice(1);
    const slash = hash.indexOf('/');
    const type = slash < 0 ? hash : hash.slice(0, slash);
    let value = '';
    try { value = decodeURIComponent(slash < 0 ? '' : hash.slice(slash + 1)); } catch {}
    route = ['day', 'library', 'saved', 'paper'].includes(type) ? { type, value } : { type: 'day', value: DATA.latestDate };
    query = ''; category = 'all'; reading = 'all'; sort = 'priority'; reportTab = false;
    render(); closeMenu(); window.scrollTo(0, 0);
  }

  function render() {
    renderSidebar();
    document.querySelector('#footer-date').textContent = `更新于 ${DATA.latestDate}`;
    const label = { day: '每日精选', library: '全部论文', saved: '我的收藏', paper: '论文精读' }[route.type];
    document.querySelector('#breadcrumb').innerHTML = `文献雷达 <span>/</span> ${label}`;
    if (route.type === 'paper') return renderPaper();
    const report = currentReport();
    const dayIndex = DATA.reports.indexOf(report);
    const dayPapers = DATA.papers.filter(p => report.paperIds.includes(p.id));
    const heading = route.type === 'day' ? dateLabel(report.date) : label;
    document.title = `${heading} · 文献雷达`;
    main.innerHTML = `<section class="page-heading">
      <div><div class="eyebrow">${route.type === 'day' ? `DAILY READING <span>/</span> ${report.date.slice(0, 4)}` : 'YOUR RESEARCH LIBRARY'}</div><h1>${heading}${route.type === 'day' ? `<span class="weekday">${dateParts(report.date).week}</span>` : ''}</h1><div class="heading-meta">${route.type === 'day' ? `${dayPapers.length} 篇精选 <span>·</span> ${dayPapers.filter(p => p.category === 'general').length} 篇通用算法 <span>·</span> ${dayPapers.filter(p => p.category === 'medical').length} 篇医学应用` : `${route.type === 'saved' ? saved.size : DATA.papers.length} 篇论文 <span>·</span> ${read.size} 篇已读`}</div></div>
      ${route.type === 'day' ? `<div class="date-controls">${iconButton('ChevronLeft', '前一期', `data-day="${DATA.reports[dayIndex + 1]?.date || ''}" ${dayIndex === DATA.reports.length - 1 ? 'disabled' : ''}`)}<span>${report.date}</span>${iconButton('ChevronRight', '后一期', `data-day="${DATA.reports[dayIndex - 1]?.date || ''}" ${dayIndex === 0 ? 'disabled' : ''}`)}</div>` : `<span class="heading-symbol">${icon(route.type === 'saved' ? 'Bookmark' : 'Library')}</span>`}
    </section>
    ${route.type === 'day' ? `<section class="daily-brief"><div class="brief-label"><span class="live-dot"></span>本期观察</div><div>${report.summary}</div></section>
    <div class="view-tabs" role="tablist" aria-label="日报视图"><button role="tab" id="selection-tab" aria-selected="true" data-tab="selection">${icon('Library')}精选论文 <span>${dayPapers.length}</span></button><button role="tab" id="report-tab" aria-selected="false" data-tab="report">${icon('FileText')}完整日报</button></div>` : ''}
    <section id="selection-view"><div class="toolbar"><label class="search-field">${icon('Search')}<input type="search" id="search" aria-label="搜索论文" placeholder="搜索标题、方法、研究主题…" autocomplete="off"></label><div class="filters"><label class="select-label">${icon('SlidersHorizontal')}<select id="category" aria-label="研究分类"><option value="all">全部方向</option><option value="general">通用算法</option><option value="medical">医学应用</option></select></label><select id="reading" aria-label="阅读状态"><option value="all">全部状态</option><option value="unread">未读</option><option value="read">已读</option></select><select id="sort" aria-label="排序"><option value="priority">阅读优先级</option><option value="newest">最近推荐</option><option value="title">标题 A–Z</option></select></div></div><div class="list-caption"><span id="result-count" aria-live="polite"></span><span>来源与证据分级</span></div><div id="paper-list"></div></section>
    <section id="report-view" hidden><div class="report-tools"><span>${report.date} · 完整日报</span><button class="text-button" data-download="report">${icon('ArrowDownToLine')}导出 Markdown</button></div><article class="prose">${report.html}</article></section>`;
    main.querySelector('#search').addEventListener('input', event => { query = event.target.value; renderList(); });
    for (const id of ['category', 'reading', 'sort']) main.querySelector(`#${id}`).addEventListener('change', event => {
      if (id === 'category') category = event.target.value;
      if (id === 'reading') reading = event.target.value;
      if (id === 'sort') sort = event.target.value;
      renderList();
    });
    renderList();
  }

  function renderList() {
    const target = document.querySelector('#paper-list');
    if (!target) return;
    let list = route.type === 'day' ? DATA.papers.filter(p => currentReport().paperIds.includes(p.id)) : DATA.papers;
    if (route.type === 'saved') list = list.filter(p => saved.has(p.id));
    const q = query.trim().toLocaleLowerCase();
    list = list.filter(p => (category === 'all' || p.category === category) && (reading === 'all' || read.has(p.id) === (reading === 'read')) && (!q || `${p.title} ${p.short} ${p.summary} ${p.topic} ${p.markdown}`.toLocaleLowerCase().includes(q)));
    list = [...list].sort((a, b) => sort === 'title' ? a.title.localeCompare(b.title) : sort === 'newest' ? b.date.localeCompare(a.date) || a.rank - b.rank : a.rank - b.rank || b.date.localeCompare(a.date));
    document.querySelector('#result-count').textContent = `${list.length} 篇论文${reading === 'unread' ? ' · 未读' : reading === 'read' ? ' · 已读' : ''}`;
    if (!list.length) {
      const emptyDay = route.type === 'day' && !currentReport().paperIds.length;
      target.innerHTML = `<div class="empty-state">${icon(route.type === 'saved' && !query ? 'Bookmark' : 'Search')}<h2>${emptyDay ? '本期没有新增推荐' : route.type === 'saved' && !saved.size ? '收藏夹还没有论文' : '没有匹配的论文'}</h2><button class="text-button" data-empty-reset>${emptyDay || (route.type === 'saved' && !saved.size) ? '浏览全部论文' : '清除筛选'}${icon('ArrowRight')}</button></div>`;
      return;
    }
    target.innerHTML = list.map((p, index) => `<article class="paper-row ${read.has(p.id) ? 'is-read' : ''}">
      <div class="paper-rank">${String(index + 1).padStart(2, '0')}<span>${p.rank === 1 ? '优先读' : ''}</span></div>
      <div class="paper-copy"><div class="paper-kicker">${badges(p)}${read.has(p.id) ? `<span class="read-label">已读</span>` : ''}</div><a class="paper-title" href="${paperRoute(p.id)}">${esc(p.title)}</a><p class="paper-summary">${esc(p.summary)}</p><div class="paper-bottom"><span class="paper-topic">${esc(p.topic)}</span><span class="paper-date">${p.firstDate} <span>·</span> ${esc(p.publication)}</span></div><div class="paper-actions"><a class="read-link" href="${paperRoute(p.id)}">精读笔记 ${icon('ArrowRight')}</a><a class="source-link" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">原文 ${icon('ArrowUpRight')}</a><div class="paper-save-actions">${iconButton(read.has(p.id) ? 'CheckCheck' : 'Check', `${read.has(p.id) ? '标为未读' : '标为已读'} ${p.short}`, `data-toggle="read" data-id="${esc(p.id)}" aria-pressed="${read.has(p.id)}"`, read.has(p.id))}${iconButton('Bookmark', `${saved.has(p.id) ? '取消收藏' : '收藏'} ${p.short}`, `data-toggle="saved" data-id="${esc(p.id)}" aria-pressed="${saved.has(p.id)}"`, saved.has(p.id))}</div></div></div>
      ${p.image ? `<figure class="paper-figure"><a href="${paperRoute(p.id)}"><img src="${esc(p.image)}" alt="${esc(p.imageLabel)}" loading="lazy" width="600" height="330"></a><figcaption>${esc(p.imageLabel)}</figcaption></figure>` : ''}
    </article>`).join('');
  }

  function renderPaper() {
    const paper = DATA.papers.find(p => p.id === route.value);
    if (!paper) {
      main.innerHTML = `<div class="empty-state">${icon('FileText')}<h1>未找到这篇论文</h1><a class="read-link" href="#library">浏览全部论文 ${icon('ArrowRight')}</a></div>`;
      return;
    }
    document.title = `${paper.short} · 文献雷达`;
    main.innerHTML = `<div class="reader-top"><a class="back-link" href="#day/${paper.date}">${icon('ArrowLeft')} ${dateLabel(paper.date)}精选</a><div class="reader-tools">${iconButton('Link', '复制论文笔记链接', 'data-share')}${iconButton('ArrowDownToLine', '导出论文笔记', 'data-download="paper"')}<span id="reader-actions"></span></div></div>
      <header class="reader-header"><div class="paper-kicker">${badges(paper)}<span class="reader-topic">${esc(paper.topic)}</span></div><h1>${esc(paper.title)}</h1><p class="authors">${esc(paper.authors)}</p><div class="reader-meta"><span>${esc(paper.publication)}</span><span>首次 ${paper.firstDate}</span>${paper.revisionDate ? `<span>修订 ${paper.revisionDate}</span>` : ''}<span>推荐 ${paper.date}</span></div><div class="reader-source-links"><a class="primary-link" href="${esc(paper.url)}" target="_blank" rel="noopener noreferrer">论文原文 ${icon('ArrowUpRight')}</a>${paper.codeUrl ? `<a class="text-button" href="${esc(paper.codeUrl)}" target="_blank" rel="noopener noreferrer">官方代码 ${icon('ArrowUpRight')}</a>` : '<span class="no-code">未找到官方代码</span>'}</div></header>
      <div class="reader-layout"><article class="prose" id="paper-body">${paper.image ? `<figure class="detail-figure"><img src="${esc(paper.image)}" alt="${esc(paper.imageLabel)}" width="900" height="480"><figcaption>${esc(paper.imageLabel)}</figcaption></figure>` : ''}${paper.html}</article><aside class="outline" aria-label="文章目录"><div class="small-label">本文目录</div><nav id="outline-links"></nav></aside></div><div class="reading-finish"><span>${esc(paper.short)}</span><button class="primary-link" data-toggle="read" data-id="${esc(paper.id)}" id="finish-read"></button></div>`;
    const headings = [...main.querySelectorAll('#paper-body h2, #paper-body h3')];
    headings.forEach((heading, i) => { heading.id = `section-${i}`; });
    document.querySelector('#outline-links').innerHTML = headings.filter(h => !/^\d+\./.test(h.textContent)).map(h => `<button data-section="${h.id}">${esc(h.textContent)}</button>`).join('');
    updatePaperActions();
  }

  function updatePaperActions() {
    const p = DATA.papers.find(p => p.id === route.value);
    if (!p) return;
    document.querySelector('#reader-actions').innerHTML = `${iconButton('Bookmark', `${saved.has(p.id) ? '取消收藏' : '收藏'} ${p.short}`, `data-toggle="saved" data-id="${esc(p.id)}" aria-pressed="${saved.has(p.id)}"`, saved.has(p.id))}`;
    const finish = document.querySelector('#finish-read');
    finish.innerHTML = `${icon(read.has(p.id) ? 'CheckCheck' : 'Check')} ${read.has(p.id) ? '已读 · 标为未读' : '标为已读'}`;
    finish.setAttribute('aria-pressed', String(read.has(p.id)));
  }

  function download(kind) {
    const p = DATA.papers.find(p => p.id === route.value);
    const item = kind === 'paper' ? p : currentReport();
    if (!item) return;
    const blob = new Blob([item.markdown], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `${kind === 'paper' ? p.short.replace(/[^\p{L}\p{N}._-]/gu, '-') : item.date}-reading.md`;
    a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  main.addEventListener('click', async event => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.dataset.toggle) return toggle(button.dataset.toggle, button.dataset.id);
    if (button.dataset.day) { location.hash = `day/${button.dataset.day}`; return; }
    if (button.dataset.tab) {
      reportTab = button.dataset.tab === 'report';
      document.querySelector('#report-view').hidden = !reportTab;
      document.querySelector('#selection-view').hidden = reportTab;
      document.querySelector('#report-tab').setAttribute('aria-selected', String(reportTab));
      document.querySelector('#selection-tab').setAttribute('aria-selected', String(!reportTab));
    }
    if (button.dataset.section) document.getElementById(button.dataset.section)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (button.hasAttribute('data-empty-reset')) {
      if ((route.type === 'saved' && !saved.size) || (route.type === 'day' && !currentReport().paperIds.length)) { location.hash = 'library'; return; }
      query = ''; category = 'all'; reading = 'all';
      document.querySelector('#search').value = '';
      document.querySelector('#category').value = 'all';
      document.querySelector('#reading').value = 'all'; renderList();
    }
    if (button.dataset.download) download(button.dataset.download);
    if (button.hasAttribute('data-share')) {
      try { await navigator.clipboard.writeText(location.href); toast('论文笔记链接已复制'); }
      catch { toast('链接复制失败，请复制浏览器地址'); }
    }
  });
  document.querySelector('#menu-button').innerHTML = icon('Menu');
  document.querySelector('#menu-button').addEventListener('click', () => {
    const open = document.body.classList.toggle('menu-open');
    document.querySelector('#menu-button').setAttribute('aria-expanded', String(open));
  });
  document.querySelector('#sidebar-scrim').addEventListener('click', closeMenu);
  sidebar.addEventListener('click', event => { if (event.target.closest('a')) closeMenu(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenu(); });
  window.addEventListener('hashchange', parseRoute);
  window.addEventListener('storage', event => {
    if (!['radar.saved', 'radar.read'].includes(event.key)) return;
    const key = event.key.split('.')[1], set = key === 'saved' ? saved : read;
    set.clear(); getStored(key).forEach(id => set.add(id));
    if (route.type === 'paper') updatePaperActions(); else renderList(); renderSidebar();
  });
  parseRoute();
})();
</script>
</body>
</html>
