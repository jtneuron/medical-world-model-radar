cstrong>未找到官方代码\u003c/strong>，不能将其引用的其他进展模型仓库当成实现。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>任务是根据晚期观测重建未观测的早期影像。先训练并冻结 3D VQ-GAN，逆序 ConvGRU 汇总晚期 latent，再用 \u003ccode>dz/dt = f_theta(z,t)\u003c/code> 向较早时刻积分；残差头相对已观测 anchor 累加变化。它改变的是纵向推断方向和残差时间模型，没有加入治疗效应识别或随机轨迹校准。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>相较向前进展生成，方法明确设置“缺失患者自身早期基线”的任务。损失为 \u003ccode>L = 0.2 L_direct + L_inter\u003c/code>，分别约束直接 latent 误差与帧间变化；真实连续时间与整数序列下标分开。方法强调 anchor 必须是已观测帧，不能偷偷取被遮蔽的最早帧。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>最关键的是全文 §5.2 / Table 1：配准至 1 mm 的 ADNI 测试为 \u003cstrong>25 名受试者\u003c/strong>。模型 MSE \u003cstrong>0.00238\u003c/strong>，VQ copy-nearest \u003cstrong>0.00168\u003c/strong>，原始像素 copy-nearest \u003cstrong>0.00088\u003c/strong>；模型 SSIM \u003cstrong>0.574\u003c/strong> 高于 VQ copy 的 \u003cstrong>0.454\u003c/strong>，但远低于原始像素 copy 的 \u003cstrong>0.957\u003c/strong>。仅做目标影像 encode-decode 的 MSE 已达 \u003cstrong>0.00131\u003c/strong>，说明编码器误差本身已大于复制基线误差。\u003c/p>\n\u003cp>变化幅度比 \u003ccode>Dyn\u003c/code> 为 \u003cstrong>1.29 ± 0.23\u003c/strong>，说明不是静态复制，却存在变化过冲；不同诊断分层的 \u003ccode>Rev\u003c/code> 均为负，整体为 \u003cstrong>-1.88\u003c/strong>。未配准 64³ 数据上的正面结果，作者在正文中明确解释为主要受到位姿和视野错配影响。因此，\u003cstrong>摘要中“所有分层为正”的表述不能代表配准后的主实验\u003c/strong>。合成数据能恢复非单调变化，不等于真实 MRI 已捕捉疾病机制。\u003c/p>\n\u003cp>另有两点待复现时核对：文中“382 T1 MRI”、至少五次就诊、80/10/10 划分和 25 名测试受试者的计数口径并不充分清楚；配准使用患者最早 baseline 为参考，实际逆向部署若该 baseline 不可得，预处理必须改为只依赖已观测 anchor。这是部署可用性问题，不能直接断言已发生模型输入泄漏。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关。\u003c/strong> VQ 潜空间、连续时间、残差预测与双向学习都贴近纵向影像路线。最值得迁移的是“先量化可观测疾病变化是否高于编码器误差”的评估。肿瘤治疗可能导致非单调反应、坏死、复发；“更早就是更健康”不适用，也不能将向后积分解释为撤除治疗的因果反事实。原文无 pCR、OS 或治疗条件实验。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>**改动位置：**先在现有冻结编码器的评估管线加入重建误差诊断，再试一个小型时间残差头。正向与反向各自只使用预测时可获得的 anchor 和预处理信息。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**对照：**原始像素复制、encode-decode 后复制、目标影像 encode-decode（仅诊断重建误差，不是可部署预测器）、线性趋势、同输入/参数量/训练预算的直接残差模型。固定患者划分，单独报告配准前后结果。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**指标：**全图与病灶 ROI 分开算误差；报告肿瘤体积变化 MAE、变化方向、变化幅度比，并按真实变化幅度分层。仅在病灶变化有效后，用同一 landmark 比较临床基线、真实历史直接预测、历史加生成状态的 pCR AUROC/AUPRC/Brier；OS 另用删失适配指标。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**否证：**配准后收益消失、只改善背景、变化不优于复制，或生成状态不优于同预算直接预测，则不支持“学到有临床价值的动态状态”。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**算力：**原文 §3.1 为冻结 34.1M 参数编码器、22,163 个时间模型参数、20,000 步 fp32；§5.3 报告 1 mm 阶段一约 36.2 GB 显存/48 GB 单卡。医学小实验若直接复用缓存 latent，可单卡起步，这是按小时间头估计，非原论文复现耗时承诺。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据：\u003ca href=\"https://arxiv.org/html/2609.14590v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §3–6、Table 1；独立笔记附原始英文摘要。上述医学实验为建议，尚未执行。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Deep learning-based spatio-temporal disease progression models commonly overlook the incubation period of progressive diseases, limiting the use of those models in early interventions, which are vital for not easily reversible diseases such as Alzheimer&#39;s. This is because, the existing deep learning based longitudinal disease-progression models are almost always run forward: from an observed baseline they predict future decline. In many clinical settings, however, imaging begins only after pathology is suspected or already visible, the earlier, healthier patient-specific reference was never acquired. To address this, we propose to study reverse disease progression prediction: given later diseased anatomy, reconstruct the unobserved healthier anatomy that preceded it. We use a two-stage model in which a frozen 3D vector-quantised autoencoder defines a compact discrete latent space, while a Neural Ordinary Differential Equation (ODE) learns continuous-time dynamics in that space. A recurrent encoder reads late observations in reverse temporal order, initialises the latent state, and the ODE is integrated backwards across the trajectory. On a controlled Morpho-MNIST benchmark with a sinusoidal perturbation, our model successfully recovered the unseen previous states from later observations of the non-monotonic trajectory. On longitudinal brain MRIs from Alzheimer&#39;s Disease Neuroimaging Initiative, at the task to recover the previous unseen trajectory towards healthy states of the patients from observed later diseased states, our model outperforms the baselines that uses copy-nearest and mean-observed, with positive disease-reversal scores in every diagnostic stratum. We hope that our work can provide insights and tools towards discovering the incubation periods from single-shot scans, and developing early interventions of diseases based on imaging.\u003c/p>\n","markdown":"### 一句话总结\n\n冻结 VQ-GAN 后用逆向 Neural ODE 预测过去 MRI，但配准后的 ADNI 结果没有证明疾病特异的逆向轨迹；最有价值的是重建误差、配准和复制基线的诊断设计。\n\n**元数据。** Ulugbek Shernazarov、Moucheng Xu、Inomjon Ramatov。v1：2026-09-13 15:17:59 UTC；无修订。[原始页面](https://arxiv.org/abs/2609.14590)；[全文](https://arxiv.org/html/2609.14590v1)。当前可核实载体为预印本；作者在 arXiv 注明获 SASHIMI 2026（MICCAI workshop）接受，正式论文集记录本次未独立核实。**未找到官方代码**，不能将其引用的其他进展模型仓库当成实现。\n\n### 中文摘要\n\n任务是根据晚期观测重建未观测的早期影像。先训练并冻结 3D VQ-GAN，逆序 ConvGRU 汇总晚期 latent，再用 `dz/dt = f_theta(z,t)` 向较早时刻积分；残差头相对已观测 anchor 累加变化。它改变的是纵向推断方向和残差时间模型，没有加入治疗效应识别或随机轨迹校准。\n\n### 创新点与机制\n\n相较向前进展生成，方法明确设置“缺失患者自身早期基线”的任务。损失为 `L = 0.2 L_direct + L_inter`，分别约束直接 latent 误差与帧间变化；真实连续时间与整数序列下标分开。方法强调 anchor 必须是已观测帧，不能偷偷取被遮蔽的最早帧。\n\n### 实验支持与局限\n\n最关键的是全文 §5.2 / Table 1：配准至 1 mm 的 ADNI 测试为 **25 名受试者**。模型 MSE **0.00238**，VQ copy-nearest **0.00168**，原始像素 copy-nearest **0.00088**；模型 SSIM **0.574** 高于 VQ copy 的 **0.454**，但远低于原始像素 copy 的 **0.957**。仅做目标影像 encode-decode 的 MSE 已达 **0.00131**，说明编码器误差本身已大于复制基线误差。\n\n变化幅度比 `Dyn` 为 **1.29 ± 0.23**，说明不是静态复制，却存在变化过冲；不同诊断分层的 `Rev` 均为负，整体为 **-1.88**。未配准 64³ 数据上的正面结果，作者在正文中明确解释为主要受到位姿和视野错配影响。因此，**摘要中“所有分层为正”的表述不能代表配准后的主实验**。合成数据能恢复非单调变化，不等于真实 MRI 已捕捉疾病机制。\n\n另有两点待复现时核对：文中“382 T1 MRI”、至少五次就诊、80/10/10 划分和 25 名测试受试者的计数口径并不充分清楚；配准使用患者最早 baseline 为参考，实际逆向部署若该 baseline 不可得，预处理必须改为只依赖已观测 anchor。这是部署可用性问题，不能直接断言已发生模型输入泄漏。\n\n### 和我方向的适配\n\n**直接相关。** VQ 潜空间、连续时间、残差预测与双向学习都贴近纵向影像路线。最值得迁移的是“先量化可观测疾病变化是否高于编码器误差”的评估。肿瘤治疗可能导致非单调反应、坏死、复发；“更早就是更健康”不适用，也不能将向后积分解释为撤除治疗的因果反事实。原文无 pCR、OS 或治疗条件实验。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：**先在现有冻结编码器的评估管线加入重建误差诊断，再试一个小型时间残差头。正向与反向各自只使用预测时可获得的 anchor 和预处理信息。\n\n- **对照：**原始像素复制、encode-decode 后复制、目标影像 encode-decode（仅诊断重建误差，不是可部署预测器）、线性趋势、同输入/参数量/训练预算的直接残差模型。固定患者划分，单独报告配准前后结果。\n\n- **指标：**全图与病灶 ROI 分开算误差；报告肿瘤体积变化 MAE、变化方向、变化幅度比，并按真实变化幅度分层。仅在病灶变化有效后，用同一 landmark 比较临床基线、真实历史直接预测、历史加生成状态的 pCR AUROC/AUPRC/Brier；OS 另用删失适配指标。\n\n- **否证：**配准后收益消失、只改善背景、变化不优于复制，或生成状态不优于同预算直接预测，则不支持“学到有临床价值的动态状态”。\n\n- **算力：**原文 §3.1 为冻结 34.1M 参数编码器、22,163 个时间模型参数、20,000 步 fp32；§5.3 报告 1 mm 阶段一约 36.2 GB 显存/48 GB 单卡。医学小实验若直接复用缓存 latent，可单卡起步，这是按小时间头估计，非原论文复现耗时承诺。\n\n\n### 原始摘要或 Evidence Source\n\n证据：[v1 全文](https://arxiv.org/html/2609.14590v1) §3–6、Table 1；独立笔记附原始英文摘要。上述医学实验为建议，尚未执行。\n\n\n\n## 原始摘要\n\nDeep learning-based spatio-temporal disease progression models commonly overlook the incubation period of progressive diseases, limiting the use of those models in early interventions, which are vital for not easily reversible diseases such as Alzheimer's. This is because, the existing deep learning based longitudinal disease-progression models are almost always run forward: from an observed baseline they predict future decline. In many clinical settings, however, imaging begins only after pathology is suspected or already visible, the earlier, healthier patient-specific reference was never acquired. To address this, we propose to study reverse disease progression prediction: given later diseased anatomy, reconstruct the unobserved healthier anatomy that preceded it. We use a two-stage model in which a frozen 3D vector-quantised autoencoder defines a compact discrete latent space, while a Neural Ordinary Differential Equation (ODE) learns continuous-time dynamics in that space. A recurrent encoder reads late observations in reverse temporal order, initialises the latent state, and the ODE is integrated backwards across the trajectory. On a controlled Morpho-MNIST benchmark with a sinusoidal perturbation, our model successfully recovered the unseen previous states from later observations of the non-monotonic trajectory. On longitudinal brain MRIs from Alzheimer's Disease Neuroimaging Initiative, at the task to recover the previous unseen trajectory towards healthy states of the patients from observed later diseased states, our model outperforms the baselines that uses copy-nearest and mean-observed, with positive disease-reversal scores in every diagnostic stratum. We hope that our work can provide insights and tools towards discovering the incubation periods from single-shot scans, and developing early interventions of diseases based on imaging."},{"id":"arxiv:2609.15189","title":"Reconstructing Is Not Acting: Action-Centric Latent Dynamics Modeling","short":"ACT-LAM","date":"2026-09-16","rank":2,"category":"general","topic":"可迁移算法","summary":"ACT-LAM 将条件提取和条件使用分开设计，控制任务收益与影像重建指标并不一致；其长程误差结果也提醒我们不要把条件敏感性当成预测正确性。","authors":"Fu, Dingjie · Shi, Dianxing · Xu, Yangyang · Yu, Jun","firstDate":"2026-09-14","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.15189","codeUrl":"https://github.com/DingjieFu/ACT-LAM","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>ACT-LAM 将条件提取和条件使用分开设计，控制任务收益与影像重建指标并不一致；其长程误差结果也提醒我们不要把条件敏感性当成预测正确性。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Dingjie Fu、Dianxing Shi、Yangyang Xu、Jun Yu。v1：2026-09-14 08:10:46 UTC；无修订；技术报告/预印本，未核实正式接受。\u003ca href=\"https://arxiv.org/abs/2609.15189\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.15189v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>；\u003ca href=\"https://github.com/DingjieFu/ACT-LAM\" target=\"_blank\" rel=\"noopener noreferrer\">官方仓库\u003c/a>。仓库与论文互链已核实，但当前根目录只有 \u003cstrong>README.md 和 LICENSE，没有模型源码\u003c/strong>，不能称为已可复现实现。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>基于冻结 DINOv2，AQ-IDM 用可学习 query 读取相邻状态差，并通过门控汇总为 latent action；AT-FDM 把 action 变成随 state token 一起更新的 token，在每层继续调制状态。它针对当前状态造成的预测捷径，以及重建训练并未充分约束 latent action 含义的问题。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>相对 DiLA，方法取消较重的特征处理模块，强化逆向与正向动态模块。未来状态采用残差形式 \u003ccode>s_next = s + F(s,z_action)\u003c/code>；总目标组合特征重建、状态差 SmoothL1、动作一致性、前后方向对称与动作方差项。参数量从 \u003cstrong>123M 降至 55M\u003c/strong>，因此主榜并非只改变一个损失的等容量对照。论文的条件使用实验固定 IDM，替换 FDM 的条件通路，再把正确 action 换为常量，比较 rollout 状态误差的相对增量。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 5 的 VP² 归一化 aggregate 为 \u003cstrong>49.04 对 41.44\u003c/strong>，提高 \u003cstrong>7.60 个百分点\u003c/strong>；该 aggregate 按 simulator 成功率归一化，并非普通平均临床成功率。结果来自四个种子。\u003c/p>\n\u003cp>Table 3 的 RT-1 重建 MSE：短程 @1，ACT-LAM \u003cstrong>0.119\u003c/strong>、DiLA \u003cstrong>0.215\u003c/strong>；@15 则 ACT-LAM \u003cstrong>0.705\u003c/strong>、DiLA \u003cstrong>0.323\u003c/strong>。正文说明 ACT-LAM 仅 teacher forcing，而 DiLA 用 rollout 微调的官方 checkpoint，训练阶段差异限制了归因。论文支持“更好的动作表示可以与更差的长程重建共存”，不支持“所有生成和长程指标全面领先”。移除动作使误差上升，仅证明模型依赖该输入，不能单独证明使用方式正确。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 优先借鉴 state-aware 条件 token 和条件干预诊断；用已知治疗类型、剂量及真实时间差初始化 token。逆向模型从真实未来影像提取的 action 只能用于训练期辅助监督，预测时不可作为输入，否则发生未来信息泄漏。肿瘤缩小并不能唯一反推治疗，前后方向对称也不等于临床过程可逆；\u003ccode>L_sym\u003c/code> 不应直接照搬为撤药或逆疗效约束。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>**改动位置：**只替换小型 latent 残差预测头的治疗条件注入模块，比较固定拼接/FiLM 与逐层交互 token；保持治疗编码器与影像编码器一致。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**对照：**同输入、近似同参数量与预算，包含不使用治疗、正确治疗、置换治疗、复制和直接残差预测；置换仅作条件使用诊断，不估计治疗效应。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**指标：**分开报告单步/多步 latent 误差、病灶变化 MAE、患者间变化排序，以及 landmark 固定的 pCR 增益。记录移除条件后的误差差值，但不把该差值作为主要成绩。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**否证：**治疗敏感性增加却不改善真实预测、校准或下游任务，或收益仅出现在训练可获得未来 action 的设置，则否定本次迁移假设。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**算力：**原文 Appendix A.2 使用 \u003cstrong>4 × RTX A6000 48 GB、50k 步、16 帧 256²、fp32\u003c/strong>。仅改缓存 latent 上的小头估计可单卡验证；不据此估计完整视频预训练时长。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据：\u003ca href=\"https://arxiv.org/html/2609.15189v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §3–4、Tables 1/3/5、Appendix A.2/B.8；官方仓库目录为本次读取结果。独立笔记附原始摘要。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Latent action models (LAMs) learn action representations from unlabeled videos by inferring latent actions from visual transitions and reconstructing future states. However, we identify a fundamental $\\textbf{reconstruction-action mismatch}$: lower reconstruction error does not necessarily yield better latent dynamics or downstream performance. We attribute this mismatch to two underconstrained aspects of reconstruction-based latent dynamics modeling: (i) the inverse dynamics model (IDM) is not explicitly encouraged to distinguish action-related transitions from nuisance appearance, and (ii) the forward dynamics model (FDM) can underutilize the inferred latent action by exploiting predictive shortcuts from the current state. To address both limitations, we propose $\\textbf{ACT-LAM}$, a lightweight action-centric framework that strengthens both action extraction and action utilization. Specifically, its Action Query IDM (AQ-IDM) employs learnable action queries and gated aggregation to selectively extract rich action-related transition cues without strong information bottlenecks. And its Action Token FDM (AT-FDM) projects latent actions into action tokens that progressively interact with evolving state representations, enabling continuous state-aware action conditioning. ACT-LAM further streamlines feature processing to concentrate model capacity on latent dynamics modeling. Extensive experiments on several robotic datasets and the VP$^2$ benchmark demonstrate stronger latent action consistency, forward dynamics, and downstream visual planning performance with fewer trainable parameters and lower computational overhead. In particular, ACT-LAM surpasses the previous state of the art by $\\textbf{7.6%}$ on the aggregated VP$^2$ success rate. Codes at $\\href{\u003ca href=\"https://github.com/DingjieFu/ACT-LAM%7D%7Burl%7D$\" target=\"_blank\" rel=\"noopener noreferrer\">https://github.com/DingjieFu/ACT-LAM}{url}$\u003c/a>.\u003c/p>\n","markdown":"### 一句话总结\n\nACT-LAM 将条件提取和条件使用分开设计，控制任务收益与影像重建指标并不一致；其长程误差结果也提醒我们不要把条件敏感性当成预测正确性。\n\n**元数据。** Dingjie Fu、Dianxing Shi、Yangyang Xu、Jun Yu。v1：2026-09-14 08:10:46 UTC；无修订；技术报告/预印本，未核实正式接受。[原文](https://arxiv.org/abs/2609.15189)；[全文](https://arxiv.org/html/2609.15189v1)；[官方仓库](https://github.com/DingjieFu/ACT-LAM)。仓库与论文互链已核实，但当前根目录只有 **README.md 和 LICENSE，没有模型源码**，不能称为已可复现实现。\n\n### 中文摘要\n\n基于冻结 DINOv2，AQ-IDM 用可学习 query 读取相邻状态差，并通过门控汇总为 latent action；AT-FDM 把 action 变成随 state token 一起更新的 token，在每层继续调制状态。它针对当前状态造成的预测捷径，以及重建训练并未充分约束 latent action 含义的问题。\n\n### 创新点与机制\n\n相对 DiLA，方法取消较重的特征处理模块，强化逆向与正向动态模块。未来状态采用残差形式 `s_next = s + F(s,z_action)`；总目标组合特征重建、状态差 SmoothL1、动作一致性、前后方向对称与动作方差项。参数量从 **123M 降至 55M**，因此主榜并非只改变一个损失的等容量对照。论文的条件使用实验固定 IDM，替换 FDM 的条件通路，再把正确 action 换为常量，比较 rollout 状态误差的相对增量。\n\n### 实验支持与局限\n\nTable 5 的 VP² 归一化 aggregate 为 **49.04 对 41.44**，提高 **7.60 个百分点**；该 aggregate 按 simulator 成功率归一化，并非普通平均临床成功率。结果来自四个种子。\n\nTable 3 的 RT-1 重建 MSE：短程 @1，ACT-LAM **0.119**、DiLA **0.215**；@15 则 ACT-LAM **0.705**、DiLA **0.323**。正文说明 ACT-LAM 仅 teacher forcing，而 DiLA 用 rollout 微调的官方 checkpoint，训练阶段差异限制了归因。论文支持“更好的动作表示可以与更差的长程重建共存”，不支持“所有生成和长程指标全面领先”。移除动作使误差上升，仅证明模型依赖该输入，不能单独证明使用方式正确。\n\n### 和我方向的适配\n\n**可迁移算法。** 优先借鉴 state-aware 条件 token 和条件干预诊断；用已知治疗类型、剂量及真实时间差初始化 token。逆向模型从真实未来影像提取的 action 只能用于训练期辅助监督，预测时不可作为输入，否则发生未来信息泄漏。肿瘤缩小并不能唯一反推治疗，前后方向对称也不等于临床过程可逆；`L_sym` 不应直接照搬为撤药或逆疗效约束。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：**只替换小型 latent 残差预测头的治疗条件注入模块，比较固定拼接/FiLM 与逐层交互 token；保持治疗编码器与影像编码器一致。\n\n- **对照：**同输入、近似同参数量与预算，包含不使用治疗、正确治疗、置换治疗、复制和直接残差预测；置换仅作条件使用诊断，不估计治疗效应。\n\n- **指标：**分开报告单步/多步 latent 误差、病灶变化 MAE、患者间变化排序，以及 landmark 固定的 pCR 增益。记录移除条件后的误差差值，但不把该差值作为主要成绩。\n\n- **否证：**治疗敏感性增加却不改善真实预测、校准或下游任务，或收益仅出现在训练可获得未来 action 的设置，则否定本次迁移假设。\n\n- **算力：**原文 Appendix A.2 使用 **4 × RTX A6000 48 GB、50k 步、16 帧 256²、fp32**。仅改缓存 latent 上的小头估计可单卡验证；不据此估计完整视频预训练时长。\n\n\n### 原始摘要或 Evidence Source\n\n证据：[v1 全文](https://arxiv.org/html/2609.15189v1) §3–4、Tables 1/3/5、Appendix A.2/B.8；官方仓库目录为本次读取结果。独立笔记附原始摘要。\n\n\n\n## 原始摘要\n\nLatent action models (LAMs) learn action representations from unlabeled videos by inferring latent actions from visual transitions and reconstructing future states. However, we identify a fundamental $\\textbf{reconstruction-action mismatch}$: lower reconstruction error does not necessarily yield better latent dynamics or downstream performance. We attribute this mismatch to two underconstrained aspects of reconstruction-based latent dynamics modeling: (i) the inverse dynamics model (IDM) is not explicitly encouraged to distinguish action-related transitions from nuisance appearance, and (ii) the forward dynamics model (FDM) can underutilize the inferred latent action by exploiting predictive shortcuts from the current state. To address both limitations, we propose $\\textbf{ACT-LAM}$, a lightweight action-centric framework that strengthens both action extraction and action utilization. Specifically, its Action Query IDM (AQ-IDM) employs learnable action queries and gated aggregation to selectively extract rich action-related transition cues without strong information bottlenecks. And its Action Token FDM (AT-FDM) projects latent actions into action tokens that progressively interact with evolving state representations, enabling continuous state-aware action conditioning. ACT-LAM further streamlines feature processing to concentrate model capacity on latent dynamics modeling. Extensive experiments on several robotic datasets and the VP$^2$ benchmark demonstrate stronger latent action consistency, forward dynamics, and downstream visual planning performance with fewer trainable parameters and lower computational overhead. In particular, ACT-LAM surpasses the previous state of the art by $\\textbf{7.6%}$ on the aggregated VP$^2$ success rate. Codes at $\\href{https://github.com/DingjieFu/ACT-LAM}{url}$."},{"id":"arxiv:2609.16573","title":"AsyncCouple-Flow: Asynchronous Cross-Modal Coupling and Flow Matching for Spatio-Temporal Forecasting","short":"AsyncCouple-Flow","date":"2026-09-16","rank":3,"category":"general","topic":"可迁移算法","summary":"用原生时间戳的稀疏跨模态图构造条件，再由 Flow Matching 联合预测整段未来；它可以启发 MRI、临床变量和治疗记录不同步时的历史融合。","authors":"Wu, Zhixiang · Liu, Yining · Zhao, Bo · Chen, Szu-Yu · Duan, Huiran · Lin, Chu · Yang, Chuanguang","firstDate":"2026-09-15","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.16573","codeUrl":"","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>用原生时间戳的稀疏跨模态图构造条件，再由 Flow Matching 联合预测整段未来；它可以启发 MRI、临床变量和治疗记录不同步时的历史融合。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Zhixiang Wu、Yining Liu、Bo Zhao、Szu-Yu Chen、Huiran Duan、Chu Lin、Chuanguang Yang。v1：\u003cstrong>2026-09-15 03:15:14 UTC\u003c/strong>，以原页历史为准，搜索结果显示的 09-14 不采用；无修订。\u003ca href=\"https://arxiv.org/abs/2609.16573\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.16573v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。预印本；作者注明 ICONIP 2026 接受，未独立核实正式论文集。\u003cstrong>未找到官方代码\u003c/strong>，摘要仍称接受后发布。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>MATS 在各模态各时点保留少量 token；ACCG 的边结合真实时间差、语义相似度与模态对先验，缺失模态直接不建立节点；FM head 把整个未来张量作为一个联合随机变量生成。相对插值后拼接或逐步自回归，它同时改变历史融合与未来输出组织方式。\u003c/p>\n\u003ch3>创新点与机制\u003c/h3>\n\u003cp>边权大致为时间衰减 × query-key 相似度 × 模态对先验。生成时间 \u003ccode>s ∈ [0,1]\u003c/code> 与真实观测时间分开：\u003ccode>x_s = (1-s) noise + s Y_future\u003c/code>，回归速度 \u003ccode>Y_future - noise\u003c/code>，再加一步预测 L1 与 token 预算正则。训练随机整模态 dropout 为 \u003cstrong>0.3\u003c/strong>。“一次 ODE 求解”仍包含 \u003cstrong>25 次 Euler 更新\u003c/strong>，不是一次网络前向，也不保证未来误差不增长。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>Table 1：WeatherBench-MM 24 h 的 RMSE \u003cstrong>1.67 对 CrossViViT 1.89\u003c/strong>，CRPS \u003cstrong>0.93 对 1.06\u003c/strong>；PEMS-BAY-MM 60 min MAE \u003cstrong>1.61 对 1.79\u003c/strong>。论文称五个种子均值，但该表没有给种子离散度或差异置信区间。缺失模态实验通过随机删除 0/1/2 个模态完成，不能推及临床按病情选择检查的缺失机制。\u003c/p>\n\u003cp>作者将优点描述为避免自回归漂移；我的判断是它消除了显式逐步回灌，但 Figure 4 中误差仍随预测距离增长。它没有证明医学长程外推、治疗效应识别或跨中心校准，插值式基线和融合模块同时改变也需要拆开消融。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可以迁移真实时间差边和“整段未来 latent”的输出方式；需要影像、化验、临床记录各自可信的采集时间，以及预测时点之前的治疗信息。少量 MRI 的场景可先保留全部时点，避免未经验证的 top-k 丢掉小病灶。天气模态之间的物理先验不能直接换成未经验证的影像—病理因果关系。预测跨度超过已知治疗方案时，需要明确后续治疗的条件假设。\u003c/p>\n\u003ch3>可借鉴动作：最小验证实验\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>**改动位置：**冻结编码器，用时间差图或简单时间戳 attention 融合历史，再比较联合未来 latent 与自回归输出。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**对照：**2×2 消融：插值/原生时间融合 × 直接回归/FM，另加复制和同预算自回归模型；匹配可用历史、参数量、训练步数与采样预算。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**指标：**按真实间隔报告病灶体积变化 MAE、每一步误差、CRPS、联合 energy score、区间覆盖率与宽度。分别测试随机缺失和真实就诊缺失，后者需记录缺失指示及时间信息。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>**否证：**只在随机缺失上有效、对真实缺失失效；联合采样增加多样性却恶化 proper scores；或相同输入预算的直接回归更好，均削弱迁移理由。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>算力：\u003c/strong>§4.1 报告 \u003cstrong>8 × A100、100 epochs、batch 32\u003c/strong>；§4.6 单 A100 推理约 \u003cstrong>150 ms\u003c/strong>，只适用于其数据/分辨率。医学小实验估计先用缓存 latent 单卡训练小头，不能沿用该延迟数字。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>证据：\u003ca href=\"https://arxiv.org/html/2609.16573v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §3–4、Table 1、Figures 2–5。独立笔记附原始摘要。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Multi-modal spatio-temporal forecasting (MM-STF) supports weather nowcasting, traffic prediction, and earth-system modeling by combining heterogeneous sources such as physical fields, satellite imagery, and in-situ sensors. Three obstacles persist: (i) modalities have different spatio-temporal sampling rates, forcing lossy interpolation onto a unified grid; (ii) modalities are frequently missing at deployment due to sensor outages or revisit gaps, while most methods train with full availability; and (iii) autoregressive decoders accumulate errors over long horizons, amplified by multi-modal conditioning. We propose AsyncCouple-Flow to address these issues jointly. A Modality-Aware Token Sparsification (MATS) module performs scale-aware tokenization and uses a shared importance scorer to select top-k tokens per timestep, producing equal-length sequences. An Asynchronous Cross-Modal Coupling Graph (ACCG) replaces fixed cross-attention with a learnable graph whose edges encode time offsets, semantic similarity, and modality-specific physical priors, enabling fusion under arbitrary asynchrony and missingness. A Flow-Matching Forecasting Head models multi-step prediction as a conditional ODE, trained with stochastic modality dropout and integrated jointly to avoid autoregressive drift. Experiments on ERA5+GOES+ISD weather forecasting and PEMS-BAY traffic prediction with multi-source side information show that AsyncCouple-Flow outperforms state-of-the-art baselines and remains robust with up to two missing modalities. The code will be released upon acceptance.\u003c/p>\n","markdown":"### 一句话总结\n\n用原生时间戳的稀疏跨模态图构造条件，再由 Flow Matching 联合预测整段未来；它可以启发 MRI、临床变量和治疗记录不同步时的历史融合。\n\n**元数据。** Zhixiang Wu、Yining Liu、Bo Zhao、Szu-Yu Chen、Huiran Duan、Chu Lin、Chuanguang Yang。v1：**2026-09-15 03:15:14 UTC**，以原页历史为准，搜索结果显示的 09-14 不采用；无修订。[原文](https://arxiv.org/abs/2609.16573)；[全文](https://arxiv.org/html/2609.16573v1)。预印本；作者注明 ICONIP 2026 接受，未独立核实正式论文集。**未找到官方代码**，摘要仍称接受后发布。\n\n### 中文摘要\n\nMATS 在各模态各时点保留少量 token；ACCG 的边结合真实时间差、语义相似度与模态对先验，缺失模态直接不建立节点；FM head 把整个未来张量作为一个联合随机变量生成。相对插值后拼接或逐步自回归，它同时改变历史融合与未来输出组织方式。\n\n### 创新点与机制\n\n边权大致为时间衰减 × query-key 相似度 × 模态对先验。生成时间 `s ∈ [0,1]` 与真实观测时间分开：`x_s = (1-s) noise + s Y_future`，回归速度 `Y_future - noise`，再加一步预测 L1 与 token 预算正则。训练随机整模态 dropout 为 **0.3**。“一次 ODE 求解”仍包含 **25 次 Euler 更新**，不是一次网络前向，也不保证未来误差不增长。\n\n### 实验支持与局限\n\nTable 1：WeatherBench-MM 24 h 的 RMSE **1.67 对 CrossViViT 1.89**，CRPS **0.93 对 1.06**；PEMS-BAY-MM 60 min MAE **1.61 对 1.79**。论文称五个种子均值，但该表没有给种子离散度或差异置信区间。缺失模态实验通过随机删除 0/1/2 个模态完成，不能推及临床按病情选择检查的缺失机制。\n\n作者将优点描述为避免自回归漂移；我的判断是它消除了显式逐步回灌，但 Figure 4 中误差仍随预测距离增长。它没有证明医学长程外推、治疗效应识别或跨中心校准，插值式基线和融合模块同时改变也需要拆开消融。\n\n### 和我方向的适配\n\n**可迁移算法。** 可以迁移真实时间差边和“整段未来 latent”的输出方式；需要影像、化验、临床记录各自可信的采集时间，以及预测时点之前的治疗信息。少量 MRI 的场景可先保留全部时点，避免未经验证的 top-k 丢掉小病灶。天气模态之间的物理先验不能直接换成未经验证的影像—病理因果关系。预测跨度超过已知治疗方案时，需要明确后续治疗的条件假设。\n\n### 可借鉴动作：最小验证实验\n\n- **改动位置：**冻结编码器，用时间差图或简单时间戳 attention 融合历史，再比较联合未来 latent 与自回归输出。\n\n- **对照：**2×2 消融：插值/原生时间融合 × 直接回归/FM，另加复制和同预算自回归模型；匹配可用历史、参数量、训练步数与采样预算。\n\n- **指标：**按真实间隔报告病灶体积变化 MAE、每一步误差、CRPS、联合 energy score、区间覆盖率与宽度。分别测试随机缺失和真实就诊缺失，后者需记录缺失指示及时间信息。\n\n- **否证：**只在随机缺失上有效、对真实缺失失效；联合采样增加多样性却恶化 proper scores；或相同输入预算的直接回归更好，均削弱迁移理由。\n\n- **算力：**§4.1 报告 **8 × A100、100 epochs、batch 32**；§4.6 单 A100 推理约 **150 ms**，只适用于其数据/分辨率。医学小实验估计先用缓存 latent 单卡训练小头，不能沿用该延迟数字。\n\n\n### 原始摘要或 Evidence Source\n\n证据：[v1 全文](https://arxiv.org/html/2609.16573v1) §3–4、Table 1、Figures 2–5。独立笔记附原始摘要。\n\n\n\n## 原始摘要\n\nMulti-modal spatio-temporal forecasting (MM-STF) supports weather nowcasting, traffic prediction, and earth-system modeling by combining heterogeneous sources such as physical fields, satellite imagery, and in-situ sensors. Three obstacles persist: (i) modalities have different spatio-temporal sampling rates, forcing lossy interpolation onto a unified grid; (ii) modalities are frequently missing at deployment due to sensor outages or revisit gaps, while most methods train with full availability; and (iii) autoregressive decoders accumulate errors over long horizons, amplified by multi-modal conditioning. We propose AsyncCouple-Flow to address these issues jointly. A Modality-Aware Token Sparsification (MATS) module performs scale-aware tokenization and uses a shared importance scorer to select top-k tokens per timestep, producing equal-length sequences. An Asynchronous Cross-Modal Coupling Graph (ACCG) replaces fixed cross-attention with a learnable graph whose edges encode time offsets, semantic similarity, and modality-specific physical priors, enabling fusion under arbitrary asynchrony and missingness. A Flow-Matching Forecasting Head models multi-step prediction as a conditional ODE, trained with stochastic modality dropout and integrated jointly to avoid autoregressive drift. Experiments on ERA5+GOES+ISD weather forecasting and PEMS-BAY traffic prediction with multi-source side information show that AsyncCouple-Flow outperforms state-of-the-art baselines and remains robust with up to two missing modalities. The code will be released upon acceptance."},{"id":"arxiv:2609.16317","title":"Generative models for simulation based filtering: Formulations and Empirical Comparisons","short":"Generative-Filters","date":"2026-09-16","rank":4,"category":"general","topic":"可迁移算法","summary":"把新观测下的后验校正统一成条件 transport，比较 FM、随机插值和 Schrodinger bridge；算法选择依赖粒子数和在线计算预算，没有普遍赢家。","authors":"Al-Jarrah, Mohammad · Deng, Wei · Hosseini, Bamdad · Taghvaei, Amirhossein","firstDate":"2026-09-14","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.16317","codeUrl":"https://github.com/Mohd9485/Generative_Filters","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>把新观测下的后验校正统一成条件 transport，比较 FM、随机插值和 Schrodinger bridge；算法选择依赖粒子数和在线计算预算，没有普遍赢家。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Mohammad Al-Jarrah、Wei Deng、Bamdad Hosseini、Amirhossein Taghvaei。v1：2026-09-14 20:31:29 UTC；无修订；预印本。\u003ca href=\"https://arxiv.org/abs/2609.16317\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.16317v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>；\u003ca href=\"https://github.com/Mohd9485/Generative_Filters\" target=\"_blank\" rel=\"noopener noreferrer\">官方代码\u003c/a>。论文链接与仓库目录已核验，有 SIF.py、SBF.py、OTF.py、KRF.py、SIR.py、EnKF.py 及调参脚本；未运行代码。README 提及的 FMF.py 未出现在本次根目录列表中，不能据此宣称所有比较方法均已完整发布。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>已知状态转移和观测模拟器时，先生成 forecast ensemble，再学习依赖新观测的 transport 得到过滤后验。通过保持观测坐标的三角映射统一不同模型，并把初始训练调参与每次新观测的在线 refinement 分开。\u003c/p>\n\u003ch3>创新点与实验边界\u003c/h3>\n\u003cp>两类合成动力学测试用 aa-SW2、粒子数、在线成本和二十次模拟评价。正文 §IV-C 明确：二次观测任务中 \u003cstrong>SBF 是未恢复双峰的例外\u003c/strong>，不能照摘要转述“所有生成过滤器都恢复多峰”。小粒子数 Lorenz-63 下 OTF/KRF 更稳定；某些 SIF 最低误差设置的在线成本比 EnKF/SIR 高约四个数量级。aa-SW2 逐坐标投影不能充分检查联合相关结构。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 适合“疗中 MRI 到达后校正患者状态分布”，与从基线一次性预测未来是不同任务。前提是有可用状态转移与观测模型；MRI 测量噪声、潜状态可辨识性、信息性随访不能当作已知。原文没有临床疗效/生存证据。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在固定低维病灶状态预测器后增加观测校正层，比较无校正、线性/Kalman 更新、小粒子滤波、FM transport；相同观测与在线预算。用观测到来之后的下一次随访检验变化 MAE、energy score 和覆盖率，不能用刚吸收的观测当“未来预测”成绩。若仅观测拟合变好而下一次预测无增益，或增加成本后不优于简单滤波，否定复杂生成校正的必要性。先做低维模拟和缓存 latent，CPU/单卡估计可起步；具体训练预算需实测，原文比较的是随方法变化的在线成本。\u003c/p>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>\u003ca href=\"https://arxiv.org/html/2609.16317v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §II–V、Figures 1–2；独立笔记附原始摘要。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>This letter presents a unified formulation and a controlled numerical comparison of generative-model approaches to the nonlinear filtering problem. Under this formulation the analysis step is realized by a transport of the forecast distribution to the posterior, the approaches differing only in how that transport is selected and learned. We derive three new filters, based on stochastic interpolants, their deterministic flow-matching limit, and Schr&quot;odinger bridges realized through forward--backward SDEs. We develop a two-stage tuning procedure that separates the training of the generative model from its online refinement. The resulting methods are compared against the optimal transport filter (OTF), the Knothe--Rosenblatt filter (KRF), the sequential importance resampling (SIR) particle filter and the ensemble Kalman filter (EnKF), in terms of accuracy, computational time, and sensitivity to ensemble size and state dimension. The results indicate that every generative filter resolves multimodal posteriors that the EnKF and SIR do not, that no single generative framework dominates, the preferred method being set by the available online budget and ensemble size, and that the filters differ in the regularity of the particle trajectories they produce.\u003c/p>\n","markdown":"### 一句话总结\n\n把新观测下的后验校正统一成条件 transport，比较 FM、随机插值和 Schrodinger bridge；算法选择依赖粒子数和在线计算预算，没有普遍赢家。\n\n**元数据。** Mohammad Al-Jarrah、Wei Deng、Bamdad Hosseini、Amirhossein Taghvaei。v1：2026-09-14 20:31:29 UTC；无修订；预印本。[原文](https://arxiv.org/abs/2609.16317)；[全文](https://arxiv.org/html/2609.16317v1)；[官方代码](https://github.com/Mohd9485/Generative_Filters)。论文链接与仓库目录已核验，有 SIF.py、SBF.py、OTF.py、KRF.py、SIR.py、EnKF.py 及调参脚本；未运行代码。README 提及的 FMF.py 未出现在本次根目录列表中，不能据此宣称所有比较方法均已完整发布。\n\n### 中文摘要\n\n已知状态转移和观测模拟器时，先生成 forecast ensemble，再学习依赖新观测的 transport 得到过滤后验。通过保持观测坐标的三角映射统一不同模型，并把初始训练调参与每次新观测的在线 refinement 分开。\n\n### 创新点与实验边界\n\n两类合成动力学测试用 aa-SW2、粒子数、在线成本和二十次模拟评价。正文 §IV-C 明确：二次观测任务中 **SBF 是未恢复双峰的例外**，不能照摘要转述“所有生成过滤器都恢复多峰”。小粒子数 Lorenz-63 下 OTF/KRF 更稳定；某些 SIF 最低误差设置的在线成本比 EnKF/SIR 高约四个数量级。aa-SW2 逐坐标投影不能充分检查联合相关结构。\n\n### 和我方向的适配\n\n**可迁移算法。** 适合“疗中 MRI 到达后校正患者状态分布”，与从基线一次性预测未来是不同任务。前提是有可用状态转移与观测模型；MRI 测量噪声、潜状态可辨识性、信息性随访不能当作已知。原文没有临床疗效/生存证据。\n\n### 可借鉴动作\n\n在固定低维病灶状态预测器后增加观测校正层，比较无校正、线性/Kalman 更新、小粒子滤波、FM transport；相同观测与在线预算。用观测到来之后的下一次随访检验变化 MAE、energy score 和覆盖率，不能用刚吸收的观测当“未来预测”成绩。若仅观测拟合变好而下一次预测无增益，或增加成本后不优于简单滤波，否定复杂生成校正的必要性。先做低维模拟和缓存 latent，CPU/单卡估计可起步；具体训练预算需实测，原文比较的是随方法变化的在线成本。\n\n### 原始摘要或 Evidence Source\n\n[v1 全文](https://arxiv.org/html/2609.16317v1) §II–V、Figures 1–2；独立笔记附原始摘要。\n\n\n\n## 原始摘要\n\nThis letter presents a unified formulation and a controlled numerical comparison of generative-model approaches to the nonlinear filtering problem. Under this formulation the analysis step is realized by a transport of the forecast distribution to the posterior, the approaches differing only in how that transport is selected and learned. We derive three new filters, based on stochastic interpolants, their deterministic flow-matching limit, and Schr\\\"odinger bridges realized through forward--backward SDEs. We develop a two-stage tuning procedure that separates the training of the generative model from its online refinement. The resulting methods are compared against the optimal transport filter (OTF), the Knothe--Rosenblatt filter (KRF), the sequential importance resampling (SIR) particle filter and the ensemble Kalman filter (EnKF), in terms of accuracy, computational time, and sensitivity to ensemble size and state dimension. The results indicate that every generative filter resolves multimodal posteriors that the EnKF and SIR do not, that no single generative framework dominates, the preferred method being set by the available online budget and ensemble size, and that the filters differ in the regularity of the particle trajectories they produce."},{"id":"arxiv:2609.16621","title":"Stable by Construction: Variational Latent Markov Operators for Long-Horizon PDE Prediction","short":"VAMO","date":"2026-09-16","rank":5,"category":"general","topic":"可迁移算法","summary":"VAMO 用空间相关的潜变量扰动和相邻状态分布 KL 对齐改善长程 rollout；其部署使用确定性均值，不能直接作为不确定性已校准的依据。","authors":"Liao, Junyi · Guilleminot, Johann · Tarokh, Vahid","firstDate":"2026-09-15","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.16621","codeUrl":"","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>VAMO 用空间相关的潜变量扰动和相邻状态分布 KL 对齐改善长程 rollout；其部署使用确定性均值，不能直接作为不确定性已校准的依据。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Junyi Liao、Johann Guilleminot、Vahid Tarokh。v1：2026-09-15 04:28:59 UTC；无修订；预印本。\u003ca href=\"https://arxiv.org/abs/2609.16621\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.16621v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。\u003cstrong>未找到官方代码\u003c/strong>。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>编码器保留空间 latent field，残差 FNO 预测下一状态。训练在编码和转移处加入有谱结构的 Gaussian 扰动，目标为 \u003ccode>L_pred + beta KL(q(z_next|x_next) || p(z_next|z)) + lambda L_rec\u003c/code>。推理只编码一次，随后潜空间递推并解码，关闭采样。\u003c/p>\n\u003ch3>创新点与实验边界\u003c/h3>\n\u003cp>相对确定性 latent FNO 和普通 Gaussian noise baseline，新增的是结构化噪声及分布转移对齐。2D CFD 从训练区间 \u003ccode>[0,1]\u003c/code> 外推至 \u003ccode>10\u003c/code>：Table 4 的平均相对 L2 \u003cstrong>0.0565\u003c/strong>，FNO-AE \u003cstrong>0.2526\u003c/strong>；H1 \u003cstrong>0.4044 对 2.3394\u003c/strong>。这是真实的长于训练时域的合成 PDE 测试，但物理系统使用规则网格和固定步长，理论界依赖正则性，不能把标题理解为任意疾病动力学均稳定。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可迁移结构化 latent 扰动与下一时点表示对齐，以检验小样本下局部预测误差的累积。治疗与不规则时间差必须另行建模；MRI 空间纹理不具有周期流体边界，频谱噪声不能未经检验直接照搬。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在同一个小型 latent transition 上比较无噪声、等方差独立噪声、空间相关噪声，以及是否加入下一状态 KL 的消融。至少需要三次观测才能检查真实多步误差；少于此时只检验单步，不构造伪随访证明长程稳定。报告 rollout 各步病灶误差、频谱/边界保真与少事件临床结局；若只是平滑病灶而失去变化信息，或 KL 导致表征塌缩，则否证。单卡小头是工程估计；本次未核实全文硬件总耗时，不作原实验算力承诺。\u003c/p>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>\u003ca href=\"https://arxiv.org/html/2609.16621v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> §4–6、Tables 2/4；本次未逐条复核附录证明，独立笔记附原始摘要。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Neural PDE solvers provide efficient surrogates for time-dependent physical systems, but autoregressive prediction over long horizons remains challenging because local errors can induce distribution shift and accumulate under recursive deployment. We develop a variational approach to this problem by introducing latent Markov dynamics in which physical states are represented by latent distributions and evolved through probabilistic transitions. The framework is formulated directly on function spaces and specialized to functional Gaussian models, where structured latent perturbations induce a spectral geometry and variational transition alignment regularizes the learned dynamics. We further analyze how these mechanisms affect autoregressive error propagation, providing a theoretical connection between variational training and long-horizon prediction. We instantiate the framework as the Variational Autoencoding Markov Operator (VAMO), which combines spatially resolved latent fields, structured Gaussian perturbations, and a neural-operator transition. Empirically, we demonstrate the effectiveness of VAMO on several fluid-dynamics benchmarks with prediction horizons extending substantially beyond those represented during training, where it consistently reduces error accumulation and improves rollout stability over several deterministic and noise-injection baselines. Overall, these results highlight variational modeling as a complementary approach to robust long-horizon neural PDE dynamics.\u003c/p>\n","markdown":"### 一句话总结\n\nVAMO 用空间相关的潜变量扰动和相邻状态分布 KL 对齐改善长程 rollout；其部署使用确定性均值，不能直接作为不确定性已校准的依据。\n\n**元数据。** Junyi Liao、Johann Guilleminot、Vahid Tarokh。v1：2026-09-15 04:28:59 UTC；无修订；预印本。[原文](https://arxiv.org/abs/2609.16621)；[全文](https://arxiv.org/html/2609.16621v1)。**未找到官方代码**。\n\n### 中文摘要\n\n编码器保留空间 latent field，残差 FNO 预测下一状态。训练在编码和转移处加入有谱结构的 Gaussian 扰动，目标为 `L_pred + beta KL(q(z_next|x_next) || p(z_next|z)) + lambda L_rec`。推理只编码一次，随后潜空间递推并解码，关闭采样。\n\n### 创新点与实验边界\n\n相对确定性 latent FNO 和普通 Gaussian noise baseline，新增的是结构化噪声及分布转移对齐。2D CFD 从训练区间 `[0,1]` 外推至 `10`：Table 4 的平均相对 L2 **0.0565**，FNO-AE **0.2526**；H1 **0.4044 对 2.3394**。这是真实的长于训练时域的合成 PDE 测试，但物理系统使用规则网格和固定步长，理论界依赖正则性，不能把标题理解为任意疾病动力学均稳定。\n\n### 和我方向的适配\n\n**可迁移算法。** 可迁移结构化 latent 扰动与下一时点表示对齐，以检验小样本下局部预测误差的累积。治疗与不规则时间差必须另行建模；MRI 空间纹理不具有周期流体边界，频谱噪声不能未经检验直接照搬。\n\n### 可借鉴动作\n\n在同一个小型 latent transition 上比较无噪声、等方差独立噪声、空间相关噪声，以及是否加入下一状态 KL 的消融。至少需要三次观测才能检查真实多步误差；少于此时只检验单步，不构造伪随访证明长程稳定。报告 rollout 各步病灶误差、频谱/边界保真与少事件临床结局；若只是平滑病灶而失去变化信息，或 KL 导致表征塌缩，则否证。单卡小头是工程估计；本次未核实全文硬件总耗时，不作原实验算力承诺。\n\n### 原始摘要或 Evidence Source\n\n[v1 全文](https://arxiv.org/html/2609.16621v1) §4–6、Tables 2/4；本次未逐条复核附录证明，独立笔记附原始摘要。\n\n\n\n## 原始摘要\n\nNeural PDE solvers provide efficient surrogates for time-dependent physical systems, but autoregressive prediction over long horizons remains challenging because local errors can induce distribution shift and accumulate under recursive deployment. We develop a variational approach to this problem by introducing latent Markov dynamics in which physical states are represented by latent distributions and evolved through probabilistic transitions. The framework is formulated directly on function spaces and specialized to functional Gaussian models, where structured latent perturbations induce a spectral geometry and variational transition alignment regularizes the learned dynamics. We further analyze how these mechanisms affect autoregressive error propagation, providing a theoretical connection between variational training and long-horizon prediction. We instantiate the framework as the Variational Autoencoding Markov Operator (VAMO), which combines spatially resolved latent fields, structured Gaussian perturbations, and a neural-operator transition. Empirically, we demonstrate the effectiveness of VAMO on several fluid-dynamics benchmarks with prediction horizons extending substantially beyond those represented during training, where it consistently reduces error accumulation and improves rollout stability over several deterministic and noise-injection baselines. Overall, these results highlight variational modeling as a complementary approach to robust long-horizon neural PDE dynamics."},{"id":"arxiv:2609.14531","title":"Multi-source conformal prediction: leveraging heterogeneity via localization","short":"MS-RLCP","date":"2026-09-16","rank":6,"category":"general","topic":"可迁移算法","summary":"MS-RLCP 根据测试样本附近的数据支持选择校准来源，适合研究多中心区间预测，但依赖跨来源共享 P(Y|X)，不提供任意中心漂移下的保证。","authors":"Hore, Rohan · Chatterjee, Anirban · Choudhury, Sayantan","firstDate":"2026-09-13","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.14531","codeUrl":"","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>MS-RLCP 根据测试样本附近的数据支持选择校准来源，适合研究多中心区间预测，但依赖跨来源共享 \u003ccode>P(Y|X)\u003c/code>，不提供任意中心漂移下的保证。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Rohan Hore、Anirban Chatterjee、Sayantan Choudhury。v1：2026-09-13 14:08:28 UTC；无修订；预印本。\u003ca href=\"https://arxiv.org/abs/2609.14531\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.14531v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。\u003cstrong>未找到官方代码\u003c/strong>。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>各来源分别训练 score 并留出 calibration set；对随机局部化的测试特征，以训练样本核密度估计选择局部支持最强的来源，再构造该来源的加权 conformal 集合。选择规则使用训练分区，避免直接依照校准标签挑选最有利来源。\u003c/p>\n\u003ch3>创新点与实验边界\u003c/h3>\n\u003cp>理论允许测试特征分布超出简单来源混合，但需要共享条件响应分布、envelope 支持及相应正则性。不是无条件的有限样本逐患者覆盖保证。目标覆盖 90% 时，FMoW 实验实际总体 \u003cstrong>88.59 ± 0.82%\u003c/strong>；MEPS 三个 panel 总体 \u003cstrong>89.4–89.8%\u003c/strong>，其中一个来源仅 \u003cstrong>88.1–88.3%\u003c/strong>。这些数字说明应报告具体亚组不足，不能只写“达到了 90% 校准”。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可为肿瘤变化量或 pCR 预测集合增加跨中心校准层。治疗选择、终点定义或疾病谱导致 \u003ccode>P(Y|X)\u003c/code> 改变时，核心假设可能失效；删失生存不能把未观察到的生存时间直接当连续标签套用。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>固定预测模型，按患者/中心分开 train、calibration、test；比较 pooled split conformal、中心内校准和 MS-RLCP，做留一中心测试。报告总体和逐中心覆盖率、区间宽度、worst-group coverage、校准样本数。带宽只在训练/验证集选择。若低样本中心持续欠覆盖，或仅靠极宽/无界集合达到覆盖，否定实用价值；也须把机制漂移与协变量漂移分别分析。缓存特征上的校准主要是 CPU 工作，复杂度与校准集规模、核计算有关，不需要重新训练生成器。\u003c/p>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>\u003ca href=\"https://arxiv.org/html/2609.14531v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> Algorithm 1、§3–5、Table 1；理论结论按其假设转述，未独立验证全部证明。独立笔记附原始摘要。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Many modern prediction tasks involve data from multiple heterogeneous sources, while the test distribution may differ substantially from any individual source. Although heterogeneity poses challenges, it also offers an opportunity: different sources may provide complementary information, with some regions of the feature space better represented in one source than another. We propose Multi-Source Randomly Localized Conformal Prediction (MS-RLCP), which builds on the local coverage properties of randomly localized conformal prediction (RLCP) (Hore and Barber, 2025) and extends it to multiple sources through data-adaptive source selection. Under the widely adopted assumption of a shared response distribution conditional on the features across sources and the test population, we establish finite-sample coverage bounds using an interpretable notion of envelope distribution that captures their aggregate feature-space representation. Our analysis allows the test feature distribution to be absolutely continuous with respect to the envelope, extending beyond mixtures of source distributions. Under additional regularity conditions, we also establish asymptotic test-conditional coverage. Simulations and real-world experiments demonstrate the effectiveness of MS-RLCP across varying levels of data heterogeneity.\u003c/p>\n","markdown":"### 一句话总结\n\nMS-RLCP 根据测试样本附近的数据支持选择校准来源，适合研究多中心区间预测，但依赖跨来源共享 `P(Y|X)`，不提供任意中心漂移下的保证。\n\n**元数据。** Rohan Hore、Anirban Chatterjee、Sayantan Choudhury。v1：2026-09-13 14:08:28 UTC；无修订；预印本。[原文](https://arxiv.org/abs/2609.14531)；[全文](https://arxiv.org/html/2609.14531v1)。**未找到官方代码**。\n\n### 中文摘要\n\n各来源分别训练 score 并留出 calibration set；对随机局部化的测试特征，以训练样本核密度估计选择局部支持最强的来源，再构造该来源的加权 conformal 集合。选择规则使用训练分区，避免直接依照校准标签挑选最有利来源。\n\n### 创新点与实验边界\n\n理论允许测试特征分布超出简单来源混合，但需要共享条件响应分布、envelope 支持及相应正则性。不是无条件的有限样本逐患者覆盖保证。目标覆盖 90% 时，FMoW 实验实际总体 **88.59 ± 0.82%**；MEPS 三个 panel 总体 **89.4–89.8%**，其中一个来源仅 **88.1–88.3%**。这些数字说明应报告具体亚组不足，不能只写“达到了 90% 校准”。\n\n### 和我方向的适配\n\n**可迁移算法。** 可为肿瘤变化量或 pCR 预测集合增加跨中心校准层。治疗选择、终点定义或疾病谱导致 `P(Y|X)` 改变时，核心假设可能失效；删失生存不能把未观察到的生存时间直接当连续标签套用。\n\n### 可借鉴动作\n\n固定预测模型，按患者/中心分开 train、calibration、test；比较 pooled split conformal、中心内校准和 MS-RLCP，做留一中心测试。报告总体和逐中心覆盖率、区间宽度、worst-group coverage、校准样本数。带宽只在训练/验证集选择。若低样本中心持续欠覆盖，或仅靠极宽/无界集合达到覆盖，否定实用价值；也须把机制漂移与协变量漂移分别分析。缓存特征上的校准主要是 CPU 工作，复杂度与校准集规模、核计算有关，不需要重新训练生成器。\n\n### 原始摘要或 Evidence Source\n\n[v1 全文](https://arxiv.org/html/2609.14531v1) Algorithm 1、§3–5、Table 1；理论结论按其假设转述，未独立验证全部证明。独立笔记附原始摘要。\n\n\n\n## 原始摘要\n\nMany modern prediction tasks involve data from multiple heterogeneous sources, while the test distribution may differ substantially from any individual source. Although heterogeneity poses challenges, it also offers an opportunity: different sources may provide complementary information, with some regions of the feature space better represented in one source than another. We propose Multi-Source Randomly Localized Conformal Prediction (MS-RLCP), which builds on the local coverage properties of randomly localized conformal prediction (RLCP) (Hore and Barber, 2025) and extends it to multiple sources through data-adaptive source selection. Under the widely adopted assumption of a shared response distribution conditional on the features across sources and the test population, we establish finite-sample coverage bounds using an interpretable notion of envelope distribution that captures their aggregate feature-space representation. Our analysis allows the test feature distribution to be absolutely continuous with respect to the envelope, extending beyond mixtures of source distributions. Under additional regularity conditions, we also establish asymptotic test-conditional coverage. Simulations and real-world experiments demonstrate the effectiveness of MS-RLCP across varying levels of data heterogeneity."},{"id":"arxiv:2609.14709","title":"An immune world model for multiscale forecasting and therapeutic hypothesis generation","short":"Immune-World-Model","date":"2026-09-16","rank":7,"category":"medical","topic":"直接相关","summary":"把免疫干预与患者背景分开建模，强调变化量和锁定评估；治疗组合仍是计算提出的假设，尚无新实验或临床疗效验证。","authors":"Cui, Taoyong · Wang, Xi · Li, Zonghang · Ding, Jinchao · You, Lingsen · Xu, Yuzhi · Xu, Wanghan · Wu, Fang · Ying, Kejun · Ouyang, Wanli · Heng, Pheng Ann · Yang, Ling · Yin, Zhenfei · Wu, Yingcheng","firstDate":"2026-09-13","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.14709","codeUrl":"","image":"","imageLabel":"","html":"\u003ch3>一句话总结\u003c/h3>\n\u003cp>把免疫干预与患者背景分开建模，强调变化量和锁定评估；治疗组合仍是计算提出的假设，尚无新实验或临床疗效验证。\u003c/p>\n\u003cp>\u003cstrong>元数据。\u003c/strong> Taoyong Cui、Xi Wang、Zonghang Li、Jinchao Ding、Lingsen You、Yuzhi Xu、Wanghan Xu、Fang Wu、Kejun Ying、Wanli Ouyang、Pheng Ann Heng、Ling Yang、Zhenfei Yin、Yingcheng Wu。v1：2026-09-13 18:06:18 UTC；无修订；预印本。\u003ca href=\"https://arxiv.org/abs/2609.14709\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.14709v1\" target=\"_blank\" rel=\"noopener noreferrer\">全文\u003c/a>。\u003cstrong>未找到官方代码\u003c/strong>；Data and code availability 使用将来时，称之后发布软件与版本化数据清单。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>将细胞状态、组织微环境和患者背景组织为结构化 state，把目标干预作为独立 action，学习 \u003ccode>S_next = F(S, A)\u003c/code>，用 decoder 输出表达变化、程序分数及临床响应相关读数。作者还报告模型搜索、冻结和独立确认流程，但公开配置和划分清单尚待发布，本次未独立审计这些隔离措施。\u003c/p>\n\u003ch3>创新点与实验边界\u003c/h3>\n\u003cp>原始细胞图谱约一千万细胞，但只有 \u003cstrong>12 名供者\u003c/strong>；细胞数不等于患者样本量。Figure 3 的平均 gene-delta cosine 中，模型与 \u003cstrong>condition-mean 均为 0.46\u003c/strong>，不能声称所有基线都被超越。抗 PD-1 的 all-cell state LOO AUC 为 \u003cstrong>0.92，95% CI 0.79–1.00\u003c/strong>，并非生成未来状态优于同输入直接预测的充分证据。23 个未见组合中 19 个改善；所谓跨尺度 rollout 包含示例，全文仍把队列级递归验证列为未来工作。研究使用公开既有数据，没有新增湿实验，IL-36gamma + SIRPalpha inhibition 只是待验证假设。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关于治疗条件下的生物状态建模；对 MRI/CT 模块属于外围启发。\u003c/strong> 值得借鉴干预与既往治疗分离、变化量而非绝对状态评价，以及在模型选择后锁定测试集。组织层表示主要来自组学/免疫上下文，不是 CT-to-WSI 生成，也未证明组织切片形态预测。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在同一患者划分上，比较临床直接预测、真实影像/组学联合直接预测、预测未来状态辅助模型；匹配输入、容量与训练预算，单独加入 condition-mean 与置换背景对照。以供者/患者为统计单位，评估变化量、pCR/response 的 AUROC/AUPRC/Brier 和中心外表现；假如生成辅助不优于直接模型，或收益依赖反复筛选测试集，就不支持临床增益。计算组合预测不自动识别治疗因果效应，仍需一致性、可交换性、positivity、清晰干预定义及缺失/删失假设。先做缓存特征小头是单卡估计；完整 AI Scientist/组学流程总算力未核实。\u003c/p>\n\u003ch3>原始摘要或 Evidence Source\u003c/h3>\n\u003cp>\u003ca href=\"https://arxiv.org/html/2609.14709v1\" target=\"_blank\" rel=\"noopener noreferrer\">v1 全文\u003c/a> Figures 2–4、Methods、Discussion、Resource availability；独立笔记附原始摘要。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Immune therapies act across cell-intrinsic programs, tissue ecosystems, and patient-specific immune states, yet most predictors address these scales separately. We used a governed evolutionary AI Scientist to construct the Immune World Model, an action-conditioned model that learns how interventions move immune states across cellular, tissue, and individual levels. The Immune World Model--building Scientist searched candidate architectures and workflows, and the resulting world model was frozen before independent confirmation. The frozen model generalized to unseen interventions and biological contexts, recovered intervention-specific cellular programs, integrated cell and tissue information to improve ecosystem and patient-response prediction, and forecast unseen perturbation combinations. Immune World Model--guided analysis then combined measured perturbations with cross-axis inference to nominate IL-36$\\gamma$ plus SIRP$\\alpha$ inhibition as a complementary-axis therapeutic hypothesis, whereas a governed self-correction audit rejected every screened cytokine pair. The Immune World Model provides a framework for multiscale immune simulation that connects AI Scientist-driven model construction, intervention forecasting, and the generation of prospectively testable therapeutic hypotheses.\u003c/p>\n","markdown":"### 一句话总结\n\n把免疫干预与患者背景分开建模，强调变化量和锁定评估；治疗组合仍是计算提出的假设，尚无新实验或临床疗效验证。\n\n**元数据。** Taoyong Cui、Xi Wang、Zonghang Li、Jinchao Ding、Lingsen You、Yuzhi Xu、Wanghan Xu、Fang Wu、Kejun Ying、Wanli Ouyang、Pheng Ann Heng、Ling Yang、Zhenfei Yin、Yingcheng Wu。v1：2026-09-13 18:06:18 UTC；无修订；预印本。[原文](https://arxiv.org/abs/2609.14709)；[全文](https://arxiv.org/html/2609.14709v1)。**未找到官方代码**；Data and code availability 使用将来时，称之后发布软件与版本化数据清单。\n\n### 中文摘要\n\n将细胞状态、组织微环境和患者背景组织为结构化 state，把目标干预作为独立 action，学习 `S_next = F(S, A)`，用 decoder 输出表达变化、程序分数及临床响应相关读数。作者还报告模型搜索、冻结和独立确认流程，但公开配置和划分清单尚待发布，本次未独立审计这些隔离措施。\n\n### 创新点与实验边界\n\n原始细胞图谱约一千万细胞，但只有 **12 名供者**；细胞数不等于患者样本量。Figure 3 的平均 gene-delta cosine 中，模型与 **condition-mean 均为 0.46**，不能声称所有基线都被超越。抗 PD-1 的 all-cell state LOO AUC 为 **0.92，95% CI 0.79–1.00**，并非生成未来状态优于同输入直接预测的充分证据。23 个未见组合中 19 个改善；所谓跨尺度 rollout 包含示例，全文仍把队列级递归验证列为未来工作。研究使用公开既有数据，没有新增湿实验，IL-36gamma + SIRPalpha inhibition 只是待验证假设。\n\n### 和我方向的适配\n\n**直接相关于治疗条件下的生物状态建模；对 MRI/CT 模块属于外围启发。** 值得借鉴干预与既往治疗分离、变化量而非绝对状态评价，以及在模型选择后锁定测试集。组织层表示主要来自组学/免疫上下文，不是 CT-to-WSI 生成，也未证明组织切片形态预测。\n\n### 可借鉴动作\n\n在同一患者划分上，比较临床直接预测、真实影像/组学联合直接预测、预测未来状态辅助模型；匹配输入、容量与训练预算，单独加入 condition-mean 与置换背景对照。以供者/患者为统计单位，评估变化量、pCR/response 的 AUROC/AUPRC/Brier 和中心外表现；假如生成辅助不优于直接模型，或收益依赖反复筛选测试集，就不支持临床增益。计算组合预测不自动识别治疗因果效应，仍需一致性、可交换性、positivity、清晰干预定义及缺失/删失假设。先做缓存特征小头是单卡估计；完整 AI Scientist/组学流程总算力未核实。\n\n### 原始摘要或 Evidence Source\n\n[v1 全文](https://arxiv.org/html/2609.14709v1) Figures 2–4、Methods、Discussion、Resource availability；独立笔记附原始摘要。\n\n\n\n## 原始摘要\n\nImmune therapies act across cell-intrinsic programs, tissue ecosystems, and patient-specific immune states, yet most predictors address these scales separately. We used a governed evolutionary AI Scientist to construct the Immune World Model, an action-conditioned model that learns how interventions move immune states across cellular, tissue, and individual levels. The Immune World Model--building Scientist searched candidate architectures and workflows, and the resulting world model was frozen before independent confirmation. The frozen model generalized to unseen interventions and biological contexts, recovered intervention-specific cellular programs, integrated cell and tissue information to improve ecosystem and patient-response prediction, and forecast unseen perturbation combinations. Immune World Model--guided analysis then combined measured perturbations with cross-axis inference to nominate IL-36$\\gamma$ plus SIRP$\\alpha$ inhibition as a complementary-axis therapeutic hypothesis, whereas a governed self-correction audit rejected every screened cytokine pair. The Immune World Model provides a framework for multiscale immune simulation that connects AI Scientist-driven model construction, intervention forecasting, and the generation of prospectively testable therapeutic hypotheses."},{"id":"arxiv:2609.17728","title":"RAF-VLA: Representation Alignment with the Future for End-to-End Autonomous Driving","short":"RAF-VLA","date":"2026-09-17","rank":1,"category":"general","topic":"可迁移算法","summary":"用训练期的未来图像特征监督当前决策表征，可以获得一部分世界模型收益；这为判断医学未来生成的增量价值提供了关键对照。","authors":"Kim, Dogun · Lee, Yongjae · Lim, Joonhee · Lee, Yeina · Park, Junhyeok · Park, Moogeun · Kum, Dongsuk","firstDate":"2026-09-15","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.17728","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Dogun Kim, Yongjae Lee, Joonhee Lim, Yeina Lee, Junhyeok Park, Moogeun Park, Dongsuk Kum。\u003c/p>\n\u003cp>原文：\u003ca href=\"https://arxiv.org/abs/2609.17728\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.17728\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.17728v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML 全文\u003c/a>。首次公开口径：v1 提交于 \u003cstrong>2026-09-15 18:39:00 UTC\u003c/strong>；最新版本 v1，无修订记录。状态：预印本，未核实正式接受。\u003cstrong>未找到官方代码\u003c/strong>。证据范围：已读方法、消融和主要实验，未复现。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>用训练期的未来图像特征监督当前决策表征，可以获得一部分世界模型收益；这为判断医学未来生成的增量价值提供了关键对照。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>面向自动驾驶，现有 world-modeling VLA 同时生成未来画面和动作，以未来画面提供密集监督。RAF-VLA 在 Qwen2.5-VL 7B 视觉语言专家和动作专家之间引入按未来时距组织的 world queries，用冻结 Cosmos 编码器提取真实未来帧特征，监督当前输入下的预测表征。未来帧仅用于训练监督，推理时保留 world queries，移除教师和投影监督分支。随后可做 GRPO 强化微调。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>最接近的比较是显式生成未来画面的 VLA，以及仅训练动作的相同架构。变化在于把未来监督作用在内部特征上，简化为 \u003ccode>L = L_action + lambda * mean_h ||f(I_future,h) - g(Z_h)||^2\u003c/code>。默认 \u003ccode>lambda=1\u003c/code>，采用 1 秒和 4 秒两个目标时距，每个时距 4 个 queries，并限制时距之间的注意力方向。增加更多时距或 queries 并未继续改善论文中的消融结果。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>论文 Table III 中，SFT 的 PDMS 从 \u003cstrong>87.92 到 89.13\u003c/strong>；强化微调后从 \u003cstrong>88.85 到 90.03\u003c/strong>。同一消融报告训练时间 10.56 到 10.96 小时，使用 4 张 H200，即约 42.2 到 43.8 GPU 小时，包含在线提取教师特征；单张 H200、batch 1 的推理延迟从 0.152 到 0.153 秒。\u003c/p>\n\u003cp>作者据此主张未来对齐以较小额外开销提高规划表现。我的判断是，这支持“未来特征监督值得作为便宜的强基线”，但仍未完全隔离损失的作用：\u003cstrong>去掉对齐的消融同时去掉了 world queries\u003c/strong>，参数和内部计算也有变化。主表的 94.2 使用 best-of-N，不能与约 90.0 的标准单次推理混用；跨论文方法的预训练和训练预算并不统一。道路规划成绩不能直接推出 pCR 或生存预测收益。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法，优先级最高。\u003c/strong> 可迁移的是“当前历史编码器 + 按临床时距查询 + 训练期未来教师特征”模块。治疗、截至 landmark 的历史 MRI/CT、已知临床信息和时间间隔进入预测器；真实未来影像只作为训练标签。冻结医学编码器的目标应尽可能保留病灶变化，必要时分别比较全图与病灶区域特征。\u003c/p>\n\u003cp>医学数据需要患者内配对的后续检查、明确的治疗开始与检查时间、可核查的结局和划分。驾驶的密集规则帧不能替代稀疏、不规则、因临床状态而安排的复查；治疗条件相关性也不具备随机干预的因果解释。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>最小实验只改潜状态预测器的辅助目标，先固定同一医学编码器。比较五组：直接 pCR/OS；直接预测加相同 world queries 但无对齐；当前状态特征对齐；未来状态特征对齐；未来 latent Flow Matching 辅助训练。全部使用相同预测时点输入、训练患者和未来监督可用性，控制参数规模、超参选择次数及总训练预算。教师不得接触测试患者训练信息。\u003c/p>\n\u003cp>分开报告未来病灶体积/增强变化误差、患者特异变化相对“复制最近观测”和趋势外推的改善、pCR AUROC/AUPRC/Brier，以及固定 landmark 的生存 C-index、时间依赖 Brier 和有效事件数。OS 必须处理删失并报告相应假设。患者级划分，另做中心留出；特征 MSE 降低不能替代临床价值。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：未来对齐不优于同 queries 对照，或优势在匹配预算后消失，则该辅助目标价值不足；未来对齐已匹配生成模型的下游成绩，则削弱“必须生成才能获得临床增益”的假设。算力：原论文成本见上述 Table III；医学最小实验若缓存冻结特征、小型预测器训练，估计可用单 GPU，依据是省去 3D 编码器反传，具体显存与时长需按潜变量尺寸实测。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Recent Vision-Language-Action (VLA) models for autonomous driving have incorporated world modeling by predicting future driving scenes alongside driving actions, demonstrating strong planning performance. Future driving scenes are utilized as dense supervision, encouraging the policy to learn rich internal representations useful for planning. However, these World-Modeling VLAs rely on explicit future generation to learn such representations, thereby introducing two key limitations: additional training burden and inference latency. To address these limitations, we propose RAF-VLA (Representation Alignment with the Future), a VLA-based autonomous driving framework that shapes planning-relevant internal representations through direct guidance from future-frame representations. RAF-VLA employs Future-Aligned Supervised Fine-Tuning, in which a straightforward regularization aligns the policy&#39;s hidden states with future-frame representations obtained from a pretrained world encoder while learning driving actions. This simple alignment allows RAF-VLA to avoid the training burden and inference latency associated with future generation. Extensive experiments on the NAVSIM benchmark show that RAF-VLA achieves competitive planning performance against state-of-the-art VLA planners with substantially fewer training samples seen. Moreover, RAF-VLA incurs only 3.8% training overhead and a negligible 1 ms inference overhead.\u003c/p>\n","markdown":"作者：Dogun Kim, Yongjae Lee, Joonhee Lim, Yeina Lee, Junhyeok Park, Moogeun Park, Dongsuk Kum。\n\n原文：[arXiv:2609.17728](https://arxiv.org/abs/2609.17728)；[HTML 全文](https://arxiv.org/html/2609.17728v1)。首次公开口径：v1 提交于 **2026-09-15 18:39:00 UTC**；最新版本 v1，无修订记录。状态：预印本，未核实正式接受。**未找到官方代码**。证据范围：已读方法、消融和主要实验，未复现。\n\n### 一句话总结\n\n用训练期的未来图像特征监督当前决策表征，可以获得一部分世界模型收益；这为判断医学未来生成的增量价值提供了关键对照。\n\n### 中文摘要\n\n面向自动驾驶，现有 world-modeling VLA 同时生成未来画面和动作，以未来画面提供密集监督。RAF-VLA 在 Qwen2.5-VL 7B 视觉语言专家和动作专家之间引入按未来时距组织的 world queries，用冻结 Cosmos 编码器提取真实未来帧特征，监督当前输入下的预测表征。未来帧仅用于训练监督，推理时保留 world queries，移除教师和投影监督分支。随后可做 GRPO 强化微调。\n\n### 创新点\n\n最接近的比较是显式生成未来画面的 VLA，以及仅训练动作的相同架构。变化在于把未来监督作用在内部特征上，简化为 `L = L_action + lambda * mean_h ||f(I_future,h) - g(Z_h)||^2`。默认 `lambda=1`，采用 1 秒和 4 秒两个目标时距，每个时距 4 个 queries，并限制时距之间的注意力方向。增加更多时距或 queries 并未继续改善论文中的消融结果。\n\n### 实验支持与局限\n\n论文 Table III 中，SFT 的 PDMS 从 **87.92 到 89.13**；强化微调后从 **88.85 到 90.03**。同一消融报告训练时间 10.56 到 10.96 小时，使用 4 张 H200，即约 42.2 到 43.8 GPU 小时，包含在线提取教师特征；单张 H200、batch 1 的推理延迟从 0.152 到 0.153 秒。\n\n作者据此主张未来对齐以较小额外开销提高规划表现。我的判断是，这支持“未来特征监督值得作为便宜的强基线”，但仍未完全隔离损失的作用：**去掉对齐的消融同时去掉了 world queries**，参数和内部计算也有变化。主表的 94.2 使用 best-of-N，不能与约 90.0 的标准单次推理混用；跨论文方法的预训练和训练预算并不统一。道路规划成绩不能直接推出 pCR 或生存预测收益。\n\n### 和我方向的适配\n\n**可迁移算法，优先级最高。** 可迁移的是“当前历史编码器 + 按临床时距查询 + 训练期未来教师特征”模块。治疗、截至 landmark 的历史 MRI/CT、已知临床信息和时间间隔进入预测器；真实未来影像只作为训练标签。冻结医学编码器的目标应尽可能保留病灶变化，必要时分别比较全图与病灶区域特征。\n\n医学数据需要患者内配对的后续检查、明确的治疗开始与检查时间、可核查的结局和划分。驾驶的密集规则帧不能替代稀疏、不规则、因临床状态而安排的复查；治疗条件相关性也不具备随机干预的因果解释。\n\n### 可借鉴动作\n\n最小实验只改潜状态预测器的辅助目标，先固定同一医学编码器。比较五组：直接 pCR/OS；直接预测加相同 world queries 但无对齐；当前状态特征对齐；未来状态特征对齐；未来 latent Flow Matching 辅助训练。全部使用相同预测时点输入、训练患者和未来监督可用性，控制参数规模、超参选择次数及总训练预算。教师不得接触测试患者训练信息。\n\n分开报告未来病灶体积/增强变化误差、患者特异变化相对“复制最近观测”和趋势外推的改善、pCR AUROC/AUPRC/Brier，以及固定 landmark 的生存 C-index、时间依赖 Brier 和有效事件数。OS 必须处理删失并报告相应假设。患者级划分，另做中心留出；特征 MSE 降低不能替代临床价值。\n\n**否证结果**：未来对齐不优于同 queries 对照，或优势在匹配预算后消失，则该辅助目标价值不足；未来对齐已匹配生成模型的下游成绩，则削弱“必须生成才能获得临床增益”的假设。算力：原论文成本见上述 Table III；医学最小实验若缓存冻结特征、小型预测器训练，估计可用单 GPU，依据是省去 3D 编码器反传，具体显存与时长需按潜变量尺寸实测。\n\n\n\n## 原始摘要\n\nRecent Vision-Language-Action (VLA) models for autonomous driving have incorporated world modeling by predicting future driving scenes alongside driving actions, demonstrating strong planning performance. Future driving scenes are utilized as dense supervision, encouraging the policy to learn rich internal representations useful for planning. However, these World-Modeling VLAs rely on explicit future generation to learn such representations, thereby introducing two key limitations: additional training burden and inference latency. To address these limitations, we propose RAF-VLA (Representation Alignment with the Future), a VLA-based autonomous driving framework that shapes planning-relevant internal representations through direct guidance from future-frame representations. RAF-VLA employs Future-Aligned Supervised Fine-Tuning, in which a straightforward regularization aligns the policy's hidden states with future-frame representations obtained from a pretrained world encoder while learning driving actions. This simple alignment allows RAF-VLA to avoid the training burden and inference latency associated with future generation. Extensive experiments on the NAVSIM benchmark show that RAF-VLA achieves competitive planning performance against state-of-the-art VLA planners with substantially fewer training samples seen. Moreover, RAF-VLA incurs only 3.8% training overhead and a negligible 1 ms inference overhead."},{"id":"arxiv:2609.18488","title":"Beyond Random Couplings: Contrastive Noise Alignment in Generative Flows","short":"CNA","date":"2026-09-17","rank":2,"category":"general","topic":"可迁移算法","summary":"除了重新配对固定噪声和数据，还可以直接优化训练噪声的位置；少步生成收益值得测试，但条件先验是否仍匹配是医学迁移的首要问题。","authors":"Wittke, Lennart · Azevedo, Vinicius","firstDate":"2026-09-16","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.18488","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Lennart Wittke, Vinicius Azevedo。\u003c/p>\n\u003cp>原文：\u003ca href=\"https://arxiv.org/abs/2609.18488\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.18488\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.18488v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML 全文\u003c/a>。v1 提交：\u003cstrong>2026-09-16 11:21:31 UTC\u003c/strong>；最新 v1，无修订记录。状态：预印本，未核实正式接受。\u003cstrong>未找到官方代码\u003c/strong>；搜索到的同名 Noise-Contrastive-Alignment 语言模型仓库属于另一篇论文，不作为本文代码。证据：已读方法、实验与实现附录。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>除了重新配对固定噪声和数据，还可以直接优化训练噪声的位置；少步生成收益值得测试，但条件先验是否仍匹配是医学迁移的首要问题。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>独立噪声耦合会形成难学的传输路径，minibatch OT 通过重分配固定噪声缓解这一问题。CNA 将一个 batch 的噪声视为可移动粒子，保持目标分配后，用对比目标把粒子向其配对数据的方向对齐，再用角度排斥和径向约束避免塌缩。优化后的噪声与目标进入常规 Flow Matching；推理仍从标准高斯采样，不运行这个内层优化。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>变化在于优化耦合的噪声端，而不只优化排列。内层目标可概括为 \u003ccode>InfoNCE(noise, target) + beta * angular_repulsion + lambda * ||noise||^2\u003c/code>。实现使用 4 步 Adam、学习率 0.02、温度 0.01，且可从 OT 配对初始化。论文给出高维、较大 batch 和较强排斥极限下保持高斯投影结构的分析；高斯性推论采用 \u003ccode>lambda=0\u003c/code>，实际离散优化却需要径向正则。\u003cstrong>这不是有限 batch 下严格保持条件标准高斯的证明。\u003c/strong>\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>在 CIFAR-10、4 NFE 下，FID 分别为独立 CFM \u003cstrong>54.39\u003c/strong>、OT-CFM \u003cstrong>30.00\u003c/strong>、CNA \u003cstrong>28.87\u003c/strong>、CNA+OT（beta=2）\u003cstrong>22.64\u003c/strong>。2 NFE 下相应为 175.91、91.75、87.39、56.40。少步表现支持进一步筛查组合方法。\u003c/p>\n\u003cp>不能沿用正文中“所有预算都优于”的宽泛说法：CIFAR-10 的 128 NFE 下，CNA+OT（beta=2）FID \u003cstrong>5.25\u003c/strong>，逊于 OT 的 \u003cstrong>4.36\u003c/strong>；调整 beta=5 后为 4.06。ImageNet32 的 4 NFE 下，单独 CNA \u003cstrong>39.93\u003c/strong> 也逊于 OT \u003cstrong>36.95\u003c/strong>，组合 beta=5 为 26.86。收益依赖耦合初始化、超参和采样预算。实验是无条件 32×32 自然图像，未提供医学条件生成、患者特异预测或临床校准证据。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可以替换 latent FM 训练中“采噪声并构造插值”这一处，先固定 VQGAN/其他编码器。患者的历史、治疗和未来目标必须保持正确配对，不能用跨患者 OT 重分配未来标签。即使总体噪声看似高斯，也要检查 \u003ccode>p(noise | history, treatment)\u003c/code>：训练噪声若携带推理时不可得的目标信息，有限样本条件模型可能学到不匹配的源分布。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>先在已知真分布的条件混合高斯任务检查概率覆盖和模态保留，再在缓存医学潜空间比较独立噪声、OT、CNA、CNA+OT。只调整噪声，不打乱患者条件与未来标签；所有方法计入噪声优化及超参搜索的总成本。采样统一评估 1/2/4/16/64 NFE，同时记录实际延迟。\u003c/p>\n\u003cp>指标包括条件噪声均值/协方差与条件依赖诊断、energy score/可适用的 CRPS、覆盖率、模态覆盖、病灶变化误差及相对复制基线的增益。图像质量单独报告；只有状态预测确有改善后，才考察同输入预算的 pCR/OS 增量。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：低 NFE 视觉指标改善却损害覆盖或病灶变化预测，收益在高 NFE 或预算匹配下消失，均不足以支持医学采用。原实验 CIFAR-10 使用单 RTX 4090，ImageNet32 使用 8 张 RTX 4090；作者报告的约 2% 内层开销仅适用于原配置。对比项存在 batch 两两计算，医学 3D 潜空间开销不能直接沿用该比例。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Diffusion and flow-matching models are typically trained by corrupting data through independently sampled Gaussian noise. While simple and scalable, this forward process induces arbitrary data-noise couplings, forcing the network to learn high-curvature transports between unrelated endpoints. Existing optimal-transport methods reduce this burden by reassigning fixed noise samples to data, but the source noise distribution itself remains passive. To address this, we introduce Contrastive Noise Alignment (CNA), a training-time method that creates dynamic, contrastive couplings by optimizing the noise representations directly. By modeling the noise batch as an interacting particle system, CNA employs a cross-modal InfoNCE objective to align noise particles with their paired data targets. To prevent spatial collapse, this alignment is regularized using an angular entropy term and a radial norm penalty. We show theoretically that this equilibrium asymptotically preserves Gaussian structures, maintaining tractability during inference. Empirically, CNA improves the alignment between noise and data, reduces flow curvature, and provides better generation quality with fewer required sampling steps. For few-step, pixel-space generation (2-4 NFEs), CNA reduces FID by over 50% compared to standard rectified flow, and by at least 24% against Optimal Transport baselines.\u003c/p>\n","markdown":"作者：Lennart Wittke, Vinicius Azevedo。\n\n原文：[arXiv:2609.18488](https://arxiv.org/abs/2609.18488)；[HTML 全文](https://arxiv.org/html/2609.18488v1)。v1 提交：**2026-09-16 11:21:31 UTC**；最新 v1，无修订记录。状态：预印本，未核实正式接受。**未找到官方代码**；搜索到的同名 Noise-Contrastive-Alignment 语言模型仓库属于另一篇论文，不作为本文代码。证据：已读方法、实验与实现附录。\n\n### 一句话总结\n\n除了重新配对固定噪声和数据，还可以直接优化训练噪声的位置；少步生成收益值得测试，但条件先验是否仍匹配是医学迁移的首要问题。\n\n### 中文摘要\n\n独立噪声耦合会形成难学的传输路径，minibatch OT 通过重分配固定噪声缓解这一问题。CNA 将一个 batch 的噪声视为可移动粒子，保持目标分配后，用对比目标把粒子向其配对数据的方向对齐，再用角度排斥和径向约束避免塌缩。优化后的噪声与目标进入常规 Flow Matching；推理仍从标准高斯采样，不运行这个内层优化。\n\n### 创新点\n\n变化在于优化耦合的噪声端，而不只优化排列。内层目标可概括为 `InfoNCE(noise, target) + beta * angular_repulsion + lambda * ||noise||^2`。实现使用 4 步 Adam、学习率 0.02、温度 0.01，且可从 OT 配对初始化。论文给出高维、较大 batch 和较强排斥极限下保持高斯投影结构的分析；高斯性推论采用 `lambda=0`，实际离散优化却需要径向正则。**这不是有限 batch 下严格保持条件标准高斯的证明。**\n\n### 实验支持与局限\n\n在 CIFAR-10、4 NFE 下，FID 分别为独立 CFM **54.39**、OT-CFM **30.00**、CNA **28.87**、CNA+OT（beta=2）**22.64**。2 NFE 下相应为 175.91、91.75、87.39、56.40。少步表现支持进一步筛查组合方法。\n\n不能沿用正文中“所有预算都优于”的宽泛说法：CIFAR-10 的 128 NFE 下，CNA+OT（beta=2）FID **5.25**，逊于 OT 的 **4.36**；调整 beta=5 后为 4.06。ImageNet32 的 4 NFE 下，单独 CNA **39.93** 也逊于 OT **36.95**，组合 beta=5 为 26.86。收益依赖耦合初始化、超参和采样预算。实验是无条件 32×32 自然图像，未提供医学条件生成、患者特异预测或临床校准证据。\n\n### 和我方向的适配\n\n**可迁移算法。** 可以替换 latent FM 训练中“采噪声并构造插值”这一处，先固定 VQGAN/其他编码器。患者的历史、治疗和未来目标必须保持正确配对，不能用跨患者 OT 重分配未来标签。即使总体噪声看似高斯，也要检查 `p(noise | history, treatment)`：训练噪声若携带推理时不可得的目标信息，有限样本条件模型可能学到不匹配的源分布。\n\n### 可借鉴动作\n\n先在已知真分布的条件混合高斯任务检查概率覆盖和模态保留，再在缓存医学潜空间比较独立噪声、OT、CNA、CNA+OT。只调整噪声，不打乱患者条件与未来标签；所有方法计入噪声优化及超参搜索的总成本。采样统一评估 1/2/4/16/64 NFE，同时记录实际延迟。\n\n指标包括条件噪声均值/协方差与条件依赖诊断、energy score/可适用的 CRPS、覆盖率、模态覆盖、病灶变化误差及相对复制基线的增益。图像质量单独报告；只有状态预测确有改善后，才考察同输入预算的 pCR/OS 增量。\n\n**否证结果**：低 NFE 视觉指标改善却损害覆盖或病灶变化预测，收益在高 NFE 或预算匹配下消失，均不足以支持医学采用。原实验 CIFAR-10 使用单 RTX 4090，ImageNet32 使用 8 张 RTX 4090；作者报告的约 2% 内层开销仅适用于原配置。对比项存在 batch 两两计算，医学 3D 潜空间开销不能直接沿用该比例。\n\n\n\n## 原始摘要\n\nDiffusion and flow-matching models are typically trained by corrupting data through independently sampled Gaussian noise. While simple and scalable, this forward process induces arbitrary data-noise couplings, forcing the network to learn high-curvature transports between unrelated endpoints. Existing optimal-transport methods reduce this burden by reassigning fixed noise samples to data, but the source noise distribution itself remains passive. To address this, we introduce Contrastive Noise Alignment (CNA), a training-time method that creates dynamic, contrastive couplings by optimizing the noise representations directly. By modeling the noise batch as an interacting particle system, CNA employs a cross-modal InfoNCE objective to align noise particles with their paired data targets. To prevent spatial collapse, this alignment is regularized using an angular entropy term and a radial norm penalty. We show theoretically that this equilibrium asymptotically preserves Gaussian structures, maintaining tractability during inference. Empirically, CNA improves the alignment between noise and data, reduces flow curvature, and provides better generation quality with fewer required sampling steps. For few-step, pixel-space generation (2-4 NFEs), CNA reduces FID by over 50\\% compared to standard rectified flow, and by at least 24\\% against Optimal Transport baselines."},{"id":"arxiv:2609.16551","title":"Which Pretext Task Transfers? Self-Supervised Pretraining Objectives for Lung Ultrasound","short":"LUSVideoSSL","date":"2026-09-17","rank":3,"category":"medical","topic":"直接相关","summary":"相同骨干和预训练条件下，JEPA/MAE 在一个医学测试集的优势，并未延续到外部队列；表征目标应依据外部临床效用选择。","authors":"Heidari, Moein · Rao, Junbo · Choraria, Jai · Chen, Wenjin · Foran, David J. · Hacihaliloglu, Ilker","firstDate":"2026-09-15","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.16551","codeUrl":"https://github.com/moeinheidari7829/LUSVideoSSL","image":"","imageLabel":"","html":"\u003cp>作者：Moein Heidari, Junbo Rao, Jai Choraria, Wenjin Chen, David J. Foran, Ilker Hacihaliloglu。\u003c/p>\n\u003cp>原文：\u003ca href=\"https://arxiv.org/abs/2609.16551\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.16551\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.16551v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML 全文\u003c/a>。v1 提交：\u003cstrong>2026-09-15 02:48:45 UTC\u003c/strong>，以原页记录为准；最新 v1，无修订记录。状态：预印本，注明 \u003cstrong>Submitted to SPIE 2027\u003c/strong>，不是已接受。官方代码：\u003ca href=\"https://github.com/moeinheidari7829/LUSVideoSSL\" target=\"_blank\" rel=\"noopener noreferrer\">LUSVideoSSL\u003c/a>。已核查 VideoMAE、V-JEPA、数据清单和 probe 相关实现文件；未找到独立 MoCo 实现目录，不能声称三种方法均已完整复现。代码未执行。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>相同骨干和预训练条件下，JEPA/MAE 在一个医学测试集的优势，并未延续到外部队列；表征目标应依据外部临床效用选择。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>论文比较三类肺超声视频自监督任务：MoCo v3 风格对比学习、VideoMAE 像素重建、V-JEPA 潜空间预测。三者从随机初始化开始，共用 ViT-S/16、16 帧输入、tubelet 2、COVID-BLUeS 预训练数据与优化日程。冻结编码器后，在 POCUS 做患者级五折 probe 训练与测试，同时在从未参与预训练或 probe 拟合的 Mendeley-Uganda 外部集评估。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>贡献主要是受控比较，而非新的目标函数：MoCo 比较同视频增强视图的 InfoNCE；VideoMAE 以 90% tube masking 做像素 MSE；V-JEPA 使用 EMA 教师、stop-gradient 与潜特征 L1。比起使用不同数据和骨干的跨论文分数比较，这个设计更能反映目标选择的影响，但相同 epoch 不保证相同 FLOPs。\u003c/p>\n\u003ch3>实验支持与局限\u003c/h3>\n\u003cp>100% 标签、线性 probe 的 balanced accuracy 如下：\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方法\u003c/th>\u003cth>POCUS\u003c/th>\u003cth>外部 Mendeley-Uganda\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MoCo\u003c/td>\u003ctd>42.1 ± 1.2\u003c/td>\u003ctd>\u003cstrong>62.7 ± 1.0\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VideoMAE\u003c/td>\u003ctd>\u003cstrong>66.5 ± 13.1\u003c/strong>\u003c/td>\u003ctd>53.8 ± 2.8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>V-JEPA\u003c/td>\u003ctd>65.4 ± 11.7\u003c/td>\u003ctd>35.1 ± 4.9\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>作者将其解释为域内 probe 排名不能预测外部迁移。这个结果支持增加中心留出评估，\u003cstrong>不支持“JEPA 普遍不适合医学”\u003c/strong>：论文是单骨干、小规模、三类诊断的初步实验。外部五次评估使用同一个外部队列和五个 POCUS fold 训练的 probe，不是五个独立外部中心，也不是五次独立预训练。文中表征层面的机制分析仍属计划，尚未证实排名反转是由塌缩或某种特征选择导致。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>直接相关于医学小样本表征选择和跨中心评价，但不是肿瘤纵向生成论文。\u003c/strong> 可迁移的是固定 backbone、数据、probe 和患者划分来比较预训练目标的实验结构。超声视频帧之间的快速变化不等同于数周治疗后的病灶演化，不能把连续视频片段直接当成治疗轨迹。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>先在同一 MRI/CT 编码器上比较对比学习、遮挡重建和未来潜特征预测，固定患者训练集与验证预算。额外记录各目标的实际 FLOPs/显存/时长，设置相同总算力的次级比较。以患者为单位抽取 5%/10%/50%/100% 标签，先做冻结 probe，避免每个目标各自调一个更强的下游模型。若事件数不足，不强行在每个小标签比例上估计 OS。\u003c/p>\n\u003cp>评价中心留出的 pCR AUROC/AUPRC、Brier、校准，以及病灶变化预测；报告患者 bootstrap 区间和事件数。加入仅监督的直接预测对照。\u003cstrong>否证结果\u003c/strong>：JEPA 只在内部队列上提升而在外部队列上不优或失效，则不能据此声称生成表征具有可泛化的临床价值。\u003c/p>\n\u003cp>算力：仓库说明包含 100 epochs 预训练设置，但论文未给出可核实硬件和 GPU 小时；小骨干/降采样的初步比较估计可单 GPU，完整 3D 训练成本必须另测，不能套用超声结果。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>Self-supervised learning (SSL) can reduce the need for labelled medical images, but the choice of pretext objective remains unclear for lung ultrasound (LUS). Contrastive learning, masked reconstruction, and joint-embedding predictive architectures (JEPA) differ in the space in which their targets are defined, yet existing ultrasound studies compare them under different corpora, backbones, and evaluation protocols. We compare these three objective families using the same encoder backbone, pretraining corpus, optimisation schedule, and frozen-evaluation protocol. Encoders are pretrained on COVID-BLUeS LUS videos and evaluated with linear, $k$NN, and attentive probes at 5%, 10%, 50%, and 100% label budgets. Evaluation is performed on POCUS using patient-level five-fold cross-validation and on the independently acquired Mendeley-Uganda dataset, which is excluded from both pretraining and probe fitting. At the full label budget under linear probing, VideoMAE and V-JEPA achieve $66.5 \\pm 13.1$ and $65.4 \\pm 11.7$ balanced accuracy on POCUS, while MoCo achieves $42.1 \\pm 1.2$. On Mendeley-Uganda, the ranking reverses: MoCo performs best at $62.7 \\pm 1.0$, followed by VideoMAE at $53.8 \\pm 2.8$, while V-JEPA falls near chance at $35.1 \\pm 4.9$. These results show that POCUS probe accuracy alone does not identify the objective that transfers best across datasets. We also outline planned representation-level analyses to examine this reversal. Code is publicly available at \u003ca href=\"https://github.com/moeinheidari7829/LUSVideoSSL\" target=\"_blank\" rel=\"noopener noreferrer\">https://github.com/moeinheidari7829/LUSVideoSSL\u003c/a>.\u003c/p>\n","markdown":"作者：Moein Heidari, Junbo Rao, Jai Choraria, Wenjin Chen, David J. Foran, Ilker Hacihaliloglu。\n\n原文：[arXiv:2609.16551](https://arxiv.org/abs/2609.16551)；[HTML 全文](https://arxiv.org/html/2609.16551v1)。v1 提交：**2026-09-15 02:48:45 UTC**，以原页记录为准；最新 v1，无修订记录。状态：预印本，注明 **Submitted to SPIE 2027**，不是已接受。官方代码：[LUSVideoSSL](https://github.com/moeinheidari7829/LUSVideoSSL)。已核查 VideoMAE、V-JEPA、数据清单和 probe 相关实现文件；未找到独立 MoCo 实现目录，不能声称三种方法均已完整复现。代码未执行。\n\n### 一句话总结\n\n相同骨干和预训练条件下，JEPA/MAE 在一个医学测试集的优势，并未延续到外部队列；表征目标应依据外部临床效用选择。\n\n### 中文摘要\n\n论文比较三类肺超声视频自监督任务：MoCo v3 风格对比学习、VideoMAE 像素重建、V-JEPA 潜空间预测。三者从随机初始化开始，共用 ViT-S/16、16 帧输入、tubelet 2、COVID-BLUeS 预训练数据与优化日程。冻结编码器后，在 POCUS 做患者级五折 probe 训练与测试，同时在从未参与预训练或 probe 拟合的 Mendeley-Uganda 外部集评估。\n\n### 创新点\n\n贡献主要是受控比较，而非新的目标函数：MoCo 比较同视频增强视图的 InfoNCE；VideoMAE 以 90% tube masking 做像素 MSE；V-JEPA 使用 EMA 教师、stop-gradient 与潜特征 L1。比起使用不同数据和骨干的跨论文分数比较，这个设计更能反映目标选择的影响，但相同 epoch 不保证相同 FLOPs。\n\n### 实验支持与局限\n\n100% 标签、线性 probe 的 balanced accuracy 如下：\n\n| 方法 | POCUS | 外部 Mendeley-Uganda |\n|---|---:|---:|\n| MoCo | 42.1 ± 1.2 | **62.7 ± 1.0** |\n| VideoMAE | **66.5 ± 13.1** | 53.8 ± 2.8 |\n| V-JEPA | 65.4 ± 11.7 | 35.1 ± 4.9 |\n\n作者将其解释为域内 probe 排名不能预测外部迁移。这个结果支持增加中心留出评估，**不支持“JEPA 普遍不适合医学”**：论文是单骨干、小规模、三类诊断的初步实验。外部五次评估使用同一个外部队列和五个 POCUS fold 训练的 probe，不是五个独立外部中心，也不是五次独立预训练。文中表征层面的机制分析仍属计划，尚未证实排名反转是由塌缩或某种特征选择导致。\n\n### 和我方向的适配\n\n**直接相关于医学小样本表征选择和跨中心评价，但不是肿瘤纵向生成论文。** 可迁移的是固定 backbone、数据、probe 和患者划分来比较预训练目标的实验结构。超声视频帧之间的快速变化不等同于数周治疗后的病灶演化，不能把连续视频片段直接当成治疗轨迹。\n\n### 可借鉴动作\n\n先在同一 MRI/CT 编码器上比较对比学习、遮挡重建和未来潜特征预测，固定患者训练集与验证预算。额外记录各目标的实际 FLOPs/显存/时长，设置相同总算力的次级比较。以患者为单位抽取 5%/10%/50%/100% 标签，先做冻结 probe，避免每个目标各自调一个更强的下游模型。若事件数不足，不强行在每个小标签比例上估计 OS。\n\n评价中心留出的 pCR AUROC/AUPRC、Brier、校准，以及病灶变化预测；报告患者 bootstrap 区间和事件数。加入仅监督的直接预测对照。**否证结果**：JEPA 只在内部队列上提升而在外部队列上不优或失效，则不能据此声称生成表征具有可泛化的临床价值。\n\n算力：仓库说明包含 100 epochs 预训练设置，但论文未给出可核实硬件和 GPU 小时；小骨干/降采样的初步比较估计可单 GPU，完整 3D 训练成本必须另测，不能套用超声结果。\n\n\n\n## 原始摘要\n\nSelf-supervised learning (SSL) can reduce the need for labelled medical images, but the choice of pretext objective remains unclear for lung ultrasound (LUS). Contrastive learning, masked reconstruction, and joint-embedding predictive architectures (JEPA) differ in the space in which their targets are defined, yet existing ultrasound studies compare them under different corpora, backbones, and evaluation protocols. We compare these three objective families using the same encoder backbone, pretraining corpus, optimisation schedule, and frozen-evaluation protocol. Encoders are pretrained on COVID-BLUeS LUS videos and evaluated with linear, $k$NN, and attentive probes at 5\\%, 10\\%, 50\\%, and 100\\% label budgets. Evaluation is performed on POCUS using patient-level five-fold cross-validation and on the independently acquired Mendeley-Uganda dataset, which is excluded from both pretraining and probe fitting. At the full label budget under linear probing, VideoMAE and V-JEPA achieve $66.5 \\pm 13.1$ and $65.4 \\pm 11.7$ balanced accuracy on POCUS, while MoCo achieves $42.1 \\pm 1.2$. On Mendeley-Uganda, the ranking reverses: MoCo performs best at $62.7 \\pm 1.0$, followed by VideoMAE at $53.8 \\pm 2.8$, while V-JEPA falls near chance at $35.1 \\pm 4.9$. These results show that POCUS probe accuracy alone does not identify the objective that transfers best across datasets. We also outline planned representation-level analyses to examine this reversal. Code is publicly available at https://github.com/moeinheidari7829/LUSVideoSSL."},{"id":"arxiv:2609.17815","title":"Principled Koopman Representations with Kalman Inference for Efficient Time-Series Prediction","short":"K2SVD","date":"2026-09-17","rank":4,"category":"general","topic":"可迁移算法","summary":"用有明确算子目标的低秩表征加线性高斯动力学做廉价多步预测，但论文中的 Kalman 输入是自身线性外推，不能直接解释为临床新观测更新。","authors":"Li, Ruiquan · Bu, Yuheng","firstDate":"2026-09-15","revisionDate":"","version":"v1","evidence":"全文已核实","publication":"预印本","url":"https://arxiv.org/abs/2609.17815","codeUrl":"","image":"","imageLabel":"","html":"\u003cp>作者：Ruiquan Li, Yuheng Bu。原文：\u003ca href=\"https://arxiv.org/abs/2609.17815\" target=\"_blank\" rel=\"noopener noreferrer\">arXiv:2609.17815\u003c/a>；\u003ca href=\"https://arxiv.org/html/2609.17815v1\" target=\"_blank\" rel=\"noopener noreferrer\">HTML\u003c/a>。v1：\u003cstrong>2026-09-15 20:32:25 UTC\u003c/strong>；最新 v1，无修订。状态：预印本，正式接受未核实。\u003cstrong>未找到官方代码\u003c/strong>。已读 HTML 方法与实验。\u003c/p>\n\u003ch3>一句话总结\u003c/h3>\n\u003cp>用有明确算子目标的低秩表征加线性高斯动力学做廉价多步预测，但论文中的 Kalman 输入是自身线性外推，不能直接解释为临床新观测更新。\u003c/p>\n\u003ch3>中文摘要\u003c/h3>\n\u003cp>K2SVD 通过 Hilbert-Schmidt 目标学习 Koopman 算子的主要奇异函数，可概括为 \u003ccode>-2 tr(T[f,g]) + tr(M_f M_g)\u003c/code>。固定基函数后，训练小型线性高斯状态模型与解码器，结合 Kalman 推断平滑多步预测。与仅把神经潜空间命名为 Koopman space 的方法相比，变化是显式低秩算子近似目标与分阶段训练。\u003c/p>\n\u003ch3>创新点\u003c/h3>\n\u003cp>算子表征与预测模型分开设计，适合检查小样本中高容量非线性动力学是否必要。典型实验 rank 16，相比 rank 128 是 \u003cstrong>12.5%\u003c/strong>，不沿用摘要中笼统的“低于 10%”。Table 2 的 Electricity NRMSE 为 0.8502，对照 K2VAE 为 0.8682；Weather 则是 0.3124，逊于 K2VAE 的 0.2853。Electricity 的数据集级推理耗时为 10.144 秒，对照 84.202 秒；内存 0.438 对 1.702 GB。这不是每名患者的延迟。\u003c/p>\n\u003ch3>和我方向的适配\u003c/h3>\n\u003cp>\u003cstrong>可迁移算法。\u003c/strong> 可用于固定医学表征后的低秩动力学基线。主要假设包括时间齐次 Markov 动力学、适当的算子紧性和高斯残差近似；治疗改变与不规则时间间隔需要显式扩展。§4.2 的 Kalman “observations”来自模型自己的 OLS 外推，不是后来真实测得的数据。主实验主要给 NRMSE，不能据此宣称概率预测已校准。\u003c/p>\n\u003ch3>可借鉴动作\u003c/h3>\n\u003cp>在缓存的患者潜序列上比较 rank 16/32/64、普通线性模型、小型时间/治疗条件 MLP 与 CDE；消融 Hilbert-Schmidt 表征目标。区分完全开环、用自身伪观测滤波、实际新检查到来后更新三种协议，后者不能与完全开环混用未来信息。评价逐步病灶变化误差、误差累积、energy score/覆盖率和运行成本，再检验同输入下游增益。\u003c/p>\n\u003cp>\u003cstrong>否证结果\u003c/strong>：去掉 Kalman 伪观测后表现相同，或不优于相同秩的普通线性预测，都会削弱机制必要性。论文使用单 GPU、50 epochs × 每 epoch 100 batches，分为 15+35 两阶段、5 seeds，未核实 GPU 型号；医学缓存特征实验估计可以单 GPU，基于 rank 较小而非原始 3D 重建。\u003c/p>\n\u003ch2>原始摘要\u003c/h2>\n\u003cp>The Koopman operator has been widely used for time-series prediction in dynamical systems. However, prior work that learns latent ``Koopman spaces&#39;&#39; using neural networks often did not construct a valid Koopman space for forecasting, as these representations may be mathematically inconsistent with the operator-theoretic formulation and fail to capture the intrinsic low-rank st
